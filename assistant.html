<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="assistant" data-title-key="ai.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">
<title>المساعد الذكي | سند</title>
<meta name="description" content="مساعد سند الذكي: صياغة البنود وتلخيص الوضع القانوني قبل عرضه على محامٍ مرخص.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/roles.js"></script>
</head>
<body class="page">
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div data-slot="header"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>

<main id="main">
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html" data-i18n="nav.home"></a>
      <svg class="icon icon-sm icon-flip" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      <span data-i18n="nav.assistant"></span>
    </nav>

    <!-- ============ CLIENT: order a draft ============ -->
    <section data-ai-client hidden style="padding-bottom:var(--s-20)">
      <header style="margin-bottom:var(--s-8);max-width:680px">
        <span class="eyebrow" data-i18n="role.client"></span>
        <h1 class="headline" style="margin-top:var(--s-3)" data-i18n="ai.clientHeading"></h1>
        <p class="lead" data-i18n="ai.clientLead"></p>
      </header>

      <div class="order-layout">
        <form class="card card--pad stack gap-6" data-order-form>
          <div class="field">
            <span class="label" data-i18n="ai.pickDoc"></span>
            <div class="doc-grid" data-doc-options></div>
          </div>

          <div class="field">
            <label class="label" for="ai-details" data-i18n="ai.details"></label>
            <textarea class="textarea" id="ai-details"
                      data-i18n-attr="placeholder:ai.detailsPlaceholder"></textarea>
          </div>

          <button class="btn btn--accent btn--lg btn--block" type="submit" data-i18n="ai.orderNow"></button>
        </form>

        <aside class="stack gap-6">
          <div class="card card--rule-gold card--pad" data-order-summary></div>
          <div class="card card--pad">
            <h2 class="subtitle" data-i18n="ai.howTitle"></h2>
            <ol class="flow" style="margin-top:var(--s-5)" data-ai-steps></ol>
          </div>
        </aside>
      </div>
    </section>

    <!-- ============ LAWYER: drafting workspace ============ -->
    <section data-ai-lawyer hidden style="padding-bottom:var(--s-20)">
      <header style="margin-bottom:var(--s-8);max-width:720px">
        <span class="eyebrow" data-i18n="role.lawyer"></span>
        <h1 class="headline" style="margin-top:var(--s-3)" data-i18n="ai.lawyerHeading"></h1>
        <p class="lead" data-i18n="ai.lawyerLead"></p>
      </header>

      <div class="workspace">
        <!-- knowledge base -->
        <aside class="stack gap-6">
          <section class="panel">
            <div class="panel__head">
              <h2 class="subtitle row gap-2">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
                <span data-i18n="ai.myFiles"></span>
              </h2>
              <p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="ai.myFilesHint"></p>
            </div>
            <div class="panel__body" data-kb-files></div>
            <div style="padding:0 var(--s-6) var(--s-6)">
              <button class="btn btn--outline btn--block" type="button" data-kb-upload>
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 13l5-5 5 5M4 4h16"/></svg>
                <span data-i18n="ai.upload"></span>
              </button>
            </div>
          </section>

          <section class="panel">
            <div class="panel__head row between wrap gap-3">
              <h2 class="subtitle row gap-2">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 21h10M3 8l4-3 4 3M3 8l2 5h4l-2-5M13 8l4-3 4 3M13 8l2 5h4l-2-5"/></svg>
                <span data-i18n="ai.regs"></span>
              </h2>
              <span class="status status--info" data-regs-count></span>
            </div>
            <div class="panel__body">
              <p class="tiny muted" style="margin-bottom:var(--s-3)" data-i18n="ai.regsHint"></p>
              <div data-kb-regs></div>
            </div>
          </section>
        </aside>

        <!-- request queue + draft editor -->
        <div class="stack gap-6">
          <section class="panel">
            <div class="panel__head row between wrap gap-3">
              <h2 class="subtitle" data-i18n="ai.queue"></h2>
              <span class="status status--warn" data-queue-count></span>
            </div>
            <div class="panel__body" data-ai-queue></div>
          </section>

          <section class="card card--rule-gold" data-draft-editor hidden></section>
        </div>
      </div>
    </section>

    <!-- ============ TRAINEE ============ -->
    <section data-ai-intern hidden style="padding-bottom:var(--s-20)">
      <header style="margin-bottom:var(--s-6);max-width:680px">
        <span class="eyebrow" data-i18n="role.intern"></span>
        <h1 class="headline" style="margin-top:var(--s-3)" data-i18n="ai.lawyerHeading"></h1>
        <p class="lead" data-i18n="ai.lawyerLead"></p>
      </header>
      <div class="card card--pad row between wrap gap-4" style="border-inline-start:4px solid var(--accent)">
        <p class="row gap-3">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 9 4.5-9 4.5-9-4.5z"/><path d="M6.5 10.5V15c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5"/></svg>
          <span data-i18n="tasks.onlyInterns"></span>
        </p>
        <a class="btn btn--accent btn--sm" href="tasks.html" data-i18n="nav.tasks"></a>
      </div>
    </section>

  </div>
</main>

<div data-slot="footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
