<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="assistant" data-title-key="ai.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">

<meta name="description" content="مساعد سند الذكي: صياغة البنود وتلخيص الوضع القانوني قبل عرضه على محامٍ مرخص.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/roles.js"></script>
</head>
<body class="page">
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div data-slot="header"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>

<main id="main">
  <div class="container" style="max-width:900px">
    <nav class="breadcrumb">
      <a href="index.html" data-i18n="nav.home"></a>
      <svg class="icon icon-sm icon-flip" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      <span data-i18n="nav.assistant"></span>
    </nav>

    <header class="center" style="margin-bottom:var(--s-8)">
      <span class="eyebrow">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>
        <span data-i18n="nav.assistant"></span>
      </span>
      <h1 class="headline" style="margin-top:var(--s-3)" data-i18n="ai.heading"></h1>
      <p class="lead" style="max-width:620px;margin-inline:auto" data-i18n="ai.lead"></p>
    </header>

    <section class="card card--rule-gold" style="margin-bottom:var(--s-16)">
      <div class="panel__head row between wrap gap-3">
        <h2 class="subtitle" data-i18n="ai.suggestions"></h2>
        <button class="btn btn--ghost btn--sm" type="button" data-chat-clear data-i18n="ai.clear"></button>
      </div>

      <div class="row gap-2 wrap" style="padding:var(--s-4) var(--s-5)" data-chat-suggestions></div>

      <div class="chat" data-chat-log aria-live="polite"></div>

      <form class="chat-composer" data-chat-form>
        <input class="input" data-chat-input required
               data-i18n-attr="placeholder:ai.placeholder, aria-label:ai.placeholder">
        <button class="btn btn--primary" type="submit">
          <span data-i18n="ai.send"></span>
          <svg class="icon icon-sm icon-flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p class="disclaimer">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        <span><span data-i18n="ai.disclaimer"></span>
        <a href="lawyers.html" style="color:var(--accent);font-weight:700" data-i18n="ai.bookInstead"></a></span>
      </p>
    </section>
  </div>
</main>

<div data-slot="footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
