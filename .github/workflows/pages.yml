name: Deploy to GitHub Pages

# Pages publishes from the gh-pages branch, which GitHub enabled automatically
# when that branch first appeared. This job keeps the branch in step with the
# sources: it rebuilds the single-file bundle and republishes the whole site
# on every push to the default branch.
#
# Publishing via the branch rather than actions/deploy-pages is deliberate.
# Deploying through Actions requires the Pages source to be set to "GitHub
# Actions" in repository settings, and the Actions token cannot make that
# change itself (creating or reconfiguring a Pages site needs administration
# rights). Pushing a branch needs only contents: write, which the token has.

on:
  push:
    branches: [claude/website-dark-light-languages-5exre8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the single-file bundle
        run: node tools/build-artifact.mjs

      - name: Assemble the published site
        run: |
          rm -rf _site
          mkdir -p _site/dist
          cp *.html _site/
          # verify.html is a diagnostic: it creates accounts and writes rows in
          # the real project. Fine to run locally against your own database,
          # not something to leave reachable by anyone with the URL.
          rm -f _site/verify.html
          cp -r assets _site/
          cp dist/sanad.html _site/dist/
          touch _site/.nojekyll   # keep Jekyll from filtering files

      - name: Stamp the asset URLs with this commit
        run: |
          # GitHub Pages serves everything with a ten-minute cache and no way
          # to set headers, so a browser that has the new HTML can still be
          # running the previous release's JavaScript. That mix is worse than
          # either version on its own: it looks like data failing to arrive,
          # and it goes away when you open the inspector, because the
          # inspector disables the cache. A version on every URL makes the two
          # halves of a release arrive together.
          V="${GITHUB_SHA::7}"
          find _site -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
            -e "s|\(src=\"assets/[^\"?]*\.js\)\"|\1?v=$V\"|g" \
            -e "s|\(href=\"assets/[^\"?]*\.css\)\"|\1?v=$V\"|g"
          grep -c "?v=$V" _site/index.html

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
