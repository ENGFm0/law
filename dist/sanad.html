<style>
/* ==========================================================================
   سند | Sanad — Design System
   Tokens first: every colour is a variable, so [data-theme="dark"] flips the
   whole site by redefining ~30 values instead of touching components.
   ========================================================================== */

/* ---------- 1. Tokens : Light (default) ---------- */
:root {
  color-scheme: light;

  /* Brand */
  --brand-navy:        #0f172a;
  --brand-gold:        #c8912a;

  /* Surfaces */
  --bg:                #f7f8fd;
  --bg-band:           #e9eefb;   /* the lavender section band */
  --surface:           #ffffff;
  --surface-2:         #f1f4fd;
  --surface-3:         #e4ebfa;
  --surface-inverse:   #101a2e;   /* dark sidebars / dark cards in light mode */
  --on-inverse:        #e8eefc;

  /* Text */
  --text:              #111c2d;
  --text-muted:        #5a6478;
  --text-faint:        #8b93a7;

  /* Lines */
  --border:            #e2e8f2;
  --border-strong:     #cbd5e6;

  /* Actions */
  --primary:           #0f172a;
  --primary-hover:     #1e293b;
  --on-primary:        #ffffff;
  --accent:            #d97706;
  --accent-hover:      #b45309;
  --on-accent:         #ffffff;
  --accent-soft:       #fdf0dd;
  --accent-soft-text:  #96560a;

  /* Status */
  --success:           #15803d;
  --success-soft:      #dcfce7;
  --warning:           #b45309;
  --warning-soft:      #fef3c7;
  --danger:            #b91c1c;
  --danger-soft:       #fee2e2;
  --info:              #1d4ed8;
  --info-soft:         #dbeafe;

  /* Depth */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 20px rgba(15, 23, 42, .05);
  --shadow-2: 0 10px 30px rgba(15, 23, 42, .12);
  --shadow-3: 0 20px 50px rgba(15, 23, 42, .16);
  --ring:     0 0 0 3px rgba(15, 23, 42, .12);

  /* Shape */
  --r-sm: 4px;
  --r:    6px;
  --r-lg: 10px;
  --r-xl: 16px;
  --r-full: 999px;

  /* Rhythm (4px base) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px;

  --container: 1200px;
  --header-h: 72px;

  /* Type */
  --font-ar: "Tajawal", "Cairo", "Segoe UI", system-ui, sans-serif;
  --font-en: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font: var(--font-ar);
}

/* ---------- 2. Tokens : Dark ---------- */
[data-theme="dark"] {
  color-scheme: dark;

  --brand-navy:        #dbe3f7;
  --brand-gold:        #e5b451;

  --bg:                #0a1020;
  --bg-band:           #0e1729;
  --surface:           #121c31;
  --surface-2:         #18243d;
  --surface-3:         #1f2d49;
  --surface-inverse:   #060c18;
  --on-inverse:        #e8eefc;

  --text:              #e8edf8;
  --text-muted:        #a3aec6;
  --text-faint:        #7c88a3;

  --border:            #24314f;
  --border-strong:     #33425f;

  --primary:           #e9eefb;
  --primary-hover:     #ffffff;
  --on-primary:        #0a1020;
  --accent:            #f0a83a;
  --accent-hover:      #f7bb5c;
  --on-accent:         #241701;
  --accent-soft:       #3a2a10;
  --accent-soft-text:  #f3bd68;

  --success:           #4ade80;
  --success-soft:      #10331f;
  --warning:           #fbbf24;
  --warning-soft:      #3a2a10;
  --danger:            #f87171;
  --danger-soft:       #3b1618;
  --info:              #93b4fd;
  --info-soft:         #16264a;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 20px rgba(0, 0, 0, .35);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5);
  --shadow-3: 0 20px 50px rgba(0, 0, 0, .6);
  --ring:     0 0 0 3px rgba(233, 238, 251, .18);
}

/* ---------- 3. Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 16px);
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}

/* English switches the type stack and the writing direction */
html[lang="en"] { --font: var(--font-en); }

img, svg, video { max-width: 100%; display: block; }
img { height: auto; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }

h1, h2, h3, h4, h5 { margin: 0; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
p  { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

::selection { background: var(--accent); color: var(--on-accent); }

/* Only fade colours, never layout — avoids the "everything slides" theme flash */
body, .card, .panel, .btn, .input, .site-header, .chip, .tag, .stat, .field {
  transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto; }
}

/* ---------- 4. Layout primitives ---------- */
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--s-6); }
@media (max-width: 640px) { .container { padding-inline: var(--s-4); } }

.section      { padding-block: var(--s-20); }
.section--tight { padding-block: var(--s-12); }
.section--band  { background: var(--bg-band); }
@media (max-width: 768px) { .section { padding-block: var(--s-12); } }

.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.between { justify-content: space-between; }
.wrap    { flex-wrap: wrap; }
.gap-1 { gap: var(--s-1);} .gap-2 { gap: var(--s-2);} .gap-3 { gap: var(--s-3);}
.gap-4 { gap: var(--s-4);} .gap-6 { gap: var(--s-6);} .gap-8 { gap: var(--s-8);}
.grow  { flex: 1 1 auto; }

.grid { display: grid; gap: var(--s-6); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px)  { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

.hidden { display: none !important; }
/* Author-level display rules (.field, .row) outrank the UA's [hidden] rule,
   so state it explicitly or hidden elements stay on screen. */
[hidden] { display: none !important; }

/* ---------- 5. Typography helpers ---------- */
.display   { font-size: clamp(2rem, 1.2rem + 3.2vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.18; }
.headline  { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2rem); font-weight: 700; }
.title     { font-size: 1.25rem; font-weight: 700; }
.subtitle  { font-size: 1.0625rem; font-weight: 600; }
.lead      { font-size: 1.0625rem; color: var(--text-muted); line-height: 1.7; }
.muted     { color: var(--text-muted); }
.faint     { color: var(--text-faint); }
.small     { font-size: .875rem; }
.tiny      { font-size: .75rem; }
.center    { text-align: center; }
.num       { font-variant-numeric: tabular-nums; direction: ltr; display: inline-block; }

.eyebrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: .8125rem; font-weight: 700; letter-spacing: .06em;
  color: var(--accent-soft-text); background: var(--accent-soft);
  padding: var(--s-1) var(--s-3); border-radius: var(--r-full);
}

.section-head { max-width: 640px; margin-bottom: var(--s-10); }
.section-head .lead { margin-top: var(--s-3); }
.section-head.center { margin-inline: auto; }

/* ---------- 6. Icons ---------- */
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
.icon-xl { width: 28px; height: 28px; }
/* Arrows must point "forward" in whichever direction the page reads */
[dir="rtl"] .icon-flip { transform: scaleX(-1); }

/* ---------- 7. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-5); height: 44px;
  border-radius: var(--r);
  font-weight: 700; font-size: .9375rem;
  border: 1.5px solid transparent;
  white-space: nowrap;
  transition: background-color .18s, border-color .18s, color .18s, transform .18s, box-shadow .18s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-2); }

.btn--accent  { background: var(--accent); color: var(--on-accent); }
.btn--accent:hover { background: var(--accent-hover); box-shadow: var(--shadow-2); }

.btn--outline { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
.btn--outline:hover { border-color: var(--primary); background: var(--surface-2); }

.btn--ghost   { color: var(--text-muted); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); }

.btn--sm  { height: 36px; padding: 0 var(--s-4); font-size: .875rem; }
.btn--lg  { height: 52px; padding: 0 var(--s-8); font-size: 1rem; }
.btn--block { width: 100%; }
.btn[disabled], .btn.is-disabled { opacity: .5; pointer-events: none; }

/* ---------- 8. Cards & panels ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card--pad { padding: var(--s-6); }
.card--hover { transition: transform .2s, box-shadow .2s, border-color .2s; }
.card--hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
/* 4px category rule along the top, per the brand spec */
.card--rule-navy  { border-top: 4px solid var(--primary); }
.card--rule-gold  { border-top: 4px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.panel__head { padding: var(--s-5) var(--s-6); border-bottom: 1px solid var(--border); }
.panel__body { padding: var(--s-6); }

.divider { height: 1px; background: var(--border); border: 0; margin: var(--s-5) 0; }

/* ---------- 9. Chips, tags, pills ---------- */
.tag {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 3px var(--s-3); border-radius: var(--r-full);
  background: var(--surface-3); color: var(--text-muted);
  font-size: .75rem; font-weight: 600;
}
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-full);
  border: 1.5px solid var(--border-strong); background: var(--surface);
  font-size: .875rem; font-weight: 600; color: var(--text-muted);
  transition: all .18s;
}
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip.is-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-soft-text); }

.status { display: inline-flex; align-items: center; gap: var(--s-2); padding: 3px var(--s-3); border-radius: var(--r-full); font-size: .75rem; font-weight: 700; }
.status--ok    { background: var(--success-soft); color: var(--success); }
.status--warn  { background: var(--warning-soft); color: var(--warning); }
.status--info  { background: var(--info-soft);    color: var(--info); }
.status--muted { background: var(--surface-3);    color: var(--text-muted); }

.rating { display: inline-flex; align-items: center; gap: var(--s-1); font-weight: 700; font-size: .875rem; }
.rating .icon { color: var(--accent); fill: var(--accent); stroke: none; }

/* ---------- 10. Forms ---------- */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.label { font-size: .875rem; font-weight: 600; color: var(--text-muted); }

.input, .select, .textarea {
  width: 100%; height: 46px;
  padding: 0 var(--s-4);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  transition: border-color .18s, box-shadow .18s, background-color .25s;
}
.textarea { height: auto; min-height: 120px; padding: var(--s-3) var(--s-4); resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }

.select {
  appearance: none;
  /* Neutral grey chevron: one asset that stays legible in both themes. */
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2389919f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-size: 16px 16px;
  padding-inline-end: var(--s-4);
  padding-inline-start: var(--s-10);
}
[dir="rtl"] .select { background-position: left var(--s-4) center; }
[dir="ltr"] .select {
  background-position: right var(--s-4) center;
  padding-inline-start: var(--s-4);
  padding-inline-end: var(--s-10);
}

.input-group { position: relative; display: flex; align-items: center; }
.input-group .icon { position: absolute; inset-inline-start: var(--s-4); color: var(--text-faint); pointer-events: none; }
.input-group .input { padding-inline-start: calc(var(--s-4) * 2 + 20px); }

.check { display: flex; align-items: center; gap: var(--s-3); cursor: pointer; padding: var(--s-1) 0; font-size: .9375rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
.check span { color: var(--text-muted); }
.check:hover span { color: var(--text); }

/* ---------- 11. Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
@supports not (backdrop-filter: blur(1px)) { .site-header { background: var(--surface); } }

.site-header__inner { display: flex; align-items: center; gap: var(--s-6); height: var(--header-h); }

.brand { display: flex; align-items: center; gap: var(--s-3); font-weight: 800; }
.brand__mark { width: 38px; height: 38px; flex: none; }
.brand__text { display: flex; align-items: baseline; gap: var(--s-2); font-size: 1.125rem; letter-spacing: -.01em; }
.brand__sep { width: 2px; height: 18px; background: var(--accent); border-radius: 2px; align-self: center; }
.brand__latin { font-family: var(--font-en); font-weight: 800; }

.nav { display: flex; align-items: center; gap: var(--s-1); margin-inline: auto; }
.nav__link {
  position: relative; padding: var(--s-2) var(--s-4); border-radius: var(--r); white-space: nowrap;
  font-size: .9375rem; font-weight: 600; color: var(--text-muted);
  transition: color .18s, background-color .18s;
}
.nav__link:hover { color: var(--text); background: var(--surface-2); }
.nav__link.is-active { color: var(--text); }
.nav__link.is-active::after {
  content: ""; position: absolute; inset-inline: var(--s-4); bottom: -2px;
  height: 2px; background: var(--accent); border-radius: 2px;
}

.header-actions { display: flex; align-items: center; gap: var(--s-2); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-1);
  width: 40px; height: 40px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
  transition: all .18s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn--wide { width: auto; padding: 0 var(--s-3); font-size: .8125rem; font-weight: 700; }
.lang-btn__code { font-family: var(--font-en); letter-spacing: .04em; }

/* The two theme glyphs swap so the button always shows what you'd switch TO */
[data-theme="dark"] .icon-moon,
:root:not([data-theme="dark"]) .icon-sun { display: none; }

.burger { display: none; }
@media (max-width: 1024px) {
  .nav, .header-actions .btn { display: none; }
  .burger { display: inline-flex; }
}

/* Mobile drawer */
.drawer {
  position: fixed; inset: 0; z-index: 90;
  visibility: hidden; opacity: 0; transition: opacity .2s, visibility .2s;
}
.drawer.is-open { visibility: visible; opacity: 1; }
.drawer__scrim { position: absolute; inset: 0; background: rgba(6, 12, 24, .55); backdrop-filter: blur(2px); }
.drawer__panel {
  position: absolute; inset-block: 0; inset-inline-end: 0;
  width: min(340px, 88vw); background: var(--surface);
  border-inline-start: 1px solid var(--border);
  padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-2);
  transform: translateX(var(--drawer-out, 100%));
  transition: transform .26s cubic-bezier(.4, 0, .2, 1);
  overflow-y: auto;
}
[dir="rtl"] .drawer__panel { --drawer-out: -100%; }
.drawer.is-open .drawer__panel { transform: translateX(0); }
.drawer__link { padding: var(--s-3) var(--s-4); border-radius: var(--r); font-weight: 600; color: var(--text-muted); }
.drawer__link:hover, .drawer__link.is-active { background: var(--surface-2); color: var(--text); }

/* ---------- 12. Footer ---------- */
.site-footer { background: var(--bg-band); border-top: 1px solid var(--border); padding-block: var(--s-16) var(--s-8); margin-top: auto; }
.site-footer__grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: var(--s-8); }
@media (max-width: 900px) { .site-footer__grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .site-footer__grid { grid-template-columns: 1fr; } }
.footer-title { font-size: .875rem; font-weight: 700; margin-bottom: var(--s-4); }
.footer-link { display: block; padding: var(--s-1) 0; font-size: .9375rem; color: var(--text-muted); transition: color .18s; }
.footer-link:hover { color: var(--accent); }
.site-footer__bottom { margin-top: var(--s-10); padding-top: var(--s-6); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--s-4); justify-content: space-between; align-items: center; font-size: .875rem; color: var(--text-muted); }

/* ---------- 13. Hero + search ---------- */
.hero { position: relative; padding-block: var(--s-20) var(--s-16); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(60% 70% at 70% 0%,  color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(50% 60% at 20% 10%, color-mix(in srgb, var(--info) 14%, transparent), transparent 70%);
}
.hero__inner { max-width: 820px; margin-inline: auto; text-align: center; }
.hero .lead { margin-top: var(--s-5); font-size: 1.125rem; }

.searchbar {
  margin-top: var(--s-8);
  display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: var(--s-3);
  padding: var(--s-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-2);
  text-align: start;
}
@media (max-width: 860px) { .searchbar { grid-template-columns: 1fr 1fr; } .searchbar .btn { grid-column: 1 / -1; } }
@media (max-width: 520px) { .searchbar { grid-template-columns: 1fr; } }
.searchbar .btn { height: 46px; }

.trustbar { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s-6); margin-top: var(--s-8); color: var(--text-muted); font-size: .875rem; }
.trustbar span { display: inline-flex; align-items: center; gap: var(--s-2); }

/* ---------- 14. Feature / step cards ---------- */
.feature { padding: var(--s-6); height: 100%; display: flex; flex-direction: column; gap: var(--s-3); }
.feature__icon {
  width: 48px; height: 48px; border-radius: var(--r-lg);
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text);
}
.card--rule-gold .feature__icon { background: var(--accent-soft); color: var(--accent-soft-text); }

.step { position: relative; padding: var(--s-6); }
.step__num {
  width: 40px; height: 40px; border-radius: var(--r-full);
  display: grid; place-items: center; font-weight: 800;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-en);

<script>/* ==========================================================================

   Runs synchronously in <head>, before any pixel is painted, so a dark-mode
   visitor never gets a white flash on load.
   ========================================================================== */
(function (global) {
  "use strict";

  var STORAGE_KEY = "sanad.theme";
  var media = global.matchMedia ? global.matchMedia("(prefers-color-scheme: dark)") : null;

  function read() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function write(v) {
    try {
      if (v) localStorage.setItem(STORAGE_KEY, v); else localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* private mode */ }
  }

  // An explicit choice wins; otherwise follow the OS.
  var stored = read();
  var current = (stored === "dark" || stored === "light")
    ? stored
    : (media && media.matches ? "dark" : "light");

  function paint(theme) {
    var html = document.documentElement;
    if (theme === "dark") html.setAttribute("data-theme", "dark");
    else html.setAttribute("data-theme", "light");
    // Keeps the mobile browser chrome in step with the page.
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#0a1020" : "#f7f8fd");
  }

  paint(current);

  // No explicit choice yet? Then keep tracking the OS while the tab is open.
  if (media && !stored) {
    var onSystem = function (e) {
      if (read()) return;
      current = e.matches ? "dark" : "light";
      paint(current);
      notify();

    else if (media.addListener) media.addListener(onSystem);
  }

  var listeners = [];
  function notify() {
    listeners.forEach(function (fn) { try { fn(current); } catch (e) { console.error(e); } });

  }

    get current() { return current; },
    get isDark() { return current === "dark"; },

<script>/* ==========================================================================
   Roles — client / lawyer / intern.
   The platform serves three audiences, and which one you are decides the
   navigation, the dashboard you land on, and which workspaces exist at all.
   Stored like the theme and the language, so the choice survives navigation.
   ========================================================================== */
(function (global) {
  "use strict";

  var STORAGE_KEY = "sanad.role";
  var DEFAULT_ROLE = "client";

  var ROLES = {
    client: {
      id: "client",
      icon: "user",
      nameKey: "role.client",
      /* The workspace this role lands on from the header badge. */
      home: "dashboard-client.html",
      /* Role-specific slot in the main navigation. */
      nav: { key: "nav.lawyers", href: "lawyers.html", id: "lawyers" }

    lawyer: {
      id: "lawyer",

      home: "tasks.html",
      nav: { key: "nav.tasks", href: "tasks.html", id: "tasks" }
    }
  };

  function read() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function write(v) {
    try { localStorage.setItem(STORAGE_KEY, v); } catch (e) { /* private mode */ }
  }

  var stored = read();
  var current = ROLES[stored] ? stored : DEFAULT_ROLE;

  var listeners = [];

  global.Roles = {
    get current() { return current; },
    get info() { return ROLES[current]; },
    all: function () { return [ROLES.client, ROLES.lawyer, ROLES.intern]; },
    is: function (id) { return current === id; },
    get: function (id) { return ROLES[id] || null; },

    set: function (id) {
      if (!ROLES[id] || id === current) return;
      current = id;
      write(id);
      listeners.forEach(function (fn) { try { fn(id); } catch (e) { console.error(e); } });
      document.dispatchEvent(new CustomEvent("rolechange", { detail: { role: id } }));
    },

    onChange: function (fn, runNow) {
      listeners.push(fn);
      if (runNow !== false) { try { fn(current); } catch (e) { console.error(e); } }
    }
  };
})(window);
</script>

<script>/* ==========================================================================

  var AVATAR_TINTS = [
    ["#0f172a", "#2c4a7c"], ["#7a4a12", "#c8912a"], ["#123b32", "#2f7d63"],
    ["#3b1450", "#7a4a9e"], ["#4a1220", "#a3465e"], ["#123047", "#2f6f9e"]

    var parts = String(name).replace(/^(د\.|أ\.|Dr\.|Mr\.|Ms\.)\s*/i, "").trim().split(/\s+/);
    var a = parts[0] ? parts[0].charAt(0) : "";

<script>/* ==========================================================================
   Page controllers. Everything that draws from DATA is registered through
   App.onRender, so flipping the language redraws it in place — no reload.
   ========================================================================== */
(function (global) {
  "use strict";

  var I18N = global.I18N, DATA = global.DATA, Icons = global.Icons, App = global.App;
  var $ = App.$, $$ = App.$$, esc = App.esc, tx = App.tx;

  /* ---------------------------------------------------------------- utils */
  function fillSelect(sel, list, anyLabelKey) {
    var current = sel.value;
    var opts = ['<option value="">' + esc(I18N.t(anyLabelKey)) + "</option>"];
    list.forEach(function (item) {
      opts.push('<option value="' + esc(item.id) + '">' + esc(tx(item)) + "</option>");
    });
    sel.innerHTML = opts.join("");
    if (current) sel.value = current;
  }

  function checkList(container, list, name) {
    // Preserve ticks across a language re-render.
    var checked = {};
    $$("input", container).forEach(function (i) { if (i.checked) checked[i.value] = true; });
    container.innerHTML = list.map(function (item) {
      return '<label class="check"><input type="checkbox" name="' + name + '" value="' + esc(item.id) + '"' +
        (checked[item.id] ? " checked" : "") + "><span>" + esc(tx(item)) + "</span></label>";
    }).join("");
  }

  function params() {
    var out = {};
    // #/lawyer?id=x in the bundled build, ?id=x when served as separate files
    var hash = global.location.hash || "";
    var mark = hash.indexOf("?");
    var q = mark !== -1 ? hash.slice(mark + 1) : global.location.search.replace(/^\?/, "");
    if (!q) return out;
    q.split("&").forEach(function (part) {
      var kv = part.split("=");
      out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    });
    return out;
  }

  /* ------------------------------------------------------------ shared bits */
  function renderStats(host) {
    host.innerHTML = DATA.stats.map(function (s) {
      var v = I18N.lang === "ar" ? s.value : s.valueEn;
      return '<div class="reveal"><div class="display" style="color:var(--accent);font-size:2.5rem">' + esc(v) + "</div>" +
        '<p class="muted small">' + esc(tx(s.label)) + "</p></div>";
    }).join("");
    App.observeReveals(host);
  }

  /* ================================================================== HOME */
  function initHome() {
    var specSel = $('[data-fill="specialties"]');
    var citySel = $('[data-fill="cities"]');
    var form = $("[data-search-form]");

    App.onRender(function () {
      if (specSel) fillSelect(specSel, DATA.specialties, "home.specialty");
      if (citySel) fillSelect(citySel, DATA.cities, "home.city");

      var trust = $("[data-trustbar]");
      if (trust) {
        trust.innerHTML = [
          ["shield-check", "home.trust1"], ["lock", "home.trust2"], ["payments", "home.trust3"]
        ].map(function (pair) {
          return "<span>" + Icons.svg(pair[0], "icon-sm") + esc(I18N.t(pair[1])) + "</span>";
        }).join("");
      }

      var feat = $("[data-features]");
      if (feat) {
        feat.innerHTML = DATA.features.map(function (f) {
          return '<article class="card card--hover card--rule-' + f.rule + ' feature reveal">' +
            '<span class="feature__icon">' + Icons.svg(f.icon, "icon-lg") + "</span>" +
            '<h3 class="subtitle">' + esc(tx(f.title)) + "</h3>" +
            '<p class="small muted">' + esc(tx(f.body)) + "</p></article>";
        }).join("");
      }

      var steps = $("[data-steps]");
      if (steps) {
        steps.innerHTML = DATA.steps.map(function (s, i) {
          return '<article class="card card--pad step reveal">' +
            '<span class="step__num">' + I18N.num(i + 1) + "</span>" +
            '<h3 class="subtitle" style="margin-top:var(--s-4)">' + esc(tx(s.title)) + "</h3>" +
            '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(s.body)) + "</p></article>";
        }).join("");
      }

      var roleCards = $("[data-role-cards]");
      if (roleCards) {
        roleCards.innerHTML = global.Roles.all().map(function (r) {
          var descKey = r.id === "client" ? "role.clientDesc"
                      : r.id === "lawyer" ? "role.lawyerDesc" : "role.internDesc";
          return '<article class="card card--hover card--rule-' +

            '<h3 class="subtitle">' + esc(I18N.t(r.nameKey)) + "</h3>" +
            '<p class="small muted">' + esc(I18N.t(descKey)) + "</p>" +

        }).join("");
      }

      var featured = $("[data-featured-lawyers]");
      if (featured) {
        featured.innerHTML = DATA.lawyers.slice(0, 3).map(function (l) {
          return '<div class="reveal">' + App.lawyerCardCompact(l) + "</div>";
        }).join("");
      }

      var statsHost = $("[data-stats]");
      if (statsHost) renderStats(statsHost);

      var tHost = $("[data-testimonials]");
      if (tHost) {
        tHost.innerHTML = DATA.testimonials.map(function (t) {
          var filled = "";
          for (var i = 0; i < 5; i++) {
            filled += '<span style="color:' + (i < t.rating ? "var(--accent)" : "var(--border-strong)") + '">' +
              Icons.svg("star", "icon-sm") + "</span>";
          }
          return '<article class="card card--pad reveal stack gap-4">' +
            '<div class="row gap-1">' + filled + "</div>" +
            '<p class="lead small">“' + esc(tx(t.body)) + '”</p>' +
            '<div class="row gap-3" style="margin-top:auto">' +
              '<img class="avatar avatar--sm" src="' + App.avatarOf(t.name, tx(t.name)) + '" alt="" width="40" height="40">' +
              "<div><strong class=\"small\">" + esc(tx(t.name)) + "</strong>" +
              '<p class="tiny muted">' + esc(tx(t.role)) + "</p></div>" +
            "</div></article>";
        }).join("");
      }

      var artHost = $("[data-home-articles]");
      if (artHost) {
        artHost.innerHTML = DATA.articles.slice(0, 3).map(function (a) {
          return '<div class="reveal">' + App.articleCard(a) + "</div>";
        }).join("");
      }

      App.observeReveals();
    });

    if (form) {
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var qs = [];
        var q = form.querySelector('[name="q"]').value.trim();
        if (q) qs.push("q=" + encodeURIComponent(q));
        if (specSel && specSel.value) qs.push("specialty=" + encodeURIComponent(specSel.value));
        if (citySel && citySel.value) qs.push("city=" + encodeURIComponent(citySel.value));
        global.location.href = "lawyers.html" + (qs.length ? "?" + qs.join("&") : "");
      });
    }
  }

  /* ============================================================= DIRECTORY */
  function initDirectory() {
    var form = $("[data-filters]");
    var results = $("[data-results]");
    var countEl = $("[data-results-count]");
    var sortSel = $("[data-sort]");
    var pager = $("[data-pagination]");
    if (!results) return;

    var PER_PAGE = 4;
    var state = { page: 1, q: "" };
    var initial = params();
    state.q = initial.q || "";

    App.onRender(function () {
      checkList($("[data-filter-specialties]"), DATA.specialties, "specialty");
      checkList($("[data-filter-cities]"), DATA.cities, "city");
      checkList($("[data-filter-consults]"), DATA.consultTypes, "consult");
      // Preselect whatever the home-page search asked for
      if (initial.specialty) tick("specialty", initial.specialty);
      if (initial.city) tick("city", initial.city);
      draw();
    });

    function tick(name, value) {
      var input = form.querySelector('input[name="' + name + '"][value="' + value + '"]');
      if (input) input.checked = true;
    }

    function selected(name) {
      return $$('input[name="' + name + '"]:checked', form).map(function (i) { return i.value; });
    }

    function matches(l) {
      var specs = selected("specialty");
      if (specs.length && !specs.some(function (s) { return l.specialties.indexOf(s) !== -1; })) return false;

      var cities = selected("city");
      if (cities.length && cities.indexOf(l.city) === -1) return false;

      var consults = selected("consult");
      if (consults.length && !consults.some(function (c) { return l.consults.indexOf(c) !== -1; })) return false;

      var min = parseFloat(form.querySelector('[name="min"]').value);
      var max = parseFloat(form.querySelector('[name="max"]').value);
      if (!isNaN(min) && l.price < min) return false;
      if (!isNaN(max) && l.price > max) return false;

      var ratingInput = form.querySelector('input[name="rating"]:checked');
      var minRating = ratingInput ? parseFloat(ratingInput.value) : 0;
      if (minRating && l.rating < minRating) return false;

      if (state.q) {
        var hay = [tx(l.name), tx(l.title), tx(l.short)].join(" ").toLowerCase();
        var specNames = l.specialties.map(function (id) {
          var s = DATA.labelOf(DATA.specialties, id);
          return s ? tx(s) : "";
        }).join(" ").toLowerCase();
        if (hay.indexOf(state.q.toLowerCase()) === -1 && specNames.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;
    }

    function sortBy(list) {
      var mode = sortSel ? sortSel.value : "rating";
      var copy = list.slice();
      copy.sort(function (a, b) {
        if (mode === "priceAsc") return a.price - b.price;
        if (mode === "priceDesc") return b.price - a.price;
        if (mode === "experience") return b.years - a.years;
        return b.rating - a.rating || b.reviews - a.reviews;
      });
      return copy;
    }

    function draw() {
      var list = sortBy(DATA.lawyers.filter(matches));
      var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      if (state.page > pages) state.page = pages;

      if (countEl) countEl.textContent = I18N.t("dir.found", { n: I18N.num(list.length) });

      if (!list.length) {
        results.innerHTML = '<div class="card empty" style="grid-column:1/-1">' +
          Icons.svg("search", "icon-xl") +
          '<p class="subtitle">' + esc(I18N.t("dir.empty")) + "</p>" +
          '<p class="small">' + esc(I18N.t("dir.emptyHint")) + "</p></div>";
        if (pager) pager.innerHTML = "";
        return;
      }

      var slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
      results.innerHTML = slice.map(App.lawyerCardWide).join("");

      if (pager) {
        if (pages < 2) { pager.innerHTML = ""; return; }
        var html = '<button class="page-btn" type="button" data-page-to="' + (state.page - 1) + '"' +
          (state.page === 1 ? " disabled" : "") + ' aria-label="' + esc(I18N.t("common.prev")) + '">' +
          Icons.svg("chevron", "icon-sm") + "</button>";
        for (var p = 1; p <= pages; p++) {
          html += '<button class="page-btn' + (p === state.page ? " is-active" : "") +
            '" type="button" data-page-to="' + p + '">' + I18N.num(p) + "</button>";
        }
        html += '<button class="page-btn" type="button" data-page-to="' + (state.page + 1) + '"' +
          (state.page === pages ? " disabled" : "") + ' aria-label="' + esc(I18N.t("common.next")) + '">' +
          Icons.svg("chevron", "icon-sm icon-flip") + "</button>";
        pager.innerHTML = html;
      }
    }

    form.addEventListener("change", function () { state.page = 1; draw(); });
    form.addEventListener("input", function (ev) {
      if (ev.target.type === "number") { state.page = 1; draw(); }
    });
    form.addEventListener("reset", function () {
      // reset() clears inputs after the event, so redraw on the next tick
      setTimeout(function () { state.page = 1; state.q = ""; draw(); }, 0);
    });
    form.addEventListener("submit", function (ev) { ev.preventDefault(); });

    if (sortSel) sortSel.addEventListener("change", function () { state.page = 1; draw(); });

    if (pager) {
      pager.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-page-to]");
        if (!btn || btn.disabled) return;
        state.page = parseInt(btn.getAttribute("data-page-to"), 10);
        draw();
        var top = $("[data-results]").getBoundingClientRect().top + global.scrollY - 100;
        global.scrollTo({ top: top, behavior: "smooth" });
      });
    }

    // Filters collapse into a toggle on narrow screens
    var toggle = $("[data-toggle-filters]");
    if (toggle) {
      var syncToggle = function () {
        var narrow = global.matchMedia("(max-width: 1024px)").matches;
        toggle.classList.toggle("hidden", !narrow);
        form.classList.toggle("hidden", narrow && !toggle.classList.contains("is-on"));
      };
      toggle.addEventListener("click", function () {
        toggle.classList.toggle("is-on");
        form.classList.toggle("hidden");
      });
      global.addEventListener("resize", syncToggle);
      syncToggle();
    }
  }

  function initProfile() {

    if (!head) return;

    var id = params().id;
    var lawyer = (id && DATA.lawyerById(id)) || DATA.lawyers[0];

    /* -- tabs -- */
    var tabsHost = $("[data-tabs]");
    if (tabsHost) {
      tabsHost.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-tab]");
        if (!btn) return;
        $$("[data-tab]", tabsHost).forEach(function (b) {
          b.classList.toggle("is-active", b === btn);
        });
        var want = btn.getAttribute("data-tab");
        $$("[data-panel]").forEach(function (p) {
          p.hidden = p.getAttribute("data-panel") !== want;
        });
      });
    }

    /* -- booking state -- */
    var today = new Date();
    var book = { serviceIndex: 0, day: null, slot: null };

    var SLOT_TIMES = ["10:00", "11:30", "13:00", "14:30", "16:00", "17:30"];
    var BLOCKED = [2]; // 13:00 already taken

    function services() { return DATA.services; }

    function servicePrice() {
      var s = services()[book.serviceIndex];
      return s ? s.price : 0;
    }

    function renderCalendar() {
      var host = $("[data-calendar]");
      if (!host) return;
      var year = today.getFullYear(), month = today.getMonth();
      var monthLabel = new Intl.DateTimeFormat(I18N.lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB",
        { month: "long", year: "numeric" }).format(new Date(year, month, 1));
      var mEl = $("[data-cal-month]");
      if (mEl) mEl.textContent = monthLabel;

      var dow = I18N.lang === "ar"
        ? ["أح", "إث", "ثل", "أر", "خم", "جم", "سب"]
        : ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
      var html = dow.map(function (d) { return '<span class="calendar__dow">' + d + "</span>"; }).join("");

      var first = new Date(year, month, 1).getDay();
      var days = new Date(year, month + 1, 0).getDate();
      for (var i = 0; i < first; i++) html += "<span></span>";

      for (var d = 1; d <= days; d++) {
        var date = new Date(year, month, d);
        var weekend = date.getDay() === 5 || date.getDay() === 6; // Fri/Sat in KSA
        var past = d < today.getDate();
        var off = past || weekend;
        if (book.day === null && !off) book.day = d;
        html += '<button type="button" class="day' + (off ? " is-off" : "") +
          (weekend ? " is-weekend" : "") + (book.day === d ? " is-selected" : "") +
          '" data-day="' + d + '"' + (off ? " disabled" : "") + ">" + I18N.num(d) + "</button>";
      }
      host.innerHTML = html;
    }

    function renderSlots() {
      var host = $("[data-slots]");
      if (!host) return;
      host.innerHTML = SLOT_TIMES.map(function (t, i) {
        var off = BLOCKED.indexOf(i) !== -1;
        return '<button type="button" class="slot' + (off ? " is-off" : "") +
          (book.slot === i ? " is-selected" : "") + '" data-slot="' + i + '"' +
          (off ? " disabled" : "") + '><span class="num">' + t + "</span></button>";

                '<span class="tiny">' + esc(I18N.t("lawyer.reviews", { n: I18N.num(lawyer.reviews) })) + "</span></span>" +
            "</div>" +
            '<hr class="divider">' +
            '<div class="stat-strip">' +
              '<div>' + Icons.svg("briefcase") + "<div><p class=\"tiny muted\">" + esc(I18N.t("lawyer.experience")) +
                '</p><strong class="small">' + esc(I18N.t("lawyer.years", { n: I18N.num(lawyer.years) })) + "</strong></div></div>" +
              '<div>' + Icons.svg("gavel") + "<div><p class=\"tiny muted\">" + esc(I18N.t("lawyer.consultations")) +
                '</p><strong class="small num">+' + I18N.num(lawyer.consultations) + "</strong></div></div>" +
              '<div>' + Icons.svg("location") + "<div><p class=\"tiny muted\">" + esc(I18N.t("lawyer.location")) +
                '</p><strong class="small">' + esc(tx(city)) + "</strong></div></div>" +

          '<p class="lead" style="margin-top:var(--s-4)">' + esc(tx(lawyer.bio)) + "</p>" +
        "</section>" +
        '<div class="grid grid-2">' +
          '<section class="card card--pad">' +
            '<h2 class="subtitle row gap-2">' + Icons.svg("graduation") + esc(I18N.t("profile.education")) + "</h2>" +
            '<ul class="bullets" style="margin-top:var(--s-4)">' +
              lawyer.education.map(function (e) {
                return "<li><strong class=\"small\">" + esc(tx(e.degree)) + "</strong>" +
                  '<p class="tiny muted">' + esc(tx(e.place)) + "</p></li>";
              }).join("") +
            "</ul></section>" +
          '<section class="card card--pad">' +
            '<h2 class="subtitle row gap-2">' + Icons.svg("scale") + esc(I18N.t("profile.subSpecialties")) + "</h2>" +
            '<div class="row gap-2 wrap" style="margin-top:var(--s-4)">' +
              lawyer.focus.map(function (f) { return '<span class="tag">' + esc(tx(f)) + "</span>"; }).join("") +
            "</div></section>" +
        "</div>" +
        '<section class="card card--pad">' +
          '<h2 class="subtitle row gap-2">' + Icons.svg("briefcase") + esc(I18N.t("profile.career")) + "</h2>" +
          '<ul class="timeline" style="margin-top:var(--s-5)">' +
            lawyer.career.map(function (c) {
              return "<li><strong class=\"small\">" + esc(tx(c.role)) + "</strong>" +

                '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(c.note)) + "</p></li>";
            }).join("") +
          "</ul></section>";

      /* services panel */
      $("[data-panel=services]").innerHTML =
        '<h2 class="title" style="grid-column:1/-1">' + esc(I18N.t("profile.services")) + "</h2>" +
        DATA.services.map(function (s) {
        var unit = s.unit === "half" ? I18N.t("lawyer.perHalfHour")
                 : s.unit === "from" ? I18N.t("lawyer.startsAt", { n: I18N.num(s.price) })
                 : I18N.t("lawyer.perConsult");
        return '<article class="card card--rule-gold card--pad stack gap-3">' +
          '<span class="feature__icon">' + Icons.svg(s.icon) + "</span>" +
          '<h3 class="subtitle">' + esc(tx(s.title)) + "</h3>" +
          '<p class="small muted">' + esc(tx(s.body)) + "</p>" +
          '<div class="row between" style="margin-top:auto;padding-top:var(--s-3)">' +
            '<strong style="font-size:1.25rem"><span class="num">' + I18N.num(s.price) + "</span> " +
              '<span class="small muted">' + esc(I18N.t("profile.sar")) + "</span></strong>" +
            '<span class="tiny muted">' + esc(unit) + "</span>" +
          "</div></article>";
      }).join("");

      /* articles panel */
      var mine = DATA.articles.filter(function (a) { return a.author === lawyer.id; });
      if (!mine.length) mine = DATA.articles.slice(0, 2);

        mine.map(App.articleCard).join("");

      /* reviews panel */
      $("[data-panel=reviews]").innerHTML =

        DATA.reviews.map(function (r) {
        var s = "";
        for (var i = 0; i < 5; i++) {
          s += '<span style="color:' + (i < r.rating ? "var(--accent)" : "var(--border-strong)") + '">' +
            Icons.svg("star", "icon-sm") + "</span>";
        }
        return '<article class="card card--pad stack gap-3">' +
          '<div class="row between gap-3 wrap">' +
            '<span class="row gap-3">' +
              '<img class="avatar avatar--sm" src="' + App.avatarOf(r.name, tx(r.name)) + '" alt="" width="40" height="40">' +
              "<strong class=\"small\">" + esc(tx(r.name)) + "</strong></span>" +

          $$("[data-day]", bookingForm).forEach(function (b) {

          $$("[data-slot]", bookingForm).forEach(function (b) {

  /* ================================================================== BLOG */
  function initBlog() {
    var list = $("[data-blog-list]");
    if (!list) return;

    var state = { cat: "all", q: "", shown: 4 };

    function filtered() {
      return DATA.articles.filter(function (a) {
        if (state.cat !== "all" && a.cat !== state.cat) return false;
        if (state.q) {
          var hay = (tx(a.title) + " " + tx(a.excerpt)).toLowerCase();
          if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
        }
        return true;
      });
    }

    function draw() {
      var all = filtered();
      var slice = all.slice(0, state.shown);

      list.innerHTML = slice.length
        ? slice.map(App.articleCard).join("")
        : '<div class="card empty" style="grid-column:1/-1">' + Icons.svg("search", "icon-xl") +
          '<p class="subtitle">' + esc(I18N.t("blog.noResults")) + "</p></div>";

      var countEl = $("[data-blog-count]");
      if (countEl) countEl.textContent = I18N.num(slice.length) + " / " + I18N.num(all.length);

      var more = $("[data-blog-more]");
      if (more) more.classList.toggle("hidden", state.shown >= all.length);
    }

    App.onRender(function () {
      var cats = $("[data-blog-cats]");
      if (cats) {
        var chips = ['<button type="button" class="chip' + (state.cat === "all" ? " is-active" : "") +
          '" data-cat="all">' + esc(I18N.t("blog.all")) + "</button>"];
        // only offer categories that actually have articles
        DATA.specialties.forEach(function (s) {
          var n = DATA.articles.filter(function (a) { return a.cat === s.id; }).length;
          if (!n) return;
          chips.push('<button type="button" class="chip' + (state.cat === s.id ? " is-active" : "") +
            '" data-cat="' + esc(s.id) + '">' + esc(tx(s)) + "</button>");
        });
        cats.innerHTML = chips.join("");
      }

      var expert = $("[data-blog-expert]");
      if (expert) {
        var l = DATA.lawyers[0];
        var s = "";
        for (var i = 0; i < 5; i++) {
          s += '<span style="color:' + (i < Math.round(l.rating) ? "var(--accent)" : "var(--border-strong)") + '">' +
            Icons.svg("star", "icon-sm") + "</span>";
        }
        expert.innerHTML =
          '<div class="row gap-3">' +
            '<img class="avatar avatar--md" src="' + App.avatarOf(l.name, l.id) + '" alt="" width="64" height="64">' +
            "<div><strong class=\"small\">" + esc(tx(l.name)) + "</strong>" +
              '<p class="tiny muted">' + esc(tx(l.title)) + "</p>" +
              '<div class="row gap-1" style="margin-top:var(--s-1)">' + s + "</div></div>" +
          "</div>" +
          '<p class="small muted" style="margin-top:var(--s-4)">' + esc(tx(l.short)) + "</p>";
      }

      var refs = $("[data-blog-refs]");
      if (refs) {
        refs.innerHTML = DATA.references.map(function (r) {
          return '<li class="row gap-3">' + Icons.svg("file-text", "icon-sm") +
            "<div><strong class=\"small\">" + esc(tx(r.title)) + "</strong>" +
            '<p class="tiny muted">' + esc(tx(r.note)) + "</p></div></li>";
        }).join("");
      }

      draw();
    });

    var cats = $("[data-blog-cats]");
    if (cats) {
      cats.addEventListener("click", function (ev) {
        var chip = ev.target.closest("[data-cat]");
        if (!chip) return;
        state.cat = chip.getAttribute("data-cat");
        state.shown = 4;
        $$("[data-cat]", cats).forEach(function (c) { c.classList.toggle("is-active", c === chip); });
        draw();
      });
    }

    var searchForm = $("[data-blog-search]");
    if (searchForm) {
      var input = searchForm.querySelector("input");
      searchForm.addEventListener("submit", function (ev) { ev.preventDefault(); });
      input.addEventListener("input", function () {
        state.q = input.value.trim();
        state.shown = 4;
        draw();
      });
    }

    var more = $("[data-blog-more]");
    if (more) {
      more.addEventListener("click", function () { state.shown += 4; draw(); });
    }

    var news = $("[data-newsletter]");
    if (news) {
      news.addEventListener("submit", function (ev) {
        ev.preventDefault();
        App.toast(I18N.t("blog.subscribed"), "mail");
        news.reset();
      });
    }
  }

  function initAuth() {
    var seg = $("[data-auth-seg]");
    var form = $("[data-auth-form]");
    if (!form) return;
    var mode = "login";

    function sync() {
      $$("[data-only]").forEach(function (el) {
        el.hidden = el.getAttribute("data-only") !== mode;
      });
      $$("[data-only=register] input").forEach(function (i) { i.required = mode === "register"; });
      $("[data-auth-title]").textContent = I18N.t(mode === "login" ? "auth.welcome" : "auth.register");
      $("[data-auth-lead]").textContent = I18N.t(mode === "login" ? "auth.welcomeLead" : "auth.registerLead");
      $("[data-auth-submit]").textContent = I18N.t(mode === "login" ? "auth.submitLogin" : "auth.submitRegister");
    }

    App.onRender(function () {
      var points = $("[data-auth-points]");
      if (points) {
        points.innerHTML = ["auth.asidePoint1", "auth.asidePoint2", "auth.asidePoint3"].map(function (k) {
          return '<li class="row gap-3">' + Icons.svg("check") + "<span>" + esc(I18N.t(k)) + "</span></li>";
        }).join("");
      }
      sync();
    });

    if (seg) {
      seg.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-mode]");
        if (!btn) return;
        mode = btn.getAttribute("data-mode");
        $$("[data-mode]", seg).forEach(function (b) { b.classList.toggle("is-active", b === btn); });
        sync();
      });
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();

      global.location.href = "dashboard-lawyer.html";

  }

  /* ============================================================= TASK BANK */
  // Accepted tasks live for the session only — there is no backend to persist to.
  var acceptedTasks = [];

  function levelKey(level) {
    return level === "advanced" ? "tasks.levelAdvanced"
         : level === "mid" ? "tasks.levelMid" : "tasks.levelBasic";
  }

  function initTasks() {
    var list = $("[data-task-list]");
    if (!list) return;
    var filter = "all";

    function taskCard(t) {
      var sup = DATA.lawyerById(t.supervisor);
      var spec = DATA.labelOf(DATA.specialties, t.specialty);
      var taken = acceptedTasks.indexOf(t.id) !== -1;

      return '<article class="card card--hover task-card' + (taken ? " is-taken" : "") + '">' +
        '<div class="task-card__body">' +
          '<div class="row between gap-3 wrap">' +
            '<span class="tag">' + esc(tx(spec)) + "</span>" +
            '<span class="status status--' + (t.level === "advanced" ? "warn" : t.level === "mid" ? "info" : "muted") + '">' +
              esc(I18N.t(levelKey(t.level))) + "</span>" +
          "</div>" +
          '<h3 class="subtitle">' + esc(tx(t.title)) + "</h3>" +
          '<p class="small muted">' + esc(tx(t.body)) + "</p>" +
          '<div class="task-card__meta">' +
            '<div><span class="tiny muted">' + esc(I18N.t("tasks.reward")) + "</span>" +
              '<strong class="reward"><span class="num">' + I18N.num(t.reward) + "</span> " +
              esc(I18N.t("profile.sar")) + "</strong></div>" +
            '<div><span class="tiny muted">' + esc(I18N.t("tasks.deadline")) + "</span>" +
              "<strong>" + esc(I18N.t("tasks.days", { n: I18N.num(t.days) })) + "</strong></div>" +
            '<div><span class="tiny muted">' + esc(I18N.t("tasks.supervisor")) + "</span>" +
              "<strong>" + esc(sup ? tx(sup.name) : "—") + "</strong></div>" +
          "</div>" +
        "</div>" +
        '<div class="task-card__foot">' +
          (taken
            ? '<span class="status status--ok" style="width:100%;justify-content:center;height:44px">' +
              Icons.svg("check", "icon-sm") + esc(I18N.t("tasks.inProgress")) + "</span>"
            : '<button class="btn btn--primary btn--block" type="button" data-accept="' + esc(t.id) + '">' +
              esc(I18N.t("tasks.accept")) + "</button>") +
        "</div></article>";
    }

    function draw() {
      var open = DATA.tasks.filter(function (t) {
        return filter === "all" || t.specialty === filter;
      });
      list.innerHTML = open.map(taskCard).join("");

      /* headline figures */
      var stats = $("[data-task-stats]");
      if (stats) {
        var earned = DATA.tasks.reduce(function (sum, t) {
          return acceptedTasks.indexOf(t.id) !== -1 ? sum + t.reward : sum;
        }, 0);
        var cells = [
          { icon: "file-text", label: I18N.t("tasks.openCount"), value: I18N.num(DATA.tasks.length), rule: "navy" },
          { icon: "check",     label: I18N.t("tasks.mine"),      value: I18N.num(acceptedTasks.length), rule: "navy" },
          { icon: "wallet",    label: I18N.t("tasks.earnings"),
            value: I18N.num(earned) + " " + I18N.t("profile.sar"), rule: "gold" }
        ];
        stats.innerHTML = cells.map(function (c) {
          return '<article class="card card--rule-' + c.rule + ' stat">' +
            '<div class="stat__top"><span class="small muted">' + esc(c.label) + "</span>" +
              '<span class="stat__icon">' + Icons.svg(c.icon) + "</span></div>" +
            '<div class="stat__value">' + esc(c.value) + "</div></article>";
        }).join("");
      }

      /* accepted list */
      var mine = $("[data-task-mine]");
      if (mine) {
        var taken = DATA.tasks.filter(function (t) { return acceptedTasks.indexOf(t.id) !== -1; });
        mine.innerHTML = taken.length
          ? taken.map(function (t) {
              var sup = DATA.lawyerById(t.supervisor);
              return '<div class="list-row">' +
                '<span class="list-row__icon">' + Icons.svg("file-text", "icon-sm") + "</span>" +
                '<div class="grow"><strong class="small">' + esc(tx(t.title)) + "</strong>" +
                  '<p class="tiny muted">' + esc(I18N.t("tasks.supervisor")) + ": " +
                  esc(sup ? tx(sup.name) : "—") + "</p></div>" +
                '<div class="stack gap-1" style="align-items:flex-end">' +
                  '<span class="status status--info">' + esc(I18N.t("tasks.inProgress")) + "</span>" +
                  '<span class="tiny faint num">' + I18N.num(t.reward) + " " + esc(I18N.t("profile.sar")) + "</span>" +
                "</div></div>";
            }).join("")
          : '<p class="muted center" style="padding:var(--s-6)">' + esc(I18N.t("tasks.noneAccepted")) + "</p>";
      }
    }

    App.onRender(function () {
      var sel = $("[data-task-filter]");
      if (sel) {
        var used = {};
        DATA.tasks.forEach(function (t) { used[t.specialty] = true; });
        sel.innerHTML = '<option value="all">' + esc(I18N.t("tasks.filterAll")) + "</option>" +
          DATA.specialties.filter(function (sp) { return used[sp.id]; }).map(function (sp) {
            return '<option value="' + esc(sp.id) + '">' + esc(tx(sp)) + "</option>";
          }).join("");
        sel.value = filter;
      }

      // The bank is a trainee workspace; anyone else gets an invitation to switch.
      var gate = $("[data-role-gate]");
      if (gate) gate.classList.toggle("hidden", global.Roles.is("intern"));

      draw();
    });

    list.addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-accept]");
      if (!btn) return;
      var id = btn.getAttribute("data-accept");
      if (acceptedTasks.indexOf(id) === -1) acceptedTasks.push(id);
      App.toast(I18N.t("tasks.accepted"), "check");
      draw();
    });

    var sel = $("[data-task-filter]");
    if (sel) sel.addEventListener("change", function () { filter = sel.value; draw(); });

    var become = $("[data-become-intern]");
    if (become) {
      become.addEventListener("click", function () {
        global.Roles.set("intern");
        App.toast(I18N.t("role.changed", { role: I18N.t("role.intern") }), "graduation");
      });
    }
  }

  function initAssistant() {
    var log = $("[data-chat-log]");
    if (!log) return;
    var turns = [];   // { who: "bot" | "user", text }

    function bubble(turn) {
      var mine = turn.who === "user";
      return '<div class="bubble' + (mine ? " bubble--user" : "") + '">' +
        '<span class="bubble__who">' + esc(mine ? I18N.t("ai.you") : I18N.t("brand.name")) + "</span>" +
        "<p>" + esc(turn.text) + "</p></div>";
    }

    function draw() {
      log.innerHTML = turns.length
        ? turns.map(bubble).join("")
        : bubble({ who: "bot", text: I18N.t("ai.greeting") });
      log.scrollTop = log.scrollHeight;
    }

    /** Match a question to the closest canned answer; fall back to a hand-off. */
    function answer(question) {
      var q = question.toLowerCase();
      var best = null, bestScore = 0;
      DATA.assistant.forEach(function (entry) {
        var words = tx(entry.q).toLowerCase().split(/[\s،,؟?.]+/).filter(function (w) { return w.length > 3; });
        var score = words.reduce(function (n, w) { return q.indexOf(w) !== -1 ? n + 1 : n; }, 0);
        if (score > bestScore) { bestScore = score; best = entry; }
      });
      if (best && bestScore >= 1) return tx(best.a);
      return I18N.t("ai.disclaimer");
    }

    App.onRender(function () {
      var host = $("[data-chat-suggestions]");
      if (host) {
        host.innerHTML = DATA.assistant.map(function (entry) {
          return '<button type="button" class="chip" data-ask="' + esc(entry.id) + '">' +
            esc(tx(entry.q)) + "</button>";
        }).join("");
      }
      draw();
    });

    function ask(text) {
      turns.push({ who: "user", text: text });
      draw();
      // A brief pause reads as a reply rather than an instant lookup.
      setTimeout(function () {
        turns.push({ who: "bot", text: answer(text) });
        draw();
      }, 420);
    }

    var sugg = $("[data-chat-suggestions]");
    if (sugg) {
      sugg.addEventListener("click", function (ev) {
        var chip = ev.target.closest("[data-ask]");
        if (!chip) return;
        var entry = DATA.assistant.filter(function (e) { return e.id === chip.getAttribute("data-ask"); })[0];
        if (entry) ask(tx(entry.q));
      });
    }

    var form = $("[data-chat-form]");
    if (form) {
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var input = $("[data-chat-input]");
        var text = input.value.trim();
        if (!text) return;
        input.value = "";
        ask(text);
      });
    }

    var clear = $("[data-chat-clear]");
    if (clear) clear.addEventListener("click", function () { turns = []; draw(); });
  }

  /* =============================================================== ACCOUNT */
  function initAccount() {
    var switcher = $("[data-role-switcher]");
    if (!switcher) return;

    App.onRender(function () {
      var role = global.Roles.info;

      var ident = $("[data-account-identity]");
      if (ident) {
        ident.innerHTML =
          '<div class="row gap-5 wrap" style="align-items:center">' +
            '<img class="avatar avatar--lg avatar--round" alt="" width="88" height="88" src="' +
              App.avatarOf({ ar: "فهد", en: "Fahad Al-Otaibi" }, "account") + '">' +
            '<div class="grow"><p class="tiny muted" data-i18n="account.signedInAs"></p>' +
              '<h2 class="title">' + esc(tx({ ar: "فهد العتيبي", en: "Fahad Al-Otaibi" })) + "</h2>" +
              '<p class="small muted">' + esc(I18N.t("role.current")) + ": " +
                '<strong style="color:var(--accent)">' + esc(I18N.t(role.nameKey)) + "</strong></p></div>" +
            '<a class="btn btn--primary" href="' + role.home + '">' +
              esc(I18N.t("role.workspace")) + Icons.svg("arrow", "icon-sm icon-flip") + "</a>" +
          "</div>";
        I18N.apply(ident);
      }

      switcher.innerHTML = global.Roles.all().map(function (r) {
        var on = r.id === role.id;
        return '<button type="button" class="role-card' + (on ? " is-active" : "") + '" data-pick-role="' + r.id + '">' +
          '<span class="role-card__icon">' + Icons.svg(r.icon, "icon-lg") + "</span>" +
          "<strong>" + esc(I18N.t(r.nameKey)) + "</strong>" +
          '<span class="tiny muted">' + esc(I18N.t(r.id === "client" ? "role.clientDesc"
            : r.id === "lawyer" ? "role.lawyerDesc" : "role.internDesc")) + "</span>" +
          (on ? '<span class="role-card__check">' + Icons.svg("check", "icon-sm") + "</span>" : "") +
          "</button>";
      }).join("");

      var links = $("[data-account-links]");
      if (links) {
        var items = [
          { href: "dashboard-client.html", key: "nav.dashboardClient", icon: "grid" },
          { href: "dashboard-lawyer.html", key: "nav.dashboardLawyer", icon: "briefcase" },
          { href: "tasks.html",            key: "nav.tasks",           icon: "graduation" },
          { href: "assistant.html",        key: "nav.assistant",       icon: "sparkle" },
          { href: "about.html",            key: "nav.about",           icon: "shield-check" },
          { href: "login.html",            key: "dash.logout",         icon: "logout" }
        ];
        links.innerHTML = items.map(function (it) {
          return '<a class="account-link" href="' + it.href + '">' +
            Icons.svg(it.icon, "icon-sm") + "<span>" + esc(I18N.t(it.key)) + "</span>" +
            Icons.svg("chevron", "icon-sm account-link__go") + "</a>";
        }).join("");
      }
    });

    switcher.addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-pick-role]");
      if (!btn) return;
      var id = btn.getAttribute("data-pick-role");
      if (global.Roles.is(id)) return;
      global.Roles.set(id);
      App.toast(I18N.t("role.changed", { role: I18N.t(global.Roles.info.nameKey) }), "check");
    });
  }

  /* ================================================================= route */
  function mount() {
    var page = document.documentElement.getAttribute("data-page") || "";
    if (page === "home") initHome();
    else if (page === "lawyers" && $("[data-results]")) initDirectory();
    else if (page === "lawyers") initProfile();
    else if (page === "blog") initBlog();
    else if (page === "about") initAbout();
    else if (page === "login") initAuth();
    else if (page === "dashboard") initLawyerDash();
    else if (page === "dashboard-client") initClientDash();
    else if (page === "tasks") initTasks();
    else if (page === "assistant") initAssistant();
    else if (page === "account") initAccount();
  }

  global.Pages = { mount: mount };

  // Served as separate HTML files, each document mounts itself. The bundled
  // single-file build sets __SPA__ and lets its router call mount() per route.
  if (!global.__SPA__) mount();
})(window);
</script>
<script>/* ==========================================================================
   Hash router — used only by the bundled single-file build.
   The multi-page site navigates with ordinary links; here the same eight
   views live in one document and are swapped in under #/route.
   ========================================================================== */
(function (global) {
  "use strict";

  var ROUTES = global.__ROUTES__;          // injected by tools/build-artifact.mjs
  var DEFAULT = "index";
  var I18N = global.I18N, App = global.App, Pages = global.Pages;
  var host = document.getElementById("app");

  function parse() {
    var raw = (global.location.hash || "").replace(/^#\/?/, "");
    var mark = raw.indexOf("?");
    var name = mark === -1 ? raw : raw.slice(0, mark);
    var query = mark === -1 ? "" : raw.slice(mark + 1);
    var to = "";
    query.split("&").forEach(function (part) {
      var kv = part.split("=");
      if (kv[0] === "to") to = decodeURIComponent(kv[1] || "");
    });
    return { name: ROUTES[name] ? name : DEFAULT, to: to };
  }

  function syncNav(name) {
    var href = name + ".html";
    App.$$(".nav__link, .drawer__link").forEach(function (a) {
      var match = a.getAttribute("href") === href ||
        (name === "lawyer" && a.getAttribute("href") === "lawyers.html");
      a.classList.toggle("is-active", match);
      if (match) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function render() {
    var at = parse();
    var route = ROUTES[at.name];

    document.documentElement.setAttribute("data-page", route.page);
    document.documentElement.setAttribute("data-title-key", route.titleKey);
    // Dashboards bring their own chrome, so the site header and footer step aside.
    document.body.classList.toggle("is-app", route.chrome === "app");

    App.resetRenderers();
    host.innerHTML = route.html;
    I18N.apply(document);
    Pages.mount();
    App.observeReveals();
    syncNav(at.name);

    var target = at.to && document.getElementById(at.to);
    if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
    else global.scrollTo(0, 0);
  }

  /* Turn the site's own "page.html" links into hash routes, so one set of
     markup serves both the multi-page site and this bundle. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[href]");
    if (!a || a.target === "_blank") return;
    var parts = (a.getAttribute("href") || "")
      .match(/^([\w-]+)\.html(?:\?([^#]*))?(?:#(.*))?$/);
    if (!parts) return;

    ev.preventDefault();
    var next = "#/" + parts[1];
    var query = parts[2] || "";
    if (parts[3]) query += (query ? "&" : "") + "to=" + encodeURIComponent(parts[3]);
    if (query) next += "?" + query;

    if (global.location.hash === next) render();       // same route, re-render
    else global.location.hash = next;
  });

  global.addEventListener("hashchange", function () {
    // In-page anchors (#main from the skip link) are not routes — leave them be.
    var h = global.location.hash;
    if (h && h.charAt(1) !== "/") return;
    render();
  });
  global.Router = { render: render };
  render();
})(window);
</script>
