      var id = pf.getAttribute("data-price-for");
      var s = M.servicesOf(Session.user().id).filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      var price = +pf.value;
      var bad = M.checkPrice(s.typeId, price);
      if (bad) {
        App.toast(I18N.t(bad === "low" ? "svc.tooLow" : bad === "high" ? "svc.tooHigh" : "svc.empty"), "close");
        pf.value = s.price;
        return;
      }
      Store.removeService(s.id);
      Store.addService({ id: s.id, ownerId: s.ownerId, typeId: s.typeId, price: price, active: true });
      App.toast(I18N.t("svc.added"), "check");
    }
  });

  host.addEventListener("click", function (ev) {
    var t = ev.target;

    var pt = t.closest("[data-pick-type]");
    if (pt) { filters.type = pt.getAttribute("data-pick-type"); App.rerender(); return; }
    if (t.closest("[data-clear-type]")) { filters.type = ""; App.rerender(); return; }

    var oc = t.closest("[data-order-channel]");
    if (oc) {
      ordering[oc.getAttribute("data-svc")] = oc.getAttribute("data-order-channel");
      App.rerender();
      return;
    }

    var ord = t.closest("[data-order]");
    if (ord) {
      if (Session.isGuest()) { App.toast(I18N.t("svc.orderSignIn"), "lock");
        setTimeout(function () { App.go("login.html"); }, 900); return; }
      var all = offersOfType(filters.type);
      var pick = null;
      for (var i = 0; i < all.length; i++) if (all[i].svc.id === ord.getAttribute("data-order")) pick = all[i];
      if (!pick) return;
      var chosen = ordering[pick.svc.id] || M.serviceChannels(pick.svc)[0];
      Store.addRequest({
        clientId: Session.user().id, lawyerId: pick.owner.id, typeId: pick.svc.typeId,
        channel: chosen,
        // Something to draft is something written; a call is not.
        price: pick.svc.price, status: "new", ai: !M.channel(chosen).live, hours: 3,
        title: M.serviceTitle(pick.svc),
        brief: { ar: "", en: "" },
        ago: { ar: I18N.t("common.today"), en: I18N.t("common.today") }
      });
      App.toast(I18N.t("req.ordered", { name: tx(pick.owner.name) }), "check");
      setTimeout(function () { App.go("requests.html"); }, 1000);
      return;
    }

    if (t.closest("[data-add-svc]")) {
      var f = readForm();
      var bad = M.checkPrice(f.typeId, f.price);
      if (bad) { svcError(bad === "low" ? "svc.tooLow" : bad === "high" ? "svc.tooHigh" : "svc.empty"); return; }
      var chosen = draftChannels(f.typeId);
      // A service nobody can be reached through is not a service.
      if (!chosen.length) { svcError("svc.needChannel"); return; }
      svcError(null);
      var record = {
        ownerId: Session.user().id, typeId: f.typeId, price: f.price, active: true,
        channels: chosen,
        title: f.title ? { ar: f.title, en: f.title } : null,
        meta: f.meta ? { ar: f.meta, en: f.meta } : null
      };
      if (editing) {
        record.id = editing.id;
        Store.removeService(editing.id);
        editing = null;
      }
      Store.addService(record);
      draft = {};
      App.toast(I18N.t(record.id ? "svc.updated" : "svc.added"), "check");
      return;
    }

    var ed = t.closest("[data-edit-svc]");
    if (ed) {
      var found = M.servicesOf(Session.user().id)
        .filter(function (x) { return x.id === ed.getAttribute("data-edit-svc"); })[0];
      if (!found) return;
      editing = found;
      draft = { typeId: found.typeId, price: found.price,
                channels: M.serviceChannels(found).slice(),
                title: found.title ? tx(found.title) : "", meta: found.meta ? tx(found.meta) : "" };
      App.rerender();
      return;
    }

    var ch = t.closest("[data-channel]");
    if (ch) {
      var id = ch.getAttribute("data-channel");
      var cat = editing ? editing.typeId : (draft.typeId || M.serviceTypes()[0].id);
      var list = draftChannels(cat);
      var at = list.indexOf(id);
      draft.channels = at === -1 ? list.concat([id])
                                 : list.filter(function (x) { return x !== id; });
      App.rerender();
      return;
    }

    if (t.closest("[data-cancel-edit]")) { editing = null; draft = {}; App.rerender(); return; }

    var del = t.closest("[data-del-svc]");
    if (del) {
      if (editing && editing.id === del.getAttribute("data-del-svc")) { editing = null; draft = {}; }
      Store.removeService(del.getAttribute("data-del-svc"));
      App.toast(I18N.t("svc.removed"), "trash");
      return;
    }

    if (t.closest("[data-skill-add]")) { addSkill(); return; }

    var sd = t.closest("[data-skill-del]");
    if (sd) { skills.splice(+sd.getAttribute("data-skill-del"), 1); App.rerender(); return; }

    if (t.closest("[data-skill-save]")) {
      Store.updateAccount(Session.user().id, {
        skills: skills.map(function (s) { return { ar: s, en: s }; })
      });
      App.toast(I18N.t("skills.saved"), "check");
    }
  });

  host.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.matches("[data-skill-input]")) { ev.preventDefault(); addSkill(); }
  });

  function addSkill() {
    var input = $("[data-skill-input]", host);
    var v = input.value.trim();
    if (!v || skills.indexOf(v) !== -1) return;
    skills.push(v);
    App.rerender();
  }
});

/* ==========================================================================
   People — the directory a client browses and the board a professional is
   ranked on, in one page because they are two views of the same list.

   The rank is never stored; it is recomputed from ratings, delivered work and
   response speed every time this page draws.
   ========================================================================== */
Pages.define("lawyers", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-people]");
  if (!host) return;

  var state = {
    tab: Session.is("intern") ? "intern" : "lawyer",
    q: App.param("q") || "",
    specialty: App.param("specialty") || "",
    city: App.param("city") || "",
    minRating: 0,
    sort: "rating"
  };

  /* ---------- filtering ---------- */
  function lawyerList() {
    var text = state.q.trim().toLowerCase();
    var sorted = M.listedLawyers().filter(function (u) {
      if (state.specialty && (u.specialties || []).indexOf(state.specialty) === -1) return false;
      if (state.city && u.city !== state.city) return false;
      if (M.ratingOf(u.id).avg < state.minRating) return false;
      if (text) {
        var hay = (tx(u.name) + " " + tx(u.title || {}) + " " + tx(u.bio || {})).toLowerCase();
        if (hay.indexOf(text) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (state.sort === "experience") return (b.years || 0) - (a.years || 0);
      if (state.sort === "priceAsc") return cheapest(a) - cheapest(b);
      if (state.sort === "priceDesc") return cheapest(b) - cheapest(a);
      return M.ratingOf(b.id).avg - M.ratingOf(a.id).avg;
    });
    // Placement is applied last, over whatever order was asked for: a lawyer
    // the platform is putting forward stays in front of the list, and the rest
    // keep the sort the reader chose.
    return M.byPlacement(sorted);
  }

  function cheapest(u) {
    var s = M.servicesOf(u.id);
    return s.length ? Math.min.apply(null, s.map(function (x) { return x.price; })) : Infinity;
  }

  /* ---------- pieces ---------- */
  function tabs() {
    return '<div class="tabs" role="tablist">' +
      [["lawyer", "dir.tabLawyers"], ["intern", "dir.tabInterns"]].map(function (t) {
        return '<button class="tab' + (state.tab === t[0] ? " is-active" : "") + '" role="tab" ' +
          'type="button" data-tab="' + t[0] + '" data-i18n="' + t[1] + '"></button>';
      }).join("") + "</div>";
  }

  function filters() {
    function sel(name, list, value, anyKey) {
      return '<select class="select" data-f="' + name + '">' +
        '<option value="">' + esc(I18N.t(anyKey)) + "</option>" +
        list.map(function (o) {
          return '<option value="' + esc(o.id) + '"' + (o.id === value ? " selected" : "") + ">" +
            esc(tx(o)) + "</option>";
        }).join("") + "</select>";
    }
    return '<div class="results-bar">' +
      '<div class="row gap-3 wrap">' +
        '<label class="field"><span class="label" data-i18n="blog.search"></span>' +
          '<input class="input" data-f="q" value="' + esc(state.q) + '" ' +
            'data-i18n-attr="placeholder:home.searchPlaceholder"></label>' +
        '<label class="field"><span class="label" data-i18n="dir.specialties"></span>' +
          sel("specialty", global.SEED.specialties, state.specialty, "dir.anySpecialty") + "</label>" +
        '<label class="field"><span class="label" data-i18n="dir.cities"></span>' +
          sel("city", global.SEED.cities, state.city, "dir.anyCity") + "</label>" +
        '<label class="field"><span class="label" data-i18n="dir.sortBy"></span>' +
          '<select class="select" data-f="sort">' +
            [["rating", "dir.sortRating"], ["experience", "dir.sortExperience"],
             ["priceAsc", "dir.sortPriceAsc"], ["priceDesc", "dir.sortPriceDesc"]].map(function (o) {
              return '<option value="' + o[0] + '"' + (state.sort === o[0] ? " selected" : "") + ">" +
                esc(I18N.t(o[1])) + "</option>";
            }).join("") + "</select></label>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-reset data-i18n="dir.reset"></button>' +
      "</div></div>";
  }

  /** The board is a professional's own scoreboard, not a client's shopping
      aid — a client judges a lawyer by rating and price, never by a league
      position. So it is drawn for lawyers and trainees only. A trainee sees
      their own cohort; a lawyer sees both, because they supervise one of them. */
  function canSeeBoard(role) {
    if (Session.is("lawyer")) return true;
    return Session.is("intern") && role === "intern";
  }

  function board(role) {
    var me = Session.user();
    var rows = M.leaderboard(role);
    return '<section class="card" style="margin-top:var(--s-10);overflow:hidden">' +
      '<div class="panel__head"><h2 class="subtitle" data-i18n="rank.title"></h2>' +
        '<p class="tiny muted" style="margin-top:var(--s-1)" data-i18n="rank.lead"></p></div>' +
      '<div style="overflow-x:auto"><table class="rank-table">' +
        "<thead><tr>" +
          '<th data-i18n="rank.pos"></th><th data-i18n="rank.name"></th>' +
          '<th data-i18n="rank.rating"></th>' +
          '<th data-i18n="' + (role === "intern" ? "rank.hours" : "rank.done") + '"></th>' +
          '<th data-i18n="rank.score"></th>' +
        "</tr></thead><tbody>" +
        rows.map(function (row, i) {
          var mine = me && row.user.id === me.id;
          return "<tr" + (mine ? ' class="is-me"' : "") + ">" +
            '<td class="num">' + I18N.num(i + 1) + "</td>" +
            '<td><span class="row gap-2">' + C.avatar(row.user, "sm") + C.personLink(row.user) +
              (mine ? ' <span class="tag">' + esc(I18N.t("rank.you")) + "</span>" : "") + "</span></td>" +
            '<td class="num">' + I18N.num(row.rating.avg.toFixed(1)) + "</td>" +
            '<td class="num">' + I18N.num(role === "intern" ? M.hoursOf(row.user.id) : (row.user.completed || 0)) + "</td>" +
            '<td><strong class="num">' + I18N.num(row.score.total) + "</strong></td>" +
          "</tr>";
        }).join("") +
      "</tbody></table></div></section>";
  }

  /* ---------- draw ---------- */
  App.onRender(function () {
    var isLawyers = state.tab === "lawyer";
    var list = isLawyers ? lawyerList() : M.interns();

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-6)">' +
        '<h1 class="headline" data-i18n="' + (isLawyers ? "dir.heading" : "dir.headingInterns") + '"></h1>' +
        '<p class="lead" data-i18n="' + (isLawyers ? "dir.lead" : "dir.internsLead") + '"></p></header>' +
      tabs() +
      (isLawyers ? filters() : "") +
      '<p class="small muted" style="margin:var(--s-4) 0">' +
        esc(I18N.t(isLawyers ? "dir.found" : "dir.foundInterns", { n: I18N.num(list.length) })) + "</p>" +
      (list.length
        ? '<div class="grid grid-3">' + list.map(isLawyers ? C.lawyerCard : C.internCard).join("") + "</div>"
        : C.empty("search", "dir.empty")) +
      (canSeeBoard(state.tab) ? board(state.tab) : "") +
    "</div>";

    I18N.apply(host);
    App.observeReveals(host);
  });

  /* ---------- events ---------- */
  host.addEventListener("click", function (ev) {
    var tab = ev.target.closest("[data-tab]");
    if (tab) { state.tab = tab.getAttribute("data-tab"); App.rerender(); return; }
    if (ev.target.closest("[data-reset]")) {
      state.q = ""; state.specialty = ""; state.city = ""; state.sort = "rating";
      App.rerender();
    }
  });

  host.addEventListener("change", function (ev) {
    var f = ev.target.closest("[data-f]");
    if (!f) return;
    state[f.getAttribute("data-f")] = f.value;
    App.rerender();
  });

  // Typing filters as you go; the select handler above covers the dropdowns.
  host.addEventListener("input", function (ev) {
    var f = ev.target.closest('[data-f="q"]');
    if (!f) return;
    state.q = f.value;
    clearTimeout(f._t);
    f._t = setTimeout(function () {
      App.rerender();
      var again = $('[data-f="q"]', host);
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 250);
  });
});

      '<div class="profile-layout">' +
        "<section>" +
          '<div class="tabs" role="tablist">' + TABS.map(function (t) {
            return '<button class="tab' + (tab === t[0] ? " is-active" : "") + '" type="button" ' +
              'role="tab" data-tab="' + t[0] + '" data-i18n="' + t[1] + '"></button>';

        "</section>" +

    });

    setTimeout(function () { App.go("requests.html"); }, 1000);
  });
});

/* ==========================================================================
   A trainee's page — its own template. No price list and no licence: what a

Pages.define("intern", function (global) {

    var t = [["skills", "profile.tabSkills"], ["cert", "profile.tabCert"]];

            (M.endorsementsFor(u.id).length

                Icons.svg("badge", "icon-sm") + "</span>" : "") + "</h1>" +
          '<p class="lead">' + esc(tx(u.university || {})) +
            (u.level ? " · " + esc(tx(u.level)) : "") + "</p>" +

  /** Hours, endorsements, and — for the supervising lawyer — the issue button. */
  function certPanel(u) {

    var given = M.endorsementsFor(u.id);

    // Only a lawyer who routed work to this trainee may sign for them.

      (supervised && !already
        ? '<div style="margin-top:var(--s-5)">' +

    '<h2 class="subtitle" style="margin-top:var(--s-8)" data-i18n="profile.supervisors"></h2>' +
    (given.length
      ? '<div class="stack gap-4" style="margin-top:var(--s-4)">' + given.map(function (e) {
          var lw = M.user(e.lawyerId);
          return '<article class="testimony">' +

            (e.note ? '<p class="small" style="margin-top:var(--s-3)">' + esc(tx(e.note)) + "</p>" : "") +
          "</article>";

  /* ---------- pay: a share per task, or terms settled in advance ---------- */

    var all = M.agreementsOfIntern(u.id);

      '<div class="card card--pad" style="margin-top:var(--s-6)">' +

          '<h2 class="subtitle" data-i18n="pay.earned"></h2>' +

        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="pay.shareHint"></p></div>' +

  function kindLabel(kind) {

  function agreementCard(a, u) {

    var perKey = a.kind === "cases" ? "pay.perCase" : a.kind === "monthly" ? "pay.perMonth" : "pay.perYear";

      '<div class="row between wrap gap-4">' +
        '<div class="row gap-3">' + C.avatar(lawyer, "sm") +

            '<p class="tiny muted">' + esc(kindLabel(a.kind)) +

        '<div class="row gap-4">' +

            ' <span class="tiny muted">' + esc(I18N.t(perKey)) + "</span></strong>" +
          (me && me.id === a.lawyerId
            ? '<button class="btn btn--ghost btn--sm" type="button" data-end-deal="' +
              esc(a.internId) + '" data-i18n="pay.end"></button>'
            : "") +
        "</div></div></article>";
  }

  function agreementForm(u) {
    return '<div class="card card--pad" style="margin-top:var(--s-6)">' +
      '<h3 class="subtitle" data-i18n="pay.newAgreement"></h3>' +
      '<div class="grid grid-3" style="gap:var(--s-4);margin-top:var(--s-5)">' +
        '<label class="field"><span class="label" data-i18n="pay.kind"></span>' +
          '<select class="select" data-deal-kind>' +

                return '<option value="' + k[0] + '"' + (deal.kind === k[0] ? " selected" : "") + ">" +
                  esc(I18N.t(k[1])) + "</option>";
              }).join("") + "</select></label>" +
        '<label class="field"><span class="label" data-i18n="pay.amount"></span>' +
          '<input class="input num" type="number" min="0" dir="ltr" data-deal-amount value="' +
            esc(deal.amount) + '"></label>' +
        (deal.kind === "cases"
          ? '<label class="field"><span class="label" data-i18n="pay.cases"></span>' +
            '<input class="input num" type="number" min="1" dir="ltr" data-deal-cases value="' +

  function reviewsPanel(u) {

  function articlesPanel(u) {

  }

  App.onRender(function () {
    var u = id ? M.user(id) : null;
    if (!u || u.roles.indexOf("intern") === -1) {
      host.innerHTML = '<div class="container" style="padding-block:var(--s-16)">' +

        '<p class="center" style="margin-top:var(--s-6)">' +
          '<a class="btn btn--primary" href="lawyers.html" data-i18n="profile.backToDir"></a></p></div>';

    if (allowed.indexOf(tab) === -1) tab = allowed[0];

    var body = tab === "skills" ? skillsPanel(u)
             : tab === "cert" ? certPanel(u)
             : tab === "pay" ? payPanel(u)
             : tab === "reviews" ? reviewsPanel(u)
             : articlesPanel(u);

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-20);max-width:940px">' +
      head(u) +
      '<div class="tabs" role="tablist">' + tabsFor(u).map(function (t) {

      var cases = +(($("[data-deal-cases]", host) || {}).value || 0);
      var err = $("[data-deal-error]", host);
      var fail = function (key) { if (err) { err.hidden = false; err.textContent = I18N.t(key); } };
      if (!amount || amount <= 0) { fail("pay.needAmount"); return; }
      if (deal.kind === "cases" && !cases) { fail("pay.needCases"); return; }
      if (err) err.hidden = true;
      Store.addAgreement({ lawyerId: Session.user().id, internId: u2.id,
                           kind: deal.kind, amount: amount, cases: cases });
      deal = { kind: "cases", amount: "", cases: "" };
      App.toast(I18N.t("pay.created", { name: tx(u2.name) }), "check");
      return;
    }

    var endDeal = ev.target.closest("[data-end-deal]");
    if (endDeal) {
      Store.endAgreement(Session.user().id, endDeal.getAttribute("data-end-deal"));
      App.toast(I18N.t("pay.ended"), "close");
      return;
    }

    if (ev.target.closest("[data-issue]")) {
      var u = M.user(id);
      Store.addEndorsement({
        internId: u.id, lawyerId: Session.user().id, hours: M.hoursOf(u.id),
        date: { ar: I18N.t("common.today"), en: I18N.t("common.today") },
        note: null
      });
      App.toast(I18N.t("cert.issuedToast"), "badge");
    }
  });

  host.addEventListener("change", function (ev) {
    var k = ev.target.closest("[data-deal-kind]");
    if (!k) return;
    // Keep what is already typed; only the "cases" field comes and goes.
    deal.kind = k.value;
    deal.amount = ($("[data-deal-amount]", host) || {}).value || "";
    App.rerender();
  });
});

/* ==========================================================================

/* ==========================================================================
   Reverse auction — one brief, many lawyers, a closing bell.

   The client says what work they need, how they want it done, and how long
   they will wait. Every lawyer who has listed that work through that channel
   sees the case and never the person. Offers arrive while the clock runs, the
   client takes the one they want, and the moment they do the agreement stops
   being an auction and becomes a request that both sides can see and follow.

   Two things changed here after the first version. The brief used to be a
   single object in this browser's own storage, so it was posted to nobody:
   no lawyer on another machine could see it, and accepting an offer set a
   flag and created nothing — which is why an agreed piece of work never
   turned up in either side's list. And the choice used to be "call, video or
   written", which is not work, it is a channel; the work is the statement of
   claim, and the channel is how it is handed over.
   ========================================================================== */
Pages.define("quotes", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var compose = $("[data-quote-compose]");
  if (!compose) return;

  var WINDOWS = [15, 30, 60];
  var remote = (global.SANAD_CONFIG || {}).backend === "supabase";

  var draft = { city: "", specialty: "", typeId: "", channel: "", window: 30 };
  // "Post it again" hands the old brief back rather than making somebody type
  // it a second time. The old row is left where it is — it is the record of a
  // window that closed.
  var again = App.param("again");
  var sort = "price";
  var offerTimers = [];

  // The clock outlives a view swap in the bundled build, so it is parked on
  // the window and cleared before a fresh run starts another one.
  clearInterval(global.__quoteTicker);
  var ticker = null;

  function me() { return Session.user(); }
  function mine() { return me() ? M.myQuote(me().id) : null; }
  function offers(cur) { return cur ? M.offersOn(cur.id) : []; }
  function remaining(cur) { return Math.max(0, Math.floor((cur.expiresAt - Date.now()) / 1000)); }
  function clock(total) {
    var m = Math.floor(total / 60), s = total % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function types() { return M.serviceTypes(); }
  function firstType() { return (types()[0] || {}).id || ""; }
  function typeOf(id) { return M.serviceType(id) || { title: {}, meta: {} }; }
  function channelsOf(typeId) {
    return M.channelsFor(typeId).map(function (id) { return M.channel(id); })
      .filter(Boolean);
  }
  /** Keep the draft answerable: a category always chosen, and a channel that
      the category actually allows. */
  function settle() {
    if (!draft.typeId || !M.serviceType(draft.typeId)) draft.typeId = firstType();
    var allowed = M.channelsFor(draft.typeId);
    if (allowed.indexOf(draft.channel) === -1) draft.channel = allowed[0] || "text";
  }

  /* ================================================== client: compose ===== */
  function drawCompose() {
    settle();
    var citySel = $("[data-quote-city]");
    if (citySel) {
      citySel.innerHTML = '<option value="">' + esc(I18N.t("quotes.anyCity")) + "</option>" +
        global.SEED.cities.map(function (c) {
          return '<option value="' + esc(c.id) + '">' + esc(tx(c)) + "</option>";
        }).join("");
      citySel.value = draft.city;
    }
    var specSel = $("[data-quote-spec]");
    if (specSel) {
      specSel.innerHTML = '<option value="">' + esc(I18N.t("quotes.anySpecialty")) + "</option>" +
        global.SEED.specialties.map(function (s) {
          return '<option value="' + esc(s.id) + '">' + esc(tx(s)) + "</option>";
        }).join("");
      specSel.value = draft.specialty;
    }
    drawChips();
    drawPreview();
  }

  function drawChips() {
    settle();
    var kinds = $("[data-quote-types]");
    if (kinds) {
      kinds.innerHTML = types().map(function (t) {
        return '<button type="button" class="chip' + (draft.typeId === t.id ? " is-active" : "") +
          '" data-type="' + esc(t.id) + '">' + Icons.svg(t.icon || "tag", "icon-sm") +
          esc(tx(t.title)) + "</button>";
      }).join("");
    }
    var ways = $("[data-quote-modes]");
    if (ways) {
      ways.innerHTML = channelsOf(draft.typeId).map(function (c) {
        return '<button type="button" class="chip' + (draft.channel === c.id ? " is-active" : "") +
          '" data-mode="' + esc(c.id) + '">' + Icons.svg(c.icon, "icon-sm") +
          esc(tx(c.title)) + "</button>";
      }).join("");
    }
    var win = $("[data-quote-window]");
    if (win) {
      win.innerHTML = WINDOWS.map(function (n) {
        return '<button type="button" class="chip' + (draft.window === n ? " is-active" : "") +
          '" data-window="' + n + '">' + esc(I18N.t("quotes.minutes", { n: I18N.num(n) })) + "</button>";
      }).join("");
    }
  }

  /** Exactly what a lawyer will receive — proof the client is not in it. */
  function drawPreview() {
    var prev = $("[data-quote-preview]");
    if (!prev) return;
    settle();
    var city = draft.city ? tx(M.city(draft.city)) : I18N.t("quotes.anyCity");
    var sp = draft.specialty ? tx(M.specialty(draft.specialty)) : I18N.t("quotes.anySpecialty");
    var ch = M.channel(draft.channel);
    prev.innerHTML =
      '<p class="tiny muted">' + esc(I18N.t("bids.clientHidden")) + "</p>" +
      '<div class="anon-card" style="margin-top:var(--s-3)"><div class="row gap-3">' +
        '<span class="anon-card__mark">' + Icons.svg("user", "icon-sm") + "</span>" +
        "<div><strong class=\"small\">" + esc(I18N.t("quotes.anonId", { id: "4821" })) + "</strong>" +
        '<p class="tiny muted">' + esc(tx(typeOf(draft.typeId).title)) +
          ' <span class="dot"></span> ' + esc(ch ? tx(ch.title) : "") +
          ' <span class="dot"></span> ' + esc(city) +
          ' <span class="dot"></span> ' + esc(sp) + "</p></div>" +
      "</div></div>";
  }

  /* ================================================== client: the board === */
  function offerRow(cur, o) {
    var l = M.user(o.lawyer);
    if (!l) return "";
    var prices = M.offersOn(cur.id).map(function (x) { return x.price; });
    var best = o.price === Math.min.apply(null, prices);
    return '<article class="offer-card' + (best ? " is-best" : "") + '">' +
      (best ? '<span class="offer-card__flag">' + esc(I18N.t("quotes.bestPrice")) + "</span>" : "") +
      C.avatar(l, "md") +
      '<div class="grow" style="min-width:0">' +
        "<strong class=\"small\">" + esc(tx(l.name)) + "</strong>" +
        '<p class="tiny muted">' + esc(tx(l.title || {})) + "</p>" +
        '<div class="meta-row" style="margin-top:var(--s-2)">' + C.ratingLine(l.id) +
          '<span class="dot"></span><span class="muted">' +
            esc(I18N.t("lawyer.years", { n: I18N.num(l.years || 0) })) + "</span>" +
          '<span class="dot"></span><span class="muted">' +
            esc(I18N.t("quotes.within", { n: I18N.num(o.eta) })) + "</span></div>" +
      "</div>" +
      '<div class="offer-card__end">' +
        '<strong class="offer-card__price"><span class="num">' + I18N.num(o.price) + "</span> " +
          '<span class="small muted">' + esc(I18N.t("common.sar")) + "</span></strong>" +
        '<button class="btn btn--accent btn--sm" type="button" data-accept="' + esc(o.id) + '">' +
          esc(I18N.t("quotes.accept")) + "</button>" +
      "</div></article>";
  }

  function sortedOffers(cur) {
    return offers(cur).slice().sort(function (a, b) {
      if (sort === "rating") return M.ratingOf(b.lawyer).avg - M.ratingOf(a.lawyer).avg;
      if (sort === "speed") return a.eta - b.eta;
      return a.price - b.price;
    });
  }

  function drawLive() {
    var host = $("[data-quote-live]");
    var cur = mine();
    if (!host) return;

    // Worked out, not read off the row: a window that ran out while nobody
    // had the page open is over, whatever the stored status still says.
    var state = M.quoteState(cur);
    compose.hidden = state === "open";
    host.hidden = !cur;
    if (!cur) return;

    if (state === "accepted") {
      var won = M.user(cur.acceptedBy);
      host.innerHTML =
        '<div class="card card--rule-gold card--pad center stack gap-4" style="align-items:center">' +
          '<span class="feature__icon" style="background:var(--success-soft);color:var(--success)">' +
            Icons.svg("check", "icon-lg") + "</span>" +
          '<h1 class="headline">' + esc(I18N.t("quotes.acceptedTitle")) + "</h1>" +
          '<p class="lead">' + esc(I18N.t("quotes.acceptedBody", { name: won ? tx(won.name) : "" })) + "</p>" +
          '<hr class="divider" style="width:100%">' +
          '<strong class="subtitle">' + esc(I18N.t("quotes.trackTitle")) + "</strong>" +
          '<p class="small muted">' + esc(I18N.t("quotes.trackBody")) + "</p>" +
          '<a class="btn btn--primary" href="requests.html' +
            (cur.requestId ? "?r=" + encodeURIComponent(cur.requestId) : "") + '">' +
            esc(I18N.t("quotes.openRequest")) + "</a>" +
          '<button class="btn btn--ghost btn--sm" type="button" data-quote-reset>' +
            esc(I18N.t("quotes.newRequest")) + "</button></div>";
      return;
    }
    if (state === "expired" || state === "cancelled") {
      host.innerHTML =
        '<div class="card card--pad center stack gap-4" style="align-items:center">' +
          '<span class="feature__icon">' + Icons.svg("clock", "icon-xl") + "</span>" +
          '<h1 class="headline">' +
            esc(I18N.t(state === "expired" ? "quotes.expired" : "quotes.cancelled")) + "</h1>" +
          '<p class="lead">' +
            esc(I18N.t(state === "expired" ? "quotes.expiredBody" : "quotes.cancelled")) + "</p>" +
          '<button class="btn btn--accent" type="button" data-quote-reset>' +
            esc(I18N.t("quotes.repost")) + "</button></div>";
      return;
    }

    var left = remaining(cur);
    var city = cur.city ? tx(M.city(cur.city)) : I18N.t("quotes.anyCity");
    var ch = M.channel(cur.channel);
    var list = offers(cur);
    // How many lawyers could answer this at all. A board with nothing on it
    // means one thing when twelve people could have bid and quite another
    // when nobody on the platform does this work through this channel.
    var reach = M.lawyersForQuote(cur).length;
    host.innerHTML =
      '<div class="card card--rule-gold card--pad" style="margin-bottom:var(--s-6)">' +
        '<div class="row between wrap gap-6">' +
          '<div class="grow" style="min-width:220px">' +
            '<span class="status status--ok">' + esc(I18N.t("quotes.live")) + "</span>" +
            '<h1 class="title" style="margin-top:var(--s-3)">' + esc(cur.brief.slice(0, 90)) +
              (cur.brief.length > 90 ? "…" : "") + "</h1>" +
            '<p class="small muted" style="margin-top:var(--s-2)">' +
              esc(tx(typeOf(cur.typeId).title)) + ' <span class="dot"></span> ' +
              esc(ch ? tx(ch.title) : "") + ' <span class="dot"></span> ' + esc(city) + "</p></div>" +
          '<div class="countdown" style="min-width:180px">' +
            '<div class="countdown__time" data-quote-clock>' + clock(left) + "</div>" +
            '<p class="tiny muted">' + esc(I18N.t("quotes.timeLeft")) + "</p></div>" +
        "</div>" +
        '<hr class="divider">' +
        '<p class="tiny ' + (reach ? "muted" : "faint") + '" style="margin-bottom:var(--s-3)">' +
          esc(reach ? I18N.t("brief.reach", { n: I18N.num(reach) })
                    : I18N.t("brief.reachNone")) + "</p>" +
        '<div class="row between wrap gap-3">' +
          "<strong class=\"small\">" + esc(I18N.t("quotes.offersIn", { n: I18N.num(list.length) })) + "</strong>" +
          '<button class="btn btn--ghost btn--sm" type="button" data-quote-cancel>' +
            esc(I18N.t("quotes.cancel")) + "</button></div>" +
      "</div>" +
      (list.length
        ? '<div class="row gap-2 wrap" style="margin-bottom:var(--s-4)">' +
            [["price", "quotes.sortPrice"], ["rating", "quotes.sortRating"], ["speed", "quotes.sortSpeed"]]
              .map(function (p) {
                return '<button type="button" class="chip' + (sort === p[0] ? " is-active" : "") +
                  '" data-sort="' + p[0] + '">' + esc(I18N.t(p[1])) + "</button>";
              }).join("") + "</div>" +
          '<div class="stack gap-3">' + sortedOffers(cur).map(function (o) {
            return offerRow(cur, o);
          }).join("") + "</div>"
        : '<div class="card empty">' + Icons.svg("clock", "icon-xl") +
          '<p class="subtitle">' + esc(I18N.t("quotes.waiting")) + "</p></div>");
  }

  /* ================================================== lawyer: bidding ===== */
  function briefCard(cur, who) {
    var city = cur.city ? tx(M.city(cur.city)) : I18N.t("quotes.anyCity");
    var spec = cur.specialty ? tx(M.specialty(cur.specialty)) : I18N.t("quotes.anySpecialty");
    var ch = M.channel(cur.channel);
    var list = M.offersOn(cur.id);
    var ours = list.filter(function (o) { return o.lawyer === who.id; })[0];
    var band = M.priceBand(cur.typeId);

    return '<article class="card card--pad" style="margin-bottom:var(--s-5)">' +
      '<div class="row between wrap gap-3" style="margin-bottom:var(--s-4)">' +
        '<strong class="subtitle">' + esc(tx(typeOf(cur.typeId).title)) + "</strong>" +
        '<span class="countdown__time" data-brief-clock="' + esc(cur.id) + '">' +
          esc(I18N.t("bids.closesIn")) + " " + clock(remaining(cur)) + "</span></div>" +

      '<div class="anon-card"><div class="row gap-3" style="align-items:flex-start">' +
        '<span class="anon-card__mark">' + Icons.svg("user", "icon-sm") + "</span>" +
        '<div class="grow" style="min-width:0">' +
          "<strong class=\"small\">" + esc(I18N.t("quotes.anonId", { id: String(cur.id).slice(0, 4) })) + "</strong>" +
          '<p class="tiny muted">' + esc(city) + ' <span class="dot"></span> ' + esc(spec) +
            ' <span class="dot"></span> ' + esc(ch ? tx(ch.title) : "") + "</p></div></div>" +
        '<p class="small" style="margin-top:var(--s-3)">' + esc(cur.brief) + "</p>" +
        '<p class="tiny faint row gap-2" style="margin-top:var(--s-3)">' + Icons.svg("lock", "icon-sm") +
          esc(I18N.t("bids.clientHidden")) + "</p></div>" +

      '<p class="tiny muted" style="margin-top:var(--s-4)">' +
        esc(I18N.t("bids.competing", { n: I18N.num(list.length) })) + "</p>" +

      (ours
        ? '<p class="status status--ok" style="width:100%;justify-content:center;margin-top:var(--s-4)">' +
            Icons.svg("check", "icon-sm") +
            esc(ours.auto ? I18N.t("bids.auto") : I18N.t("bids.already")) + " — " +
            '<span class="num">' + I18N.num(ours.price) + "</span> " + esc(I18N.t("common.sar")) + "</p>"
        : '<form class="bid-form" data-bid-form="' + esc(cur.id) + '">' +
            '<label class="field"><span class="tiny muted">' + esc(I18N.t("bids.yourPrice")) + "</span>" +
              '<input class="input num" type="number" min="' + band.min + '" max="' + band.max +
                '" step="5" data-bid-price value="' + M.quotePrice(who.id, cur.typeId) + '"></label>' +
            '<label class="field"><span class="tiny muted">' + esc(I18N.t("bids.yourEta")) + "</span>" +
              '<input class="input num" type="number" min="1" max="72" step="1" data-bid-eta value="4"></label>' +
            '<button class="btn btn--accent" type="submit">' + esc(I18N.t("bids.submit")) + "</button>" +
          "</form>") +
    "</article>";
  }

  function drawBids() {
    var host = $("[data-quote-bids]");
    if (!host) return;
    var who = me();
    host.hidden = false;

    var open = M.openQuotesFor(who.id);
    // What happened to the briefs they did bid on, whether or not they are
    // still open: a lawyer should not have to guess why a board went quiet.
    var settled = M.quotes().filter(function (q) {
      if (q.status === "open") return false;
      return M.offersOn(q.id).some(function (o) { return o.lawyer === who.id; });
    }).slice(0, 4);

    host.innerHTML =
      '<div class="row between wrap gap-3" style="margin-bottom:var(--s-5)">' +
        '<div><h1 class="headline" data-i18n="bids.title"></h1>' +
        '<p class="lead" data-i18n="bids.lead"></p></div>' +
        (who.autoBid
          ? '<span class="status status--ok">' + Icons.svg("check", "icon-sm") +
            esc(I18N.t("bids.autoOn")) + "</span>" : "") +
      "</div>" +
      (open.length
        ? '<p class="tiny muted" style="margin-bottom:var(--s-4)">' +
            esc(I18N.t("bids.openCount", { n: I18N.num(open.length) })) + "</p>" +
          open.map(function (q) { return briefCard(q, who); }).join("")
        : '<div class="card empty">' + Icons.svg("gavel", "icon-xl") +
          '<p class="subtitle">' + esc(I18N.t("bids.none")) + "</p>" +
          // A board is empty for two different reasons, and only one of them
          // is "wait". A lawyer who has listed nothing will wait forever.
          (M.servicesOf(who.id).length
            ? ""
            : '<p class="small muted" style="margin-top:var(--s-3)">' +
              esc(I18N.t("bids.listFirst")) + "</p>" +
              '<a class="btn btn--outline btn--sm" style="margin-top:var(--s-3)" ' +
              'href="services.html">' + esc(I18N.t("nav.services")) + "</a>") +
          "</div>") +
      settled.map(function (q) {
        var won = q.status === "accepted" && q.acceptedBy === who.id;
        return '<p class="status ' + (won ? "status--ok" : "") + '" style="width:100%;' +
          'justify-content:center;margin-top:var(--s-3)">' +
          Icons.svg(won ? "trophy" : "clock", "icon-sm") +
          esc(I18N.t(won ? "bids.won" : "bids.lost")) + "</p>";
      }).join("");
    I18N.apply(host);
  }

  /* ================================================== the field ===========
     On the demo backend there is nobody else on the other end, so the rest of
     the board is simulated. On the real one it must not be: an offer is a row
     that belongs to the lawyer who made it, and a browser cannot write one in
     somebody else's name — nor should it. There, a lawyer who has said they
     take matching work automatically has already bid, from the database, by
     the time the brief is posted. */
  function scheduleOffers(cur) {
    offerTimers.forEach(clearTimeout);
    offerTimers = [];
    if (remote) return;

    var meId = me() ? me().id : null;
    var eligible = M.listedLawyers().filter(function (l) { return l.id !== meId; });
    var pool = eligible.filter(function (l) {
      if (cur.specialty && (l.specialties || []).indexOf(cur.specialty) === -1) return false;
      if (cur.city && l.city !== cur.city) return false;
      return true;
    });
    if (pool.length < 3) pool = eligible.slice();

    pool.slice(0, 5).forEach(function (l, i) {
      var base = M.quotePrice(l.id, cur.typeId);
      var band = M.priceBand(cur.typeId);
      // A competitive board: bids land between 25% under and 10% over list,
      // and never outside what the platform publishes.
      var factor = 0.75 + ((i * 37) % 35) / 100;
      var price = Math.min(band.max, Math.max(band.min, Math.round(base * factor / 5) * 5));
      var eta = 2 + ((i * 3) % 10);
      offerTimers.push(setTimeout(function () {
        if (Store.addOffer({ quoteId: cur.id, lawyer: l.id, price: price, eta: eta })) {
          if (cur.clientId) Store.notify({ to: cur.clientId, type: "offer", ref: l.id });
        }
      }, 2200 + i * 2600));
    });
  }

  /* The other side of the auction is another browser, or the database itself
     answering on a lawyer's behalf. Neither of them can reach into this page,
     so a board that is only drawn once shows nought offers for as long as
     anybody watches it. Asked again every few seconds while something is
     actually open, and redrawn only when the answer has changed — a redraw on
     a timer would take the half-typed bid out from under whoever is typing. */
  var polls = 0;
  function poll(active) {
    if (!active || !Store.refreshAuction) return;
    if (polls++ % 5 !== 0) return;               // every fifth second
    Store.refreshAuction();
  }

  function startTicker() {
    clearInterval(ticker);
    ticker = global.__quoteTicker = setInterval(function () {
      var cur = mine();
      var el = $("[data-quote-clock]");
      poll(Session.is("lawyer") ? true : !!(cur && M.quoteState(cur) === "open"));
      if (cur && M.quoteState(cur) === "open") {
        var left = remaining(cur);
        if (el) el.textContent = clock(left);
        if (left <= 0) {
          offerTimers.forEach(clearTimeout);
          Store.setQuote(cur.id, { status: "expired" });
          App.toast(I18N.t("quotes.expired"), "clock");
        }
      }
      // The lawyer's board is a list, so each brief carries its own clock.
      var any = false;
      App.$$("[data-brief-clock]").forEach(function (node) {
        var q = M.quote(node.getAttribute("data-brief-clock"));
        if (!q) return;
        any = true;
        node.textContent = I18N.t("bids.closesIn") + " " + clock(remaining(q));
      });
      // A lawyer with an empty board is the one person who most needs the
      // page to keep asking: the next brief is what they are waiting for.
      if (!any && !Session.is("lawyer") && (!cur || M.quoteState(cur) !== "open")) {
        clearInterval(ticker);
      }
    }, 1000);
  }

  /* ================================================== draw =============== */
  App.onRender(function () {
    var isLawyer = Session.is("lawyer");
    var bids = $("[data-quote-bids]");
    var live = $("[data-quote-live]");

    if (isLawyer) {
      compose.hidden = true;
      if (live) live.hidden = true;
      drawBids();
      startTicker();
      return;
    }

    if (bids) { bids.hidden = true; bids.innerHTML = ""; }
    if (again) {
      var old = M.quote(again);
      if (old && old.clientId === (me() ? me().id : null)) {
        draft.typeId = old.typeId; draft.channel = old.channel;
        draft.city = old.city || ""; draft.specialty = old.specialty || "";
        var box = $("#q-brief");
        if (box && !box.value) box.value = old.brief;
        App.toast(I18N.t("brief.reposted"), "send");
      }
      again = null;                    // once, not on every redraw
    }
    drawCompose();
    drawLive();
    var cur = mine();
    if (cur && M.quoteState(cur) === "open") { startTicker(); scheduleOffers(cur); }
  });

  /* ================================================== events ============= */
  compose.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-type]");
    if (t) { draft.typeId = t.getAttribute("data-type"); drawChips(); drawPreview(); return; }
    var m = ev.target.closest("[data-mode]");
    if (m) { draft.channel = m.getAttribute("data-mode"); drawChips(); drawPreview(); return; }
    var w = ev.target.closest("[data-window]");
    if (w) { draft.window = parseInt(w.getAttribute("data-window"), 10); drawChips(); }
  });

  compose.addEventListener("change", function (ev) {
    var isCity = ev.target.matches("[data-quote-city]");
    var isSpec = ev.target.matches("[data-quote-spec]");
    // The textarea also fires `change` when it loses focus — which happens on
    // the way to clicking a chip. Redrawing then would tear the chip out from
    // under the pointer and swallow the click, so only the selects redraw.
    if (!isCity && !isSpec) return;
    if (isCity) draft.city = ev.target.value;
    if (isSpec) draft.specialty = ev.target.value;
    drawPreview();
  });

  var form = $("[data-quote-form]");
  if (form) {
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var brief = $("#q-brief").value.trim();
      if (brief.length < 10) { App.toast(I18N.t("quotes.needBrief"), "file-text"); return; }
      settle();
      if (!draft.typeId) { App.toast(I18N.t("quotes.needType"), "tag"); return; }
      if (!me()) { App.go("login.html"); return; }

      var cur = Store.openQuote({
        brief: brief, city: draft.city, specialty: draft.specialty,
        typeId: draft.typeId, channel: draft.channel, minutes: draft.window,
        expiresAt: Date.now() + draft.window * 60000,
        clientId: me().id, status: "open"
      });
      App.toast(I18N.t("quotes.published"), "check");
      startTicker();
      scheduleOffers(cur);
      global.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /** Taking an offer is where an auction stops being an auction. The work
      becomes a request carrying both names, at the price that was agreed, and
      from here on the two of them are looking at the same row. */
  function accept(offerId) {
    var cur = mine();
    if (!cur || cur.status !== "open") return;
    var offer = M.offersOn(cur.id).filter(function (o) { return o.id === offerId; })[0];
    if (!offer) return;

    offerTimers.forEach(clearTimeout);
    clearInterval(ticker);

    var kind = typeOf(cur.typeId);
    // The brief closes at once — nobody else may bid on work that has been
    // given away — and the link to the request is written when the request
    // has an id the database agrees with, which on the remote backend is one
    // round trip later.
    Store.setQuote(cur.id, { status: "accepted", acceptedBy: offer.lawyer });
    Store.addRequest({
      clientId: cur.clientId, lawyerId: offer.lawyer,
      typeId: cur.typeId, channel: cur.channel,
      title: kind.title, brief: { ar: cur.brief, en: cur.brief },
      price: offer.price, status: "new", hours: offer.eta || 4,
    }, function (saved) {
      Store.setQuote(cur.id, { requestId: saved.id });
      Store.notify({ to: offer.lawyer, type: "won", ref: saved.id });
    });

    var who = M.user(offer.lawyer);
    App.toast(I18N.t("quotes.accepted", { name: who ? tx(who.name) : "" }), "check");
  }

  var live = $("[data-quote-live]");
  if (live) {
    live.addEventListener("click", function (ev) {
      var so = ev.target.closest("[data-sort]");
      if (so) { sort = so.getAttribute("data-sort"); drawLive(); return; }

      var ac = ev.target.closest("[data-accept]");
      if (ac) { accept(ac.getAttribute("data-accept")); return; }

      if (ev.target.closest("[data-quote-cancel]")) {
        var cur = mine();
        offerTimers.forEach(clearTimeout);
        clearInterval(ticker);
        if (cur) Store.setQuote(cur.id, { status: "cancelled" });
        App.toast(I18N.t("quotes.cancelled"), "close");
        return;
      }
      // "Post another" leaves the old brief where it is. It is the record of
      // what was agreed and what it cost, and on the remote backend it is a
      // row with a request hanging off it — so this scrolls to the form
      // rather than deleting anything.
      if (ev.target.closest("[data-quote-reset]")) {
        compose.hidden = false;
        var box = $("#q-brief");
        if (box) { box.value = ""; box.focus(); }
        compose.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }

  var bidsHost = $("[data-quote-bids]");
  if (bidsHost) {
    bidsHost.addEventListener("submit", function (ev) {
      var f = ev.target.closest("[data-bid-form]");
      if (!f) return;
      ev.preventDefault();
      var cur = M.quote(f.getAttribute("data-bid-form"));
      if (!cur) return;
      var price = parseInt(f.querySelector("[data-bid-price]").value, 10);
      var eta = parseInt(f.querySelector("[data-bid-eta]").value, 10) || 4;
      var band = M.priceBand(cur.typeId);
      if (!price || price < band.min || price > band.max) {
        App.toast(I18N.t("bids.badPrice"), "file-text");
        return;
      }
      App.toast(I18N.t(Store.addOffer({
        quoteId: cur.id, lawyer: me().id, price: price, eta: eta,
      }) ? "bids.submitted" : "bids.already"), "check");
    });
  }
});

/* ==========================================================================
   The assistant — a lawyer's tool, and only a lawyer's.

   A client never reaches this page and never sees the word. What they buy is
   a document at a stated price; how it gets written is the lawyer's business,
   and nothing here is published until the lawyer approves it.

   Two halves: the knowledge base the drafting reads from (the lawyer's own
   files plus the regulations they switch on), and the queue of their own
   requests waiting to be drafted.
   ========================================================================== */
Pages.define("assistant", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-assistant]");
  if (!host) return;

  var files = null;          // the lawyer's uploads, this session only
  var regs = {};             // regulation id -> on
  var uploads = 0;
  var openDraft = null;

  function ensure() {
    if (!files) files = global.SEED.lawyerFiles.slice();
    global.SEED.regulations.forEach(function (r) {
      if (!(r.id in regs)) regs[r.id] = r.on;
    });
  }

  function gate(key) {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("lock", key || "ai.forLawyers") +
      '<p class="center" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="index.html" data-i18n="art.back"></a></p></div>';
  }

  /* ---------- knowledge base ---------- */
  function kb() {
    var on = global.SEED.regulations.filter(function (r) { return regs[r.id]; }).length;
    return '<aside class="stack gap-6">' +
      '<section class="card card--pad">' +
        '<div class="row between gap-3">' +
          '<h2 class="subtitle" data-i18n="ai.myFiles"></h2>' +
          '<button class="btn btn--outline btn--sm" type="button" data-kb-upload>' +
            Icons.svg("upload", "icon-sm") + '<span data-i18n="ai.upload"></span></button></div>' +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="ai.myFilesHint"></p>' +
        '<div style="margin-top:var(--s-4)">' + files.map(function (f) {
          return '<div class="list-row">' +
            '<span class="list-row__icon" style="color:var(--accent)">' +
              Icons.svg("file-text", "icon-sm") + "</span>" +
            '<div class="grow"><strong class="small">' + esc(tx(f)) + "</strong>" +
              '<p class="tiny muted">' + esc(I18N.t(f.kind === "template" ? "ai.template" : "ai.precedent")) +
                ' <span class="dot"></span> <span class="num">' + esc(f.size) + "</span></p></div>" +
            '<button class="icon-btn" type="button" data-kb-remove="' + esc(f.id) + '" ' +
              'data-i18n-attr="aria-label:ai.removeFile">' + Icons.svg("close", "icon-sm") + "</button></div>";
        }).join("") + "</div>" +
      "</section>" +

      '<section class="card card--pad">' +
        '<div class="row between gap-3">' +
          '<h2 class="subtitle" data-i18n="ai.regs"></h2>' +
          '<span class="tag">' + esc(I18N.t("ai.regsOn", { n: I18N.num(on) })) + "</span></div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="ai.regsHint"></p>' +
        '<div class="stack gap-2" style="margin-top:var(--s-4)">' +
          global.SEED.regulations.map(function (r) {
            return '<label class="check"><input type="checkbox" data-reg="' + esc(r.id) + '"' +
              (regs[r.id] ? " checked" : "") + "><span>" + esc(tx(r)) + "</span></label>";
          }).join("") + "</div>" +
      "</section></aside>";
  }

  /* ---------- the queue: this lawyer's own drafting work ---------- */
  function queue() {
    var me = Session.user();
    var rows = M.requestsForLawyer(me.id).filter(function (r) {
      var st = M.requestState(r).status;
      var type = M.serviceType(r.typeId);
      // Something to draft, which a call is not.
      return !M.isLive(r) && st !== "delivered" && st !== "completed" &&
             st !== "cancelled" && !M.requestState(r).assignedTo;
    });

    return '<section class="card card--pad">' +
      '<div class="row between gap-3">' +
        '<h2 class="subtitle" data-i18n="ai.queue"></h2>' +
        '<span class="tag num">' + I18N.num(rows.length) + "</span></div>" +
      (rows.length
        ? '<div style="margin-top:var(--s-4)">' + rows.map(function (r) {
            var st = M.requestState(r).status;
            var ready = st === "drafted";
            var client = M.user(r.clientId);
            return '<div class="list-row">' +
              '<span class="list-row__icon">' + Icons.svg(ready ? "sparkle" : "clock", "icon-sm") + "</span>" +
              '<div class="grow" style="min-width:0"><strong class="small">' + esc(tx(r.title)) + "</strong>" +
                '<p class="tiny muted">' + esc(client ? tx(client.name) : "") +
                  ' <span class="dot"></span> ' + esc(tx(r.ago)) + "</p>" +
                '<p class="tiny faint">' + esc(tx(r.brief)) + "</p></div>" +
              '<div class="stack gap-2" style="align-items:flex-end">' +
                '<span class="status status--' + (ready ? "ok" : "muted") + '">' +
                  esc(I18N.t(ready ? "ai.stateDrafted" : "ai.stateQueued")) + "</span>" +
                '<button class="btn btn--sm ' + (ready ? "btn--primary" : "btn--outline") +
                  '" type="button" data-req="' + esc(r.id) + '">' +
                  esc(I18N.t(ready ? "ai.openDraft" : "ai.generate")) + "</button></div></div>";
          }).join("") + "</div>"
        : '<p class="muted center" style="padding:var(--s-6)" data-i18n="ai.queueEmpty"></p>') +
    "</section>";
  }

  function editor() {
    if (!openDraft) return "";
    var r = M.request(openDraft);
    if (!r) return "";
    var client = M.user(r.clientId);
    var st = M.requestState(r);
    var body = st.body || (r.doc && global.SEED.draftBodies[r.doc] ? tx(global.SEED.draftBodies[r.doc]) : "");
    var onRegs = global.SEED.regulations.filter(function (x) { return regs[x.id]; })
      .slice(0, 3).map(function (x) { return tx(x); }).join("، ");

    return '<section class="panel" style="margin-top:var(--s-6)">' +
      '<div class="panel__head row between wrap gap-3">' +
        "<div><h2 class=\"subtitle\">" + esc(I18N.t("ai.draftFor")) + " " +
          esc(client ? tx(client.name) : "") + "</h2>" +
          '<p class="tiny muted">' + esc(tx(r.title)) + ' <span class="dot"></span> ' +
            esc(I18N.t("ai.aiSource")) + "</p></div>" +
        '<button class="icon-btn" type="button" data-draft-close ' +
          'data-i18n-attr="aria-label:ai.discard">' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<div style="padding:var(--s-4) var(--s-6) 0">' +
        '<p class="tiny muted">' + esc(I18N.t("ai.basedOn")) + ": " + esc(onRegs) + "</p>" +
        '<p class="tiny muted" style="margin-top:var(--s-1)" data-i18n="ai.editHint"></p></div>' +
      '<textarea class="draft-text" data-draft-body spellcheck="false">' + esc(body) + "</textarea>" +
      '<div class="draft-foot">' +
        '<div><span class="tiny muted" data-i18n="ai.earns"></span>' +
          '<strong style="display:block;color:var(--accent)"><span class="num">' +
            I18N.num(r.price) + "</span> " + esc(I18N.t("common.sar")) + "</strong></div>" +
        '<span class="tiny muted grow">' + esc(I18N.t("ai.reviewMinutes", { n: I18N.num(6) })) + "</span>" +
        '<button class="btn btn--accent" type="button" data-draft-approve>' +
          Icons.svg("check", "icon-sm") + '<span data-i18n="ai.approve"></span></button>' +
      "</div></section>";
  }

  function howItWorks() {
    return '<section class="section section--tight"><div class="container">' +
      '<h2 class="headline" data-i18n="ai.howTitle"></h2>' +
      '<div class="grid grid-4" style="margin-top:var(--s-6)">' +
        [1, 2, 3, 4].map(function (n) {
          return '<div class="card card--pad step"><span class="step__num num">' + I18N.num(n) + "</span>" +
            '<h3 class="subtitle" style="margin-top:var(--s-3)" data-i18n="ai.step' + n + '"></h3>' +
            '<p class="small muted" data-i18n="ai.step' + n + 'Body"></p></div>';
        }).join("") + "</div></div></section>";
  }

  App.onRender(function () {
    if (!Session.is("lawyer")) { host.innerHTML = gate(); I18N.apply(host); return; }
    // Sold, not given. A lawyer without a live subscription is told what it is
    // rather than shown an empty workspace they cannot use.
    if (!M.canDraft(Session.user().id)) {
      host.innerHTML = gate("ai.needsSub"); I18N.apply(host); return;
    }
    ensure();

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-12)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="ai.lawyerHeading"></h1>' +
        '<p class="lead" data-i18n="ai.lawyerLead"></p>' +
        '<p class="disclaimer" style="margin-top:var(--s-4)">' + Icons.svg("lock", "icon-sm") +
          '<span data-i18n="ai.disclaimer"></span></p>' +
      "</header>" +
      '<div class="grid dash-split">' +
        "<div>" + queue() + editor() + "</div>" +
        kb() +
      "</div></div>" + howItWorks();

    I18N.apply(host);
  });

  host.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-kb-upload]")) {
      uploads++;
      files = files.concat([{ id: "up-" + uploads, kind: "template", size: "36 KB",
        ar: "ملف مرفوع " + uploads, en: "Uploaded file " + uploads }]);
      App.toast(I18N.t("ai.uploaded"), "check");
      App.rerender();
      return;
    }

    var rm = ev.target.closest("[data-kb-remove]");
    if (rm) {
      var fid = rm.getAttribute("data-kb-remove");
      files = files.filter(function (f) { return f.id !== fid; });
      App.toast(I18N.t("ai.removed"), "close");
      App.rerender();
      return;
    }

    var req = ev.target.closest("[data-req]");
    if (req) {
      var rid = req.getAttribute("data-req");
      if (M.requestState(M.request(rid)).status === "drafted") {
        openDraft = rid;
        App.rerender();
      } else {
        // Drafting takes a beat, so the state change reads as work happening.
        req.disabled = true;
        req.textContent = I18N.t("ai.generating");
        setTimeout(function () {
          openDraft = rid;
          Store.setRequest(rid, { status: "drafted" });
          App.toast(I18N.t("ai.generated"), "sparkle");
        }, 700);
      }
      return;
    }

    if (ev.target.closest("[data-draft-close]")) { openDraft = null; App.rerender(); return; }

    if (ev.target.closest("[data-draft-approve]")) {
      var box = $("[data-draft-body]", host);
      var id = openDraft;
      openDraft = null;
      Store.setRequest(id, { status: "delivered", body: box ? box.value : null });
      App.toast(I18N.t("ai.approved"), "check");
    }
  });

  host.addEventListener("change", function (ev) {
    var reg = ev.target.closest("[data-reg]");
    if (!reg) return;
    regs[reg.getAttribute("data-reg")] = reg.checked;
    App.rerender();
  });
});

/* ==========================================================================
   Account — who you are, and the way out.

   The role switcher that used to live here was a demo affordance: it invited
   you to add a role and "try its interface", which on a real platform means
   tapping a card to become a lawyer. Roles are decided at sign-up and changed
   by staff; nothing on this page grants one.
   ========================================================================== */
Pages.define("account", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-account]");
  if (!host) return;

  function demo() { return !(global.SB && global.SB.configured()); }

  function guest() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("user", "account.guest") +
      '<div class="row center gap-3" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="login.html" data-i18n="auth.signIn"></a>' +
        '<a class="btn btn--outline" href="signup.html" data-i18n="auth.createAccount"></a></div></div>';
  }

  /* Switching between capacities the account ALREADY holds. This is not the
     role picker that used to live here: there is no card that adds one, and
     nothing on this page can. A staff member who is also a client should be
     able to look at the site the way a client sees it without signing out. */
  function viewAs() {
    var mine = Session.myRoles();
    if (mine.length < 2) return "";
    var active = Session.role();
    return '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
      '<h2 class="subtitle" data-i18n="account.viewAs"></h2>' +
      '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="account.viewAsHint"></p>' +
      '<div class="row gap-3 wrap" style="margin-top:var(--s-5)">' +
        mine.map(function (id) {
          var def = Session.roleDef(id);
          return '<button type="button" class="btn btn--sm ' +
            (active === id ? "btn--primary" : "btn--outline") + '" data-view-as="' + id + '">' +
            Icons.svg(def.icon, "icon-sm") + esc(I18N.t(def.nameKey)) + "</button>";
        }).join("") +
      "</div></section>";
  }

  function details(u) {
    function row(labelKey, value) {
      return "<div><span class=\"tiny muted\">" + esc(I18N.t(labelKey)) + "</span>" +
        '<p class="small"><strong>' + esc(value || "—") + "</strong></p></div>";
    }
    return '<section class="card card--pad">' +
      '<h2 class="subtitle" data-i18n="account.details"></h2>' +
      '<div class="grid grid-2" style="gap:var(--s-4);margin-top:var(--s-5)">' +
        row("auth.fullName", tx(u.name)) +
        row("auth.email", u.email) +
        row("account.phone", u.phone) +
        row("account.city", u.city ? tx(M.city(u.city) || {}) : "") +
      "</div></section>";
  }

  App.onRender(function () {
    if (Session.isGuest()) { host.innerHTML = guest(); I18N.apply(host); return; }

    var u = Session.user();
    var pro = Session.is("lawyer") || Session.is("intern");

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20);max-width:900px">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="account.heading"></h1>' +
        '<p class="lead" data-i18n="account.lead"></p></header>' +

      '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
        '<div class="row gap-5 wrap">' + C.avatar(u, "lg") +
          '<div class="grow" style="min-width:0">' +
            '<span class="tiny muted" data-i18n="account.signedInAs"></span>' +
            '<h2 class="title">' + esc(tx(u.name)) + "</h2>" +
            '<p class="small muted num" dir="ltr">' + esc(u.email) + "</p>" +
            (Session.isVerified() ? "" :
              '<p class="note-inline" style="margin-top:var(--s-3)" data-i18n="signup.pendingNote"></p>') +
          "</div>" +
          '<div class="stack gap-2">' +
            (pro ? '<a class="btn btn--outline btn--sm" href="' + M.profileHref(u) + '" ' +
              'data-i18n="account.viewProfile"></a>' : "") +
            '<button class="btn btn--ghost btn--sm" type="button" data-signout>' +
              Icons.svg("logout", "icon-sm") + '<span data-i18n="dash.logout"></span></button>' +
          "</div>" +
        "</div></section>" +

      viewAs() +

      details(u) +

      // Wiping the visit is a thing you do to a demo. On a real database it
      // would be either meaningless or alarming, so it is not offered there.
      (demo()
        ? '<section class="card card--pad" style="margin-top:var(--s-6)">' +
            '<h2 class="subtitle" data-i18n="account.reset"></h2>' +
            '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)" data-i18n="account.resetHint"></p>' +
            '<button class="btn btn--outline btn--sm" type="button" data-reset>' +
              Icons.svg("trash", "icon-sm") + '<span data-i18n="account.reset"></span></button></section>'
        : "") +
    "</div>";

    I18N.apply(host);
  });

  host.addEventListener("click", function (ev) {
    var v = ev.target.closest("[data-view-as]");
    if (v) {
      var id = v.getAttribute("data-view-as");
      // switchRole refuses anything the account does not hold, so this cannot
      // become a way to acquire one.
      if (Session.switchRole(id)) {
        App.toast(I18N.t("role.changed", { role: I18N.t(Session.roleDef(id).nameKey) }), "check");
      }
      return;
    }

    if (ev.target.closest("[data-signout]")) {
      Session.signOut().then(function () { App.go("index.html"); });
      return;
    }

    if (ev.target.closest("[data-reset]")) {
      Store.resetWork();
      App.toast(I18N.t("account.resetDone"), "trash");
    }
  });
});
