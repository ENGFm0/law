/* ==========================================================================
   Sign-in. Also offers the seeded demo people, so the three interfaces can be
   seen without registering three times.
   ========================================================================== */
Pages.define("login", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var form = $("[data-login]");
  if (!form) return;

  function error(key) {
    var el = $("[data-login-error]");
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  App.onRender(function () {
    var slot = $("[data-google]") ? null : $("[data-google-slot]");
    if (slot) slot.innerHTML = global.C.googleButton();

    var points = $("[data-auth-points]");
    if (points) {
      points.innerHTML = ["auth.asidePoint1", "auth.asidePoint2", "auth.asidePoint3"].map(function (k) {
        return '<li class="row gap-3">' + Icons.svg("check") + "<span>" + esc(I18N.t(k)) + "</span></li>";
      }).join("");
    }

    var demo = $("[data-demo-accounts]");
    if (demo) {
      // One seeded person per role, so each interface is one click away.
      var picks = [
        { id: "u-fahad", roleKey: "role.client" },
        { id: "u-ahmed", roleKey: "role.lawyer" },
        { id: "u-jaid",  roleKey: "role.intern" }
      ];
      demo.innerHTML = picks.map(function (p) {
        var u = M.user(p.id);
        return '<button type="button" class="demo-card" data-demo="' + esc(p.id) + '">' +
          global.C.avatar(u, "sm") +
          "<strong>" + esc(tx(u.name).split(" ").slice(0, 2).join(" ")) + "</strong>" +
          '<span class="tiny muted">' + esc(I18N.t(p.roleKey)) + "</span></button>";
      }).join("");
    }
  });

  var demoHost = $("[data-demo-accounts]");
  if (demoHost) {
    demoHost.addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-demo]");
      if (!btn) return;
      Store.signIn(btn.getAttribute("data-demo"));
      App.go("index.html");
    });
  }

  var authBox = form.closest("section") || document;
  authBox.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-google]")) return;
    global.SB.signInWithGoogle(global.location.origin +
      global.location.pathname.replace(/login\.html$/, "index.html"))
      .catch(function () { App.toast(I18N.t("auth.googleFailed"), "close"); });
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = form.querySelector('[name="email"]').value.trim();
    var pass = form.querySelector('[name="password"]').value;
    if (!email) { error("signup.needEmail"); return; }
    var button = form.querySelector('[type="submit"]');
    if (button) { button.disabled = true; button.textContent = I18N.t("auth.working"); }
    Session.signIn(email, pass).then(function (res) {
      if (button) { button.disabled = false; button.textContent = I18N.t("auth.signIn"); }
      if (!res.ok) { error("login." + res.error); return; }
      App.go("index.html");
    });
  });
});

/* ==========================================================================
   Sign-up — one wizard, three endings.
   Step 3 is where the roles diverge: a lawyer proves a licence, a trainee
   describes where they study and what they can do, a client skips it.
   ========================================================================== */
Pages.define("signup", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session;
  var $ = App.$, $$ = App.$$, esc = App.esc, tx = App.tx;

  var form = $("[data-signup]");
  if (!form) return;

  var state = { step: 1, role: null, avatar: null, skills: [], specialties: [] };

  /* Finishing an account rather than opening one. Google gave us a name and a
     picture; everything the wizard asks after that is still unanswered, so the
     same wizard runs — minus the two questions that no longer apply, because
     the account exists and is already signed in. */
  /* Asked, never captured. The session from Google is restored a moment after
     this module runs, so a value read once at load is read while nobody is
     signed in yet — which left the wizard asking a signed-in person for an
     email and a password it had no use for, and offering them a link to sign
     in. It is a question now, and everything that depends on it is answered
     again when the session arrives. */
  function completing() {
    return App.param("complete") === "1" && !Session.isGuest();
  }
  var LAST = 4;

  /* A client needs no proof of standing, so their wizard is a step shorter. */
  function steps() {
    return state.role === "client" ? [1, 2, 4] : [1, 2, 3, 4];
  }
  function stepIndex() { return steps().indexOf(state.step); }

  function drawStepper() {
    var host = $("[data-stepper]");
    if (!host) return;
    var seq = steps();
    var labels = { 1: "signup.stepRole", 2: "signup.stepBasics", 3: "signup.stepProof", 4: "signup.stepReview" };
    host.innerHTML = seq.map(function (n, i) {
      var done = seq.indexOf(state.step) > i;
      var here = state.step === n;
      return '<li class="step-dot' + (here ? " is-here" : "") + (done ? " is-done" : "") + '">' +
        '<span class="step-dot__mark">' + (done ? Icons.svg("check", "icon-sm") : I18N.num(i + 1)) + "</span>" +
        '<span data-i18n="' + labels[n] + '"></span></li>';
    }).join("");
    I18N.apply(host);
  }

  function drawRoles() {
    var host = $("[data-role-picker]");
    if (!host) return;
    host.innerHTML = Session.allRoles().map(function (r) {
      var descKey = r.id === "client" ? "role.clientDesc"
                  : r.id === "lawyer" ? "role.lawyerDesc" : "role.internDesc";
      return '<button type="button" class="role-card' + (state.role === r.id ? " is-active" : "") +
        '" data-pick="' + r.id + '">' +
        '<span class="role-card__icon">' + Icons.svg(r.icon, "icon-lg") + "</span>" +
        "<strong>" + esc(I18N.t(r.nameKey)) + "</strong>" +
        '<span class="tiny muted">' + esc(I18N.t(descKey)) + "</span>" +
        (state.role === r.id ? '<span class="role-card__check">' + Icons.svg("check", "icon-sm") + "</span>" : "") +
        "</button>";
    }).join("");
  }

  function drawCities() {
    var sel = $("[data-city-options]");
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = SEEDCITIES().map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(tx(c)) + "</option>";
    }).join("");
    if (cur) sel.value = cur;
  }
  function SEEDCITIES() { return global.SEED.cities; }

  /* ---------- step 3, per role ---------- */
  function drawProof() {
    var title = $("[data-step3-title]");
    var host = $("[data-step3-fields]");
    if (!host) return;

    if (state.role === "lawyer") {
      title.textContent = I18N.t("signup.licenceTitle");
      host.innerHTML =
        '<div class="grid grid-2" style="gap:var(--s-4)">' +
          field("licenceNumber", "signup.licenceNo", "text", "num") +
          field("licenceAuthority", "signup.licenceAuthority") +
          field("licenceExpiry", "signup.licenceExpiry", "date") +
          field("years", "signup.years", "number") +
        "</div>" +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.licenceFile")) + "</span>" +
          '<input class="input" name="licenceFile" type="file" accept="image/*,.pdf"></label>' +
        '<p class="tiny faint" style="margin-top:var(--s-2)">' + esc(I18N.t("signup.uploadNote")) + "</p>" +
        '<div class="field" style="margin-top:var(--s-5)">' +
          '<span class="label">' + esc(I18N.t("signup.specialties")) + "</span>" +
          '<div class="row gap-2 wrap" data-spec-picker></div></div>' +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.bio")) + "</span>" +
          '<textarea class="textarea" name="bio"></textarea></label>';
      drawSpecialties();
    } else {
      title.textContent = I18N.t("signup.internTitle");
      host.innerHTML =
        '<div class="grid grid-2" style="gap:var(--s-4)">' +
          field("university", "signup.university") +
          field("level", "signup.level") +
        "</div>" +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.cv")) + "</span>" +
          '<input class="input" name="cvFile" type="file" accept=".pdf,.doc,.docx"></label>' +
        '<p class="tiny faint" style="margin-top:var(--s-2)">' + esc(I18N.t("signup.uploadNote")) + "</p>" +
        '<div class="field" style="margin-top:var(--s-5)">' +
          '<span class="label">' + esc(I18N.t("signup.skills")) + "</span>" +
          '<p class="tiny muted">' + esc(I18N.t("signup.skillsHint")) + "</p>" +
          '<div class="chip-input"><input class="input" data-skill-input ' +
            'placeholder="' + esc(I18N.t("signup.skillPlaceholder")) + '">' +
            '<button class="btn btn--outline btn--sm" type="button" data-skill-add>' +
              esc(I18N.t("signup.add")) + "</button></div>" +
          '<div class="row gap-2 wrap" style="margin-top:var(--s-3)" data-skill-list></div></div>' +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.bio")) + "</span>" +
          '<textarea class="textarea" name="bio"></textarea></label>';
      drawSkills();
    }
  }

  function field(name, labelKey, type, cls) {
    return '<label class="field"><span class="label">' + esc(I18N.t(labelKey)) + "</span>" +
      '<input class="input' + (cls ? " " + cls : "") + '" name="' + name +
      '" type="' + (type || "text") + '"></label>';
  }

  function drawSpecialties() {
    var host = $("[data-spec-picker]");
    if (!host) return;
    host.innerHTML = global.SEED.specialties.map(function (s) {
      return '<button type="button" class="chip' + (state.specialties.indexOf(s.id) !== -1 ? " is-active" : "") +
        '" data-spec="' + esc(s.id) + '">' + esc(tx(s)) + "</button>";
    }).join("");
  }

  function drawSkills() {
    var host = $("[data-skill-list]");
    if (!host) return;
    host.innerHTML = state.skills.length
      ? state.skills.map(function (sk, i) {
          return '<span class="chip is-active">' + esc(sk) +
            '<button type="button" data-skill-del="' + i + '" aria-label="×">' +
            Icons.svg("close", "icon-sm") + "</button></span>";
        }).join("")
      : '<span class="tiny faint">' + esc(I18N.t("signup.noSkills")) + "</span>";
  }

  /* ---------- step 4 ---------- */
  function drawReview() {
    var host = $("[data-review]");
    if (!host) return;
    var d = collect();
    var rows = [
      ["signup.role", I18N.t(Session.roleDef(state.role).nameKey)],
      ["auth.fullName", d.name],
      ["auth.email", d.email],
      ["signup.phone", d.phone],
      ["home.city", d.city ? tx(M.city(d.city)) : ""]
    ];
    if (state.role === "lawyer") {
      rows.push(["signup.licenceNo", d.licenceNumber], ["signup.licenceExpiry", d.licenceExpiry]);
      rows.push(["signup.specialties", state.specialties.map(function (id) { return tx(M.specialty(id)); }).join("، ")]);
    }
    if (state.role === "intern") {
      rows.push(["signup.university", d.university], ["signup.level", d.level]);
      rows.push(["signup.skills", state.skills.join("، ")]);
    }
    host.innerHTML = '<dl class="review">' + rows.map(function (r) {
      return "<dt>" + esc(I18N.t(r[0])) + "</dt><dd>" + (esc(r[1]) || '<span class="faint">—</span>') + "</dd>";
    }).join("") + "</dl>" +
    (state.role !== "client"
      ? '<p class="note-inline">' + Icons.svg("clock", "icon-sm") + esc(I18N.t("signup.pendingNote")) + "</p>"
      : "");
  }

  function collect() {
    var d = {};
    $$("input,select,textarea", form).forEach(function (el) {
      if (el.name && el.type !== "file" && el.type !== "checkbox") d[el.name] = el.value.trim();
    });
    return d;
  }

  /* ---------- navigation ---------- */
  function show() {
    $$("[data-step]", form).forEach(function (sec) {
      sec.hidden = String(state.step) !== sec.getAttribute("data-step");
    });
    var seq = steps(), i = stepIndex();
    $("[data-back]").hidden = i <= 0;
    $("[data-next]").hidden = i >= seq.length - 1;
    $("[data-finish]").hidden = i < seq.length - 1;
    drawGoogle();
    if (state.step === 3) drawProof();
    if (state.step === 4) drawReview();
    drawStepper();
    error(null);
  }

  function error(key) {
    var el = $("[data-signup-error]");
    if (!el) return;
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  function validate() {
    var d = collect();
    if (state.step === 1 && !state.role) return "signup.needRole";
    if (state.step === 2) {
      if (!d.name) return "signup.needName";
      if (!completing()) {
        if (!/^\S+@\S+\.\S+$/.test(d.email || "")) return "signup.needEmail";
        if (!d.password || d.password.length < 4) return "signup.needPassword";
        if (Store.findAccount(d.email)) return "signup.emailTaken";
      }
    }
    if (state.step === 3 && state.role === "lawyer" && !d.licenceNumber) return "signup.needLicence";
    if (state.step === 3 && state.role === "intern" && !d.university) return "signup.needUniversity";
    return null;
  }

  /* The door belongs after the role, not before it. Offering Google first
     meant whoever took it arrived as a client with no say in the matter — the
     one question the wizard exists to ask, skipped by the shortest path
     through it. So the role is picked, and only then does this appear beside
     the email fields as the other way to answer the same form.

     And the markup is translated on the spot: it is injected after the page's
     translation pass, so a button built here and left alone is a bare icon
     with no words on it. */
  function drawGoogle() {
    var slot = $("[data-google-slot]");
    if (!slot) return;
    var show = !completing() && state.step === 2;
    slot.innerHTML = show ? global.C.googleButton() : "";
    if (show) I18N.apply(slot);
  }

  App.onRender(function () {
    drawGoogle();

    var done = completing();
    // Both directions: the fields go when the session arrives, and come back
    // if it turns out there is none.
    $$("[data-signed-in-hide]", document).forEach(function (el) { el.hidden = done; });

    if (done) {
      var me = Session.user();
      // What they picked before being sent to Google.
      if (!state.role) {
        var kept = null;
        try { kept = localStorage.getItem("sanad.pendingRole"); } catch (e) {}
        if (kept) { state.role = kept; drawRoles(); }
      }
      // The two questions that no longer apply, and the answer Google gave us.
      var nameField = form.querySelector('[name="name"]');
      if (nameField && !nameField.value && me) nameField.value = App.tx(me.name);
      // Swap the key, not the text: a translation pass runs after this and
      // would put the original line straight back, and this way the sentence
      // still follows a language change.
      var head = $("[data-signup-head]");
      if (head) {
        head.setAttribute("data-i18n", "signup.completeLead");
        head.textContent = I18N.t("signup.completeLead");
      }
    }

    drawRoles(); drawCities(); drawStepper();
    if (state.step === 3) drawProof();
    if (state.step === 4) drawReview();
  });

  form.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-google]")) {
      // Google will not carry the role across the redirect, so it waits here
      // and the completion step picks it up — otherwise choosing "lawyer" and
      // then signing in with Google would quietly make you a client.
      try { localStorage.setItem("sanad.pendingRole", state.role || ""); } catch (e) {}
      global.SB.signInWithGoogle(global.location.origin +
        global.location.pathname.replace(/signup\.html$/, "index.html"))
        .catch(function () { App.toast(I18N.t("auth.googleFailed"), "close"); });
      return;
    }

    var pick = ev.target.closest("[data-pick]");
    if (pick) { state.role = pick.getAttribute("data-pick"); drawRoles(); drawStepper(); return; }

    var sp = ev.target.closest("[data-spec]");
    if (sp) {
      var id = sp.getAttribute("data-spec");
      var at = state.specialties.indexOf(id);
      at === -1 ? state.specialties.push(id) : state.specialties.splice(at, 1);
      drawSpecialties();
      return;
    }

    if (ev.target.closest("[data-skill-add]")) { addSkill(); return; }
    var del = ev.target.closest("[data-skill-del]");
    if (del) { state.skills.splice(+del.getAttribute("data-skill-del"), 1); drawSkills(); return; }

    if (ev.target.closest("[data-next]")) {
      var bad = validate();
      if (bad) { error(bad); return; }
      var seq = steps();
      state.step = seq[Math.min(stepIndex() + 1, seq.length - 1)];
      show();
      return;
    }
    if (ev.target.closest("[data-back]")) {
      var s2 = steps();
      state.step = s2[Math.max(stepIndex() - 1, 0)];
      show();
    }
  });

  function addSkill() {
    var input = $("[data-skill-input]");
    var v = input.value.trim();
    if (!v) return;
    if (state.skills.indexOf(v) === -1) state.skills.push(v);
    input.value = "";
    drawSkills();
  }
  form.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.matches("[data-skill-input]")) { ev.preventDefault(); addSkill(); }
  });

  /* A picked image is read into a data URI — there is nowhere to upload it. */
  form.addEventListener("change", function (ev) {
    if (ev.target.name === "avatar" && ev.target.files && ev.target.files[0]) {
      var reader = new FileReader();
      reader.onload = function () { state.avatar = reader.result; };
      reader.readAsDataURL(ev.target.files[0]);
    }
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var bad = validate();
    if (bad) { error(bad); return; }
    if (!form.querySelector('[name="terms"]').checked) { error("signup.needTerms"); return; }

    var d = collect();
    var fileOf = function (n) {
      var el = form.querySelector('[name="' + n + '"]');
      return el && el.files && el.files[0] ? el.files[0].name : null;
    };
    var name = { ar: d.name, en: d.name };

    var button = $("[data-finish]");
    if (button) { button.disabled = true; button.textContent = I18N.t("auth.working"); }

    var payload = {
      role: state.role, name: name, email: d.email, phone: d.phone,
      city: d.city, password: d.password, avatar: state.avatar,
      licenceNumber: d.licenceNumber, licenceAuthority: d.licenceAuthority,
      licenceExpiry: d.licenceExpiry, licenceFile: fileOf("licenceFile"),
      specialties: state.specialties, years: +d.years || 0, bio: { ar: d.bio, en: d.bio },
      university: { ar: d.university, en: d.university }, level: { ar: d.level, en: d.level },
      skills: state.skills.map(function (s) { return { ar: s, en: s }; }),
      cvFile: fileOf("cvFile")
    };

    // The account already exists when we are finishing one; registering again
    // would fail on the address it already has.
    var sent = completing()
      ? global.SB.complete(Session.user().id, payload).then(function (res) {
          if (res.ok) {
            try { localStorage.removeItem("sanad.pendingRole"); } catch (e) {}
            Store.notifyAll();
          }
          return res;
        })
      : Store.register(payload);

    sent.then(function (res) {
      if (button) { button.disabled = false; I18N.apply(button.parentNode); }
      if (!res.ok) {
        // A backend can fail in ways the demo never could — a refused address,
        // an unconfirmed mailbox — so show what it said when we have no phrase
        // of our own for it.
        error("signup." + res.error);
        if (res.message && I18N.t("signup." + res.error) === "signup." + res.error) {
          var el = $("[data-signup-error]");
          if (el) { el.hidden = false; el.textContent = res.message; }
        }
        return;
      }
      App.toast(I18N.t("signup.welcome", { name: d.name.split(" ")[0] }), "check");
      setTimeout(function () { App.go("index.html"); }, 900);
    });
  });

  show();
});

/* ==========================================================================
   The call room. Three states and nothing else: before you join, in the call,
   and after it ended. Everything the browser can refuse — permission, a
   missing device, an insecure origin — is caught and said in plain words,
   because "nothing happened" is the worst possible answer to a click.
   ========================================================================== */
Pages.define("call", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-call]");
  if (!host) return;

  var requestId = App.param("id");
  var phase = "ready";        // ready | live | ended
  var error = null;
  var call = null;
  var muted = false, camOff = false;
  var timer = null, seconds = 0, endedBy = null;

  function request() { return requestId ? M.request(requestId) : null; }

  /** Voice or video, taken from the service the client actually bought. */
  function wantsVideo() {
    var r = request();
    var t = r && M.serviceType(r.typeId);
    return !t || t.id !== "call";
  }

  function other() {
    var r = request();
    if (!r) return null;
    var me = Session.user();
    if (!me) return null;
    return M.user(me.id === r.clientId ? r.lawyerId : r.clientId);
  }

  function mayJoin() {
    var r = request(), me = Session.user();
    if (!r || !me) return false;
    var st = M.requestState(r);
    return me.id === r.clientId || me.id === r.lawyerId || st.assignedTo === me.id;
  }

  function clock() {
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ---------- the three screens ---------- */
  function readyScreen() {
    var r = request(), them = other();
    return '<div class="call-card card card--pad">' +
      '<span class="feature__icon" style="margin-inline:auto">' +
        Icons.svg(wantsVideo() ? "video" : "phone", "icon-lg") + "</span>" +
      '<h1 class="headline center" style="margin-top:var(--s-4)" data-i18n="' +
        (wantsVideo() ? "call.video" : "call.audio") + '"></h1>' +
      (them
        ? '<p class="lead center">' + esc(I18N.t("call.with", { name: tx(them.name) })) + "</p>" +
          '<div class="row center" style="margin-top:var(--s-5)">' + C.avatar(them, "lg") + "</div>"
        : "") +
      (r ? '<p class="small muted center" style="margin-top:var(--s-4)">' + esc(tx(r.title)) + "</p>" : "") +
      (error ? '<p class="form-error center" style="margin-top:var(--s-5)">' +
        esc(I18N.t("call." + error)) + "</p>" : "") +
      '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
        '<button class="btn btn--accent btn--lg" type="button" data-join>' +
          Icons.svg(wantsVideo() ? "video" : "phone", "icon-sm") +
          "<span>" + esc(I18N.t(error ? "call.retry" : "call.join")) + "</span></button>" +
        '<a class="btn btn--ghost" href="requests.html" data-i18n="call.back"></a>' +
      "</div>" +
      '<p class="tiny faint center" style="margin-top:var(--s-4)" data-i18n="call.joinHint"></p>' +
      (global.Signal.isRemote() ? "" :
        '<p class="note-inline" style="margin-top:var(--s-6)">' +
          '<span><span data-i18n="call.localOnly"></span> ' +
          '<span data-i18n="call.openSecond"></span></span></p>' +
        '<div class="row center" style="margin-top:var(--s-3)">' +
          '<button class="btn btn--outline btn--sm" type="button" data-copy-link>' +
            Icons.svg("file-text", "icon-sm") +
            '<span data-i18n="call.copyLink"></span></button></div>') +
    "</div>";
  }

  function liveScreen() {
    var them = other();
    return '<div class="call-stage">' +
      '<div class="call-stage__remote">' +
        '<video data-remote autoplay playsinline></video>' +
        '<div class="call-stage__placeholder" data-placeholder>' +
          (them ? C.avatar(them, "lg") : "") +
          '<p class="subtitle" style="margin-top:var(--s-4)">' +
            esc(them ? tx(them.name) : "") + "</p>" +
          '<p class="small" data-call-status>' + esc(I18N.t("call.waiting")) + "</p>" +
        "</div>" +
        '<div class="call-stage__badge"><span class="num" data-clock>00:00</span></div>' +
        '<div class="call-stage__self' + (wantsVideo() ? "" : " is-audio") + '">' +
          '<video data-local autoplay playsinline muted></video>' +
          '<span class="tiny" data-i18n="call.you"></span>' +
        "</div>" +
      "</div>" +
      '<div class="call-bar">' +
        '<button class="call-btn" type="button" data-mute ' +
          'data-i18n-attr="aria-label:call.mute">' + Icons.svg("mic") + "</button>" +
        (wantsVideo()
          ? '<button class="call-btn" type="button" data-cam ' +
            'data-i18n-attr="aria-label:call.camOff">' + Icons.svg("video") + "</button>"
          : "") +
        '<button class="call-btn call-btn--end" type="button" data-hang ' +
          'data-i18n-attr="aria-label:call.hangUp">' + Icons.svg("phone-off") + "</button>" +
      "</div></div>";
  }

  function endedScreen() {
    var r = request();
    var me = Session.user();
    var canDeliver = r && me && me.id === r.lawyerId &&
      ["delivered", "completed"].indexOf(M.requestState(r).status) === -1;
    return '<div class="call-card card card--pad center">' +
      '<span class="feature__icon" style="margin-inline:auto">' + Icons.svg("check", "icon-lg") + "</span>" +
      '<h1 class="headline" style="margin-top:var(--s-4)" data-i18n="call.ended"></h1>' +
      (endedBy === "peer" ? '<p class="lead" data-i18n="call.endedByPeer"></p>' : "") +
      '<p class="small muted" style="margin-top:var(--s-4)">' + esc(I18N.t("call.duration")) +
        ': <strong class="num">' + esc(clock()) + "</strong></p>" +
      '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
        (canDeliver
          ? '<button class="btn btn--accent" type="button" data-deliver data-i18n="call.markDone"></button>'
          : "") +
        '<a class="btn btn--outline" href="requests.html" data-i18n="call.back"></a>' +
      "</div></div>";
  }

  function gate(key) {
    return '<div class="call-card card card--pad center">' +
      C.empty("lock", key) +
      '<p style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="requests.html" data-i18n="call.back"></a></p></div>';
  }

  /* ---------- draw ---------- */
  App.onRender(function () {
    if (Session.isGuest()) { host.innerHTML = gate("auth.guestHint"); I18N.apply(host); return; }
    if (requestId && !mayJoin()) { host.innerHTML = gate("call.notYours"); I18N.apply(host); return; }

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-16)">' +
      (phase === "live" ? liveScreen() : phase === "ended" ? endedScreen() : readyScreen()) +
      "</div>";
    I18N.apply(host);
    if (phase === "live") attachStreams();
    syncButtons();
  });

  /* The <video> elements are recreated by every redraw, so the streams have to
     be re-attached rather than set once at join time. */
  var localStream = null, remoteStream = null;
  function attachStreams() {
    var l = $("[data-local]", host), r = $("[data-remote]", host);
    if (l && localStream) l.srcObject = localStream;
    if (r && remoteStream) r.srcObject = remoteStream;
    var ph = $("[data-placeholder]", host);
    if (ph) ph.hidden = !!remoteStream;
  }

  function syncButtons() {
    var mb = $("[data-mute]", host), cb = $("[data-cam]", host);
    if (mb) {
      mb.classList.toggle("is-off", muted);
      mb.setAttribute("aria-label", I18N.t(muted ? "call.unmute" : "call.mute"));
      mb.innerHTML = Icons.svg(muted ? "mic-off" : "mic");
    }
    if (cb) {
      cb.classList.toggle("is-off", camOff);
      cb.setAttribute("aria-label", I18N.t(camOff ? "call.camOn" : "call.camOff"));
      cb.innerHTML = Icons.svg(camOff ? "video-off" : "video");
    }
  }

  function status(key) {
    var el = $("[data-call-status]", host);
    if (el) el.textContent = I18N.t(key);
  }

  /* ---------- joining ---------- */
  function join() {
    error = null;

    if (!global.RTC.supported()) { error = "unsupported"; App.rerender(); return; }
    // getUserMedia is only handed out on a secure origin; localhost counts.
    if (!global.isSecureContext) { error = "insecure"; App.rerender(); return; }

    var them = other();
    call = new global.RTC.Call({
      room: requestId || "lobby",
      video: wantsVideo(),
      // Two offers can collide; the polite side yields. Comparing the two user
      // ids gives each peer the opposite answer with nothing to exchange.
      polite: !!(them && Session.user().id < them.id),
      on: {
        local: function (s) { localStream = s; },
        remote: function (s) { remoteStream = s; attachStreams(); status("call.connected"); },
        connected: function () { startTimer(); },
        state: function (st) {
          // Surfaced on the element so the state is inspectable, not only felt.
          var stage = $(".call-stage", host);
          if (stage) stage.setAttribute("data-conn", st);
          if (st === "connecting") status("call.connecting");
          if (st === "disconnected") status("call.reconnecting");
        },
        ended: function (who) { endedBy = who; finish(); }
      }
    });

    call.getMedia().then(function () {
      phase = "live";
      App.rerender();
      call.connect();
      status("call.waiting");
      startTimer();
    }).catch(function (e) {
      error = e.code || "failed";
      App.rerender();
    });
  }

  function startTimer() {
    if (timer) return;
    timer = setInterval(function () {
      seconds++;
      var el = $("[data-clock]", host);
      if (el) el.textContent = clock();
    }, 1000);
  }

  function finish() {
    clearInterval(timer);
    timer = null;
    localStream = null;
    remoteStream = null;
    phase = "ended";
    App.rerender();
  }

  /* ---------- events ---------- */
  host.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-join]")) { join(); return; }

    if (ev.target.closest("[data-copy-link]")) {
      var url = global.location.href;
      if (global.navigator.clipboard) global.navigator.clipboard.writeText(url);
      App.toast(I18N.t("call.copied"), "check");
      return;
    }

    if (ev.target.closest("[data-mute]")) {
      muted = !muted;
      if (call) call.setMuted(muted);
      syncButtons();
      return;
    }

    if (ev.target.closest("[data-cam]")) {
      camOff = !camOff;
      if (call) call.setCameraOff(camOff);
      syncButtons();
      return;
    }

    if (ev.target.closest("[data-hang]")) {
      if (call) call.hangUp(); else finish();
      return;
    }

    if (ev.target.closest("[data-deliver]")) {
      Store.setRequest(requestId, { status: "delivered" });
      App.toast(I18N.t("inbox.completed"), "check");
      setTimeout(function () { App.go("requests.html"); }, 800);
    }
  });

  // Leaving the page must release the camera; the light staying on is alarming.
  global.addEventListener("pagehide", function () { if (call) call.hangUp(); });
});

/* ==========================================================================
   The staff console.

   Six sections behind one page, because running a platform is not one job:
   who is allowed in, what is being asked for, where the money went, what the
   platform is saying to people, and what it charges.

   Two rules shape all of it. Every action is written to a record that is
   appended to and never edited — a decision nobody can be asked about later
   is not a decision. And every figure is derived from the requests that
   actually happened rather than from a running total somebody has to remember
   to update, so the books cannot quietly drift from the work.
   ========================================================================== */
Pages.define("admin", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, $$ = App.$$, esc = App.esc, tx = App.tx;

  var host = $("[data-admin]");
  if (!host) return;

  var TABS = [
    { id: "overview", key: "adm.tabOverview", icon: "grid" },
    { id: "people",   key: "adm.tabPeople",   icon: "user" },
    { id: "requests", key: "adm.tabRequests", icon: "inbox" },
    { id: "money",    key: "adm.tabMoney",    icon: "wallet" },
    { id: "ads",      key: "adm.tabAds",      icon: "bell" },
    { id: "catalogue",key: "admin.tabCat",    icon: "tag" },
    { id: "settings", key: "adm.tabSettings", icon: "settings" }
  ];

  var tab = App.param("tab") || "overview";
  var months = 1;
  var filter = "all";
  var query = "";
  var rejecting = null;
  var outcome = {};

  var sar = function (halalas) {
    return C.num(Math.round(halalas / 100)) + " " + C.sar();
  };

  function head(titleKey, leadKey) {
    return '<header style="margin-bottom:var(--s-6)">' +
      '<h2 class="subtitle" data-i18n="' + titleKey + '"></h2>' +
      (leadKey ? '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="' +
        leadKey + '"></p>' : "") + "</header>";
  }

  function denied() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("lock", "admin.denied") +
      '<p class="center" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--ghost" href="index.html" data-i18n="nav.home"></a></p></div>';
  }

  /* ================================================================ overview */
  function stat(labelKey, value, tone) {
    return '<div class="kpi' + (tone ? " kpi--" + tone : "") + '">' +
      '<span class="kpi__label" data-i18n="' + labelKey + '"></span>' +
      '<strong class="kpi__value">' + value + "</strong></div>";
  }

  function windowPicker() {
    return '<div class="row gap-2 wrap" style="margin-bottom:var(--s-5)">' +
      '<span class="tiny muted" style="align-self:center" data-i18n="adm.window"></span>' +
      [[1, "adm.month1"], [3, "adm.month3"], [12, "adm.month12"]].map(function (m) {
        return '<button class="btn btn--sm ' + (months === m[0] ? "btn--primary" : "btn--outline") +
          '" type="button" data-months="' + m[0] + '">' + esc(I18N.t(m[1])) + "</button>";
      }).join("") + "</div>";
  }

  function overview() {
    var b = M.books(months);
    var waiting = M.pendingVerification();
    var open = M.openDisputes();

    return windowPicker() +
      '<div class="kpi-grid">' +
        stat("adm.kpiOrders", C.num(b.orders)) +
        stat("adm.kpiVolume", sar(b.clientPaid)) +
        stat("adm.kpiRevenue", sar(b.revenue)) +
        stat("adm.kpiProfit", sar(b.profit), b.profit < 0 ? "bad" : "good") +
        stat("adm.kpiPending", C.num(waiting.length), waiting.length ? "warn" : "") +
        stat("adm.kpiDisputes", C.num(open.length), open.length ? "warn" : "") +
      "</div>" +

      '<section class="card card--pad" style="margin-top:var(--s-6)">' +
        head("adm.needsYou") +
        (waiting.length || open.length
          ? '<div class="stack gap-3">' +
              waiting.map(function (u) {
                return '<div class="row between wrap gap-3 admin-line">' +
                  '<span class="row gap-3">' + C.avatar(u, "sm") +
                    "<span><strong>" + esc(tx(u.name)) + "</strong>" +
                    '<span class="tiny muted" style="display:block">' +
                      esc(I18N.t(u.roles.indexOf("lawyer") !== -1 ? "role.lawyer" : "role.intern")) +
                    "</span></span></span>" +
                  '<a class="btn btn--outline btn--sm" href="admin.html?tab=people">' +
                    esc(I18N.t("admin.queue")) + "</a></div>";
              }).join("") +
              open.map(function (d) {
                var r = M.request(d.requestId);
                return '<div class="row between wrap gap-3 admin-line">' +
                  "<span><strong>" + esc(r ? tx(r.title) : d.requestId) + "</strong>" +
                  '<span class="tiny muted" style="display:block">' + esc(d.reason) + "</span></span>" +
                  '<a class="btn btn--outline btn--sm" href="admin.html?tab=requests">' +
                    esc(I18N.t("admin.decide")) + "</a></div>";
              }).join("") +
            "</div>"
          : '<p class="small muted" data-i18n="adm.allClear"></p>') +
      "</section>";
  }

  /* ================================================================== people */
  function matches(u) {
    if (filter === "lawyers" && u.roles.indexOf("lawyer") === -1) return false;
    if (filter === "interns" && u.roles.indexOf("intern") === -1) return false;
    if (filter === "clients" && u.roles.indexOf("client") === -1) return false;
    if (filter === "pending" && u.status !== "pending") return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return (tx(u.name) || "").toLowerCase().indexOf(q) !== -1 ||
           (u.email || "").toLowerCase().indexOf(q) !== -1;
  }

  function people() {
    var all = M.users().filter(function (u) {
      return u.roles.indexOf("staff") === -1;
    }).filter(matches);

    return head("adm.people", "adm.peopleLead") +
      '<div class="row gap-2 wrap" style="margin-bottom:var(--s-4)">' +
        [["all","adm.filterAll"],["pending","adm.filterPending"],["lawyers","adm.filterLawyers"],
         ["interns","adm.filterInterns"],["clients","adm.filterClients"]].map(function (f) {
          return '<button class="btn btn--sm ' + (filter === f[0] ? "btn--primary" : "btn--outline") +
            '" type="button" data-filter="' + f[0] + '">' + esc(I18N.t(f[1])) + "</button>";
        }).join("") +
      "</div>" +
      '<input class="input" style="margin-bottom:var(--s-5)" data-search value="' + esc(query) +
        '" data-i18n-attr="placeholder:adm.search">' +
      (all.length ? all.map(personRow).join("") : '<p class="small muted" data-i18n="adm.noPeople"></p>');
  }

  function personRow(u) {
    var lawyer = u.roles.indexOf("lawyer") !== -1;
    var intern = u.roles.indexOf("intern") !== -1;
    var pro = lawyer || intern;
    var lic = u.licence;
    var ai = lawyer ? M.subscriptionOf(u.id) : null;
    var placed = u.featuredRank != null;

    return '<div class="card card--pad admin-card">' +
      '<div class="row between wrap gap-3">' +
        '<div class="row gap-3">' + C.avatar(u, "sm") +
          "<div><strong>" + esc(tx(u.name)) + "</strong>" +
            '<div class="tiny muted num" dir="ltr">' + esc(u.email || "") + "</div></div></div>" +
        '<div class="row gap-2 wrap">' +
          (placed ? '<span class="status status--ok">' +
            esc(I18N.t("adm.featuredAt", { n: I18N.num(u.featuredRank) })) + "</span>" : "") +
          C.statusPill(u.status) +
        "</div>" +
      "</div>" +

      (pro && lic
        ? '<div class="row gap-6 wrap small" style="margin-top:var(--s-4)">' +
            '<span><span class="tiny muted" data-i18n="admin.licence"></span> ' +
              '<span class="num">' + esc(lic.number || "") + "</span></span>" +
            '<span><span class="tiny muted" data-i18n="admin.expiry"></span> ' +
              esc(lic.expiry || "") + "</span>" +
          "</div>"
        : "") +

      (rejecting === u.id
        ? '<div style="margin-top:var(--s-4)">' +
            '<p class="small" data-i18n="admin.rejectWhy"></p>' +
            '<textarea class="input" rows="3" style="margin-top:var(--s-2)" data-why></textarea>' +
            '<div class="row gap-3" style="margin-top:var(--s-3)">' +
              '<button class="btn btn--primary btn--sm" type="button" data-reject-send="' + esc(u.id) + '">' +
                esc(I18N.t("admin.reject")) + "</button>" +
              '<button class="btn btn--ghost btn--sm" type="button" data-cancel>' +
                esc(I18N.t("accept.cancel")) + "</button></div></div>"
        : '<div class="row gap-2 wrap" style="margin-top:var(--s-4)">' +
            (u.status !== "verified"
              ? '<button class="btn btn--primary btn--sm" type="button" data-approve="' + esc(u.id) + '">' +
                  Icons.svg("check", "icon-sm") + esc(I18N.t("admin.approve")) + "</button>"
              : "") +
            (pro && u.status !== "rejected"
              ? '<button class="btn btn--ghost btn--sm" type="button" data-reject="' + esc(u.id) + '">' +
                  esc(I18N.t("admin.reject")) + "</button>"
              : "") +
            (lawyer && u.status === "verified"
              ? '<button class="btn btn--outline btn--sm" type="button" data-feature="' + esc(u.id) + '">' +
                  Icons.svg("star", "icon-sm") +
                  esc(I18N.t(placed ? "adm.unfeature" : "adm.feature")) + "</button>"
              : "") +
            (lawyer
              ? '<button class="btn btn--outline btn--sm" type="button" data-ai="' + esc(u.id) + '">' +
                  Icons.svg("sparkle", "icon-sm") +
                  esc(I18N.t(ai && ai.active ? "adm.aiOn" : "adm.aiOff")) + "</button>"
              : "") +
          "</div>") +
    "</div>";
  }

  /* ================================================================ requests */
  function requests() {
    var all = M.requests().slice().reverse();
    if (!all.length) return head("adm.requests", "adm.requestsLead") +
      '<p class="small muted" data-i18n="adm.noRequests"></p>';

    return head("adm.requests", "adm.requestsLead") +
      all.map(function (r) {
        var st = M.requestState(r);
        var d = M.distribute(r);
        var client = M.user(r.clientId), lawyer = M.user(r.lawyerId);
        var dis = M.disputeFor(r.id);
        return '<div class="card card--pad admin-card' +
          (dis && dis.status === "open" ? " card--rule-gold" : "") + '">' +
          '<div class="row between wrap gap-3">' +
            "<strong>" + esc(tx(r.title || {})) + "</strong>" +
            '<span class="row gap-2">' + C.statusPill(st.status) +
              "<strong>" + sar(d.client) + "</strong></span>" +
          "</div>" +
          '<div class="row gap-6 wrap tiny muted" style="margin-top:var(--s-3)">' +
            '<span><span data-i18n="adm.client"></span>: ' + esc(client ? tx(client.name) : "—") + "</span>" +
            '<span><span data-i18n="adm.lawyer"></span>: ' + esc(lawyer ? tx(lawyer.name) : "—") + "</span>" +
          "</div>" +
          (dis && dis.status === "open" ? disputePanel(dis, r, d) : "") +
        "</div>";
      }).join("");
  }

  function choice(id, value, key, pick) {
    return '<button class="btn btn--sm ' + (pick === value ? "btn--primary" : "btn--outline") +
      '" type="button" data-outcome="' + esc(value) + '" data-for="' + esc(id) + '">' +
      esc(I18N.t(key)) + "</button>";
  }

  function disputePanel(d, r, split) {
    var st = M.requestState(r);
    var who = M.user(d.byId), pick = outcome[d.id] || "";
    return '<div style="margin-top:var(--s-5);border-top:1px solid var(--border);padding-top:var(--s-5)">' +
      '<p class="tiny muted">' + esc(I18N.t("admin.raisedBy")) + ": " +
        esc(who ? tx(who.name) : d.byId) + "</p>" +
      '<p class="tiny muted" style="margin-top:var(--s-3)" data-i18n="admin.claim"></p>' +
      '<p class="small">' + esc(d.reason) + "</p>" +
      '<p class="tiny muted" style="margin-top:var(--s-4)" data-i18n="admin.delivered"></p>' +
      (st.body
        ? '<pre class="draft-text" style="min-height:auto" readonly>' + esc(st.body) + "</pre>"
        : '<p class="small muted" data-i18n="admin.nothingDelivered"></p>') +
      (split.intern > 0
        ? '<div class="card card--pad" style="margin-top:var(--s-4);background:var(--surface-2)">' +
            '<p class="small">' + esc(I18N.t("admin.internNote")) + "</p>" +
            '<p class="small" style="margin-top:var(--s-2)"><strong>' +
              esc(I18N.t("admin.internOwed")) + ": " + sar(split.intern) + "</strong></p></div>"
        : "") +
      '<h4 class="subtitle" style="margin-top:var(--s-5)" data-i18n="admin.decide"></h4>' +
      '<div class="row gap-3 wrap" style="margin-top:var(--s-3)">' +
        choice(d.id, "release", "admin.forLawyer", pick) +
        choice(d.id, "refund", "admin.forClient", pick) +
        choice(d.id, "split", "admin.split", pick) +
      "</div>" +
      (pick === "split"
        ? '<div style="margin-top:var(--s-3)"><label class="tiny muted" data-i18n="admin.lawyerPct"></label>' +
          '<input class="input" type="number" min="0" max="100" value="60" data-pct></div>'
        : "") +
      (pick
        ? '<div style="margin-top:var(--s-4)">' +

  /* ============================================================== settings */
  /* ============================================================= catalogue
     What a lawyer is allowed to offer to do. This used to be six entries
     compiled into the page, so the platform could not add a kind of work
     without a release — and the one thing a legal marketplace does as it
     grows is add kinds of work. */
  function catalogue() {
    var all = M.allServiceTypes();
    var chans = M.channels();

    var row = function (t) {
      var band = M.priceBand(t.id);
      return '<div class="card card--pad" style="margin-bottom:var(--s-3)">' +
        '<div class="row between wrap gap-3">' +
          "<div><strong>" + esc(tx(t.title)) + "</strong>" +
            '<p class="tiny muted" style="margin-top:var(--s-1)">' + esc(t.id) +
              ' <span class="dot"></span> <span class="num">' + I18N.num(band.min) + "</span>–" +
              '<span class="num">' + I18N.num(band.max) + "</span> " +
              esc(I18N.t("common.sar")) + "</p></div>" +
          '<span class="row gap-2 wrap">' +
            '<span class="status' + (t.active === false ? "" : " status--ok") + '">' +
              esc(I18N.t(t.active === false ? "admin.catHidden" : "admin.catShown")) + "</span>" +
            '<button class="btn btn--ghost btn--sm" type="button" data-cat-toggle="' + esc(t.id) + '">' +
              esc(I18N.t(t.active === false ? "admin.catShown" : "admin.catHidden")) + "</button>" +
            '<button class="btn btn--ghost btn--sm" type="button" data-cat-remove="' + esc(t.id) + '">' +
              esc(I18N.t("adm.remove")) + "</button>" +
          "</span></div>" +
        '<div class="row gap-2 wrap" style="margin-top:var(--s-3)">' +
          chans.map(function (c) {
            var on = (t.channels || []).indexOf(c.id) !== -1;
            return '<label class="chip' + (on ? " is-active" : "") + '">' +
              '<input type="checkbox" style="margin-inline-end:var(--s-2)"' + (on ? " checked" : "") +
              ' data-cat-channel="' + esc(t.id) + '" value="' + esc(c.id) + '">' +
              esc(tx(c.title)) + "</label>";
          }).join("") +
        "</div></div>";
    };

    return head("admin.catTitle", "admin.catLead") +
      '<div style="margin-bottom:var(--s-8)">' + all.map(row).join("") + "</div>" +

      '<section class="card card--pad">' +
        '<h3 class="subtitle" data-i18n="admin.catAdd"></h3>' +
        '<div class="grid grid-2" style="gap:var(--s-4);margin-top:var(--s-4)">' +
          '<label class="field"><span class="label" data-i18n="admin.catName"></span>' +
            '<input class="input" data-cat-ar></label>' +
          '<label class="field"><span class="label" data-i18n="admin.catNameEn"></span>' +
            '<input class="input" dir="ltr" data-cat-en></label>' +
          '<label class="field"><span class="label" data-i18n="admin.catId"></span>' +
            '<input class="input" dir="ltr" data-cat-id></label>' +
          '<label class="field"><span class="label" data-i18n="admin.catMeta"></span>' +
            '<input class="input" data-cat-meta></label>' +
          num("adm.min", "data-cat-min", 100, 0) +
          num("adm.max", "data-cat-max", 1000, 0) +
        "</div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="admin.catIdHint"></p>' +
        '<span class="label" style="margin-top:var(--s-4);display:block" data-i18n="admin.catChannels"></span>' +
        '<div class="row gap-2 wrap" style="margin-top:var(--s-2)">' +
          chans.map(function (c) {
            return '<label class="chip"><input type="checkbox" checked value="' + esc(c.id) +
              '" style="margin-inline-end:var(--s-2)" data-cat-new-channel>' +
              esc(tx(c.title)) + "</label>";
          }).join("") +
        "</div>" +
        '<button class="btn btn--primary" style="margin-top:var(--s-5)" type="button" data-cat-save>' +
          esc(I18N.t("admin.catAdd")) + "</button>" +
      "</section>";
  }

  function num(labelKey, attr, value, min, max, step) {
    return '<label class="field"><span class="label" data-i18n="' + labelKey + '"></span>' +
      '<input class="input" type="number"' +
      (min != null ? ' min="' + min + '"' : "") + (max != null ? ' max="' + max + '"' : "") +
      (step ? ' step="' + step + '"' : "") + ' value="' + value + '" ' + attr + "></label>";
  }

  function settings() {
    var s = M.platformSettings();
    return head("adm.tabSettings") +

      '<section class="card card--pad">' +
        '<h3 class="subtitle" data-i18n="admin.settings"></h3>' +
        '<div class="grid grid-2" style="gap:var(--s-4);margin-top:var(--s-4)">' +
          num("admin.commission", "data-commission", s.commissionPct, 0, M.COMMISSION_MAX_PCT) +
          num("adm.aiPrice", "data-ai-price", s.aiPrice, 0) +
        "</div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="admin.commissionNote"></p>' +
        '<label class="row gap-3" style="margin-top:var(--s-5)">' +
          '<input type="checkbox" data-vat' + (s.vatEnabled ? " checked" : "") + ">" +
          '<span data-i18n="admin.vat"></span></label>' +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="admin.vatNote"></p>' +
        '<div style="margin-top:var(--s-4);max-width:220px">' +
          num("admin.vatPct", "data-vatpct", s.vatPct, 0, 100) + "</div>" +
      "</section>" +

      '<section class="card card--pad" style="margin-top:var(--s-6)">' +
        '<h3 class="subtitle" data-i18n="adm.rates"></h3>' +
        '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="adm.ratesLead"></p>' +
        '<div class="grid grid-2" style="gap:var(--s-4);margin-top:var(--s-4)">' +
          num("adm.madaPct", "data-mada-pct", s.madaPct, 0, 100, "0.01") +
          num("adm.madaFixed", "data-mada-fixed", s.madaFixed, 0, null, "0.01") +
          num("adm.cardPct", "data-card-pct", s.cardPct, 0, 100, "0.01") +
          num("adm.cardFixed", "data-card-fixed", s.cardFixed, 0, null, "0.01") +
        "</div>" +
        '<div style="margin-top:var(--s-4);max-width:260px">' +
          num("adm.madaShare", "data-mada-share", s.madaSharePct, 0, 100) + "</div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="adm.madaShareNote"></p>' +
      "</section>" +

      '<section class="card card--pad" style="margin-top:var(--s-6)">' +
        '<h3 class="subtitle" data-i18n="adm.bands"></h3>' +
        '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="adm.bandsLead"></p>' +
        '<div style="margin-top:var(--s-4)">' +
          M.serviceTypes().map(function (t) {
            var band = M.priceBand(t.id);
            return '<div class="row between wrap gap-3 admin-line">' +
              "<strong>" + esc(tx(t.title)) + "</strong>" +
              '<span class="row gap-3">' +
                '<input class="input" style="width:110px" type="number" min="0" value="' +
                  band.min + '" data-band-min="' + esc(t.id) + '">' +
                '<input class="input" style="width:110px" type="number" min="0" value="' +
                  band.max + '" data-band-max="' + esc(t.id) + '">' +
              "</span></div>";
          }).join("") +
        "</div>" +
      "</section>" +

      '<button class="btn btn--primary" style="margin-top:var(--s-6)" type="button" data-save-settings>' +
        esc(I18N.t("admin.save")) + "</button>";
  }

  /* =============================================================== record */
  var ACT = { approve: "admin.actApprove", reject: "admin.actReject",
              resolve: "admin.actResolve", settings: "admin.actSettings",
              feature: "adm.feature", ai: "adm.aiOff", ad: "adm.ads",
              cost: "adm.costs", partner: "adm.partners", band: "adm.bands",
              catalogue: "admin.catTitle" };

  function record() {
    var log = Store.audit().slice(0, 40);
    return '<section class="card card--pad" style="margin-top:var(--s-8)">' +
      '<h3 class="subtitle" data-i18n="admin.audit"></h3>' +
      '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)" data-i18n="admin.auditLead"></p>' +
      (log.length
        ? log.map(function (e) {
            var by = M.user(e.byId);
            return '<div class="row between wrap gap-3 small admin-line">' +
              "<span>" + esc(I18N.t(ACT[e.action] || e.action)) +
                (e.subject ? " — " + esc(e.subject) : "") + "</span>" +
              '<span class="tiny muted">' + esc(by ? tx(by.name) : "") + "</span></div>";
          }).join("")
        : '<p class="small muted" data-i18n="admin.auditEmpty"></p>') +
    "</section>";
  }

  /* =============================================================== render */
  var VIEWS = { overview: overview, people: people, requests: requests,
                money: money, ads: ads, catalogue: catalogue, settings: settings };

  App.onRender(function () {
    if (!Session.is("staff")) { host.innerHTML = denied(); I18N.apply(host); return; }
    var view = VIEWS[tab] || overview;

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-6)">' +
        '<h1 class="headline" data-i18n="admin.heading"></h1>' +
        '<p class="lead" data-i18n="admin.lead"></p></header>' +

      '<nav class="adm-tabs">' + TABS.map(function (t) {
        return '<button type="button" class="adm-tab' + (tab === t.id ? " is-active" : "") +
          '" data-tab="' + t.id + '">' + Icons.svg(t.icon, "icon-sm") +
          '<span data-i18n="' + t.key + '"></span></button>';
      }).join("") + "</nav>" +

      '<div class="adm-view">' + view() + "</div>" +
      (tab === "overview" ? record() : "") +
    "</div>";

    I18N.apply(host);
    var s = $("[data-search]", host);
    if (s) { s.value = query; if (query) { s.focus(); s.setSelectionRange(query.length, query.length); } }
  });

  /* =============================================================== events */
  function val(sel) { var el = $(sel, host); return el ? el.value.trim() : ""; }

  host.addEventListener("input", function (ev) {
    if (ev.target.matches("[data-search]")) { query = ev.target.value.trim(); App.rerender(); }
  });

  // Which channels a category allows. Ticking one is the whole edit — there
  // is no save button, because a half-saved catalogue is worse than none.
  host.addEventListener("change", function (ev) {
    var box = ev.target.closest("[data-cat-channel]");
    if (!box || !Session.is("staff")) return;
    var id = box.getAttribute("data-cat-channel");
    var picked = $$('[data-cat-channel="' + id + '"]', host)
      .filter(function (b) { return b.checked; })
      .map(function (b) { return b.value; });
    if (!picked.length) { App.toast(I18N.t("admin.catNeed"), "alert"); box.checked = true; return; }
    Store.setType(id, { channels: picked });
  });

  host.addEventListener("click", function (ev) {
    var t = ev.target;
    var hit = function (a) { var el = t.closest("[" + a + "]"); return el ? el.getAttribute(a) : null; };
    var me = Session.user();
    if (!me || !Session.is("staff")) return;

    var tb = hit("data-tab");
    if (tb) { tab = tb; rejecting = null; App.rerender(); return; }

    var mo = hit("data-months");
    if (mo) { months = +mo; App.rerender(); return; }

    var f = hit("data-filter");
    if (f) { filter = f; App.rerender(); return; }

    /* --- people --- */
    var ap = hit("data-approve");
    if (ap) {
      Store.updateAccount(ap, { status: "verified" });
      Store.log({ action: "approve", byId: me.id, targetId: ap,
                  subject: tx((M.user(ap) || {}).name || {}) });
      Store.notify({ to: ap, type: "approved", ref: ap });
      App.toast(I18N.t("admin.approved"), "check");
      return;
    }

    var rj = hit("data-reject");
    if (rj) { rejecting = rj; App.rerender(); return; }
    if (t.closest("[data-cancel]")) { rejecting = null; App.rerender(); return; }

    var rs = hit("data-reject-send");
    if (rs) {
      var why = val("[data-why]");
      if (!why) { App.toast(I18N.t("admin.rejectNeed"), "alert"); return; }
      Store.updateAccount(rs, { status: "rejected", rejectedReason: why });
      Store.log({ action: "reject", byId: me.id, targetId: rs, reason: why,
                  subject: tx((M.user(rs) || {}).name || {}) });
      Store.notify({ to: rs, type: "rejected", ref: rs });
      rejecting = null;
      App.toast(I18N.t("admin.rejected"), "check");
      return;
    }

    var fe = hit("data-feature");
    if (fe) {
      var u = M.user(fe);
      var placed = u && u.featuredRank != null;
      // Appended to the end rather than dropped on top of somebody: placement
      // is an ordering, and two lawyers both put first is not an answer.
      var next = placed ? null : M.featured().length + 1;
      Store.updateAccount(fe, { featuredRank: next });
      Store.log({ action: "feature", byId: me.id, targetId: fe,
                  subject: tx((u || {}).name || {}) });
      return;
    }

    var aiId = hit("data-ai");
    if (aiId) {
      var cur = M.subscriptionOf(aiId);
      Store.setSubscription(aiId, {
        price: M.platformSettings().aiPrice, active: !cur.active
      });
      Store.log({ action: "ai", byId: me.id, targetId: aiId,
                  subject: tx((M.user(aiId) || {}).name || {}) });
      App.toast(I18N.t(cur.active ? "adm.aiRevoked" : "adm.aiGranted"), "sparkle");
      return;
    }

    /* --- disputes --- */
    var oc = hit("data-outcome");
    if (oc) { outcome[t.closest("[data-for]").getAttribute("data-for")] = oc; App.rerender(); return; }

    var rv = hit("data-resolve");
    if (rv) {
      var reason = val("[data-why]"), pctEl = $("[data-pct]", host);
      if (!reason) { App.toast(I18N.t("admin.reasonNeed"), "alert"); return; }
      var pick = outcome[rv];
      Store.resolveDispute(rv, {
        outcome: pick,
        lawyerPct: pctEl ? Math.max(0, Math.min(100, +pctEl.value || 0)) : null,
        reason: reason, byId: me.id
      });
      Store.log({ action: "resolve", byId: me.id, targetId: rv, reason: reason, subject: pick });
      var dq = Store.disputes().filter(function (x) { return x.id === rv; })[0];
      if (dq) {
        M.partiesOf(M.request(dq.requestId), null).forEach(function (id) {
          Store.notify({ to: id, type: "resolved", ref: dq.requestId });
        });
      }
      delete outcome[rv];
      App.toast(I18N.t("admin.decided"), "check");
      return;
    }

    /* --- money --- */
    if (t.closest("[data-add-cost]")) {
      var cn = val("[data-cost-name]"), ca = +val("[data-cost-amount]");
      if (!cn || !(ca >= 0)) { App.toast(I18N.t("adm.costName"), "alert"); return; }
      Store.addCost({ name: cn, amount: ca, period: val("[data-cost-period]") || "monthly" });
      Store.log({ action: "cost", byId: me.id, subject: cn });
      return;
    }
    var dc = hit("data-del-cost");
    if (dc) { Store.removeCost(dc); return; }

    if (t.closest("[data-add-partner]")) {
      var pn = val("[data-partner-name]"), ps = +val("[data-partner-share]");
      if (!pn || !(ps >= 0 && ps <= 100)) { App.toast(I18N.t("adm.share"), "alert"); return; }
      Store.addPartner({ name: pn, sharePct: ps });
      Store.log({ action: "partner", byId: me.id, subject: pn });
      return;
    }
    var dp = hit("data-del-partner");
    if (dp) { Store.removePartner(dp); return; }

    /* --- announcements --- */
    if (t.closest("[data-add-ad]")) {
      var at = val("[data-ad-title]");
      if (!at) { App.toast(I18N.t("adm.needTitle"), "alert"); return; }
      Store.addAnnouncement({
        title: at, body: val("[data-ad-body]"), link: val("[data-ad-link]"),
        imageUrl: val("[data-ad-image]"), html: val("[data-ad-html]"),
        placement: val("[data-ad-placement]") || "bar",
        audience: val("[data-ad-audience]") || "all", active: true
      });
      Store.log({ action: "ad", byId: me.id, subject: at });
      App.toast(I18N.t("adm.saved"), "check");
      return;
    }
    var ta = hit("data-toggle-ad");
    if (ta) {
      var found = Store.announcements().filter(function (a) { return a.id === ta; })[0];
      Store.setAnnouncement(ta, { active: !(found && found.active) });
      return;
    }
    var da = hit("data-del-ad");
    if (da) { Store.removeAnnouncement(da); return; }

    /* --- the catalogue --- */
    if (t.closest("[data-cat-save]")) {
      var id = val("[data-cat-id]").toLowerCase().replace(/[^a-z0-9_-]/g, "");
      var ar = val("[data-cat-ar]"), en = val("[data-cat-en]");
      if (!id || !ar) { App.toast(I18N.t("admin.catNeed"), "alert"); return; }
      if (M.serviceType(id)) { App.toast(I18N.t("admin.catNeed"), "alert"); return; }
      var picked = $$("[data-cat-new-channel]", host)
        .filter(function (b) { return b.checked; })
        .map(function (b) { return b.value; });
      var min = +val("[data-cat-min]") || 0;
      var max = +val("[data-cat-max]") || 0;
      // The band goes in first. A category with no band is one a lawyer
      // cannot price anything under, so it would appear in the picker and
      // refuse every number typed into it.
      Store.setBand(id, { min: min, max: Math.max(min, max) });
      Store.addType({
        id: id, icon: "tag", active: true,
        title: { ar: ar, en: en || ar },
        meta: { ar: val("[data-cat-meta]"), en: val("[data-cat-meta]") },
        channels: picked.length ? picked : ["text"],
        sort: (M.allServiceTypes().length + 1) * 10,
      });
      Store.log({ action: "catalogue", byId: me.id, subject: ar });
      App.toast(I18N.t("admin.catAdded"), "check");
      return;
    }
    var ct = hit("data-cat-toggle");
    if (ct) {
      var cur = M.serviceType(ct);
      Store.setType(ct, { active: !(cur && cur.active !== false) });
      Store.log({ action: "catalogue", byId: me.id, subject: tx((cur || {}).title || {}) });
      return;
    }
    var cr = hit("data-cat-remove");
    if (cr) {
      // Refused by the database when anything is sold under it, and the
      // message says so rather than the row quietly coming back.
      var used = M.services().some(function (sv) { return sv.typeId === cr; }) ||
                 M.requests().some(function (rq) { return rq.typeId === cr; });
      if (used) { App.toast(I18N.t("admin.catInUse"), "alert"); return; }
      Store.removeType(cr);
      Store.log({ action: "catalogue", byId: me.id, subject: cr });
      return;
    }

    /* --- settings --- */
    if (t.closest("[data-save-settings]")) {
      var pct = +val("[data-commission]");
      if (pct > M.COMMISSION_MAX_PCT) { App.toast(I18N.t("admin.overCap"), "alert"); return; }

      // Read the whole form before writing any of it. The first write announces
      // a change, the page redraws on the spot, and every input still waiting
      // to be read is replaced by a fresh one carrying the old value — so the
      // bands were saved back exactly as they had been.
      var next = {
        commissionPct: M.clampCommission(pct),
        vatEnabled: !!$("[data-vat]", host).checked,
        vatPct: Math.max(0, Math.min(100, +val("[data-vatpct]") || 0)),
        madaPct: +val("[data-mada-pct]") || 0, madaFixed: +val("[data-mada-fixed]") || 0,
        cardPct: +val("[data-card-pct]") || 0, cardFixed: +val("[data-card-fixed]") || 0,
        madaSharePct: Math.max(0, Math.min(100, +val("[data-mada-share]") || 0)),
        aiPrice: +val("[data-ai-price]") || 0
      };
      var bands = $$("[data-band-min]", host).map(function (el) {
        var id = el.getAttribute("data-band-min");
        var max = $('[data-band-max="' + id + '"]', host);
        return { id: id, min: +el.value || 0, max: max ? +max.value || 0 : 0 };
      });

      Store.setSettings(next);
      bands.forEach(function (band) { Store.setBand(band.id, band); });
      Store.log({ action: "settings", byId: me.id, subject: M.clampCommission(pct) + "%" });
      App.toast(I18N.t("adm.saved"), "check");
      return;
    }
  });
});
</script>
<script>/* ==========================================================================
   Hash router — used only by the bundled single-file build.
   The multi-page site navigates with ordinary links; here every view lives in
   one document and is swapped in under #/route, then its page module is run
   again through Pages.run().
   ========================================================================== */
(function (global) {
  "use strict";

  var ROUTES = global.__ROUTES__;          // injected by tools/build-artifact.mjs
  var DEFAULT = "index";
  var I18N = global.I18N, App = global.App, Pages = global.Pages;
  var Layout = global.Layout;
  var host = document.getElementById("app");

  function parse() {
    var raw = (global.location.hash || "").replace(/^#\/?/, "");
    var mark = raw.indexOf("?");
    var name = mark === -1 ? raw : raw.slice(0, mark);
    var query = mark === -1 ? "" : raw.slice(mark + 1);
    var to = "";
    query.split("&").forEach(function (part) {
      var kv = part.split("=");
      if (kv[0] === "to") to = decodeURIComponent(kv[1] || "");
    });
    return { name: ROUTES[name] ? name : DEFAULT, to: to, query: query };
  }

  function syncNav(name) {
    var href = name + ".html";
    App.$$(".nav__link, .tabbar__link").forEach(function (a) {
      var match = a.getAttribute("href") === href ||
        (name === "lawyer" && a.getAttribute("href") === "lawyers.html");
      a.classList.toggle("is-active", match);
      if (match) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function render() {
    var at = parse();
    var route = ROUTES[at.name];

    document.documentElement.setAttribute("data-page", route.page);
    document.documentElement.setAttribute("data-title-key", route.titleKey);

    global.__ROUTE_QUERY__ = at.query;
    App.resetRenderers();
    host.innerHTML = route.html;
    I18N.apply(document);
    // The header is role-aware, so it is rebuilt with the view, not once.
    if (Layout && Layout.refresh) Layout.refresh();
    Pages.run(route.script);
    App.observeReveals();
    syncNav(at.name);

    var target = at.to && document.getElementById(at.to);
    if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
    else global.scrollTo(0, 0);
  }

  /* Turn the site's own "page.html" links into hash routes, so one set of
     markup serves both the multi-page site and this bundle. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[href]");
    if (!a || a.target === "_blank") return;
    var parts = (a.getAttribute("href") || "")
      .match(/^([\w-]+)\.html(?:\?([^#]*))?(?:#(.*))?$/);
    if (!parts) return;

    ev.preventDefault();
    var next = "#/" + parts[1];
    var query = parts[2] || "";
    if (parts[3]) query += (query ? "&" : "") + "to=" + encodeURIComponent(parts[3]);
    if (query) next += "?" + query;

    if (global.location.hash === next) render();       // same route, re-render
    else global.location.hash = next;
  });

  global.addEventListener("hashchange", function () {
    // In-page anchors (#main from the skip link) are not routes — leave them be.
    var h = global.location.hash;
    if (h && h.charAt(1) !== "/") return;
    render();
  });
  global.Router = { render: render };
  render();
})(window);
</script>
