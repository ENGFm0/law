  }

  function mount() {
    var page = document.documentElement.getAttribute("data-page") || "";
    var filled = false;
    var h = document.querySelector("[data-slot=header]");
    if (h) { h.outerHTML = header(page) + tabbar(page); filled = true; }
    var f = document.querySelector("[data-slot=footer]");
    if (f) { f.outerHTML = footer(); filled = true; }
    if (filled && I18N) I18N.apply(document);
    return filled;
  }

  /** Rebuild in place — the nav changes when the role or the session does. */
  function refresh() {
    var page = document.documentElement.getAttribute("data-page") || "";
    var oldHeader = document.querySelector(".site-header");
    var oldTab = document.querySelector("[data-tabbar]");
    if (!oldHeader) return;
    // The announcements sit above the header, so anything left from the last
    // draw has to go before this one replaces it.
    document.querySelectorAll("[data-announce]").forEach(function (el) { el.remove(); });
    var holder = document.createElement("div");
    holder.innerHTML = header(page) + tabbar(page);
    var newTab = holder.lastChild;
    var nodes = [];
    while (holder.firstChild !== newTab) nodes.push(holder.removeChild(holder.firstChild));
    var newHeader = nodes[nodes.length - 1];
    oldHeader.replaceWith(newHeader);
    nodes.slice(0, -1).forEach(function (n) { newHeader.parentNode.insertBefore(n, newHeader); });

    if (I18N) { I18N.apply(newHeader); I18N.apply(newTab); }
  }

  /** Redraw the bell and its list without rebuilding the header — a full

      inside it. */
  function syncNotices() {
    var wrap = document.querySelector(".notice-wrap");
    if (!wrap) return;
    var panel = wrap.querySelector("[data-notice-panel]");
    var wasOpen = panel && !panel.hidden;
    wrap.innerHTML = bell() + noticePanel();

  // the page turns English around a list that stays Arabic.
  document.addEventListener("langchange", syncNotices);
  document.addEventListener("sessionchange", syncNotices);

     header outlives every page and no page owns it. */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var panel = document.querySelector("[data-notice-panel]");
    var onBell = t.closest && t.closest('[data-action="notices"]');
    if (onBell) { if (panel) panel.hidden = !panel.hidden; return; }

    var all = t.closest && t.closest('[data-action="notices-read-all"]');
    if (all) {
      var me = Session.user();
      if (me) global.Store.readAllNotices(me.id);
      return;
    }

    var one = t.closest && t.closest("[data-notice]");
    if (one) { global.Store.readNotice(one.getAttribute("data-notice")); return; }

    if (panel && !panel.hidden && !(t.closest && t.closest(".notice-wrap"))) panel.hidden = true;
  });

  }

  /* ---------- signing in with Google ----------
     Shown always, so the page does not change shape between the demo and the
     connected project. On the demo it says why it cannot work yet rather than
     failing silently when pressed. */
  function googleButton() {
    var live = global.SB && global.SB.configured();
    var mark =
      '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke:none">' +
        '<path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/>' +
        '<path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/>' +
        '<path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.8V7.6H3.1a10 10 0 0 0 0 8.8L6.4 14z"/>' +
        '<path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.6l3.3 2.6C7.2 7.6 9.4 5.9 12 5.9z"/>' +
      "</svg>";
    return '<button class="btn btn--outline btn--block" type="button" data-google' +
      (live ? "" : " disabled") + ">" + mark +
      '<span data-i18n="auth.google"></span></button>' +
      (live ? "" : '<p class="tiny faint center" style="margin-top:var(--s-2)" ' +
        'data-i18n="auth.googleOnly"></p>') +
      '<div class="or-rule"><span data-i18n="auth.or"></span></div>';
  }

  /* ---------- misc ---------- */
  function empty(iconName, textKey) {
    return '<div class="card empty">' + Icons.svg(iconName, "icon-xl") +
      '<p class="subtitle">' + esc(I18N.t(textKey)) + "</p></div>";
  }

  function sectionHead(titleKey, leadKey) {
    return '<div class="section-head"><h2 class="headline" data-i18n="' + titleKey + '"></h2>' +
      (leadKey ? '<p class="lead" data-i18n="' + leadKey + '"></p>' : "") + "</div>";
  }

  global.C = {
    sar: sar, num: num, avatar: avatar, personLink: personLink, stars: stars,
    ratingLine: ratingLine, verifiedMark: verifiedMark, progressBar: progressBar,
    starPicker: starPicker, ratingSummary: ratingSummary, reviewCard: reviewCard,
    lawyerCard: lawyerCard, internCard: internCard, articleCard: articleCard,
    statusPill: statusPill, progress: progress,
    requestRow: requestRow, empty: empty, sectionHead: sectionHead,
    googleButton: googleButton
  };
})(window);
</script>
<script>/* ==========================================================================
   Home — one address, three landings.

   A client (and a guest) gets a deliberately short front page: what the
   platform is, three ways in, a few lawyers, a couple of articles.
   A lawyer and a trainee get a working dashboard instead, because for them
   this is where the day starts, not a brochure.
   ========================================================================== */
Pages.define("home", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-home]");
  if (!host) return;

  /* ---------- shared pieces ---------- */
  function stat(iconName, labelKey, value, rule) {
    return '<div class="card stat' + (rule ? " card--rule-" + rule : "") + '">' +
      '<div class="stat__top"><span class="small muted" data-i18n="' + labelKey + '"></span>' +
        '<span class="stat__icon">' + Icons.svg(iconName, "icon-sm") + "</span></div>" +
      '<span class="stat__value num">' + value + "</span></div>";
  }

  function sideLink(href, iconName, labelKey) {
    return '<a class="account-link" href="' + href + '">' +
      '<span class="stat__icon">' + Icons.svg(iconName, "icon-sm") + "</span>" +
      '<span class="grow" data-i18n="' + labelKey + '"></span>' +
      '<span class="account-link__go">' + Icons.svg("arrow", "icon-sm") + "</span></a>";
  }

  function pendingNotice() {
    return '<div class="card card--pad card--rule-gold" style="margin-bottom:var(--s-6)">' +
      '<h2 class="subtitle" data-i18n="dash.pendingTitle"></h2>' +
      '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="dash.pendingBody"></p></div>';
  }

  function greeting(leadKey) {
    var u = Session.user();
    return '<header style="margin-bottom:var(--s-8)">' +
      '<h1 class="headline" data-i18n="dash.hello" data-i18n-vars=\'' +
        JSON.stringify({ name: tx(u.name).split(" ").slice(0, 2).join(" ") }).replace(/'/g, "&#39;") +
      '\'></h1>' +
      '<p class="lead" data-i18n="' + leadKey + '"></p></header>';
  }

  function rankCard(role) {
    var u = Session.user();
    var r = M.rankOf(u.id, role);
    var s = M.scoreOf(u);
    return '<div class="card card--pad">' +
      '<h2 class="subtitle" data-i18n="dash.myRank"></h2>' +
      '<p class="display" style="margin:var(--s-3) 0">' +
        (r.rank
          ? '<span class="num">' + I18N.num(r.rank) + "</span>" +
            '<span class="lead" style="font-size:1rem"> ' + esc(I18N.t("dash.of")) + " " +
            '<span class="num">' + I18N.num(r.of) + "</span></span>"
          : "—") + "</p>" +
      C.progressBar(s.total) +
      '<p class="tiny muted" style="margin-top:var(--s-3)" data-i18n="dash.rankHint"></p></div>';
  }

  /* ---------- client / guest ---------- */
  function paths() {
    var items = [
      { href: "lawyers.html",  icon: "scale", t: "home.pathBrowse", b: "home.pathBrowseBody" },
      { href: "services.html", icon: "tag",   t: "home.pathOrder",  b: "home.pathOrderBody" },
      { href: "quotes.html",   icon: "gavel", t: "home.pathQuote",  b: "home.pathQuoteBody" }
    ];
    return '<div class="grid grid-3">' + items.map(function (it) {
      return '<a class="card card--hover feature" href="' + it.href + '">' +
        '<span class="feature__icon">' + Icons.svg(it.icon, "icon-lg") + "</span>" +
        '<h3 class="subtitle" data-i18n="' + it.t + '"></h3>' +
        '<p class="small muted" data-i18n="' + it.b + '"></p></a>';
    }).join("") + "</div>";
  }

  function clientHome() {
    var top = M.leaderboard("lawyer").slice(0, 3).map(function (row) { return row.user; });
    var posts = M.articles().slice(0, 2);

    return (
      '<section class="hero"><div class="container hero__inner">' +
        '<span class="eyebrow" data-i18n="home.eyebrow"></span>' +
        '<h1 class="display" data-i18n="home.heroTitle"></h1>' +
        '<p class="lead" data-i18n="home.heroLead"></p>' +
        '<form class="searchbar" data-home-search>' +
          '<input class="input" name="q" data-i18n-attr="placeholder:home.searchPlaceholder">' +
          '<select class="select" name="specialty" data-any-specialty></select>' +
          '<select class="select" name="city" data-any-city></select>' +
          '<button class="btn btn--primary" type="submit" data-i18n="home.search"></button>' +
        "</form>" +
        '<div class="trustbar">' +
          ["shield-check:home.trust1", "lock:home.trust2", "verified:home.trust3"].map(function (p) {
            var bits = p.split(":");
            return "<span>" + Icons.svg(bits[0], "icon-sm") + '<span data-i18n="' + bits[1] + '"></span></span>';
          }).join("") +
        "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        C.sectionHead("home.pathsTitle", "home.pathsLead") + paths() +
      "</div></section>" +

      '<section class="section section--band"><div class="container reveal">' +
        '<div class="row between wrap gap-4" style="margin-bottom:var(--s-8)">' +
          '<div><h2 class="headline" data-i18n="home.featuredTitle"></h2>' +
            '<p class="lead" data-i18n="home.featuredLead"></p></div>' +
          '<a class="btn btn--outline" href="lawyers.html" data-i18n="home.viewAll"></a></div>' +
        '<div class="grid grid-3">' + top.map(C.lawyerCard).join("") + "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        '<div class="row between wrap gap-4" style="margin-bottom:var(--s-8)">' +
          '<div><h2 class="headline" data-i18n="home.blogTitle"></h2>' +
            '<p class="lead" data-i18n="home.blogLead"></p></div>' +
          '<a class="btn btn--outline" href="blog.html" data-i18n="home.viewAll"></a></div>' +
        '<div class="grid grid-2">' + posts.map(C.articleCard).join("") + "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        '<div class="cta-band">' +
          '<h2 class="headline" data-i18n="home.ctaTitle"></h2>' +
          '<p class="lead" data-i18n="home.ctaLead"></p>' +
          '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
            '<a class="btn btn--accent btn--lg" href="lawyers.html" data-i18n="home.ctaPrimary"></a>' +
            '<a class="btn btn--ghost btn--lg" href="signup.html" data-i18n="home.ctaSecondary"></a>' +
          "</div></div>" +
      "</div></section>"
    );
  }

  /* ---------- lawyer ---------- */
  function lawyerHome() {
    var u = Session.user();
    var mine = M.requestsForLawyer(u.id);
    var live = mine.filter(function (r) {
      var st = M.requestState(r).status;
      return st !== "completed" && st !== "cancelled";
    });
    var needsMe = live.filter(function (r) {
      var st = M.requestState(r);
      return !st.assignedTo && (st.status === "new" || st.status === "drafted" || st.status === "assigned");
    });
    var revenue = mine.reduce(function (t, r) { return t + (r.price || 0); }, 0);
    var rating = M.ratingOf(u.id);
    // What has gone out to trainees is part of reading the month honestly.
    var toInterns = mine.reduce(function (t, r) {
      var pay = M.taskPay(r);
      return t + (pay && pay.kind === "share" ? pay.amount : 0);
    }, 0);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      greeting("dash.lawyerLead") +
      (Session.isVerified() ? "" : pendingNotice()) +
      '<div class="grid grid-5">' +
        stat("inbox", "dash.awaitingYou", I18N.num(needsMe.length), "gold") +
        stat("file-text", "dash.activeRequests", I18N.num(live.length)) +
        stat("wallet", "dash.revenue", I18N.num(revenue)) +
        stat("graduation", "pay.paidOut", I18N.num(toInterns)) +
        stat("star", "dash.overallRating", rating.avg.toFixed(1)) +
      "</div>" +

      '<div class="grid dash-split" style="margin-top:var(--s-10)">' +
        '<section class="card card--pad">' +
          '<div class="row between gap-3" style="margin-bottom:var(--s-5)">' +
            '<h2 class="subtitle" data-i18n="dash.latestWork"></h2>' +
            '<a class="btn btn--outline btn--sm" href="requests.html" data-i18n="dash.openInbox"></a></div>' +
          (live.length
            ? '<div class="req-list">' + live.slice(0, 4).map(function (r) {
                return C.requestRow(r, { showClient: true });
              }).join("") + "</div>"
            : '<p class="small muted" data-i18n="dash.nothingYet"></p>') +
        "</section>" +

        '<aside class="stack gap-4">' +
          rankCard("lawyer") +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" style="margin-bottom:var(--s-4)" data-i18n="dash.quickActions"></h2>' +
            '<div class="stack gap-2">' +
              sideLink("assistant.html", "sparkle", "dash.aiAssist") +
              sideLink("services.html", "tag", "dash.manageServices") +
              sideLink("editor.html", "edit", "dash.writeArticle") +
              sideLink("lawyer.html?id=" + encodeURIComponent(u.id), "user", "dash.completeProfile") +
            "</div></div>" +
        "</aside>" +
      "</div></div>";
  }

  /* ---------- trainee ---------- */
  function internHome() {
    var u = Session.user();
    var mine = M.requestsForIntern(u.id);
    var done = mine.filter(function (r) {
      var st = M.requestState(r).status;
      return st === "delivered" || st === "completed";
    });
    var prog = M.certProgress(u.id);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      greeting("dash.internLead") +
      (Session.isVerified() ? "" : pendingNotice()) +
      '<div class="grid grid-4">' +
        stat("inbox", "dash.assignedCount", I18N.num(mine.length), "gold") +
        stat("check", "dash.doneCount", I18N.num(done.length)) +
        stat("clock", "dash.hoursLogged", I18N.num(prog.hours)) +
        stat("wallet", "pay.earned", I18N.num(M.earnedBy(u.id))) +
      "</div>" +

      '<div class="grid dash-split" style="margin-top:var(--s-10)">' +
        '<section class="card card--pad">' +
          '<div class="row between gap-3" style="margin-bottom:var(--s-5)">' +
            '<h2 class="subtitle" data-i18n="tasks.assignedToMe"></h2>' +
            '<a class="btn btn--outline btn--sm" href="requests.html" data-i18n="dash.openInbox"></a></div>' +
          (mine.length
            ? '<div class="req-list">' + mine.slice(0, 4).map(function (r) {
                return C.requestRow(r, { showClient: true });
              }).join("") + "</div>"
            : '<p class="small muted" data-i18n="dash.nothingYet"></p>') +
        "</section>" +

        '<aside class="stack gap-4">' +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" data-i18n="cert.title"></h2>' +
            '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)" data-i18n="cert.progress"></p>' +
            C.progressBar(prog.pct) +
            '<p class="tiny muted" style="margin-top:var(--s-3)">' +
              esc(I18N.t(prog.eligible ? "cert.eligible" : "cert.remaining",
                         { n: I18N.num(Math.max(0, prog.needed - prog.hours)) })) + "</p></div>" +
          rankCard("intern") +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" style="margin-bottom:var(--s-4)" data-i18n="dash.quickActions"></h2>' +
            '<div class="stack gap-2">' +
              sideLink("services.html", "graduation", "dash.mySkills") +
              sideLink("editor.html", "edit", "dash.writeArticle") +
              sideLink("intern.html?id=" + encodeURIComponent(u.id), "user", "dash.completeProfile") +
            "</div></div>" +
        "</aside>" +
      "</div></div>";
  }

  /* ---------- draw ---------- */
  /** Announcements the platform wants on the home page rather than in a bar.
      An image if there is one, markup of its own if the platform wrote some,
      and otherwise a clean card — three ways to say something, one shape. */
  function feature() {
    var list = (M.announcementsFor(Session.role()) || []).filter(function (a) {
      return a.placement === "home";
    });
    if (!list.length) return "";
    return '<section class="container" style="padding-block:var(--s-8) 0">' +
      list.map(function (a) {
        // Markup written by staff, through a table only staff can write to.
        // Nothing a visitor types reaches this.
        if (a.html) return '<div class="promo promo--raw">' + a.html + "</div>";
        return '<article class="promo' + (a.imageUrl ? " promo--image" : "") + '"' +
          (a.imageUrl ? ' style="background-image:url(' + esc(a.imageUrl) + ')"' : "") + ">" +
          '<div class="promo__body">' +
            '<h2 class="title">' + esc(a.title) + "</h2>" +
            (a.body ? '<p class="lead">' + esc(a.body) + "</p>" : "") +
            (a.link ? '<a class="btn btn--accent" href="' + esc(a.link) + '" rel="noopener">' +
              esc(I18N.t("notice.open")) + "</a>" : "") +
          "</div></article>";
      }).join("") +
    "</section>";
  }

  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = feature() + (role === "lawyer" ? lawyerHome()
                   : role === "intern" ? internHome()
                   : clientHome());

    fillAny("[data-any-specialty]", global.SEED.specialties, "dir.anySpecialty");
    fillAny("[data-any-city]", global.SEED.cities, "dir.anyCity");
    I18N.apply(host);
    App.observeReveals(host);
  });

  function fillAny(sel, list, anyKey) {
    var el = $(sel, host);
    if (!el) return;
    el.innerHTML = '<option value="">' + esc(I18N.t(anyKey)) + "</option>" +
      list.map(function (o) {
        return '<option value="' + esc(o.id) + '">' + esc(tx(o)) + "</option>";
      }).join("");
  }

  /* The front-page search is just a shortcut into the directory's own filters. */
  host.addEventListener("submit", function (ev) {
    var form = ev.target.closest("[data-home-search]");
    if (!form) return;
    ev.preventDefault();
    var q = new URLSearchParams();
    ["q", "specialty", "city"].forEach(function (n) {
      var v = form.querySelector('[name="' + n + '"]').value;
      if (v) q.set(n, v);
    });
    App.go("lawyers.html" + (q.toString() ? "?" + q : ""));
  });
});

/* ==========================================================================
   Requests — the same URL, three jobs.

     client : what I asked for, running and finished. Never a word about how
              the work was produced — that is the lawyer's business.
     lawyer : the inbox. What the assistant has drafted, what needs my pen,
              what I routed to a trainee.
     intern : the work routed to me, and the button that logs its hours.
   ========================================================================== */
Pages.define("requests", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-requests]");
  if (!host) return;

  var open = null;      // request id whose editor/detail panel is expanded
  var rating = {};      // requestId -> stars picked but not yet sent
  var arguing = null;   // requestId whose refusal form is open
  var revising = null;  // requestId whose revision form is open

  function guest() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("lock", "auth.guestHint") +
      '<p class="center" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="login.html" data-i18n="auth.signIn"></a></p></div>';
  }

  /* ------------------------------------------------------- posted briefs
     A brief that nobody has taken yet is not nothing. It used to vanish the
     moment it was sent — the client saw an empty list and could only assume
     it had gone somewhere. It belongs here, with its clock running, until it
     is taken or the window closes; then it drops to the finished list with
     the date on it and a way to post it again. */
  function briefRow(q) {
    var state = M.quoteState(q);
    var kind = M.serviceType(q.typeId) || { title: {} };
    var ch = M.channel(q.channel);
    var offers = M.offersOn(q.id).length;
    var open = state === "open";
    var left = Math.max(0, Math.floor((q.expiresAt - Date.now()) / 60000));
    var pill = { open: "ok", accepted: "ok", expired: "", cancelled: "" }[state];

    return '<article class="req-row">' +
      '<span class="req-row__icon">' + Icons.svg(open ? "gavel" : "clock", "icon-sm") + "</span>" +
      '<div class="grow" style="min-width:0">' +
        '<div class="row gap-2 wrap"><strong class="small">' +
          esc(q.brief.slice(0, 70)) + (q.brief.length > 70 ? "…" : "") + "</strong>" +
          '<span class="tag">' + esc(tx(kind.title)) + "</span></div>" +
        '<p class="tiny muted">' + esc(ch ? tx(ch.title) : "") +
          ' <span class="dot"></span> ' + esc(I18N.t("brief.offers", { n: I18N.num(offers) })) +
          ' <span class="dot"></span> ' +
          esc(open ? I18N.t("brief.closesInMin", { n: I18N.num(left) })
                   : I18N.date(q.at)) + "</p></div>" +
      '<div class="req-row__side">' +
        '<span class="status' + (pill ? " status--" + pill : "") + '">' +
          esc(I18N.t("brief." + state)) + "</span>" +
        (open
          ? '<a class="btn btn--ghost btn--sm" href="quotes.html">' +
              esc(I18N.t("brief.watch")) + "</a>" +
            '<button class="btn btn--ghost btn--sm" type="button" data-brief-cancel="' +
              esc(q.id) + '">' + esc(I18N.t("quotes.cancel")) + "</button>"
          : state === "accepted"
            ? ""
            : '<a class="btn btn--outline btn--sm" href="quotes.html?again=' + esc(q.id) + '">' +
                Icons.svg("send", "icon-sm") + esc(I18N.t("brief.again")) + "</a>") +
      "</div></article>";
  }

  function briefs(me, which) {
    return M.quotesForClient(me.id).filter(function (q) {
      var state = M.quoteState(q);
      // An accepted brief became a request; it is in the list below as itself.
      if (state === "accepted") return false;
      return which === "open" ? state === "open" : state !== "open";
    });
  }

  /* ====================================================== client ========== */
  function clientView() {
    var me = Session.user();
    var live = M.requestsForClient(me.id, "open");
    var past = M.requestsForClient(me.id, "past");
    var waiting = briefs(me, "open");
    var closed = briefs(me, "past");

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="req.heading"></h1>' +
        '<p class="lead" data-i18n="req.leadClient"></p></header>' +

      (waiting.length
        ? '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
            '<h2 class="subtitle" style="margin-bottom:var(--s-5)" data-i18n="brief.waiting"></h2>' +
            '<div class="req-list">' + waiting.map(briefRow).join("") + "</div></section>"
        : "") +

      '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
        '<h2 class="subtitle" style="margin-bottom:var(--s-5)" data-i18n="req.current"></h2>' +
        (live.length
          ? '<div class="req-list">' + live.map(clientRow).join("") + "</div>"
          : '<p class="small muted" data-i18n="req.noneCurrent"></p>') +
      "</section>" +

      '<section class="card card--pad">' +
        '<h2 class="subtitle" style="margin-bottom:var(--s-5)" data-i18n="req.past"></h2>' +
        (past.length || closed.length
          ? '<div class="req-list">' + past.map(clientRow).join("") +
            closed.map(briefRow).join("") + "</div>"
          : '<p class="small muted" data-i18n="req.nonePast"></p>') +
      "</section></div>";
  }

  /* What the client is allowed to see. Drafting, assistant queues and trainee
     routing are how the work gets done, not something the client ordered — so
     all three collapse into one honest word: in progress. */
  var CLIENT_STATUS = {
    drafted: "in_progress", with_intern: "in_progress", assigned: "in_progress",
    open_to_interns: "in_progress"
  };

  function clientRow(r) {
    var st = M.requestState(r);
    var lawyer = M.user(r.lawyerId);
    var canRate = (st.status === "delivered" || st.status === "completed") && !st.rated;

    return '<div>' + C.requestRow(r, {
      status: CLIENT_STATUS[st.status] || st.status,
      actions: function () {
        var chan = M.channel(r.channel);
        var live = M.isLive(r) &&
          ["delivered", "completed", "cancelled"].indexOf(st.status) === -1;
        return (live
            ? '<a class="btn btn--primary btn--sm" href="call.html?id=' + esc(r.id) + '">' +
              Icons.svg(chan.icon, "icon-sm") + esc(I18N.t("inbox.join")) + "</a>"
            : "") +
          '<button class="btn btn--ghost btn--sm" type="button" data-detail="' + esc(r.id) + '">' +
            esc(I18N.t("req.openDetails")) + "</button>" +
          (canRate
            ? '<button class="btn btn--outline btn--sm" type="button" data-rate="' + esc(r.id) + '">' +
              Icons.svg("star", "icon-sm") + esc(I18N.t("rate.cta")) + "</button>"
            : st.rated
              ? '<span class="tiny muted">' + esc(I18N.t("rate.already")) + "</span>"
              : "");
      }
    }) +
    // On the row itself, not behind "open details". Both sides asked the same
    // question about an agreed piece of work — where has it got to — and
    // answering it should not require finding a button first.
    '<div class="track-slot">' + C.progress(r, "client") + "</div>" +
    (open === r.id ? clientDetail(r, st, lawyer) : "") + "</div>";
  }

  function clientDetail(r, st, lawyer) {
    return '<div class="card card--pad" style="margin:var(--s-2) 0 var(--s-4)">' +
      '<div class="row between wrap gap-3">' +
        '<div class="row gap-3">' + C.avatar(lawyer, "sm") +
          '<div><span class="tiny muted" data-i18n="req.byLawyer"></span>' +
          "<div>" + C.personLink(lawyer) + "</div></div></div>" +
        '<button class="icon-btn" type="button" data-detail-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<h3 class="subtitle" style="margin-top:var(--s-5)" data-i18n="req.deliverable"></h3>' +
      (st.body
        ? '<pre class="draft-text" style="min-height:auto" readonly>' + esc(st.body) + "</pre>"
        : '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="req.noDeliverable"></p>') +
      acceptPanel(r) +
      (rating[r.id] !== undefined ? rateForm(r) : "") +
    "</div>";
  }


  /* ---- accepting a delivery, and refusing one -------------------------
     The client is not asked to trust that somebody will eventually settle
     this. The window is on screen with its deadline, the one revision is
     offered before the right to refuse rather than instead of it, and a
     refusal says plainly that the money stops moving until it is decided. */
  function timeLeft(ms) {
    var h = Math.floor(ms / 3600e3), d = Math.floor(h / 24);
    if (d > 0) return I18N.t("accept.leftDays", { d: d, h: h - d * 24 });
    if (h > 0) return I18N.t("accept.leftHours", { h: h });
    return I18N.t("accept.leftSoon");
  }

  function outcomeLine(res) {
    if (res.outcome === "release") return I18N.t("accept.outRelease");
    if (res.outcome === "refund") return I18N.t("accept.outRefund");
    return I18N.t("accept.outSplit", { p: res.lawyerPct });
  }

  function acceptPanel(r) {
    var a = M.acceptance(r);
    if (!a.delivered) return "";
    var d = a.dispute;

    // Decided: the outcome and the reason behind it, in the same words the
    // lawyer sees — there is no version of this the other party cannot read.
    if (d && d.status === "resolved") {
      var s = M.settlement(r);
      return card("gold",
        '<h3 class="subtitle">' + esc(I18N.t("accept.decided")) + "</h3>" +
        '<p style="margin-top:var(--s-2)">' + esc(outcomeLine(d.resolution)) + "</p>" +
        (s && s.refund > 0
          ? '<p class="small" style="margin-top:var(--s-2)">' +
            esc(I18N.t("accept.refunded")) + ": " + C.num(Math.round(s.refund / 100)) + " " + C.sar() + "</p>"
          : "") +
        '<p class="tiny muted" style="margin-top:var(--s-3)">' +
          esc(I18N.t("accept.decisionReason")) + "</p>" +
        '<p class="small">' + esc(d.resolution.reason) + "</p>");
    }

    if (d) {
      return card("gold",
        '<h3 class="subtitle">' + esc(I18N.t("accept.disputeOpen")) + "</h3>" +
        '<p class="small" style="margin-top:var(--s-2)">' + esc(I18N.t("accept.frozen")) + "</p>" +
        '<p class="tiny muted" style="margin-top:var(--s-3)">' + esc(I18N.t("accept.yourReason")) + "</p>" +
        '<p class="small">' + esc(d.reason) + "</p>");
    }

    if (a.settled) {
      return card("", '<p class="small">' + Icons.svg("check", "icon-sm") + " " +
        esc(I18N.t(a.autoAccepted ? "accept.auto" : "accept.accepted")) + "</p>");
    }

    if (revising === r.id) return card("gold", form("revise", r));
    if (arguing === r.id) return card("gold", form("dispute", r));

    return card("gold",
      '<h3 class="subtitle">' + esc(I18N.t("accept.heading")) + "</h3>" +
      '<p class="small" style="margin-top:var(--s-2)">' + esc(I18N.t("accept.lead")) + "</p>" +
      (a.msLeft != null
        ? '<p class="small" style="margin-top:var(--s-3)"><strong>' + esc(timeLeft(a.msLeft)) +
          "</strong></p>" +
          '<p class="tiny muted">' + esc(I18N.t("accept.autoNote")) + "</p>"
        : "") +
      '<p class="tiny muted" style="margin-top:var(--s-2)">' +
        esc(I18N.t(a.canRevise ? "accept.reviseOnce" : "accept.reviseUsed")) + "</p>" +
      '<div class="row gap-3 wrap" style="margin-top:var(--s-4)">' +
        '<button class="btn btn--primary btn--sm" type="button" data-accept="' + esc(r.id) + '">' +
          Icons.svg("check", "icon-sm") + esc(I18N.t("accept.cta")) + "</button>" +
        (a.canRevise
          ? '<button class="btn btn--outline btn--sm" type="button" data-revise="' + esc(r.id) + '">' +
            esc(I18N.t("accept.revise")) + "</button>"
          : "") +
        // Refusing is deliberately the quiet option: it is a right, not the
        // expected next step.
        '<button class="btn btn--ghost btn--sm" type="button" data-argue="' + esc(r.id) + '">' +
          esc(I18N.t("accept.dispute")) + "</button>" +
      "</div>");
  }

  function card(rule, inner) {
    return '<div class="card card--pad' + (rule ? " card--rule-" + rule : "") +
      '" style="margin-top:var(--s-6)">' + inner + "</div>";
  }

  function form(kind, r) {
    var revise = kind === "revise";
    return '<h3 class="subtitle">' +
        esc(I18N.t(revise ? "accept.revise" : "accept.dispute")) + "</h3>" +
      '<p class="small" style="margin-top:var(--s-2)">' +
        esc(I18N.t(revise ? "accept.reviseWhat" : "accept.disputeWhy")) + "</p>" +
      '<textarea class="input" rows="4" style="margin-top:var(--s-3)" data-argue-body></textarea>' +
      '<div class="row gap-3" style="margin-top:var(--s-4)">' +
        '<button class="btn btn--primary btn--sm" type="button" data-' +
          (revise ? "revise-send" : "argue-send") + '="' + esc(r.id) + '">' +
          esc(I18N.t(revise ? "accept.reviseSend" : "accept.disputeSend")) + "</button>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-argue-cancel>' +
          esc(I18N.t("accept.cancel")) + "</button>" +
      "</div>";
  }

  function rateForm(r) {
    var lawyer = M.user(r.lawyerId);
    return '<div class="card card--pad card--rule-gold" style="margin-top:var(--s-6)">' +
      '<h3 class="subtitle" data-i18n="rate.title"></h3>' +
      '<p class="tiny muted" style="margin-top:var(--s-1)">' +
        esc(lawyer ? tx(lawyer.name) : "") + " · " + esc(tx(r.title)) + "</p>" +
      '<div style="margin:var(--s-5) 0">' + C.starPicker(rating[r.id] || 0, r.id) + "</div>" +
      '<textarea class="textarea" data-rate-body ' +
        'data-i18n-attr="placeholder:rate.placeholder"></textarea>' +
      '<p class="tiny faint" style="margin-top:var(--s-2)" data-i18n="rate.commentOptional"></p>' +
      '<button class="btn btn--accent" type="button" style="margin-top:var(--s-4)" ' +
        'data-rate-send="' + esc(r.id) + '" data-i18n="rate.submit"></button></div>';
  }

  /* ====================================================== lawyer ========== */
  var FILTERS = [
    { id: "all",      key: "inbox.all" },
    { id: "ai",       key: "inbox.withAi" },
    { id: "manual",   key: "inbox.withoutAi" },
    { id: "live",     key: "inbox.live" },
    { id: "assigned", key: "inbox.assigned" }
  ];
  var filter = "all";

  function bucket(r) {
    var st = M.requestState(r);
    if (st.assignedTo) return "assigned";
    var t = M.serviceType(r.typeId);
    if (t && t.mode === "live") return "live";
    return r.ai ? "ai" : "manual";
  }

  function inboxStatus(r) {
    var st = M.requestState(r);
    if (st.status === "delivered" || st.status === "completed") return { cls: "ok", key: "inbox.done" };
    if (st.assignedTo) return { cls: "info", key: "inbox.assigned" };
    var t = M.serviceType(r.typeId);
    if (t && t.mode === "live") return { cls: "info", key: "inbox.scheduled" };
    if (r.ai && st.status === "drafted") return { cls: "ok", key: "inbox.aiReady" };
    if (r.ai) return { cls: "muted", key: "inbox.aiQueued" };
    return { cls: "warn", key: "inbox.needsYou" };
  }

  function lawyerActions(r) {
    var st = M.requestState(r);
    var t = M.serviceType(r.typeId) || {};
    if (st.status === "delivered" || st.status === "completed") return "";

    if (st.status === "open_to_interns" && !st.assignedTo) {
      var n = Store.applicants(r.id).length;
      return '<span class="tiny muted">' +
          esc(I18N.t("task.competing", { n: I18N.num(n) })) + "</span>" +
        '<button class="btn btn--outline btn--sm" type="button" data-open="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.applicants")) + "</button>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-unassign="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.withdrawOffer")) + "</button>";
    }

    if (st.assignedTo) {
      var who = M.user(st.assignedTo);
      return '<span class="tiny muted">' +
          esc(I18N.t("inbox.assignedTo", { name: who ? tx(who.name) : "" })) + "</span>" +
        '<span>' + payLine(r, "pay.share") + "</span>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-unassign="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.unassign")) + "</button>";
    }

    if (t.mode === "live") {
      return '<a class="btn btn--primary btn--sm" href="call.html?id=' + esc(r.id) + '">' +
        Icons.svg(t.icon, "icon-sm") + esc(I18N.t("inbox.join")) + "</a>";
    }

    var main = r.ai
      ? (st.status === "drafted"
          ? '<button class="btn btn--primary btn--sm" type="button" data-open="' + esc(r.id) + '">' +
            esc(I18N.t("inbox.review")) + "</button>"
          : '<button class="btn btn--outline btn--sm" type="button" data-gen="' + esc(r.id) + '">' +
            Icons.svg("sparkle", "icon-sm") + esc(I18N.t("inbox.generate")) + "</button>")
      : '<button class="btn btn--outline btn--sm" type="button" data-open="' + esc(r.id) + '">' +
        esc(I18N.t("inbox.writeSelf")) + "</button>";

    return main +
      '<button class="btn btn--ghost btn--sm" type="button" data-assign="' + esc(r.id) + '">' +
        Icons.svg("graduation", "icon-sm") + esc(I18N.t("inbox.assign")) + "</button>";
  }

  function lawyerView() {
    var me = Session.user();
    var all = M.requestsForLawyer(me.id);
    var rows = all.filter(function (r) { return filter === "all" || bucket(r) === filter; });

    var chips = FILTERS.map(function (f) {
      var n = f.id === "all" ? all.length
        : all.filter(function (r) { return bucket(r) === f.id; }).length;
      return '<button type="button" class="chip' + (filter === f.id ? " is-active" : "") +
        '" data-filter="' + f.id + '">' + esc(I18N.t(f.key)) +
        ' <span class="num">' + I18N.num(n) + "</span></button>";
    }).join("");

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-6)">' +
        '<h1 class="headline" data-i18n="inbox.title"></h1>' +
        '<p class="lead" data-i18n="inbox.lead"></p></header>' +
      '<div class="row gap-2 wrap" style="margin-bottom:var(--s-5)">' + chips + "</div>" +
      '<p class="small muted" style="margin-bottom:var(--s-4)">' +
        esc(I18N.t("inbox.count", { n: I18N.num(rows.length) })) + "</p>" +

      (rows.length
        ? rows.map(function (r) {
            var st = inboxStatus(r);
            var client = M.user(r.clientId);
            var t = M.serviceType(r.typeId) || {};
            return "<div>" +
              '<div class="inbox-row' + (open === r.id ? " is-open" : "") + '">' +
                '<span class="inbox-row__icon">' + Icons.svg(t.icon || "file-text", "icon-sm") + "</span>" +
                '<div class="grow" style="min-width:0">' +
                  '<div class="row gap-2 wrap"><strong class="small">' + esc(tx(r.title)) + "</strong>" +
                    '<span class="tag">' + esc(tx(t.title || {})) + "</span></div>" +
                  '<p class="tiny muted">' + esc(client ? tx(client.name) : "") +
                    ' <span class="dot"></span> ' + esc(tx(r.ago)) + "</p>" +
                  (r.brief ? '<p class="tiny faint">' + esc(I18N.t("inbox.clientNote")) + ": " +
                    esc(tx(r.brief)) + "</p>" : "") +
                "</div>" +
                '<div class="inbox-row__side">' +
                  '<span class="status status--' + st.cls + '">' + esc(I18N.t(st.key)) + "</span>" +
                  '<strong class="tiny"><span class="num">' + I18N.num(r.price) + "</span> " +
                    esc(I18N.t("common.sar")) + "</strong>" +
                  '<div class="inbox-row__actions">' + lawyerActions(r) + "</div>" +
                "</div></div>" +
              '<div class="track-slot">' + C.progress(r, "lawyer") + "</div>" +
              (open === r.id
                ? (M.requestState(r).status === "open_to_interns" && !M.requestState(r).assignedTo
                    ? applicantsPanel(r)
                    : draftPanel(r))
                : "") + "</div>";
          }).join("")
        : '<p class="muted center" style="padding:var(--s-8)">' + esc(I18N.t("inbox.empty")) + "</p>") +
    "</div>";
  }

  /** Who put their hand up for an opened task, and the button that ends it. */
  function applicantsPanel(r) {
    var ids = Store.applicants(r.id);
    return '<section class="panel" style="margin:var(--s-2) 0 var(--s-5)">' +
      '<div class="panel__head row between wrap gap-3">' +
        '<h2 class="subtitle">' + esc(I18N.t("inbox.applicants")) + " — " + esc(tx(r.title)) + "</h2>" +
        '<button class="icon-btn" type="button" data-draft-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<div style="padding:var(--s-5)">' +
        (ids.length
          ? '<div class="req-list">' + ids.map(function (id) {
              var u = M.user(id);
              if (!u) return "";
              var prog = M.certProgress(u.id);
              return '<div class="req-row">' +
                '<span class="req-row__icon">' + C.avatar(u, "sm") + "</span>" +
                '<div class="grow" style="min-width:0">' + C.personLink(u) +
                  '<p class="tiny muted">' + esc(tx(u.university || {})) + ' <span class="dot"></span> ' +
                    esc(I18N.t("cert.hoursShort", { n: I18N.num(prog.hours) })) + "</p>" +
                  '<div class="row gap-2 wrap" style="margin-top:var(--s-2)">' +
                    (u.skills || []).slice(0, 3).map(function (sk) {
                      return '<span class="tag">' + esc(tx(sk)) + "</span>";
                    }).join("") + "</div></div>" +
                '<div class="req-row__side">' + C.ratingLine(u.id) +
                  '<button class="btn btn--accent btn--sm" type="button" ' +
                    'data-pick-intern="' + esc(u.id) + '" data-for="' + esc(r.id) + '">' +
                    esc(I18N.t("inbox.pickApplicant")) + "</button></div></div>";
            }).join("") + "</div>"
          : '<p class="small muted">' + esc(I18N.t("inbox.noApplicants")) + "</p>") +
      "</div></section>";
  }

  /** The drafting surface. The assistant's text lands here and nowhere else. */
  function draftPanel(r) {
    var st = M.requestState(r);
    var t = M.serviceType(r.typeId) || {};
    var client = M.user(r.clientId);
    var body = st.body || (r.doc && global.SEED.draftBodies[r.doc] ? tx(global.SEED.draftBodies[r.doc]) : "");

    return '<section class="panel" style="margin:var(--s-2) 0 var(--s-5)">' +
      '<div class="panel__head row between wrap gap-3">' +
        "<div><h2 class=\"subtitle\">" + esc(tx(r.title)) + "</h2>" +
          '<p class="tiny muted">' + esc(client ? tx(client.name) : "") + ' <span class="dot"></span> ' +
            esc(tx(t.title || {})) +
            (r.ai ? ' <span class="dot"></span> ' + esc(I18N.t("ai.aiSource")) : "") + "</p></div>" +
        '<button class="icon-btn" type="button" data-draft-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      (r.ai ? '<p class="disclaimer" style="border-top:0">' + Icons.svg("lock", "icon-sm") +
        "<span>" + esc(I18N.t("inbox.aiHidden")) + "</span></p>" : "") +
      '<textarea class="draft-text" data-draft-body spellcheck="false">' + esc(body) + "</textarea>" +
      '<div class="draft-foot">' +
        '<div><span class="tiny muted">' + esc(I18N.t("inbox.revenue")) + "</span>" +
          '<strong style="display:block;color:var(--accent)"><span class="num">' +
            I18N.num(r.price) + "</span> " + esc(I18N.t("common.sar")) + "</strong></div>" +
        '<span class="grow"></span>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-assign="' + esc(r.id) + '">' +
          Icons.svg("graduation", "icon-sm") + esc(I18N.t("inbox.assign")) + "</button>" +
        '<button class="btn btn--accent" type="button" data-approve="' + esc(r.id) + '">' +
          Icons.svg("check", "icon-sm") + esc(I18N.t("ai.approve")) + "</button>" +
      "</div></section>";
  }

  /** Two ways to hand work down: name someone, or let them compete for it.
      Three names is not worth a modal, so this is an inline chooser. */
  function openAssign(id, anchor) {
    var existing = $(".assign-pop");
    if (existing) existing.remove();
    var pop = document.createElement("div");
    pop.className = "assign-pop";
    var me = Session.user();
    var r = M.request(id);
    pop.innerHTML =
      '<label class="field" style="padding:0 var(--s-2) var(--s-2)">' +
        '<span class="tiny muted">' + esc(I18N.t("pay.shareLabel")) + "</span>" +
        '<span class="tiny faint">' + esc(I18N.t("pay.shareFloor",
          { n: I18N.num(M.MIN_SHARE) })) + "</span>" +
        '<input class="input num" type="number" min="' + M.MIN_SHARE + '" max="100" step="5" ' +
          'dir="ltr" data-share value="' + M.DEFAULT_SHARE + '"></label>' +
      '<p class="tiny faint" style="padding:0 var(--s-2) var(--s-3)">' +
        esc(I18N.t("pay.shareHint")) + "</p>" +
      '<hr class="divider" style="margin:0 0 var(--s-2)">' +
      '<p class="tiny muted">' + esc(I18N.t("inbox.pickOne")) + "</p>" +
      M.interns().map(function (i) {
        // A standing agreement already settles the terms, so say so here.
        var deal = M.agreementFor(me.id, i.id);
        return '<button type="button" data-pick-intern="' + esc(i.id) + '" data-for="' + esc(id) + '">' +
          '<img class="avatar avatar--sm" alt="" width="28" height="28" src="' +
            App.avatarOf(i.name, i.id) + '">' +
          "<span>" + esc(tx(i.name)) +
            (deal ? '<span class="tiny muted" style="display:block">' +
              esc(I18N.t("pay.underAgreement", { kind: I18N.t("pay.kind" +
                deal.kind.charAt(0).toUpperCase() + deal.kind.slice(1)) })) + "</span>" : "") +
          "</span>" +
          '<span class="tiny muted num">' + I18N.num(M.hoursOf(i.id)) + "</span></button>";
      }).join("") +
      '<hr class="divider" style="margin:var(--s-2) 0">' +
      '<button type="button" data-broadcast="' + esc(id) + '">' +
        '<span class="stat__icon" style="width:28px;height:28px">' +
          Icons.svg("gavel", "icon-sm") + "</span>" +
        "<span><strong>" + esc(I18N.t("inbox.openToAll")) + "</strong>" +
        '<span class="tiny muted" style="display:block">' +
          esc(I18N.t("inbox.openToAllHint")) + "</span></span></button>";
    anchor.appendChild(pop);
  }

  /* ====================================================== intern ========== */
  function internView() {
    var me = Session.user();
    var mine = M.requestsForIntern(me.id);
    var pool = M.openInternTasks();

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="task.heading"></h1>' +
        '<p class="lead" data-i18n="task.lead"></p></header>' +
      (mine.length
        ? mine.map(internRow).join("")
        : C.empty("inbox", "task.none")) +

      '<section style="margin-top:var(--s-12)">' +
        '<h2 class="headline" data-i18n="task.openPool"></h2>' +
        '<p class="lead" style="margin-bottom:var(--s-6)" data-i18n="task.openPoolLead"></p>' +
        (pool.length
          ? pool.map(function (r) { return openTaskRow(r, me); }).join("")
          : C.empty("gavel", "task.noOpen")) +
      "</section></div>";
  }

  /** An opened task: every trainee sees it, applies, and the lawyer picks. */
  function openTaskRow(r, me) {
    var lawyer = M.user(r.lawyerId);
    var t = M.serviceType(r.typeId) || {};
    var applicants = Store.applicants(r.id);
    var applied = applicants.indexOf(me.id) !== -1;

    return '<article class="card card--pad card--rule-gold" style="margin-bottom:var(--s-4)">' +
      '<div class="row between wrap gap-4">' +
        '<div class="grow" style="min-width:0">' +
          '<div class="row gap-2 wrap"><h3 class="subtitle">' + esc(tx(r.title)) + "</h3>" +
            '<span class="tag">' + esc(tx(t.title || {})) + "</span></div>" +
          '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(r.brief)) + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-3)">' +
            '<span class="row gap-2">' + Icons.svg("scale", "icon-sm") +
              '<span class="tiny muted">' + esc(I18N.t("task.supervisor")) + ":</span> " +
              (lawyer ? C.personLink(lawyer) : "") + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' + esc(I18N.t("task.hoursWorth", { n: I18N.num(r.hours || 4) })) + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' +
              esc(I18N.t("task.competing", { n: I18N.num(applicants.length) })) + "</span>" +
          "</div>" +
        "</div>" +
        (applied
          ? '<span class="status status--ok">' + esc(I18N.t("task.applied")) + "</span>"
          : '<button class="btn btn--accent btn--sm" type="button" data-apply="' + esc(r.id) + '">' +
            Icons.svg("send", "icon-sm") + esc(I18N.t("task.apply")) + "</button>") +
      "</div></article>";
  }

  function internRow(r) {
    var st = M.requestState(r);
    var lawyer = M.user(r.lawyerId);
    var t = M.serviceType(r.typeId) || {};
    var done = st.status === "delivered" || st.status === "completed";

    return '<article class="card card--pad" style="margin-bottom:var(--s-4)">' +
      '<div class="row between wrap gap-4">' +
        '<div class="grow" style="min-width:0">' +
          '<div class="row gap-2 wrap"><h2 class="subtitle">' + esc(tx(r.title)) + "</h2>" +
            '<span class="tag">' + esc(tx(t.title || {})) + "</span>" + C.statusPill(st.status) + "</div>" +
          '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(r.brief)) + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-3)">' +
            '<span class="row gap-2">' + Icons.svg("scale", "icon-sm") +
              '<span class="tiny muted">' + esc(I18N.t("task.supervisor")) + ":</span> " +
              (lawyer ? C.personLink(lawyer) : "") + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' + esc(I18N.t("task.hoursWorth", { n: I18N.num(r.hours || 4) })) + "</span>" +
            '<span class="dot"></span>' + payLine(r, "pay.yourShare") +
          "</div>" +
        "</div>" +
        '<div class="row gap-2 wrap">' +
          (done ? ""
            : '<button class="btn btn--outline btn--sm" type="button" data-task-open="' + esc(r.id) + '">' +
              esc(I18N.t(st.status === "in_progress" ? "req.openDetails" : "task.start")) + "</button>") +
        "</div>" +
      "</div>" +
      (open === r.id && !done
        ? '<div style="margin-top:var(--s-5)">' +
            '<textarea class="draft-text" data-task-body spellcheck="false" ' +
              'data-i18n-attr="placeholder:task.writeHere">' + esc(st.body || "") + "</textarea>" +
            '<div class="row gap-2" style="margin-top:var(--s-3)">' +
              '<button class="btn btn--ghost btn--sm" type="button" data-task-save="' + esc(r.id) + '" ' +
                'data-i18n="dash.saveDraft"></button>' +
              '<button class="btn btn--accent btn--sm" type="button" data-task-deliver="' + esc(r.id) + '">' +
                Icons.svg("send", "icon-sm") + esc(I18N.t("task.deliver")) + "</button></div></div>"
        : "") +
    "</article>";
  }

  /** The share typed into the routing chooser, if it is open. */
  function readShare() {
    var el = $("[data-share]", host);
    return el ? M.clampShare(+el.value) : null;
  }

  /** One line saying what this task pays, for whoever is entitled to see it. */
  function payLine(r, labelKey) {
    var pay = M.taskPay(r);
    if (!pay) return "";
    if (pay.kind === "share") {
      return '<span class="tiny muted">' + esc(I18N.t(labelKey)) + ": </span>" +
        '<strong class="tiny" style="color:var(--accent)"><span class="num">' +
          I18N.num(pay.amount) + "</span> " + esc(I18N.t("common.sar")) + "</strong>" +
        '<span class="tiny faint"> (' + esc(I18N.t("pay.ofPrice",
          { pct: I18N.num(pay.pct), price: I18N.num(r.price || 0) })) + ")</span>";
    }
    var kindKey = "pay.kind" + pay.kind.charAt(0).toUpperCase() + pay.kind.slice(1);
    return '<span class="tag">' +
      esc(I18N.t("pay.underAgreement", { kind: I18N.t(kindKey) })) + "</span>";
  }

  /* ====================================================== draw ============ */
  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = Session.isGuest() ? guest()
                   : role === "lawyer" ? lawyerView()
                   : role === "intern" ? internView()
                   : clientView();
    I18N.apply(host);
  });

  /* ====================================================== events ========== */
  host.addEventListener("click", function (ev) {
    var t = ev.target;
    var hit = function (attr) {
      var el = t.closest("[" + attr + "]");
      return el ? el.getAttribute(attr) : null;
    };

    var f = t.closest("[data-filter]");
    if (f) { filter = f.getAttribute("data-filter"); App.rerender(); return; }

    /* --- client --- */
    var bc = hit("data-brief-cancel");
    if (bc) {
      Store.setQuote(bc, { status: "cancelled" });
      App.toast(I18N.t("quotes.cancelled"), "close");
      return;
    }

    var det = hit("data-detail");
    if (det) { open = open === det ? null : det; App.rerender(); return; }
    if (t.closest("[data-detail-close]")) { open = null; App.rerender(); return; }

    var rt = hit("data-rate");
    if (rt) { open = rt; rating[rt] = rating[rt] || 0; App.rerender(); return; }

    var star = t.closest("[data-star]");
    if (star) {
      rating[star.getAttribute("data-for")] = +star.getAttribute("data-star");
      App.rerender();
      return;
    }

    var send = hit("data-rate-send");
    if (send) {
      if (!rating[send]) { App.toast(I18N.t("rate.needStars"), "star"); return; }
      var r = M.request(send);
      var box = $("[data-rate-body]", host);
      Store.addReview({
        targetId: r.lawyerId, authorId: Session.user().id, requestId: r.id,
        rating: rating[send], date: { ar: I18N.t("common.today"), en: I18N.t("common.today") },
        body: { ar: box ? box.value : "", en: box ? box.value : "" }
      });
      Store.setRequest(r.id, { rated: true, status: "completed" });
      Store.notify({ to: r.lawyerId, type: "rated", ref: r.id });
      delete rating[send];
      open = null;
      App.toast(I18N.t("rate.done"), "check");
      return;
    }

    /* --- accepting, revising, refusing --- */
    var acc = hit("data-accept");
    if (acc) {
      Store.setRequest(acc, { status: "completed", acceptedAt: Date.now() });
      M.partiesOf(M.request(acc), Session.user().id).forEach(function (id) {
        Store.notify({ to: id, type: "accepted", ref: acc });
      });
      App.toast(I18N.t("accept.done"), "check");
      return;
    }

    var rev = hit("data-revise");
    if (rev) { revising = rev; arguing = null; App.rerender(); return; }

    var arg = hit("data-argue");
    if (arg) { arguing = arg; revising = null; App.rerender(); return; }

    if (t.closest("[data-argue-cancel]")) { arguing = revising = null; App.rerender(); return; }

    var rs = hit("data-revise-send");
    if (rs) {
      var rbody = $("[data-argue-body]", host);
      var rwhat = rbody ? rbody.value.trim() : "";
      if (!rwhat) { App.toast(I18N.t("accept.reviseNeed"), "alert"); return; }
      // Back into the lawyer's hands, and the window starts again from the
      // next delivery — not from the first one.
      Store.setRequest(rs, {
        status: "in_progress", deliveredAt: null,
        revisions: (M.requestState(M.request(rs)).revisions || 0) + 1,
        revisionNote: rwhat
      });
      Store.notify({ to: M.request(rs).lawyerId, type: "revision", ref: rs });
      revising = null;
      App.toast(I18N.t("accept.reviseDone"), "check");
      return;
    }

    var as2 = hit("data-argue-send");
    if (as2) {
      var abody = $("[data-argue-body]", host);
      var why = abody ? abody.value.trim() : "";
      if (!why) { App.toast(I18N.t("accept.disputeNeed"), "alert"); return; }
      Store.openDispute({ requestId: as2, byId: Session.user().id, reason: why });
      // Everyone who has money or work in this, plus whoever has to decide it.
      M.partiesOf(M.request(as2), Session.user().id)
        .concat(M.users().filter(function (u) { return u.roles.indexOf("staff") !== -1; })
                         .map(function (u) { return u.id; }))
        .forEach(function (id) { Store.notify({ to: id, type: "disputed", ref: as2 }); });
      arguing = null;
      App.toast(I18N.t("accept.disputeSent"), "alert");
      return;
    }

    /* --- lawyer --- */
    var gen = t.closest("[data-gen]");
    if (gen) {
      var gid = gen.getAttribute("data-gen");
      gen.disabled = true;
      gen.textContent = I18N.t("ai.generating");
      setTimeout(function () {
        open = gid;
        Store.setRequest(gid, { status: "drafted" });
        App.toast(I18N.t("ai.generated"), "sparkle");
      }, 700);
      return;
    }

    var op = hit("data-open");
    if (op) { open = op; App.rerender(); return; }
    if (t.closest("[data-draft-close]")) { open = null; App.rerender(); return; }

    var ap = hit("data-approve");
    if (ap) {
      var body = $("[data-draft-body]", host);
      Store.setRequest(ap, { status: "delivered", body: body ? body.value : null });
      Store.notify({ to: M.request(ap).clientId, type: "delivered", ref: ap });
      open = null;
      App.toast(I18N.t("inbox.completed"), "check");
      return;
    }

    var dl = hit("data-deliver");
    if (dl) {
      Store.setRequest(dl, { status: "delivered" });
      Store.notify({ to: M.request(dl).clientId, type: "delivered", ref: dl });
      App.toast(I18N.t("inbox.completed"), "check"); return;
    }

    var as = t.closest("[data-assign]");
    if (as) { openAssign(as.getAttribute("data-assign"), as.parentNode); return; }

    var bc = hit("data-broadcast");
    if (bc) {
      open = null;
      Store.clearApplicants(bc);
      Store.setRequest(bc, { assignedTo: null, status: "open_to_interns", internShare: readShare() });
      M.interns().forEach(function (u) {
        if (u.status === "verified") Store.notify({ to: u.id, type: "opened", ref: bc });
      });
      App.toast(I18N.t("inbox.broadcastDone"), "gavel");
      return;
    }

    var pick = t.closest("[data-pick-intern]");
    if (pick) {
      var who = M.user(pick.getAttribute("data-pick-intern"));
      var forId = pick.getAttribute("data-for");
      var share = readShare();
      open = null;
      Store.clearApplicants(forId);
      Store.setRequest(forId, share == null
        ? { assignedTo: who.id, status: "with_intern" }
        : { assignedTo: who.id, status: "with_intern", internShare: share });
      Store.notify({ to: who.id, type: "routed", ref: forId });
      App.toast(I18N.t("inbox.assignDone", { name: tx(who.name) }), "graduation");
      return;
    }

    var un = hit("data-unassign");
    if (un) {
      Store.clearApplicants(un);
      Store.setRequest(un, { assignedTo: null, status: "new" });
      App.toast(I18N.t("inbox.unassigned"), "arrow-back");
      return;
    }

    /* --- intern --- */
    var ap2 = hit("data-apply");
    if (ap2) {
      Store.apply(ap2, Session.user().id);
      App.toast(I18N.t("task.appliedToast"), "send");
      return;
    }

    var to = hit("data-task-open");
    if (to) {
      open = open === to ? null : to;
      if (M.requestState(M.request(to)).status === "with_intern") {
        Store.setRequest(to, { status: "in_progress" });
        App.toast(I18N.t("task.started"), "check");
      } else App.rerender();
      return;
    }

    var ts = hit("data-task-save");
    if (ts) {
      var tb = $("[data-task-body]", host);
      Store.setRequest(ts, { body: tb ? tb.value : "" });
      App.toast(I18N.t("task.saved"), "check");
      return;
    }

    var td = hit("data-task-deliver");
    if (td) {
      var tb2 = $("[data-task-body]", host);
      open = null;
      Store.setRequest(td, { status: "delivered", body: tb2 ? tb2.value : "" });
      App.toast(I18N.t("task.delivered"), "send");
      return;
    }

    var pop = $(".assign-pop");
    if (pop && !t.closest(".assign-pop")) pop.remove();
  });
});

/* ==========================================================================
   Services — a marketplace, a price list, or a skills sheet.

     client : every service every verified lawyer offers, filterable, orderable.
     lawyer : the same list narrowed to their own, with the price control —
              free to set, bounded by the band the platform publishes.
     intern : no services at all. A trainee lists skills instead, which is why
              the navigation slot is renamed rather than reused.
   ========================================================================== */
Pages.define("services", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-services]");
  if (!host) return;

  var filters = { type: "", specialty: "", sort: "price" };
  var skills = null;    // trainee's working copy, loaded on first draw
  var draft = {};       // the service being written
  var editing = null;   // the service being changed, if any
  var ordering = {};    // serviceId -> the channel the client has picked

  /* ====================================================== client ==========
     Two ways in, stated up front. Either the client names the service and the
     lawyers who offer it line up by price, or they describe the case once and
     let the lawyers come to them — that second road is the auction. */
  function routeCards() {
    return '<div class="grid grid-2" style="margin-bottom:var(--s-10)">' +
      '<div class="card card--pad card--rule-navy feature">' +
        '<span class="feature__icon">' + Icons.svg("tag", "icon-lg") + "</span>" +
        '<h2 class="subtitle" data-i18n="svc.routePick"></h2>' +
        '<p class="small muted" data-i18n="svc.routePickBody"></p></div>' +
      '<a class="card card--pad card--hover card--rule-gold feature" href="quotes.html">' +
        '<span class="feature__icon">' + Icons.svg("gavel", "icon-lg") + "</span>" +
        '<h2 class="subtitle" data-i18n="svc.routeAuction"></h2>' +
        '<p class="small muted" data-i18n="svc.routeAuctionBody"></p></a>' +
    "</div>";
  }

  /** Everyone who offers one service type, cheapest first by default. */
  function offersOfType(typeId) {
    var out = [];
    M.listedLawyers().forEach(function (u) {
      M.servicesOf(u.id).forEach(function (svc) {
        if (svc.typeId !== typeId) return;
        if (filters.specialty && (u.specialties || []).indexOf(filters.specialty) === -1) return;
        out.push({ svc: svc, owner: u });
      });
    });
    return out.sort(function (a, b) {
      return filters.sort === "rating"
        ? M.ratingOf(b.owner.id).avg - M.ratingOf(a.owner.id).avg
        : a.svc.price - b.svc.price;
    });
  }

  function countFor(typeId) {
    return M.listedLawyers().filter(function (u) {
      return M.servicesOf(u.id).some(function (s) { return s.typeId === typeId; });
    }).length;
  }

  function cheapestFor(typeId) {
    var all = [];
    M.listedLawyers().forEach(function (u) {
      M.servicesOf(u.id).forEach(function (s) { if (s.typeId === typeId) all.push(s.price); });
    });
    return all.length ? Math.min.apply(null, all) : null;
  }

  /* --- step one: which service --- */
  function typePicker() {
    return '<h2 class="title" style="margin-bottom:var(--s-5)" data-i18n="svc.pickType"></h2>' +
      '<div class="grid grid-3">' + M.serviceTypes().map(function (t) {
        var from = cheapestFor(t.id);
        return '<button type="button" class="card card--pad card--hover feature" ' +
          'data-pick-type="' + esc(t.id) + '" style="text-align:start">' +
          '<span class="feature__icon">' + Icons.svg(t.icon, "icon-lg") + "</span>" +
          '<h3 class="subtitle">' + esc(tx(t.title)) + "</h3>" +
          '<p class="small muted">' + esc(tx(t.meta)) + "</p>" +
          '<p class="small" style="margin-top:auto;padding-top:var(--s-3)">' +
            (from !== null
              ? esc(I18N.t("svc.fromPrice")) + ' <strong class="num">' + I18N.num(from) + "</strong> " +
                esc(I18N.t("common.sar")) + ' <span class="dot"></span> <span class="muted">' +
                esc(I18N.t("svc.offeredBy", { n: I18N.num(countFor(t.id)) })) + "</span>"
              : '<span class="muted">' + esc(I18N.t("svc.noneForType")) + "</span>") +
          "</p></button>";
      }).join("") + "</div>";
  }

  /* --- step two: who offers it --- */
  function lawyersForType() {
    var type = M.serviceType(filters.type);
    var list = offersOfType(filters.type);

    return '<div class="row between wrap gap-4" style="margin-bottom:var(--s-6)">' +
        '<h2 class="title">' + esc(I18N.t("svc.lawyersFor", { name: tx(type.title) })) + "</h2>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-clear-type>' +
          Icons.svg("arrow-back", "icon-sm") + esc(I18N.t("svc.changeType")) + "</button>" +
      "</div>" +

      '<div class="results-bar">' +
        '<div class="row gap-3 wrap">' +
          '<label class="field"><span class="label" data-i18n="dir.specialties"></span>' +
            select("specialty", global.SEED.specialties.map(function (sp) {
              return { id: sp.id, label: tx(sp) };
            }), filters.specialty, "dir.anySpecialty") + "</label>" +
          '<label class="field"><span class="label" data-i18n="dir.sortBy"></span>' +
            select("sort", [{ id: "price", label: I18N.t("svc.sortPrice") },
                            { id: "rating", label: I18N.t("svc.sortRating") }], filters.sort) + "</label>" +
        "</div>" +
        '<p class="small muted">' + esc(I18N.t("svc.found", { n: I18N.num(list.length) })) + "</p>" +
      "</div>" +

      (list.length
        ? '<div class="grid grid-2" style="margin-top:var(--s-6)">' +
          list.map(function (o, i) { return offerCard(o, type, i === 0 && filters.sort === "price"); }).join("") +
          "</div>"
        : C.empty("tag", "svc.noneForType"));
  }

  function clientView() {
    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="svc.routeTitle"></h1>' +
        '<p class="lead" data-i18n="svc.routeLead"></p></header>' +
      routeCards() +
      (filters.type ? lawyersForType() : typePicker()) +
    "</div>";
  }

  function select(name, items, value, anyKey) {
    return '<select class="select" data-filter="' + name + '">' +
      (anyKey ? '<option value="">' + esc(I18N.t(anyKey)) + "</option>" : "") +
      items.map(function (o) {
        return '<option value="' + esc(o.id) + '"' + (o.id === value ? " selected" : "") + ">" +
          esc(o.label) + "</option>";
      }).join("") + "</select>";
  }

  function offerCard(o, type, best) {
    var named = M.serviceTitle(o.svc);
    return '<article class="card card--pad card--hover' + (best ? " card--rule-gold" : "") + '">' +
      '<div class="row between wrap gap-3">' +
        '<span class="row gap-3">' + C.avatar(o.owner, "sm") +
          "<span>" + C.personLink(o.owner) +
            '<p class="tiny muted">' + esc(tx(named)) + "</p></span></span>" +
        '<strong class="title"><span class="num">' + I18N.num(o.svc.price) + "</span> " +
          esc(I18N.t("common.sar")) + "</strong>" +
      "</div>" +
      '<div class="meta-row" style="margin-top:var(--s-4)">' + C.ratingLine(o.owner.id) +
        '<span class="dot"></span><span class="muted">' +
          esc(I18N.t("lawyer.years", { n: I18N.num(o.owner.years || 0) })) + "</span>" +
        (best ? '<span class="dot"></span><span class="tag">' +
          esc(I18N.t("quotes.bestPrice")) + "</span>" : "") +
      "</div>" +
      '<div style="margin-top:var(--s-4)">' +
        '<span class="tiny muted" data-i18n="svc.pickChannel"></span>' +
        '<div class="row gap-2 wrap" style="margin-top:var(--s-2)">' +
          M.serviceChannels(o.svc).map(function (id, i) {
            var c = M.channel(id);
            var on = (ordering[o.svc.id] || M.serviceChannels(o.svc)[0]) === id;
            return '<button type="button" class="chip' + (on ? " is-active" : "") +
              '" data-order-channel="' + esc(id) + '" data-svc="' + esc(o.svc.id) + '">' +
              Icons.svg(c.icon, "icon-sm") + esc(tx(c.title)) + "</button>";
          }).join("") +
        "</div></div>" +
      '<div class="row between wrap gap-3" style="margin-top:var(--s-5);padding-top:var(--s-4);' +
        'border-top:1px solid var(--border)">' +
        '<span class="tiny muted">' + esc(tx(M.serviceMeta(o.svc))) + "</span>" +
        '<button class="btn btn--primary btn--sm" type="button" data-order="' + esc(o.svc.id) + '" ' +
          'data-i18n="req.order"></button>' +
      "</div></article>";
  }

  /* ====================================================== lawyer ==========
     The lawyer writes the service themselves — its name and its turnaround.
     The category behind it is not a label, it is the price band: whatever they
     charge has to sit between the platform's floor and ceiling for that kind
     of work, which is what stops both undercutting and gouging. */
  /** The channels the lawyer is offering on the service being written. Starts
      from whatever the category allows, so the common case needs no clicks. */
  function draftChannels(cat) {
    if (!draft.channels) draft.channels = M.channelsFor(cat).slice();
    return draft.channels.filter(function (c) {
      return M.channelsFor(cat).indexOf(c) !== -1;
    });
  }

  function channelPicker(cat) {
    var on = draftChannels(cat);
    return '<div class="field"><span class="label" data-i18n="svc.channels"></span>' +
      '<div class="row gap-2 wrap" style="margin-top:var(--s-2)">' +
        M.channelsFor(cat).map(function (id) {
          var c = M.channel(id);
          return '<button type="button" class="chip' +
            (on.indexOf(id) !== -1 ? " is-active" : "") + '" data-channel="' + esc(id) + '">' +
            Icons.svg(c.icon, "icon-sm") + esc(tx(c.title)) + "</button>";
        }).join("") +
      "</div>" +
      '<span class="tiny faint" data-i18n="svc.channelsHint"></span></div>';
  }

  function lawyerView() {
    var me = Session.user();
    var mine = M.servicesOf(me.id);
    var types = M.serviceTypes();
    var cat = editing ? editing.typeId : (draft.typeId || types[0].id);
    var band = M.priceBand(cat);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="svc.mine"></h1>' +
        '<p class="lead" data-i18n="svc.mineLead"></p></header>' +
      (Session.isVerified() ? "" :
        '<p class="note-inline" style="margin-bottom:var(--s-6)" data-i18n="svc.pendingNote"></p>') +

      '<div class="grid dash-split">' +
        '<section class="card card--pad">' +
          (mine.length
            ? '<div class="req-list">' + mine.map(myServiceRow).join("") + "</div>"
            : '<p class="small muted" data-i18n="svc.noneMine"></p>') +
        "</section>" +

        '<aside class="stack gap-4">' +
        '<section class="card card--pad">' +
          '<label class="row between gap-3">' +
            '<span><strong data-i18n="svc.autoBid"></strong>' +
              '<span class="tiny muted" style="display:block" data-i18n="svc.autoBidHint"></span></span>' +
            '<input type="checkbox" data-auto-bid' + (me.autoBid ? " checked" : "") + "></label>" +
          '<p class="tiny ' + (me.autoBid ? "" : "muted") + '" style="margin-top:var(--s-3)" data-i18n="' +
            (me.autoBid ? "svc.autoBidOn" : "svc.autoBidOff") + '"></p>' +
          // Switching it on is not enough on its own: the database only bids
          // on behalf of an account whose licence has been checked. Saying so
          // here beats a lawyer watching a board that will never call them.
          (me.autoBid && me.status !== "verified"
            ? '<p class="note-inline" style="margin-top:var(--s-3)" data-i18n="svc.autoNeedsApproval"></p>'
            : "") +
        "</section>" +
        '<section class="card card--pad">' +
          '<h2 class="subtitle" data-i18n="' + (editing ? "svc.editTitle" : "svc.addTitle") + '"></h2>' +
          '<div class="stack gap-4" style="margin-top:var(--s-5)">' +
            '<label class="field"><span class="label" data-i18n="svc.category"></span>' +
              '<select class="select" data-new-type>' + types.map(function (t) {
                return '<option value="' + esc(t.id) + '"' + (cat === t.id ? " selected" : "") + ">" +
                  esc(tx(t.title)) + "</option>";
              }).join("") + "</select>" +
              '<span class="tiny faint" data-i18n="svc.categoryHint"></span></label>' +

            '<label class="field"><span class="label" data-i18n="svc.customTitle"></span>' +
              '<input class="input" data-new-title value="' + esc(draft.title || "") + '" ' +
                'placeholder="' + esc(tx(M.serviceType(cat).title)) + '">' +
              '<span class="tiny faint" data-i18n="svc.customTitleHint"></span></label>' +

            '<label class="field"><span class="label" data-i18n="svc.customMeta"></span>' +
              '<input class="input" data-new-meta value="' + esc(draft.meta || "") + '" ' +
                'placeholder="' + esc(tx(M.serviceType(cat).meta)) + '"></label>' +

            '<label class="field"><span class="label" data-i18n="svc.priceLabel"></span>' +
              '<input class="input num" type="number" data-new-price dir="ltr" ' +
                'min="' + band.min + '" max="' + band.max + '" ' +
                'value="' + (draft.price != null ? draft.price : "") + '"></label>' +
            channelPicker(cat) +
            '<p class="tiny muted" data-band></p>' +
            '<p class="form-error" data-svc-error hidden></p>' +
            '<div class="row gap-2">' +
              '<button class="btn btn--primary" type="button" data-add-svc data-i18n="' +
                (editing ? "svc.saveChanges" : "svc.add") + '"></button>' +
              (editing ? '<button class="btn btn--ghost" type="button" data-cancel-edit ' +
                'data-i18n="signup.back"></button>' : "") +
            "</div>" +
          "</div>" +
        "</section></aside>" +
      "</div></div>";
  }

  function myServiceRow(s) {
    var band = M.priceBand(s.typeId);
    var type = M.serviceType(s.typeId) || {};
    var name = tx(M.serviceTitle(s));
    var category = tx(type.title || {});
    return '<div class="req-row">' +
      '<span class="req-row__icon">' + Icons.svg(M.serviceIcon(s), "icon-sm") + "</span>" +
      '<div class="grow" style="min-width:0">' +
        '<div class="row gap-2 wrap"><strong class="small">' + esc(name) + "</strong>" +
          // The category tag only earns its place when it says something new.
          (name === category ? "" : '<span class="tag">' + esc(category) + "</span>") + "</div>" +
        '<p class="tiny muted">' + esc(tx(M.serviceMeta(s))) + "</p>" +
        '<p class="tiny faint">' + esc(I18N.t("svc.band",
          { min: I18N.num(band.min), max: I18N.num(band.max) })) + "</p>" +
      "</div>" +
      '<div class="req-row__side"><div class="row gap-2">' +
        '<strong class="small"><span class="num">' + I18N.num(s.price) + "</span> " +
          esc(I18N.t("common.sar")) + "</strong>" +
        '<button class="icon-btn" type="button" data-edit-svc="' + esc(s.id) + '" ' +
          'data-i18n-attr="aria-label:svc.editTitle">' + Icons.svg("edit", "icon-sm") + "</button>" +
        '<button class="icon-btn" type="button" data-del-svc="' + esc(s.id) + '" ' +
          'data-i18n-attr="aria-label:svc.remove">' + Icons.svg("trash", "icon-sm") + "</button>" +
      "</div></div></div>";
  }

  /* ====================================================== intern ========== */
  function internView() {
    var me = Session.user();
    if (skills === null) skills = (me.skills || []).map(function (s) { return tx(s); });

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20);max-width:760px">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="skills.heading"></h1>' +
        '<p class="lead" data-i18n="skills.lead"></p></header>' +
      '<section class="card card--pad">' +
        '<div class="chip-input">' +
          '<input class="input" data-skill-input data-i18n-attr="placeholder:skills.placeholder">' +
          '<button class="btn btn--outline btn--sm" type="button" data-skill-add data-i18n="svc.add"></button>' +
        "</div>" +
        '<div class="row gap-2 wrap" style="margin-top:var(--s-5)">' +
          (skills.length
            ? skills.map(function (sk, i) {
                return '<span class="chip is-active">' + esc(sk) +
                  '<button type="button" data-skill-del="' + i + '" aria-label="x">' +
                  Icons.svg("close", "icon-sm") + "</button></span>";
              }).join("")
            : '<span class="tiny faint" data-i18n="skills.none"></span>') +
        "</div>" +
        '<button class="btn btn--primary" type="button" style="margin-top:var(--s-6)" ' +
          'data-skill-save data-i18n="skills.save"></button>' +
      "</section></div>";
  }

  /* ====================================================== draw ============ */
  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = role === "lawyer" ? lawyerView()
                   : role === "intern" ? internView()
                   : clientView();
    I18N.apply(host);
    showBand();
  });

  function showBand() {
    var sel = $("[data-new-type]", host), out = $("[data-band]", host);
    if (!sel || !out) return;
    var band = M.priceBand(sel.value);
    out.textContent = I18N.t("svc.band", { min: I18N.num(band.min), max: I18N.num(band.max) });
  }

  function readForm() {
    var g = function (sel) { var el = $(sel, host); return el ? el.value.trim() : ""; };
    return {
      typeId: g("[data-new-type]"),
      title: g("[data-new-title]"),
      meta: g("[data-new-meta]"),
      price: +g("[data-new-price]")
    };
  }

  function svcError(key) {
    var el = $("[data-svc-error]", host);
    if (!el) return;
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  /* ====================================================== events ========== */
  host.addEventListener("change", function (ev) {
    var f = ev.target.closest("[data-filter]");
    if (f) { filters[f.getAttribute("data-filter")] = f.value; App.rerender(); return; }
    if (ev.target.closest("[data-auto-bid]")) {
      Store.updateAccount(Session.user().id, { autoBid: !!ev.target.checked });
      App.toast(I18N.t(ev.target.checked ? "svc.autoBidOn" : "svc.autoBidOff"), "check");
      return;
    }
    if (ev.target.closest("[data-new-type]")) {
      var keep = draft.channels;
      draft = readForm();
      // A category change resets the channels to whatever the new one allows,
      // rather than carrying over a choice that may no longer be permitted.
      draft.channels = null;
      showBand();
      App.rerender();
      return;
    }

    // Editing a live price in place: validated against the band, saved at once.
    var pf = ev.target.closest("[data-price-for]");
    if (pf) {
