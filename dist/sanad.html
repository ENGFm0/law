                    esc(I18N.t("common.sar")) + "</strong>" +
                  '<div class="inbox-row__actions">' + lawyerActions(r) + "</div>" +
                "</div></div>" +
              (open === r.id
                ? (M.requestState(r).status === "open_to_interns" && !M.requestState(r).assignedTo
                    ? applicantsPanel(r)
                    : draftPanel(r))
                : "") + "</div>";
          }).join("")
        : '<p class="muted center" style="padding:var(--s-8)">' + esc(I18N.t("inbox.empty")) + "</p>") +
    "</div>";
  }

  /** Who put their hand up for an opened task, and the button that ends it. */
  function applicantsPanel(r) {
    var ids = Store.applicants(r.id);
    return '<section class="panel" style="margin:var(--s-2) 0 var(--s-5)">' +
      '<div class="panel__head row between wrap gap-3">' +
        '<h2 class="subtitle">' + esc(I18N.t("inbox.applicants")) + " — " + esc(tx(r.title)) + "</h2>" +
        '<button class="icon-btn" type="button" data-draft-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<div style="padding:var(--s-5)">' +
        (ids.length
          ? '<div class="req-list">' + ids.map(function (id) {
              var u = M.user(id);
              if (!u) return "";
              var prog = M.certProgress(u.id);
              return '<div class="req-row">' +
                '<span class="req-row__icon">' + C.avatar(u, "sm") + "</span>" +
                '<div class="grow" style="min-width:0">' + C.personLink(u) +
                  '<p class="tiny muted">' + esc(tx(u.university || {})) + ' <span class="dot"></span> ' +
                    esc(I18N.t("cert.hoursShort", { n: I18N.num(prog.hours) })) + "</p>" +
                  '<div class="row gap-2 wrap" style="margin-top:var(--s-2)">' +
                    (u.skills || []).slice(0, 3).map(function (sk) {
                      return '<span class="tag">' + esc(tx(sk)) + "</span>";
                    }).join("") + "</div></div>" +
                '<div class="req-row__side">' + C.ratingLine(u.id) +
                  '<button class="btn btn--accent btn--sm" type="button" ' +
                    'data-pick-intern="' + esc(u.id) + '" data-for="' + esc(r.id) + '">' +
                    esc(I18N.t("inbox.pickApplicant")) + "</button></div></div>";
            }).join("") + "</div>"
          : '<p class="small muted">' + esc(I18N.t("inbox.noApplicants")) + "</p>") +
      "</div></section>";
  }

  /** The drafting surface. The assistant's text lands here and nowhere else. */
  function draftPanel(r) {
    var st = M.requestState(r);
    var t = M.serviceType(r.typeId) || {};
    var client = M.user(r.clientId);
    var body = st.body || (r.doc && global.SEED.draftBodies[r.doc] ? tx(global.SEED.draftBodies[r.doc]) : "");

    return '<section class="panel" style="margin:var(--s-2) 0 var(--s-5)">' +
      '<div class="panel__head row between wrap gap-3">' +
        "<div><h2 class=\"subtitle\">" + esc(tx(r.title)) + "</h2>" +
          '<p class="tiny muted">' + esc(client ? tx(client.name) : "") + ' <span class="dot"></span> ' +
            esc(tx(t.title || {})) +
            (r.ai ? ' <span class="dot"></span> ' + esc(I18N.t("ai.aiSource")) : "") + "</p></div>" +
        '<button class="icon-btn" type="button" data-draft-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      (r.ai ? '<p class="disclaimer" style="border-top:0">' + Icons.svg("lock", "icon-sm") +
        "<span>" + esc(I18N.t("inbox.aiHidden")) + "</span></p>" : "") +
      '<textarea class="draft-text" data-draft-body spellcheck="false">' + esc(body) + "</textarea>" +
      '<div class="draft-foot">' +
        '<div><span class="tiny muted">' + esc(I18N.t("inbox.revenue")) + "</span>" +
          '<strong style="display:block;color:var(--accent)"><span class="num">' +
            I18N.num(r.price) + "</span> " + esc(I18N.t("common.sar")) + "</strong></div>" +
        '<span class="grow"></span>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-assign="' + esc(r.id) + '">' +
          Icons.svg("graduation", "icon-sm") + esc(I18N.t("inbox.assign")) + "</button>" +
        '<button class="btn btn--accent" type="button" data-approve="' + esc(r.id) + '">' +
          Icons.svg("check", "icon-sm") + esc(I18N.t("ai.approve")) + "</button>" +
      "</div></section>";
  }

  /** Two ways to hand work down: name someone, or let them compete for it.
      Three names is not worth a modal, so this is an inline chooser. */
  function openAssign(id, anchor) {
    var existing = $(".assign-pop");
    if (existing) existing.remove();
    var pop = document.createElement("div");
    pop.className = "assign-pop";
    var me = Session.user();
    var r = M.request(id);
    pop.innerHTML =
      '<label class="field" style="padding:0 var(--s-2) var(--s-2)">' +
        '<span class="tiny muted">' + esc(I18N.t("pay.shareLabel")) + "</span>" +
        '<span class="tiny faint">' + esc(I18N.t("pay.shareFloor",
          { n: I18N.num(M.MIN_SHARE) })) + "</span>" +
        '<input class="input num" type="number" min="' + M.MIN_SHARE + '" max="100" step="5" ' +
          'dir="ltr" data-share value="' + M.DEFAULT_SHARE + '"></label>' +
      '<p class="tiny faint" style="padding:0 var(--s-2) var(--s-3)">' +
        esc(I18N.t("pay.shareHint")) + "</p>" +
      '<hr class="divider" style="margin:0 0 var(--s-2)">' +
      '<p class="tiny muted">' + esc(I18N.t("inbox.pickOne")) + "</p>" +
      M.interns().map(function (i) {
        // A standing agreement already settles the terms, so say so here.
        var deal = M.agreementFor(me.id, i.id);
        return '<button type="button" data-pick-intern="' + esc(i.id) + '" data-for="' + esc(id) + '">' +
          '<img class="avatar avatar--sm" alt="" width="28" height="28" src="' +
            App.avatarOf(i.name, i.id) + '">' +
          "<span>" + esc(tx(i.name)) +
            (deal ? '<span class="tiny muted" style="display:block">' +
              esc(I18N.t("pay.underAgreement", { kind: I18N.t("pay.kind" +
                deal.kind.charAt(0).toUpperCase() + deal.kind.slice(1)) })) + "</span>" : "") +
          "</span>" +
          '<span class="tiny muted num">' + I18N.num(M.hoursOf(i.id)) + "</span></button>";
      }).join("") +
      '<hr class="divider" style="margin:var(--s-2) 0">' +
      '<button type="button" data-broadcast="' + esc(id) + '">' +
        '<span class="stat__icon" style="width:28px;height:28px">' +
          Icons.svg("gavel", "icon-sm") + "</span>" +
        "<span><strong>" + esc(I18N.t("inbox.openToAll")) + "</strong>" +
        '<span class="tiny muted" style="display:block">' +
          esc(I18N.t("inbox.openToAllHint")) + "</span></span></button>";
    anchor.appendChild(pop);
  }

  /* ====================================================== intern ========== */
  function internView() {
    var me = Session.user();
    var mine = M.requestsForIntern(me.id);
    var pool = M.openInternTasks();

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="task.heading"></h1>' +
        '<p class="lead" data-i18n="task.lead"></p></header>' +
      (mine.length
        ? mine.map(internRow).join("")
        : C.empty("inbox", "task.none")) +

      '<section style="margin-top:var(--s-12)">' +
        '<h2 class="headline" data-i18n="task.openPool"></h2>' +
        '<p class="lead" style="margin-bottom:var(--s-6)" data-i18n="task.openPoolLead"></p>' +
        (pool.length
          ? pool.map(function (r) { return openTaskRow(r, me); }).join("")
          : C.empty("gavel", "task.noOpen")) +
      "</section></div>";
  }

  /** An opened task: every trainee sees it, applies, and the lawyer picks. */
  function openTaskRow(r, me) {
    var lawyer = M.user(r.lawyerId);
    var t = M.serviceType(r.typeId) || {};
    var applicants = Store.applicants(r.id);
    var applied = applicants.indexOf(me.id) !== -1;

    return '<article class="card card--pad card--rule-gold" style="margin-bottom:var(--s-4)">' +
      '<div class="row between wrap gap-4">' +
        '<div class="grow" style="min-width:0">' +
          '<div class="row gap-2 wrap"><h3 class="subtitle">' + esc(tx(r.title)) + "</h3>" +
            '<span class="tag">' + esc(tx(t.title || {})) + "</span></div>" +
          '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(r.brief)) + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-3)">' +
            '<span class="row gap-2">' + Icons.svg("scale", "icon-sm") +
              '<span class="tiny muted">' + esc(I18N.t("task.supervisor")) + ":</span> " +
              (lawyer ? C.personLink(lawyer) : "") + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' + esc(I18N.t("task.hoursWorth", { n: I18N.num(r.hours || 4) })) + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' +
              esc(I18N.t("task.competing", { n: I18N.num(applicants.length) })) + "</span>" +
          "</div>" +
        "</div>" +
        (applied
          ? '<span class="status status--ok">' + esc(I18N.t("task.applied")) + "</span>"
          : '<button class="btn btn--accent btn--sm" type="button" data-apply="' + esc(r.id) + '">' +
            Icons.svg("send", "icon-sm") + esc(I18N.t("task.apply")) + "</button>") +
      "</div></article>";
  }

  function internRow(r) {
    var st = M.requestState(r);
    var lawyer = M.user(r.lawyerId);
    var t = M.serviceType(r.typeId) || {};
    var done = st.status === "delivered" || st.status === "completed";

    return '<article class="card card--pad" style="margin-bottom:var(--s-4)">' +
      '<div class="row between wrap gap-4">' +
        '<div class="grow" style="min-width:0">' +
          '<div class="row gap-2 wrap"><h2 class="subtitle">' + esc(tx(r.title)) + "</h2>" +
            '<span class="tag">' + esc(tx(t.title || {})) + "</span>" + C.statusPill(st.status) + "</div>" +
          '<p class="small muted" style="margin-top:var(--s-2)">' + esc(tx(r.brief)) + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-3)">' +
            '<span class="row gap-2">' + Icons.svg("scale", "icon-sm") +
              '<span class="tiny muted">' + esc(I18N.t("task.supervisor")) + ":</span> " +
              (lawyer ? C.personLink(lawyer) : "") + "</span>" +
            '<span class="dot"></span>' +
            '<span class="tiny muted">' + esc(I18N.t("task.hoursWorth", { n: I18N.num(r.hours || 4) })) + "</span>" +
            '<span class="dot"></span>' + payLine(r, "pay.yourShare") +
          "</div>" +
        "</div>" +
        '<div class="row gap-2 wrap">' +
          (done ? ""
            : '<button class="btn btn--outline btn--sm" type="button" data-task-open="' + esc(r.id) + '">' +
              esc(I18N.t(st.status === "in_progress" ? "req.openDetails" : "task.start")) + "</button>") +
        "</div>" +
      "</div>" +
      (open === r.id && !done
        ? '<div style="margin-top:var(--s-5)">' +
            '<textarea class="draft-text" data-task-body spellcheck="false" ' +
              'data-i18n-attr="placeholder:task.writeHere">' + esc(st.body || "") + "</textarea>" +
            '<div class="row gap-2" style="margin-top:var(--s-3)">' +
              '<button class="btn btn--ghost btn--sm" type="button" data-task-save="' + esc(r.id) + '" ' +
                'data-i18n="dash.saveDraft"></button>' +
              '<button class="btn btn--accent btn--sm" type="button" data-task-deliver="' + esc(r.id) + '">' +
                Icons.svg("send", "icon-sm") + esc(I18N.t("task.deliver")) + "</button></div></div>"
        : "") +
    "</article>";
  }

  /** The share typed into the routing chooser, if it is open. */
  function readShare() {
    var el = $("[data-share]", host);
    return el ? M.clampShare(+el.value) : null;
  }

  /** One line saying what this task pays, for whoever is entitled to see it. */
  function payLine(r, labelKey) {
    var pay = M.taskPay(r);
    if (!pay) return "";
    if (pay.kind === "share") {
      return '<span class="tiny muted">' + esc(I18N.t(labelKey)) + ": </span>" +
        '<strong class="tiny" style="color:var(--accent)"><span class="num">' +
          I18N.num(pay.amount) + "</span> " + esc(I18N.t("common.sar")) + "</strong>" +
        '<span class="tiny faint"> (' + esc(I18N.t("pay.ofPrice",
          { pct: I18N.num(pay.pct), price: I18N.num(r.price || 0) })) + ")</span>";
    }
    var kindKey = "pay.kind" + pay.kind.charAt(0).toUpperCase() + pay.kind.slice(1);
    return '<span class="tag">' +
      esc(I18N.t("pay.underAgreement", { kind: I18N.t(kindKey) })) + "</span>";
  }

  /* ====================================================== draw ============ */
  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = Session.isGuest() ? guest()
                   : role === "lawyer" ? lawyerView()
                   : role === "intern" ? internView()
                   : clientView();
    I18N.apply(host);
  });

  /* ====================================================== events ========== */
  host.addEventListener("click", function (ev) {
    var t = ev.target;
    var hit = function (attr) {
      var el = t.closest("[" + attr + "]");
      return el ? el.getAttribute(attr) : null;
    };

    var f = t.closest("[data-filter]");
    if (f) { filter = f.getAttribute("data-filter"); App.rerender(); return; }

    /* --- client --- */
    var det = hit("data-detail");
    if (det) { open = open === det ? null : det; App.rerender(); return; }
    if (t.closest("[data-detail-close]")) { open = null; App.rerender(); return; }

    var rt = hit("data-rate");
    if (rt) { open = rt; rating[rt] = rating[rt] || 0; App.rerender(); return; }

    var star = t.closest("[data-star]");
    if (star) {
      rating[star.getAttribute("data-for")] = +star.getAttribute("data-star");
      App.rerender();
      return;
    }

    var send = hit("data-rate-send");
    if (send) {
      if (!rating[send]) { App.toast(I18N.t("rate.needStars"), "star"); return; }
      var r = M.request(send);
      var box = $("[data-rate-body]", host);
      Store.addReview({
        targetId: r.lawyerId, authorId: Session.user().id, requestId: r.id,
        rating: rating[send], date: { ar: I18N.t("common.today"), en: I18N.t("common.today") },
        body: { ar: box ? box.value : "", en: box ? box.value : "" }
      });
      Store.setRequest(r.id, { rated: true, status: "completed" });
      delete rating[send];
      open = null;
      App.toast(I18N.t("rate.done"), "check");
      return;
    }

    /* --- accepting, revising, refusing --- */
    var acc = hit("data-accept");
    if (acc) {
      Store.setRequest(acc, { status: "completed", acceptedAt: Date.now() });
      App.toast(I18N.t("accept.done"), "check");
      return;
    }

    var rev = hit("data-revise");
    if (rev) { revising = rev; arguing = null; App.rerender(); return; }

    var arg = hit("data-argue");
    if (arg) { arguing = arg; revising = null; App.rerender(); return; }

    if (t.closest("[data-argue-cancel]")) { arguing = revising = null; App.rerender(); return; }

    var rs = hit("data-revise-send");
    if (rs) {
      var rbody = $("[data-argue-body]", host);
      var rwhat = rbody ? rbody.value.trim() : "";
      if (!rwhat) { App.toast(I18N.t("accept.reviseNeed"), "alert"); return; }
      // Back into the lawyer's hands, and the window starts again from the
      // next delivery — not from the first one.
      Store.setRequest(rs, {
        status: "in_progress", deliveredAt: null,
        revisions: (M.requestState(M.request(rs)).revisions || 0) + 1,
        revisionNote: rwhat
      });
      revising = null;
      App.toast(I18N.t("accept.reviseDone"), "check");
      return;
    }

    var as2 = hit("data-argue-send");
    if (as2) {
      var abody = $("[data-argue-body]", host);
      var why = abody ? abody.value.trim() : "";
      if (!why) { App.toast(I18N.t("accept.disputeNeed"), "alert"); return; }
      Store.openDispute({ requestId: as2, byId: Session.user().id, reason: why });
      arguing = null;
      App.toast(I18N.t("accept.disputeSent"), "alert");
      return;
    }

    /* --- lawyer --- */
    var gen = t.closest("[data-gen]");
    if (gen) {
      var gid = gen.getAttribute("data-gen");
      gen.disabled = true;
      gen.textContent = I18N.t("ai.generating");
      setTimeout(function () {
        open = gid;
        Store.setRequest(gid, { status: "drafted" });
        App.toast(I18N.t("ai.generated"), "sparkle");
      }, 700);
      return;
    }

    var op = hit("data-open");
    if (op) { open = op; App.rerender(); return; }
    if (t.closest("[data-draft-close]")) { open = null; App.rerender(); return; }

    var ap = hit("data-approve");
    if (ap) {
      var body = $("[data-draft-body]", host);
      Store.setRequest(ap, { status: "delivered", body: body ? body.value : null });
      open = null;
      App.toast(I18N.t("inbox.completed"), "check");
      return;
    }

    var dl = hit("data-deliver");
    if (dl) { Store.setRequest(dl, { status: "delivered" }); App.toast(I18N.t("inbox.completed"), "check"); return; }

    var as = t.closest("[data-assign]");
    if (as) { openAssign(as.getAttribute("data-assign"), as.parentNode); return; }

    var bc = hit("data-broadcast");
    if (bc) {
      open = null;
      Store.clearApplicants(bc);
      Store.setRequest(bc, { assignedTo: null, status: "open_to_interns", internShare: readShare() });
      App.toast(I18N.t("inbox.broadcastDone"), "gavel");
      return;
    }

    var pick = t.closest("[data-pick-intern]");
    if (pick) {
      var who = M.user(pick.getAttribute("data-pick-intern"));
      var forId = pick.getAttribute("data-for");
      var share = readShare();
      open = null;
      Store.clearApplicants(forId);
      Store.setRequest(forId, share == null
        ? { assignedTo: who.id, status: "with_intern" }
        : { assignedTo: who.id, status: "with_intern", internShare: share });
      App.toast(I18N.t("inbox.assignDone", { name: tx(who.name) }), "graduation");
      return;
    }

    var un = hit("data-unassign");
    if (un) {
      Store.clearApplicants(un);
      Store.setRequest(un, { assignedTo: null, status: "new" });
      App.toast(I18N.t("inbox.unassigned"), "arrow-back");
      return;
    }

    /* --- intern --- */
    var ap2 = hit("data-apply");
    if (ap2) {
      Store.apply(ap2, Session.user().id);
      App.toast(I18N.t("task.appliedToast"), "send");
      return;
    }

    var to = hit("data-task-open");
    if (to) {
      open = open === to ? null : to;
      if (M.requestState(M.request(to)).status === "with_intern") {
        Store.setRequest(to, { status: "in_progress" });
        App.toast(I18N.t("task.started"), "check");
      } else App.rerender();
      return;
    }

    var ts = hit("data-task-save");
    if (ts) {
      var tb = $("[data-task-body]", host);
      Store.setRequest(ts, { body: tb ? tb.value : "" });
      App.toast(I18N.t("task.saved"), "check");
      return;
    }

    var td = hit("data-task-deliver");
    if (td) {
      var tb2 = $("[data-task-body]", host);
      open = null;
      Store.setRequest(td, { status: "delivered", body: tb2 ? tb2.value : "" });
      App.toast(I18N.t("task.delivered"), "send");
      return;
    }

    var pop = $(".assign-pop");
    if (pop && !t.closest(".assign-pop")) pop.remove();
  });
});

/* ==========================================================================
   Services — a marketplace, a price list, or a skills sheet.

     client : every service every verified lawyer offers, filterable, orderable.
     lawyer : the same list narrowed to their own, with the price control —
              free to set, bounded by the band the platform publishes.
     intern : no services at all. A trainee lists skills instead, which is why
              the navigation slot is renamed rather than reused.
   ========================================================================== */
Pages.define("services", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-services]");
  if (!host) return;

  var filters = { type: "", specialty: "", sort: "price" };
  var skills = null;    // trainee's working copy, loaded on first draw
  var draft = {};       // the service being written
  var editing = null;   // the service being changed, if any

  /* ====================================================== client ==========
     Two ways in, stated up front. Either the client names the service and the
     lawyers who offer it line up by price, or they describe the case once and
     let the lawyers come to them — that second road is the auction. */
  function routeCards() {
    return '<div class="grid grid-2" style="margin-bottom:var(--s-10)">' +
      '<div class="card card--pad card--rule-navy feature">' +
        '<span class="feature__icon">' + Icons.svg("tag", "icon-lg") + "</span>" +
        '<h2 class="subtitle" data-i18n="svc.routePick"></h2>' +
        '<p class="small muted" data-i18n="svc.routePickBody"></p></div>' +
      '<a class="card card--pad card--hover card--rule-gold feature" href="quotes.html">' +
        '<span class="feature__icon">' + Icons.svg("gavel", "icon-lg") + "</span>" +
        '<h2 class="subtitle" data-i18n="svc.routeAuction"></h2>' +
        '<p class="small muted" data-i18n="svc.routeAuctionBody"></p></a>' +
    "</div>";
  }

  /** Everyone who offers one service type, cheapest first by default. */
  function offersOfType(typeId) {
    var out = [];
    M.listedLawyers().forEach(function (u) {
      M.servicesOf(u.id).forEach(function (svc) {
        if (svc.typeId !== typeId) return;
        if (filters.specialty && (u.specialties || []).indexOf(filters.specialty) === -1) return;
        out.push({ svc: svc, owner: u });
      });
    });
    return out.sort(function (a, b) {
      return filters.sort === "rating"
        ? M.ratingOf(b.owner.id).avg - M.ratingOf(a.owner.id).avg
        : a.svc.price - b.svc.price;
    });
  }

  function countFor(typeId) {
    return M.listedLawyers().filter(function (u) {
      return M.servicesOf(u.id).some(function (s) { return s.typeId === typeId; });
    }).length;
  }

  function cheapestFor(typeId) {
    var all = [];
    M.listedLawyers().forEach(function (u) {
      M.servicesOf(u.id).forEach(function (s) { if (s.typeId === typeId) all.push(s.price); });
    });
    return all.length ? Math.min.apply(null, all) : null;
  }

  /* --- step one: which service --- */
  function typePicker() {
    return '<h2 class="title" style="margin-bottom:var(--s-5)" data-i18n="svc.pickType"></h2>' +
      '<div class="grid grid-3">' + M.serviceTypes().map(function (t) {
        var from = cheapestFor(t.id);
        return '<button type="button" class="card card--pad card--hover feature" ' +
          'data-pick-type="' + esc(t.id) + '" style="text-align:start">' +
          '<span class="feature__icon">' + Icons.svg(t.icon, "icon-lg") + "</span>" +
          '<h3 class="subtitle">' + esc(tx(t.title)) + "</h3>" +
          '<p class="small muted">' + esc(tx(t.meta)) + "</p>" +
          '<p class="small" style="margin-top:auto;padding-top:var(--s-3)">' +
            (from !== null
              ? esc(I18N.t("svc.fromPrice")) + ' <strong class="num">' + I18N.num(from) + "</strong> " +
                esc(I18N.t("common.sar")) + ' <span class="dot"></span> <span class="muted">' +
                esc(I18N.t("svc.offeredBy", { n: I18N.num(countFor(t.id)) })) + "</span>"
              : '<span class="muted">' + esc(I18N.t("svc.noneForType")) + "</span>") +
          "</p></button>";
      }).join("") + "</div>";
  }

  /* --- step two: who offers it --- */
  function lawyersForType() {
    var type = M.serviceType(filters.type);
    var list = offersOfType(filters.type);

    return '<div class="row between wrap gap-4" style="margin-bottom:var(--s-6)">' +
        '<h2 class="title">' + esc(I18N.t("svc.lawyersFor", { name: tx(type.title) })) + "</h2>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-clear-type>' +
          Icons.svg("arrow-back", "icon-sm") + esc(I18N.t("svc.changeType")) + "</button>" +
      "</div>" +

      '<div class="results-bar">' +
        '<div class="row gap-3 wrap">' +
          '<label class="field"><span class="label" data-i18n="dir.specialties"></span>' +
            select("specialty", global.SEED.specialties.map(function (sp) {
              return { id: sp.id, label: tx(sp) };
            }), filters.specialty, "dir.anySpecialty") + "</label>" +
          '<label class="field"><span class="label" data-i18n="dir.sortBy"></span>' +
            select("sort", [{ id: "price", label: I18N.t("svc.sortPrice") },
                            { id: "rating", label: I18N.t("svc.sortRating") }], filters.sort) + "</label>" +
        "</div>" +
        '<p class="small muted">' + esc(I18N.t("svc.found", { n: I18N.num(list.length) })) + "</p>" +
      "</div>" +

      (list.length
        ? '<div class="grid grid-2" style="margin-top:var(--s-6)">' +
          list.map(function (o, i) { return offerCard(o, type, i === 0 && filters.sort === "price"); }).join("") +
          "</div>"
        : C.empty("tag", "svc.noneForType"));
  }

  function clientView() {
    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="svc.routeTitle"></h1>' +
        '<p class="lead" data-i18n="svc.routeLead"></p></header>' +
      routeCards() +
      (filters.type ? lawyersForType() : typePicker()) +
    "</div>";
  }

  function select(name, items, value, anyKey) {
    return '<select class="select" data-filter="' + name + '">' +
      (anyKey ? '<option value="">' + esc(I18N.t(anyKey)) + "</option>" : "") +
      items.map(function (o) {
        return '<option value="' + esc(o.id) + '"' + (o.id === value ? " selected" : "") + ">" +
          esc(o.label) + "</option>";
      }).join("") + "</select>";
  }

  function offerCard(o, type, best) {
    var named = M.serviceTitle(o.svc);
    return '<article class="card card--pad card--hover' + (best ? " card--rule-gold" : "") + '">' +
      '<div class="row between wrap gap-3">' +
        '<span class="row gap-3">' + C.avatar(o.owner, "sm") +
          "<span>" + C.personLink(o.owner) +
            '<p class="tiny muted">' + esc(tx(named)) + "</p></span></span>" +
        '<strong class="title"><span class="num">' + I18N.num(o.svc.price) + "</span> " +
          esc(I18N.t("common.sar")) + "</strong>" +
      "</div>" +
      '<div class="meta-row" style="margin-top:var(--s-4)">' + C.ratingLine(o.owner.id) +
        '<span class="dot"></span><span class="muted">' +
          esc(I18N.t("lawyer.years", { n: I18N.num(o.owner.years || 0) })) + "</span>" +
        (best ? '<span class="dot"></span><span class="tag">' +
          esc(I18N.t("quotes.bestPrice")) + "</span>" : "") +
      "</div>" +
      '<div class="row between wrap gap-3" style="margin-top:var(--s-5);padding-top:var(--s-4);' +
        'border-top:1px solid var(--border)">' +
        '<span class="tiny muted">' + esc(tx(M.serviceMeta(o.svc))) + "</span>" +
        '<button class="btn btn--primary btn--sm" type="button" data-order="' + esc(o.svc.id) + '" ' +
          'data-i18n="req.order"></button>' +
      "</div></article>";
  }

  /* ====================================================== lawyer ==========
     The lawyer writes the service themselves — its name and its turnaround.
     The category behind it is not a label, it is the price band: whatever they
     charge has to sit between the platform's floor and ceiling for that kind
     of work, which is what stops both undercutting and gouging. */
  function lawyerView() {
    var me = Session.user();
    var mine = M.servicesOf(me.id);
    var types = M.serviceTypes();
    var cat = editing ? editing.typeId : (draft.typeId || types[0].id);
    var band = M.priceBand(cat);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="svc.mine"></h1>' +
        '<p class="lead" data-i18n="svc.mineLead"></p></header>' +
      (Session.isVerified() ? "" :
        '<p class="note-inline" style="margin-bottom:var(--s-6)" data-i18n="svc.pendingNote"></p>') +

      '<div class="grid dash-split">' +
        '<section class="card card--pad">' +
          (mine.length
            ? '<div class="req-list">' + mine.map(myServiceRow).join("") + "</div>"
            : '<p class="small muted" data-i18n="svc.noneMine"></p>') +
        "</section>" +

        '<aside class="card card--pad">' +
          '<h2 class="subtitle" data-i18n="' + (editing ? "svc.editTitle" : "svc.addTitle") + '"></h2>' +
          '<div class="stack gap-4" style="margin-top:var(--s-5)">' +
            '<label class="field"><span class="label" data-i18n="svc.category"></span>' +
              '<select class="select" data-new-type>' + types.map(function (t) {
                return '<option value="' + esc(t.id) + '"' + (cat === t.id ? " selected" : "") + ">" +
                  esc(tx(t.title)) + "</option>";
              }).join("") + "</select>" +
              '<span class="tiny faint" data-i18n="svc.categoryHint"></span></label>' +

            '<label class="field"><span class="label" data-i18n="svc.customTitle"></span>' +
              '<input class="input" data-new-title value="' + esc(draft.title || "") + '" ' +
                'placeholder="' + esc(tx(M.serviceType(cat).title)) + '">' +
              '<span class="tiny faint" data-i18n="svc.customTitleHint"></span></label>' +

            '<label class="field"><span class="label" data-i18n="svc.customMeta"></span>' +
              '<input class="input" data-new-meta value="' + esc(draft.meta || "") + '" ' +
                'placeholder="' + esc(tx(M.serviceType(cat).meta)) + '"></label>' +

            '<label class="field"><span class="label" data-i18n="svc.priceLabel"></span>' +
              '<input class="input num" type="number" data-new-price dir="ltr" ' +
                'min="' + band.min + '" max="' + band.max + '" ' +
                'value="' + (draft.price != null ? draft.price : "") + '"></label>' +
            '<p class="tiny muted" data-band></p>' +
            '<p class="form-error" data-svc-error hidden></p>' +
            '<div class="row gap-2">' +
              '<button class="btn btn--primary" type="button" data-add-svc data-i18n="' +
                (editing ? "svc.saveChanges" : "svc.add") + '"></button>' +
              (editing ? '<button class="btn btn--ghost" type="button" data-cancel-edit ' +
                'data-i18n="signup.back"></button>' : "") +
            "</div>" +
          "</div>" +
        "</aside>" +
      "</div></div>";
  }

  function myServiceRow(s) {
    var band = M.priceBand(s.typeId);
    var type = M.serviceType(s.typeId) || {};
    var name = tx(M.serviceTitle(s));
    var category = tx(type.title || {});
    return '<div class="req-row">' +
      '<span class="req-row__icon">' + Icons.svg(M.serviceIcon(s), "icon-sm") + "</span>" +
      '<div class="grow" style="min-width:0">' +
        '<div class="row gap-2 wrap"><strong class="small">' + esc(name) + "</strong>" +
          // The category tag only earns its place when it says something new.
          (name === category ? "" : '<span class="tag">' + esc(category) + "</span>") + "</div>" +
        '<p class="tiny muted">' + esc(tx(M.serviceMeta(s))) + "</p>" +
        '<p class="tiny faint">' + esc(I18N.t("svc.band",
          { min: I18N.num(band.min), max: I18N.num(band.max) })) + "</p>" +
      "</div>" +
      '<div class="req-row__side"><div class="row gap-2">' +
        '<strong class="small"><span class="num">' + I18N.num(s.price) + "</span> " +
          esc(I18N.t("common.sar")) + "</strong>" +
        '<button class="icon-btn" type="button" data-edit-svc="' + esc(s.id) + '" ' +
          'data-i18n-attr="aria-label:svc.editTitle">' + Icons.svg("edit", "icon-sm") + "</button>" +
        '<button class="icon-btn" type="button" data-del-svc="' + esc(s.id) + '" ' +
          'data-i18n-attr="aria-label:svc.remove">' + Icons.svg("trash", "icon-sm") + "</button>" +
      "</div></div></div>";
  }

  /* ====================================================== intern ========== */
  function internView() {
    var me = Session.user();
    if (skills === null) skills = (me.skills || []).map(function (s) { return tx(s); });

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20);max-width:760px">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="skills.heading"></h1>' +
        '<p class="lead" data-i18n="skills.lead"></p></header>' +
      '<section class="card card--pad">' +
        '<div class="chip-input">' +
          '<input class="input" data-skill-input data-i18n-attr="placeholder:skills.placeholder">' +
          '<button class="btn btn--outline btn--sm" type="button" data-skill-add data-i18n="svc.add"></button>' +
        "</div>" +
        '<div class="row gap-2 wrap" style="margin-top:var(--s-5)">' +
          (skills.length
            ? skills.map(function (sk, i) {
                return '<span class="chip is-active">' + esc(sk) +
                  '<button type="button" data-skill-del="' + i + '" aria-label="x">' +
                  Icons.svg("close", "icon-sm") + "</button></span>";
              }).join("")
            : '<span class="tiny faint" data-i18n="skills.none"></span>') +
        "</div>" +
        '<button class="btn btn--primary" type="button" style="margin-top:var(--s-6)" ' +
          'data-skill-save data-i18n="skills.save"></button>' +
      "</section></div>";
  }

  /* ====================================================== draw ============ */
  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = role === "lawyer" ? lawyerView()
                   : role === "intern" ? internView()
                   : clientView();
    I18N.apply(host);
    showBand();
  });

  function showBand() {
    var sel = $("[data-new-type]", host), out = $("[data-band]", host);
    if (!sel || !out) return;
    var band = M.priceBand(sel.value);
    out.textContent = I18N.t("svc.band", { min: I18N.num(band.min), max: I18N.num(band.max) });
  }

  function readForm() {
    var g = function (sel) { var el = $(sel, host); return el ? el.value.trim() : ""; };
    return {
      typeId: g("[data-new-type]"),
      title: g("[data-new-title]"),
      meta: g("[data-new-meta]"),
      price: +g("[data-new-price]")
    };
  }

  function svcError(key) {
    var el = $("[data-svc-error]", host);
    if (!el) return;
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  /* ====================================================== events ========== */
  host.addEventListener("change", function (ev) {
    var f = ev.target.closest("[data-filter]");
    if (f) { filters[f.getAttribute("data-filter")] = f.value; App.rerender(); return; }
    if (ev.target.closest("[data-new-type]")) {
      draft = readForm();
      draft.title = draft.title; draft.meta = draft.meta;
      showBand();
      App.rerender();
      return;
    }

    // Editing a live price in place: validated against the band, saved at once.
    var pf = ev.target.closest("[data-price-for]");
    if (pf) {
      var id = pf.getAttribute("data-price-for");
      var s = M.servicesOf(Session.user().id).filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      var price = +pf.value;
      var bad = M.checkPrice(s.typeId, price);
      if (bad) {
        App.toast(I18N.t(bad === "low" ? "svc.tooLow" : bad === "high" ? "svc.tooHigh" : "svc.empty"), "close");
        pf.value = s.price;
        return;
      }
      Store.removeService(s.id);
      Store.addService({ id: s.id, ownerId: s.ownerId, typeId: s.typeId, price: price, active: true });
      App.toast(I18N.t("svc.added"), "check");
    }
  });

  host.addEventListener("click", function (ev) {
    var t = ev.target;

    var pt = t.closest("[data-pick-type]");
    if (pt) { filters.type = pt.getAttribute("data-pick-type"); App.rerender(); return; }
    if (t.closest("[data-clear-type]")) { filters.type = ""; App.rerender(); return; }

    var ord = t.closest("[data-order]");
    if (ord) {
      if (Session.isGuest()) { App.toast(I18N.t("svc.orderSignIn"), "lock");
        setTimeout(function () { App.go("login.html"); }, 900); return; }
      var all = offersOfType(filters.type);
      var pick = null;
      for (var i = 0; i < all.length; i++) if (all[i].svc.id === ord.getAttribute("data-order")) pick = all[i];
      if (!pick) return;
      var picked = M.serviceType(pick.svc.typeId);
      Store.addRequest({
        clientId: Session.user().id, lawyerId: pick.owner.id, typeId: pick.svc.typeId,
        price: pick.svc.price, status: "new", ai: picked.tier === "quick", hours: 3,
        title: M.serviceTitle(pick.svc),
        brief: { ar: "", en: "" },
        ago: { ar: I18N.t("common.today"), en: I18N.t("common.today") }
      });
      App.toast(I18N.t("req.ordered", { name: tx(pick.owner.name) }), "check");
      setTimeout(function () { App.go("requests.html"); }, 1000);
      return;
    }

    if (t.closest("[data-add-svc]")) {
      var f = readForm();
      var bad = M.checkPrice(f.typeId, f.price);
      if (bad) { svcError(bad === "low" ? "svc.tooLow" : bad === "high" ? "svc.tooHigh" : "svc.empty"); return; }
      svcError(null);
      var record = {
        ownerId: Session.user().id, typeId: f.typeId, price: f.price, active: true,
        title: f.title ? { ar: f.title, en: f.title } : null,
        meta: f.meta ? { ar: f.meta, en: f.meta } : null
      };
      if (editing) {
        record.id = editing.id;
        Store.removeService(editing.id);
        editing = null;
      }
      Store.addService(record);
      draft = {};
      App.toast(I18N.t(record.id ? "svc.updated" : "svc.added"), "check");
      return;
    }

    var ed = t.closest("[data-edit-svc]");
    if (ed) {
      var found = M.servicesOf(Session.user().id)
        .filter(function (x) { return x.id === ed.getAttribute("data-edit-svc"); })[0];
      if (!found) return;
      editing = found;
      draft = { typeId: found.typeId, price: found.price,
                title: found.title ? tx(found.title) : "", meta: found.meta ? tx(found.meta) : "" };
      App.rerender();
      return;
    }

    if (t.closest("[data-cancel-edit]")) { editing = null; draft = {}; App.rerender(); return; }

    var del = t.closest("[data-del-svc]");
    if (del) {
      if (editing && editing.id === del.getAttribute("data-del-svc")) { editing = null; draft = {}; }
      Store.removeService(del.getAttribute("data-del-svc"));
      App.toast(I18N.t("svc.removed"), "trash");
      return;
    }

    if (t.closest("[data-skill-add]")) { addSkill(); return; }

    var sd = t.closest("[data-skill-del]");
    if (sd) { skills.splice(+sd.getAttribute("data-skill-del"), 1); App.rerender(); return; }

    if (t.closest("[data-skill-save]")) {
      Store.updateAccount(Session.user().id, {
        skills: skills.map(function (s) { return { ar: s, en: s }; })
      });
      App.toast(I18N.t("skills.saved"), "check");
    }
  });

  host.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.matches("[data-skill-input]")) { ev.preventDefault(); addSkill(); }
  });

  function addSkill() {
    var input = $("[data-skill-input]", host);
    var v = input.value.trim();
    if (!v || skills.indexOf(v) !== -1) return;
    skills.push(v);
    App.rerender();
  }
});

/* ==========================================================================
   People — the directory a client browses and the board a professional is
   ranked on, in one page because they are two views of the same list.

   The rank is never stored; it is recomputed from ratings, delivered work and
   response speed every time this page draws.
   ========================================================================== */
Pages.define("lawyers", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-people]");
  if (!host) return;

  var state = {
    tab: Session.is("intern") ? "intern" : "lawyer",
    q: App.param("q") || "",
    specialty: App.param("specialty") || "",
    city: App.param("city") || "",
    minRating: 0,
    sort: "rating"
  };

  /* ---------- filtering ---------- */
  function lawyerList() {
    var text = state.q.trim().toLowerCase();
    return M.listedLawyers().filter(function (u) {
      if (state.specialty && (u.specialties || []).indexOf(state.specialty) === -1) return false;
      if (state.city && u.city !== state.city) return false;
      if (M.ratingOf(u.id).avg < state.minRating) return false;
      if (text) {
        var hay = (tx(u.name) + " " + tx(u.title || {}) + " " + tx(u.bio || {})).toLowerCase();
        if (hay.indexOf(text) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (state.sort === "experience") return (b.years || 0) - (a.years || 0);
      if (state.sort === "priceAsc") return cheapest(a) - cheapest(b);
      if (state.sort === "priceDesc") return cheapest(b) - cheapest(a);
      return M.ratingOf(b.id).avg - M.ratingOf(a.id).avg;
    });
  }

  function cheapest(u) {
    var s = M.servicesOf(u.id);
    return s.length ? Math.min.apply(null, s.map(function (x) { return x.price; })) : Infinity;
  }

  /* ---------- pieces ---------- */
  function tabs() {
    return '<div class="tabs" role="tablist">' +
      [["lawyer", "dir.tabLawyers"], ["intern", "dir.tabInterns"]].map(function (t) {
        return '<button class="tab' + (state.tab === t[0] ? " is-active" : "") + '" role="tab" ' +
          'type="button" data-tab="' + t[0] + '" data-i18n="' + t[1] + '"></button>';
      }).join("") + "</div>";
  }

  function filters() {
    function sel(name, list, value, anyKey) {
      return '<select class="select" data-f="' + name + '">' +
        '<option value="">' + esc(I18N.t(anyKey)) + "</option>" +
        list.map(function (o) {
          return '<option value="' + esc(o.id) + '"' + (o.id === value ? " selected" : "") + ">" +
            esc(tx(o)) + "</option>";
        }).join("") + "</select>";
    }
    return '<div class="results-bar">' +
      '<div class="row gap-3 wrap">' +
        '<label class="field"><span class="label" data-i18n="blog.search"></span>' +
          '<input class="input" data-f="q" value="' + esc(state.q) + '" ' +
            'data-i18n-attr="placeholder:home.searchPlaceholder"></label>' +
        '<label class="field"><span class="label" data-i18n="dir.specialties"></span>' +
          sel("specialty", global.SEED.specialties, state.specialty, "dir.anySpecialty") + "</label>" +
        '<label class="field"><span class="label" data-i18n="dir.cities"></span>' +
          sel("city", global.SEED.cities, state.city, "dir.anyCity") + "</label>" +
        '<label class="field"><span class="label" data-i18n="dir.sortBy"></span>' +
          '<select class="select" data-f="sort">' +
            [["rating", "dir.sortRating"], ["experience", "dir.sortExperience"],
             ["priceAsc", "dir.sortPriceAsc"], ["priceDesc", "dir.sortPriceDesc"]].map(function (o) {
              return '<option value="' + o[0] + '"' + (state.sort === o[0] ? " selected" : "") + ">" +
                esc(I18N.t(o[1])) + "</option>";
            }).join("") + "</select></label>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-reset data-i18n="dir.reset"></button>' +
      "</div></div>";
  }

  /** The board is a professional's own scoreboard, not a client's shopping
      aid — a client judges a lawyer by rating and price, never by a league
      position. So it is drawn for lawyers and trainees only. A trainee sees
      their own cohort; a lawyer sees both, because they supervise one of them. */
  function canSeeBoard(role) {
    if (Session.is("lawyer")) return true;
    return Session.is("intern") && role === "intern";
  }

  function board(role) {
    var me = Session.user();
    var rows = M.leaderboard(role);
    return '<section class="card" style="margin-top:var(--s-10);overflow:hidden">' +
      '<div class="panel__head"><h2 class="subtitle" data-i18n="rank.title"></h2>' +
        '<p class="tiny muted" style="margin-top:var(--s-1)" data-i18n="rank.lead"></p></div>' +
      '<div style="overflow-x:auto"><table class="rank-table">' +
        "<thead><tr>" +
          '<th data-i18n="rank.pos"></th><th data-i18n="rank.name"></th>' +
          '<th data-i18n="rank.rating"></th>' +
          '<th data-i18n="' + (role === "intern" ? "rank.hours" : "rank.done") + '"></th>' +
          '<th data-i18n="rank.score"></th>' +
        "</tr></thead><tbody>" +
        rows.map(function (row, i) {
          var mine = me && row.user.id === me.id;
          return "<tr" + (mine ? ' class="is-me"' : "") + ">" +
            '<td class="num">' + I18N.num(i + 1) + "</td>" +
            '<td><span class="row gap-2">' + C.avatar(row.user, "sm") + C.personLink(row.user) +
              (mine ? ' <span class="tag">' + esc(I18N.t("rank.you")) + "</span>" : "") + "</span></td>" +
            '<td class="num">' + I18N.num(row.rating.avg.toFixed(1)) + "</td>" +
            '<td class="num">' + I18N.num(role === "intern" ? M.hoursOf(row.user.id) : (row.user.completed || 0)) + "</td>" +
            '<td><strong class="num">' + I18N.num(row.score.total) + "</strong></td>" +
          "</tr>";
        }).join("") +
      "</tbody></table></div></section>";
  }

  /* ---------- draw ---------- */
  App.onRender(function () {
    var isLawyers = state.tab === "lawyer";
    var list = isLawyers ? lawyerList() : M.interns();

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-6)">' +
        '<h1 class="headline" data-i18n="' + (isLawyers ? "dir.heading" : "dir.headingInterns") + '"></h1>' +
        '<p class="lead" data-i18n="' + (isLawyers ? "dir.lead" : "dir.internsLead") + '"></p></header>' +
      tabs() +
      (isLawyers ? filters() : "") +
      '<p class="small muted" style="margin:var(--s-4) 0">' +
        esc(I18N.t(isLawyers ? "dir.found" : "dir.foundInterns", { n: I18N.num(list.length) })) + "</p>" +
      (list.length
        ? '<div class="grid grid-3">' + list.map(isLawyers ? C.lawyerCard : C.internCard).join("") + "</div>"
        : C.empty("search", "dir.empty")) +
      (canSeeBoard(state.tab) ? board(state.tab) : "") +
    "</div>";

    I18N.apply(host);
    App.observeReveals(host);
  });

  /* ---------- events ---------- */
  host.addEventListener("click", function (ev) {
    var tab = ev.target.closest("[data-tab]");
    if (tab) { state.tab = tab.getAttribute("data-tab"); App.rerender(); return; }
    if (ev.target.closest("[data-reset]")) {
      state.q = ""; state.specialty = ""; state.city = ""; state.sort = "rating";
      App.rerender();
    }
  });

  host.addEventListener("change", function (ev) {
    var f = ev.target.closest("[data-f]");
    if (!f) return;
    state[f.getAttribute("data-f")] = f.value;
    App.rerender();
  });

  // Typing filters as you go; the select handler above covers the dropdowns.
  host.addEventListener("input", function (ev) {
    var f = ev.target.closest('[data-f="q"]');
    if (!f) return;
    state.q = f.value;
    clearTimeout(f._t);
    f._t = setTimeout(function () {
      App.rerender();
      var again = $('[data-f="q"]', host);
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 250);
  });
});

/* ==========================================================================
   A lawyer's own page. Its own template, deliberately — a lawyer sells
   services and shows a licence; a trainee shows skills and hours. Forcing one
   layout to do both would have made each half of it apologise for the other.
   ========================================================================== */
Pages.define("lawyer", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-profile]");
  if (!host) return;

  var id = App.param("id");
  var tab = "services";

  function head(u) {
    var city = M.city(u.city);
    // Rank is a professional's business; a client sees the rating instead.
    var rank = Session.is("lawyer") ? M.rankOf(u.id, "lawyer") : { rank: null };
    return '<header class="card card--pad" style="margin-bottom:var(--s-8)">' +
      '<div class="row gap-6 wrap" style="align-items:flex-start">' +
        C.avatar(u, "lg") +
        '<div class="grow" style="min-width:0">' +
          '<h1 class="headline row gap-3 wrap">' + esc(tx(u.name)) + C.verifiedMark(u) + "</h1>" +
          '<p class="lead">' + esc(tx(u.title || {})) + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-4)">' +
            C.ratingLine(u.id) +
            '<span class="dot"></span><span class="muted">' +
              esc(I18N.t("lawyer.years", { n: I18N.num(u.years || 0) })) + "</span>" +
            (city ? '<span class="dot"></span><span class="muted row gap-1">' +
              Icons.svg("location", "icon-sm") + esc(tx(city)) + "</span>" : "") +
            (u.licence && u.licence.number
              ? '<span class="dot"></span><span class="muted row gap-1">' + Icons.svg("shield-check", "icon-sm") +
                esc(I18N.t("lawyer.license")) + ' <span class="num">' + esc(u.licence.number) + "</span></span>"
              : "") +
            (rank.rank ? '<span class="dot"></span><span class="muted">' + esc(I18N.t("profile.rank")) +
              ' <span class="num">' + I18N.num(rank.rank) + "/" + I18N.num(rank.of) + "</span></span>" : "") +
          "</div>" +
          '<div class="row gap-2 wrap" style="margin-top:var(--s-4)">' +
            (u.specialties || []).map(function (sid) {
              var s = M.specialty(sid);
              return s ? '<span class="tag">' + esc(tx(s)) + "</span>" : "";
            }).join("") + "</div>" +
        "</div>" +
      "</div></header>";
  }

  var TABS = [["services", "profile.tabServices"], ["experience", "profile.tabExperience"],
              ["reviews", "profile.tabReviews"], ["articles", "profile.tabArticles"]];

  function panel(u) {
    if (tab === "services") return servicesPanel(u);
    if (tab === "experience") return experiencePanel(u);
    if (tab === "reviews") return reviewsPanel(u);
    return articlesPanel(u);
  }

  function servicesPanel(u) {
    var list = M.servicesOf(u.id);
    if (!list.length) return '<p class="small muted" data-i18n="profile.noServices"></p>';
    return '<div class="req-list">' + list.map(function (s) {
      return '<div class="req-row">' +
        '<span class="req-row__icon">' + Icons.svg(M.serviceIcon(s), "icon-sm") + "</span>" +
        '<div class="grow"><strong class="small">' + esc(tx(M.serviceTitle(s))) + "</strong>" +
          '<p class="tiny muted">' + esc(tx(M.serviceMeta(s))) + "</p></div>" +
        '<div class="req-row__side"><strong class="small"><span class="num">' +
          I18N.num(s.price) + "</span> " + esc(I18N.t("common.sar")) + "</strong>" +
          '<button class="btn btn--primary btn--sm" type="button" data-order="' + esc(s.id) + '" ' +
            'data-i18n="profile.orderNow"></button></div></div>';
    }).join("") + "</div>";
  }

  function experiencePanel(u) {
    return (u.bio ? '<h2 class="subtitle" data-i18n="profile.bio"></h2>' +
        '<p class="lead" style="margin:var(--s-3) 0 var(--s-8)">' + esc(tx(u.bio)) + "</p>" : "") +
      (u.focus && u.focus.length
        ? '<h2 class="subtitle" data-i18n="profile.subSpecialties"></h2>' +
          '<ul class="bullets" style="margin:var(--s-3) 0 var(--s-8)">' +
            u.focus.map(function (f) { return "<li>" + esc(tx(f)) + "</li>"; }).join("") + "</ul>"
        : "") +
      (u.education && u.education.length
        ? '<h2 class="subtitle" data-i18n="profile.education"></h2>' +
          '<ul class="timeline" style="margin:var(--s-4) 0 var(--s-8)">' +
            u.education.map(function (e) {
              return "<li><strong class=\"small\">" + esc(tx(e.degree)) + "</strong>" +
                '<p class="tiny muted">' + esc(tx(e.place)) + "</p></li>";
            }).join("") + "</ul>"
        : "") +
      (u.career && u.career.length
        ? '<h2 class="subtitle" data-i18n="profile.career"></h2>' +
          '<ul class="timeline" style="margin-top:var(--s-4)">' +
            u.career.map(function (c) {
              return "<li><strong class=\"small\">" + esc(tx(c.role)) + "</strong>" +
                '<p class="tiny muted">' + esc(tx(c.period)) + "</p>" +
                '<p class="small">' + esc(tx(c.note)) + "</p></li>";
            }).join("") + "</ul>"
        : "");
  }

  function reviewsPanel(u) {
    var list = M.reviewsFor(u.id).slice().reverse();
    return C.ratingSummary(u.id) +
      (list.length
        ? '<div class="stack gap-4" style="margin-top:var(--s-6)">' +
          list.map(C.reviewCard).join("") + "</div>"
        : "");
  }

  function articlesPanel(u) {
    var list = M.articlesBy(u.id);
    if (!list.length) return '<p class="small muted" data-i18n="profile.noArticles"></p>';
    return '<div class="grid grid-2">' + list.map(C.articleCard).join("") + "</div>";
  }

  /** The rail: order a service without leaving the page. */
  function rail(u) {
    var list = M.servicesOf(u.id);
    return '<aside class="booking card card--pad">' +
      '<h2 class="subtitle" data-i18n="profile.book"></h2>' +
      '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="profile.bookHint"></p>' +
      (list.length
        ? '<div class="stack gap-2" style="margin-top:var(--s-5)">' + list.map(function (s) {
            return '<button type="button" class="doc-option" data-order="' + esc(s.id) + '">' +
              '<span class="row gap-3">' + Icons.svg(M.serviceIcon(s), "icon-sm") +
                "<span>" + esc(tx(M.serviceTitle(s))) + "</span></span>" +
              '<span class="doc-option__price"><span class="num">' + I18N.num(s.price) + "</span> " +
                esc(I18N.t("common.sar")) + "</span></button>";
          }).join("") + "</div>"
        : '<p class="small muted" style="margin-top:var(--s-4)" data-i18n="profile.noServices"></p>') +
      '<p class="disclaimer" style="margin-top:var(--s-5)">' + Icons.svg("lock", "icon-sm") +
        '<span data-i18n="profile.securePay"></span></p>' +
    "</aside>";
  }

  App.onRender(function () {
    var u = id ? M.user(id) : null;
    if (!u || u.roles.indexOf("lawyer") === -1) {
      host.innerHTML = '<div class="container" style="padding-block:var(--s-16)">' +
        C.empty("search", "profile.notFound") +
        '<p class="center" style="margin-top:var(--s-6)">' +
          '<a class="btn btn--primary" href="lawyers.html" data-i18n="profile.backToDir"></a></p></div>';
      I18N.apply(host);
      return;
    }

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-20)">' +
      head(u) +
      '<div class="profile-layout">' +
        "<section>" +
          '<div class="tabs" role="tablist">' + TABS.map(function (t) {
            return '<button class="tab' + (tab === t[0] ? " is-active" : "") + '" type="button" ' +
              'role="tab" data-tab="' + t[0] + '" data-i18n="' + t[1] + '"></button>';
          }).join("") + "</div>" +
          '<div style="margin-top:var(--s-6)">' + panel(u) + "</div>" +
        "</section>" +
        rail(u) +
      "</div></div>";

    I18N.apply(host);
    document.title = tx(u.name) + " | " + I18N.t("brand.name");
  });

  host.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab]");
    if (t) { tab = t.getAttribute("data-tab"); App.rerender(); return; }

    var ord = ev.target.closest("[data-order]");
    if (!ord) return;
    if (Session.isGuest()) {
      App.toast(I18N.t("svc.orderSignIn"), "lock");
      setTimeout(function () { App.go("login.html"); }, 900);
      return;
    }
    var u = M.user(id);
    var svc = M.servicesOf(u.id).filter(function (s) { return s.id === ord.getAttribute("data-order"); })[0];
    if (!svc) return;
    var type = M.serviceType(svc.typeId) || {};
    Store.addRequest({
      clientId: Session.user().id, lawyerId: u.id, typeId: svc.typeId, price: svc.price,
      status: "new", ai: type.tier === "quick", hours: 3,
      title: M.serviceTitle(svc), brief: { ar: "", en: "" },
      ago: { ar: I18N.t("common.today"), en: I18N.t("common.today") }
    });
    App.toast(I18N.t("req.ordered", { name: tx(u.name) }), "check");
    setTimeout(function () { App.go("requests.html"); }, 1000);
  });
});

/* ==========================================================================
   A trainee's page — its own template. No price list and no licence: what a
   trainee has to show is skills, logged hours, and the lawyers who vouched.

   The certificate button appears only for a lawyer who actually supervised
   them, and only once the hours threshold is met.
   ========================================================================== */
Pages.define("intern", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-profile]");
  if (!host) return;

  var id = App.param("id");
  var tab = "skills";
  var deal = { kind: "cases", amount: "", cases: "" };   // the form being filled

  /** Pay is between the two parties, so the tab only exists for them. */
  function canSeePay(u) {
    var me = Session.user();
    if (!me) return false;
    return Session.is("lawyer") || me.id === u.id;
  }

  function tabsFor(u) {
    var t = [["skills", "profile.tabSkills"], ["cert", "profile.tabCert"]];
    if (canSeePay(u)) t.push(["pay", "pay.tab"]);
    return t.concat([["reviews", "profile.tabReviews"], ["articles", "profile.tabArticles"]]);
  }

  function head(u) {
    // Same rule as a lawyer's page: the league table is for the profession.
    var rank = (Session.is("lawyer") || Session.is("intern"))
      ? M.rankOf(u.id, "intern") : { rank: null };
    var prog = M.certProgress(u.id);
    return '<header class="card card--pad" style="margin-bottom:var(--s-8)">' +
      '<div class="row gap-6 wrap" style="align-items:flex-start">' +
        C.avatar(u, "lg") +
        '<div class="grow" style="min-width:0">' +
          '<h1 class="headline row gap-3 wrap">' + esc(tx(u.name)) +
            (M.endorsementsFor(u.id).length
              ? '<span class="verified" data-i18n-attr="title:cert.holder">' +
                Icons.svg("badge", "icon-sm") + "</span>" : "") + "</h1>" +
          '<p class="lead">' + esc(tx(u.university || {})) +
            (u.level ? " · " + esc(tx(u.level)) : "") + "</p>" +
          '<div class="meta-row" style="margin-top:var(--s-4)">' +
            C.ratingLine(u.id) +
            '<span class="dot"></span><span class="muted">' +
              esc(I18N.t("cert.hoursDone", { n: I18N.num(prog.hours) })) + "</span>" +
            (rank.rank ? '<span class="dot"></span><span class="muted">' + esc(I18N.t("profile.rank")) +
              ' <span class="num">' + I18N.num(rank.rank) + "/" + I18N.num(rank.of) + "</span></span>" : "") +
          "</div>" +
          '<div style="margin-top:var(--s-5);max-width:420px">' + C.progressBar(prog.pct) + "</div>" +
        "</div>" +
      "</div></header>";
  }

  function skillsPanel(u) {
    var list = u.skills || [];
    if (!list.length) return '<p class="small muted" data-i18n="profile.noSkills"></p>';
    return '<div class="row gap-2 wrap">' + list.map(function (s) {
      return '<span class="chip is-active">' + esc(tx(s)) + "</span>";
    }).join("") + "</div>" +
      (u.bio ? '<h2 class="subtitle" style="margin-top:var(--s-8)" data-i18n="profile.bio"></h2>' +
        '<p class="lead" style="margin-top:var(--s-3)">' + esc(tx(u.bio)) + "</p>" : "");
  }

  /** Hours, endorsements, and — for the supervising lawyer — the issue button. */
  function certPanel(u) {
    var prog = M.certProgress(u.id);
    var given = M.endorsementsFor(u.id);
    var me = Session.user();
    // Only a lawyer who routed work to this trainee may sign for them.
    var supervised = me && Session.is("lawyer") &&
      M.requestsForIntern(u.id).some(function (r) { return r.lawyerId === me.id; });
    var already = me && given.some(function (e) { return e.lawyerId === me.id; });

    return '<div class="card card--pad">' +
      '<h2 class="subtitle" data-i18n="cert.title"></h2>' +
      '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)">' +
        esc(I18N.t("cert.hoursDone", { n: I18N.num(prog.hours) })) + " / " +
        '<span class="num">' + I18N.num(prog.needed) + "</span></p>" +
      C.progressBar(prog.pct) +
      (supervised && !already
        ? '<div style="margin-top:var(--s-5)">' +
            '<button class="btn btn--accent btn--sm" type="button" data-issue' +
              (prog.eligible ? "" : " disabled") + ' data-i18n="cert.issueCta"></button>' +
            '<p class="tiny muted" style="margin-top:var(--s-2)">' +
              esc(I18N.t("cert.issueHint", { n: I18N.num(prog.needed) })) + "</p></div>"
        : "") +
    "</div>" +

    '<h2 class="subtitle" style="margin-top:var(--s-8)" data-i18n="profile.supervisors"></h2>' +
    (given.length
      ? '<div class="stack gap-4" style="margin-top:var(--s-4)">' + given.map(function (e) {
          var lw = M.user(e.lawyerId);
          return '<article class="testimony">' +
            '<div class="row gap-3">' + C.avatar(lw, "sm") +
              "<span><strong class=\"small\">" + esc(I18N.t("cert.issuedBy")) + " " +
                esc(lw ? tx(lw.name) : "") + "</strong>" +
              '<p class="tiny muted">' + esc(tx(e.date || {})) + " · " +
                esc(I18N.t("cert.hoursShort", { n: I18N.num(e.hours || 0) })) + "</p></span></div>" +
            (e.note ? '<p class="small" style="margin-top:var(--s-3)">' + esc(tx(e.note)) + "</p>" : "") +
          "</article>";
        }).join("") + "</div>"
      : '<p class="small muted" style="margin-top:var(--s-3)" data-i18n="cert.noneYet"></p>');
  }

  /* ---------- pay: a share per task, or terms settled in advance ---------- */
  function payPanel(u) {
    var me = Session.user();
    var mine = Session.is("lawyer") ? M.agreementFor(me.id, u.id) : null;
    var all = M.agreementsOfIntern(u.id);
    var isSelf = me.id === u.id;

    return '<p class="note-inline" data-i18n="pay.onlyParties"></p>' +

      '<div class="card card--pad" style="margin-top:var(--s-6)">' +
        '<div class="row between wrap gap-3">' +
          '<h2 class="subtitle" data-i18n="pay.earned"></h2>' +
          '<strong class="title" style="color:var(--accent)"><span class="num">' +
            I18N.num(M.earnedBy(u.id)) + "</span> " + esc(I18N.t("common.sar")) + "</strong>" +
        "</div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="pay.shareHint"></p></div>' +

      '<h2 class="subtitle" style="margin-top:var(--s-8)" data-i18n="pay.standing"></h2>' +
      (all.length
        ? '<div class="stack gap-3" style="margin-top:var(--s-4)">' +
            all.map(function (a) { return agreementCard(a, u); }).join("") + "</div>"
        : '<p class="small muted" style="margin-top:var(--s-3)" data-i18n="pay.none"></p>') +

      (Session.is("lawyer") && !mine ? agreementForm(u) : "") +
      (isSelf ? "" : "");
  }

  function kindLabel(kind) {
    return I18N.t("pay.kind" + kind.charAt(0).toUpperCase() + kind.slice(1));
  }

  function agreementCard(a, u) {
    var lawyer = M.user(a.lawyerId);
    var me = Session.user();
    var perKey = a.kind === "cases" ? "pay.perCase" : a.kind === "monthly" ? "pay.perMonth" : "pay.perYear";
    return '<article class="card card--pad card--rule-gold">' +
      '<div class="row between wrap gap-4">' +
        '<div class="row gap-3">' + C.avatar(lawyer, "sm") +
          "<div><strong class=\"small\">" +
            esc(I18N.t("pay.with", { name: lawyer ? tx(lawyer.name) : "" })) + "</strong>" +
            '<p class="tiny muted">' + esc(kindLabel(a.kind)) +
              (a.kind === "cases"
                ? " · " + esc(I18N.t("pay.casesProgress",
                    { done: I18N.num(M.casesDone(a)), total: I18N.num(a.cases) }))
                : "") + "</p></div></div>" +
        '<div class="row gap-4">' +
          '<strong class="title" style="color:var(--accent)"><span class="num">' +
            I18N.num(a.amount) + "</span> " + esc(I18N.t("common.sar")) +
            ' <span class="tiny muted">' + esc(I18N.t(perKey)) + "</span></strong>" +
          (me && me.id === a.lawyerId
            ? '<button class="btn btn--ghost btn--sm" type="button" data-end-deal="' +
              esc(a.internId) + '" data-i18n="pay.end"></button>'
            : "") +
        "</div></div></article>";
  }

  function agreementForm(u) {
    return '<div class="card card--pad" style="margin-top:var(--s-6)">' +
      '<h3 class="subtitle" data-i18n="pay.newAgreement"></h3>' +
      '<div class="grid grid-3" style="gap:var(--s-4);margin-top:var(--s-5)">' +
        '<label class="field"><span class="label" data-i18n="pay.kind"></span>' +
          '<select class="select" data-deal-kind>' +
            [["cases", "pay.kindCases"], ["monthly", "pay.kindMonthly"], ["yearly", "pay.kindYearly"]]
              .map(function (k) {
                return '<option value="' + k[0] + '"' + (deal.kind === k[0] ? " selected" : "") + ">" +
                  esc(I18N.t(k[1])) + "</option>";
              }).join("") + "</select></label>" +
        '<label class="field"><span class="label" data-i18n="pay.amount"></span>' +
          '<input class="input num" type="number" min="0" dir="ltr" data-deal-amount value="' +
            esc(deal.amount) + '"></label>' +
        (deal.kind === "cases"
          ? '<label class="field"><span class="label" data-i18n="pay.cases"></span>' +
            '<input class="input num" type="number" min="1" dir="ltr" data-deal-cases value="' +
              esc(deal.cases) + '"></label>'
          : "<span></span>") +
      "</div>" +
      '<p class="form-error" data-deal-error hidden></p>' +
      '<button class="btn btn--primary" type="button" style="margin-top:var(--s-5)" ' +
        'data-make-deal data-i18n="pay.create"></button></div>';
  }

  function reviewsPanel(u) {
    var list = M.reviewsFor(u.id).slice().reverse();
    return C.ratingSummary(u.id) +
      (list.length
        ? '<div class="stack gap-4" style="margin-top:var(--s-6)">' +
          list.map(C.reviewCard).join("") + "</div>"
        : "");
  }

  function articlesPanel(u) {
    var list = M.articlesBy(u.id);
    if (!list.length) return '<p class="small muted" data-i18n="profile.noArticles"></p>';
    return '<div class="grid grid-2">' + list.map(C.articleCard).join("") + "</div>";
  }

  App.onRender(function () {
    var u = id ? M.user(id) : null;
    if (!u || u.roles.indexOf("intern") === -1) {
      host.innerHTML = '<div class="container" style="padding-block:var(--s-16)">' +
        C.empty("search", "profile.notFound") +
        '<p class="center" style="margin-top:var(--s-6)">' +
          '<a class="btn btn--primary" href="lawyers.html" data-i18n="profile.backToDir"></a></p></div>';
      I18N.apply(host);
      return;
    }

    // A tab can disappear when the viewer changes, so fall back to the first.
    var allowed = tabsFor(u).map(function (t) { return t[0]; });
    if (allowed.indexOf(tab) === -1) tab = allowed[0];

    var body = tab === "skills" ? skillsPanel(u)
             : tab === "cert" ? certPanel(u)
             : tab === "pay" ? payPanel(u)
             : tab === "reviews" ? reviewsPanel(u)
             : articlesPanel(u);

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-20);max-width:940px">' +
      head(u) +
      '<div class="tabs" role="tablist">' + tabsFor(u).map(function (t) {
        return '<button class="tab' + (tab === t[0] ? " is-active" : "") + '" type="button" ' +
          'role="tab" data-tab="' + t[0] + '" data-i18n="' + t[1] + '"></button>';
      }).join("") + "</div>" +
      '<div style="margin-top:var(--s-6)">' + body + "</div></div>";

    I18N.apply(host);
    document.title = tx(u.name) + " | " + I18N.t("brand.name");
  });

  host.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab]");
    if (t) { tab = t.getAttribute("data-tab"); App.rerender(); return; }

    if (ev.target.closest("[data-make-deal]")) {
      var u2 = M.user(id);
      var amount = +($("[data-deal-amount]", host) || {}).value;
      var cases = +(($("[data-deal-cases]", host) || {}).value || 0);
      var err = $("[data-deal-error]", host);
      var fail = function (key) { if (err) { err.hidden = false; err.textContent = I18N.t(key); } };
      if (!amount || amount <= 0) { fail("pay.needAmount"); return; }
      if (deal.kind === "cases" && !cases) { fail("pay.needCases"); return; }
      if (err) err.hidden = true;
      Store.addAgreement({ lawyerId: Session.user().id, internId: u2.id,
                           kind: deal.kind, amount: amount, cases: cases });
      deal = { kind: "cases", amount: "", cases: "" };
      App.toast(I18N.t("pay.created", { name: tx(u2.name) }), "check");
      return;
    }

    var endDeal = ev.target.closest("[data-end-deal]");
    if (endDeal) {
      Store.endAgreement(Session.user().id, endDeal.getAttribute("data-end-deal"));
      App.toast(I18N.t("pay.ended"), "close");
      return;
    }

    if (ev.target.closest("[data-issue]")) {
      var u = M.user(id);
      Store.addEndorsement({
        internId: u.id, lawyerId: Session.user().id, hours: M.hoursOf(u.id),
        date: { ar: I18N.t("common.today"), en: I18N.t("common.today") },
        note: null
      });
      App.toast(I18N.t("cert.issuedToast"), "badge");
    }
  });

  host.addEventListener("change", function (ev) {
    var k = ev.target.closest("[data-deal-kind]");
    if (!k) return;
    // Keep what is already typed; only the "cases" field comes and goes.
    deal.kind = k.value;
    deal.amount = ($("[data-deal-amount]", host) || {}).value || "";
    App.rerender();
  });
});

/* ==========================================================================
   Blog — the reading list. Everyone reads; only lawyers and trainees write.
   A trainee's article is held until a lawyer signs it, and the queue of
   unsigned pieces appears here for lawyers, not on a separate page.
   ========================================================================== */
Pages.define("blog", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-blog]");
  if (!host) return;

  var state = { q: "", cat: "" };

  function list() {
    var text = state.q.trim().toLowerCase();
    return M.articles().filter(function (a) {
      if (state.cat && a.cat !== state.cat) return false;
      if (!text) return true;
      return (tx(a.title) + " " + tx(a.excerpt)).toLowerCase().indexOf(text) !== -1;
    });
  }

  function cats() {
    return '<div class="row gap-2 wrap">' +
      '<button type="button" class="chip' + (state.cat ? "" : " is-active") + '" data-cat="" ' +
        'data-i18n="blog.all"></button>' +
      global.SEED.specialties.map(function (s) {
        return '<button type="button" class="chip' + (state.cat === s.id ? " is-active" : "") +
          '" data-cat="' + esc(s.id) + '">' + esc(tx(s)) + "</button>";
      }).join("") + "</div>";
  }

  /** Only lawyers see this, and only when something is actually waiting. */
  function signQueue() {
    if (!Session.is("lawyer")) return "";
    var pending = M.pendingArticles();
    if (!pending.length) return "";
    return '<section class="card card--pad card--rule-gold" style="margin-bottom:var(--s-8)">' +
      '<h2 class="subtitle" data-i18n="blog.pendingTitle"></h2>' +
      '<div class="req-list" style="margin-top:var(--s-4)">' + pending.map(function (a) {
        var author = M.user(a.authorId);
        return '<div class="req-row">' +
          '<span class="req-row__icon">' + Icons.svg("file-text", "icon-sm") + "</span>" +
          '<div class="grow" style="min-width:0"><strong class="small">' + esc(tx(a.title)) + "</strong>" +
            '<p class="tiny muted">' + esc(author ? tx(author.name) : "") + "</p></div>" +
          '<div class="req-row__side"><div class="row gap-2">' +
            '<a class="btn btn--ghost btn--sm" href="article.html?id=' + esc(a.id) + '" ' +
              'data-i18n="blog.readMore"></a>' +
            '<button class="btn btn--accent btn--sm" type="button" data-sign="' + esc(a.id) + '" ' +
              'data-i18n="blog.sign"></button></div></div></div>';
      }).join("") + "</div></section>";
  }

  App.onRender(function () {
    var rows = list();
    var canWrite = Session.is("lawyer") || Session.is("intern");

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header class="row between wrap gap-4" style="margin-bottom:var(--s-8)">' +
        '<div><h1 class="headline" data-i18n="blog.heading"></h1>' +
          '<p class="lead" data-i18n="blog.lead"></p></div>' +
        (canWrite ? '<a class="btn btn--primary" href="editor.html">' + Icons.svg("edit", "icon-sm") +
          '<span data-i18n="blog.write"></span></a>' : "") +
      "</header>" +

      signQueue() +

      '<div class="results-bar">' +
        '<label class="field" style="min-width:260px"><span class="label" data-i18n="blog.search"></span>' +
          '<input class="input" data-q value="' + esc(state.q) + '" ' +
            'data-i18n-attr="placeholder:blog.searchPlaceholder"></label>' +
        cats() +
      "</div>" +

      (rows.length
        ? '<div class="grid grid-3" style="margin-top:var(--s-8)">' + rows.map(C.articleCard).join("") + "</div>"
        : C.empty("search", "blog.noResults")) +
    "</div>";

    I18N.apply(host);
    App.observeReveals(host);
  });

  host.addEventListener("click", function (ev) {
    var c = ev.target.closest("[data-cat]");
    if (c) { state.cat = c.getAttribute("data-cat"); App.rerender(); return; }

    var sg = ev.target.closest("[data-sign]");
    if (sg) {
      Store.setArticle(sg.getAttribute("data-sign"),
        { status: "published", signedBy: Session.user().id });
      App.toast(I18N.t("blog.signed"), "check");
    }
  });

  host.addEventListener("input", function (ev) {
    var f = ev.target.closest("[data-q]");
    if (!f) return;
    state.q = f.value;
    clearTimeout(f._t);
    f._t = setTimeout(function () {
      App.rerender();

});

/* ==========================================================================

Pages.define("article", function (global) {

  host.addEventListener("click", function (ev) {

/* ==========================================================================
   The editor. A lawyer publishes straight away; a trainee's piece is held as
   "pending" until a lawyer signs it in the blog's queue — the signature is
   the professional guarantee behind anything published here.

Pages.define("editor", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-editor]");
  if (!host) return;

  var draft = { title: "", cat: "labour", excerpt: "", body: "" };

  // The artwork is local SVG, so a new article borrows the closest existing

  var COVERS = {
    family: "cover-family.svg", commercial: "cover-corporate.svg",
    realestate: "cover-realestate.svg", labour: "cover-labour.svg",
    ip: "cover-ip.svg"
  };
