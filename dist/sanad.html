<style>
/* ==========================================================================
   سند | Sanad — Design System
   Tokens first: every colour is a variable, so [data-theme="dark"] flips the
   whole site by redefining ~30 values instead of touching components.
   ========================================================================== */

/* ---------- 1. Tokens : Light (default) ---------- */
:root {
  color-scheme: light;

  /* Brand */
  --brand-navy:        #0f172a;
  --brand-gold:        #c8912a;

  /* Surfaces */
  --bg:                #f7f8fd;
  --bg-band:           #e9eefb;   /* the lavender section band */
  --surface:           #ffffff;
  --surface-2:         #f1f4fd;
  --surface-3:         #e4ebfa;
  --surface-inverse:   #101a2e;   /* dark sidebars / dark cards in light mode */
  --on-inverse:        #e8eefc;

  /* Text */
  --text:              #111c2d;
  --text-muted:        #5a6478;
  --text-faint:        #8b93a7;

  /* Lines */
  --border:            #e2e8f2;
  --border-strong:     #cbd5e6;

  /* Actions */
  --primary:           #0f172a;
  --primary-hover:     #1e293b;
  --on-primary:        #ffffff;
  --accent:            #d97706;
  --accent-hover:      #b45309;
  --on-accent:         #ffffff;
  --accent-soft:       #fdf0dd;
  --accent-soft-text:  #96560a;

  /* Status */
  --success:           #15803d;
  --success-soft:      #dcfce7;
  --warning:           #b45309;
  --warning-soft:      #fef3c7;
  --danger:            #b91c1c;
  --danger-soft:       #fee2e2;
  --info:              #1d4ed8;
  --info-soft:         #dbeafe;

  /* Depth */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 20px rgba(15, 23, 42, .05);
  --shadow-2: 0 10px 30px rgba(15, 23, 42, .12);
  --shadow-3: 0 20px 50px rgba(15, 23, 42, .16);
  --ring:     0 0 0 3px rgba(15, 23, 42, .12);

  /* Shape */
  --r-sm: 4px;
  --r:    6px;
  --r-lg: 10px;
  --r-xl: 16px;
  --r-full: 999px;

  /* Rhythm (4px base) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px;

  --container: 1200px;
  --header-h: 72px;

  /* Type */
  --font-ar: "Tajawal", "Cairo", "Segoe UI", system-ui, sans-serif;
  --font-en: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font: var(--font-ar);
}

/* ---------- 2. Tokens : Dark ---------- */
[data-theme="dark"] {
  color-scheme: dark;

  --brand-navy:        #dbe3f7;
  --brand-gold:        #e5b451;

  --bg:                #0a1020;
  --bg-band:           #0e1729;
  --surface:           #121c31;
  --surface-2:         #18243d;
  --surface-3:         #1f2d49;
  --surface-inverse:   #060c18;
  --on-inverse:        #e8eefc;

  --text:              #e8edf8;
  --text-muted:        #a3aec6;
  --text-faint:        #7c88a3;

  --border:            #24314f;
  --border-strong:     #33425f;

  --primary:           #e9eefb;
  --primary-hover:     #ffffff;
  --on-primary:        #0a1020;
  --accent:            #f0a83a;
  --accent-hover:      #f7bb5c;
  --on-accent:         #241701;
  --accent-soft:       #3a2a10;
  --accent-soft-text:  #f3bd68;

  --success:           #4ade80;
  --success-soft:      #10331f;
  --warning:           #fbbf24;
  --warning-soft:      #3a2a10;
  --danger:            #f87171;
  --danger-soft:       #3b1618;
  --info:              #93b4fd;
  --info-soft:         #16264a;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 20px rgba(0, 0, 0, .35);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5);
  --shadow-3: 0 20px 50px rgba(0, 0, 0, .6);
  --ring:     0 0 0 3px rgba(233, 238, 251, .18);
}

/* ---------- 3. Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 16px);
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}

/* English switches the type stack and the writing direction */
html[lang="en"] { --font: var(--font-en); }

img, svg, video { max-width: 100%; display: block; }
img { height: auto; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }

h1, h2, h3, h4, h5 { margin: 0; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
p  { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

::selection { background: var(--accent); color: var(--on-accent); }

/* Only fade colours, never layout — avoids the "everything slides" theme flash */
body, .card, .panel, .btn, .input, .site-header, .chip, .tag, .stat, .field {
  transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto; }
}

/* ---------- 4. Layout primitives ---------- */
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--s-6); }
@media (max-width: 640px) { .container { padding-inline: var(--s-4); } }

.section      { padding-block: var(--s-20); }
.section--tight { padding-block: var(--s-12); }
.section--band  { background: var(--bg-band); }
@media (max-width: 768px) { .section { padding-block: var(--s-12); } }

.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.between { justify-content: space-between; }
.wrap    { flex-wrap: wrap; }
.gap-1 { gap: var(--s-1);} .gap-2 { gap: var(--s-2);} .gap-3 { gap: var(--s-3);}
.gap-4 { gap: var(--s-4);} .gap-6 { gap: var(--s-6);} .gap-8 { gap: var(--s-8);}
.grow  { flex: 1 1 auto; }

.grid { display: grid; gap: var(--s-6); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px)  { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

.hidden { display: none !important; }
/* Author-level display rules (.field, .row) outrank the UA's [hidden] rule,
   so state it explicitly or hidden elements stay on screen. */
[hidden] { display: none !important; }

/* ---------- 5. Typography helpers ---------- */
.display   { font-size: clamp(2rem, 1.2rem + 3.2vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.18; }
.headline  { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2rem); font-weight: 700; }
.title     { font-size: 1.25rem; font-weight: 700; }
.subtitle  { font-size: 1.0625rem; font-weight: 600; }
.lead      { font-size: 1.0625rem; color: var(--text-muted); line-height: 1.7; }
.muted     { color: var(--text-muted); }
.faint     { color: var(--text-faint); }
.small     { font-size: .875rem; }
.tiny      { font-size: .75rem; }
.center    { text-align: center; }
/* Numbers read left-to-right inside Arabic text. `unicode-bidi: isolate` does
   that on its own — an earlier `display: inline-block` did too, but it also
   dropped any <td class="num"> out of its table row. */
.num       { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

.eyebrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: .8125rem; font-weight: 700; letter-spacing: .06em;
  color: var(--accent-soft-text); background: var(--accent-soft);
  padding: var(--s-1) var(--s-3); border-radius: var(--r-full);
}

.section-head { max-width: 640px; margin-bottom: var(--s-10); }
.section-head .lead { margin-top: var(--s-3); }
.section-head.center { margin-inline: auto; }

/* ---------- 6. Icons ---------- */
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
.icon-xl { width: 28px; height: 28px; }
/* A star that has been earned is solid; an empty one stays an outline. That
   difference is the whole point of a star rating, and stroke alone loses it. */
.icon--solid { fill: currentColor; }

/* Arrows must point "forward" in whichever direction the page reads */
[dir="rtl"] .icon-flip { transform: scaleX(-1); }

/* ---------- 7. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-5); height: 44px;
  border-radius: var(--r);
  font-weight: 700; font-size: .9375rem;
  border: 1.5px solid transparent;
  white-space: nowrap;
  transition: background-color .18s, border-color .18s, color .18s, transform .18s, box-shadow .18s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-2); }

.btn--accent  { background: var(--accent); color: var(--on-accent); }
.btn--accent:hover { background: var(--accent-hover); box-shadow: var(--shadow-2); }

.btn--outline { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
.btn--outline:hover { border-color: var(--primary); background: var(--surface-2); }

.btn--ghost   { color: var(--text-muted); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); }

.btn--sm  { height: 36px; padding: 0 var(--s-4); font-size: .875rem; }
.btn--lg  { height: 52px; padding: 0 var(--s-8); font-size: 1rem; }
.btn--block { width: 100%; }
.btn[disabled], .btn.is-disabled { opacity: .5; pointer-events: none; }

/* ---------- 8. Cards & panels ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card--pad { padding: var(--s-6); }
.card--hover { transition: transform .2s, box-shadow .2s, border-color .2s; }
.card--hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
/* 4px category rule along the top, per the brand spec */
.card--rule-navy  { border-top: 4px solid var(--primary); }
.card--rule-gold  { border-top: 4px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.panel__head { padding: var(--s-5) var(--s-6); border-bottom: 1px solid var(--border); }
.panel__body { padding: var(--s-6); }

.divider { height: 1px; background: var(--border); border: 0; margin: var(--s-5) 0; }

/* ---------- 9. Chips, tags, pills ---------- */
.tag {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 3px var(--s-3); border-radius: var(--r-full);
  background: var(--surface-3); color: var(--text-muted);
  font-size: .75rem; font-weight: 600;
}
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-full);
  border: 1.5px solid var(--border-strong); background: var(--surface);
  font-size: .875rem; font-weight: 600; color: var(--text-muted);
  transition: all .18s;
}
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip.is-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-soft-text); }

.status { display: inline-flex; align-items: center; gap: var(--s-2); padding: 3px var(--s-3); border-radius: var(--r-full); font-size: .75rem; font-weight: 700; }
.status--ok    { background: var(--success-soft); color: var(--success); }
.status--warn  { background: var(--warning-soft); color: var(--warning); }
.status--info  { background: var(--info-soft);    color: var(--info); }
.status--muted { background: var(--surface-3);    color: var(--text-muted); }

.rating { display: inline-flex; align-items: center; gap: var(--s-1); font-weight: 700; font-size: .875rem; }
.rating .icon { color: var(--accent); fill: var(--accent); stroke: none; }

/* ---------- 10. Forms ---------- */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.label { font-size: .875rem; font-weight: 600; color: var(--text-muted); }

.input, .select, .textarea {
  width: 100%; height: 46px;
  padding: 0 var(--s-4);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  transition: border-color .18s, box-shadow .18s, background-color .25s;
}
.textarea { height: auto; min-height: 120px; padding: var(--s-3) var(--s-4); resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }

.select {
  appearance: none;
  /* Neutral grey chevron: one asset that stays legible in both themes. */
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2389919f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-size: 16px 16px;
  padding-inline-end: var(--s-4);
  padding-inline-start: var(--s-10);
}
[dir="rtl"] .select { background-position: left var(--s-4) center; }
[dir="ltr"] .select {
  background-position: right var(--s-4) center;
  padding-inline-start: var(--s-4);
  padding-inline-end: var(--s-10);
}

.input-group { position: relative; display: flex; align-items: center; }
.input-group .icon { position: absolute; inset-inline-start: var(--s-4); color: var(--text-faint); pointer-events: none; }
.input-group .input { padding-inline-start: calc(var(--s-4) * 2 + 20px); }

.check { display: flex; align-items: center; gap: var(--s-3); cursor: pointer; padding: var(--s-1) 0; font-size: .9375rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
.check span { color: var(--text-muted); }
.check:hover span { color: var(--text); }

/* ---------- 11. Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
@supports not (backdrop-filter: blur(1px)) { .site-header { background: var(--surface); } }

.site-header__inner { display: flex; align-items: center; gap: var(--s-4); height: var(--header-h); min-width: 0; }

.brand { display: flex; align-items: center; gap: var(--s-3); font-weight: 800; flex: none; }
.brand__mark { width: 38px; height: 38px; flex: none; }
.brand__text { display: flex; align-items: baseline; gap: var(--s-2); font-size: 1.125rem; letter-spacing: -.01em; }
.brand__sep { width: 2px; height: 18px; background: var(--accent); border-radius: 2px; align-self: center; }
.brand__latin { font-family: var(--font-en); font-weight: 800; }

/* The nav sits between a brand and a set of actions that both have a fixed
   claim on the row, and its own width depends on how long six labels happen
   to be in the current language. Adding the notice bell was enough to push a
   lawyer's English header past 1200px, and a header that outgrows the page
   widens the whole document. So the nav is allowed to shrink and, if it ever
   must, to scroll inside itself — the same rule wide tables follow. It never
   makes the page wider than the screen. */
.nav {
  display: flex; align-items: center; gap: var(--s-1); margin-inline: auto;
  min-width: 0; flex-shrink: 1;
  overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav__link {
  position: relative; padding: var(--s-2) var(--s-4); border-radius: var(--r); white-space: nowrap;
  font-size: .9375rem; font-weight: 600; color: var(--text-muted);
  transition: color .18s, background-color .18s;
}
.nav__link:hover { color: var(--text); background: var(--surface-2); }
.nav__link.is-active { color: var(--text); }
.nav__link.is-active::after {
  content: ""; position: absolute; inset-inline: var(--s-4); bottom: -2px;
  height: 2px; background: var(--accent); border-radius: 2px;
}

.header-actions { display: flex; align-items: center; gap: var(--s-2); flex: none; }

/* A phone header has 390px and five things that each want room. Left alone
   they add up to 413 and the browser zooms the entire page out to fit — which
   is what made every signed-in page look shrunken rather than merely tight.
   So on a phone the header carries only what the bottom bar cannot: the mark,
   theme, language, the bell, and who you are. */
@media (max-width: 640px) {
  .header-actions .btn { display: none; }   /* sign in / register live in the tab bar */
  .brand__text { display: none; }           /* the mark alone is the brand here */

  /* Who you are is the last tab on the bar at the bottom of the screen, an
     inch from the thumb. Repeating it up here bought nothing and cost the
     row its last comfortable gap. */
  /* Scoped through .header-actions on purpose: the plain .role-badge rule is
     further down the file and would win on equal specificity from there. */
  .header-actions .role-badge { display: none; }

  /* Three controls, evenly spaced, reading as icons rather than as a row of
     little boxes — the borders were doing the work of separating things that
     spacing separates better. */
  .site-header__inner { gap: var(--s-2); }
  .header-actions { gap: var(--s-1); }
  .header-actions .icon-btn {
    border-color: transparent; background: transparent;
    width: 42px; height: 42px;
  }
  .header-actions .icon-btn:active { background: var(--surface-2); }
  .icon-btn--wide { width: 42px; padding-inline: 0; }
  /* The globe is redundant next to two letters that already say "language". */
  .icon-btn--wide .icon { display: none; }
  .lang-btn__code { font-size: .875rem; }
  .brand__mark { width: 34px; height: 34px; }
}

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-1);
  width: 40px; height: 40px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
  transition: all .18s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn--wide { width: auto; padding: 0 var(--s-3); font-size: .8125rem; font-weight: 700; }
.lang-btn__code { font-family: var(--font-en); letter-spacing: .04em; }

/* The two theme glyphs swap so the button always shows what you'd switch TO */
[data-theme="dark"] .icon-moon,
:root:not([data-theme="dark"]) .icon-sun { display: none; }

/* Phone: the top nav collapses into the bottom tab bar below. */
@media (max-width: 1024px) {
  .nav { display: none; }
  /* The nav carried `margin-inline: auto` and was what held the brand and the
     controls apart. With it hidden they bunched together against one edge and
     left the rest of the row empty, so the spacing has to come from here. */
  .header-actions { margin-inline-start: auto; }
}

/* ---------- 11a0. The staff console ---------- */
.adm-tabs {
  display: flex; gap: var(--s-1); margin-bottom: var(--s-6);
  overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.adm-tabs::-webkit-scrollbar { display: none; }
.adm-tab {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-4); white-space: nowrap;
  font-size: .9375rem; font-weight: 600; color: var(--text-muted);
  border-block-end: 2px solid transparent; margin-block-end: -1px;
  transition: color .18s, border-color .18s;
}
.adm-tab:hover { color: var(--text); }
.adm-tab.is-active { color: var(--text); border-block-end-color: var(--accent); }

.kpi-grid {
  display: grid; gap: var(--s-4);
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.kpi {
  display: flex; flex-direction: column; gap: var(--s-2);
  padding: var(--s-5); border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--border);
}
.kpi__label { font-size: .75rem; color: var(--text-faint); font-weight: 600; }
.kpi__value { font-size: 1.375rem; letter-spacing: -.02em; }
/* Tone is carried by a rule down one edge rather than by tinting the whole
   card: a wall of coloured blocks tells you nothing about which one matters. */
.kpi--good { border-inline-start: 3px solid var(--success); }
.kpi--bad  { border-inline-start: 3px solid var(--danger); }
.kpi--warn { border-inline-start: 3px solid var(--warning); }

.admin-card { margin-bottom: var(--s-3); }
.admin-line {
  padding-block: var(--s-3);
  border-block-end: 1px solid var(--border);
}
.admin-line:last-child { border-block-end: 0; }

@media (max-width: 640px) {
  .kpi { padding: var(--s-4); }
  .kpi__value { font-size: 1.125rem; }
  .adm-tab { padding: var(--s-3) var(--s-3); font-size: .875rem; }
}

/* ---------- 11a0a. How a request is going ---------- */
.track {
  padding: var(--s-5); border-radius: var(--r-lg);
  background: var(--surface-2); border: 1px solid var(--border);
}
.track--held { background: var(--warning-soft); border-color: var(--warning); }
/* On a row rather than in a panel: tucked under the request it belongs to,
   quieter than the card above it so the list still reads as a list. */
.track-slot { margin: calc(var(--s-2) * -1) 0 var(--s-4); padding-inline: var(--s-3); }
.track-slot .track { background: transparent; border-style: dashed; padding: var(--s-4); }
.track__steps {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
  margin-top: var(--s-5); list-style: none;
}
.track__step {
  display: flex; flex-direction: column; align-items: center; gap: var(--s-2);
  position: relative; text-align: center;
}
/* The rail runs between the dots rather than under the labels, so it never
   crosses a word and never has to be redrawn when one wraps. */
.track__step::before {
  content: ""; position: absolute; inset-block-start: 11px; inset-inline-end: 50%;
  inline-size: 100%; block-size: 2px; background: var(--border);
}
.track__step:first-child::before { display: none; }
.track__step.is-done::before, .track__step.is-here::before { background: var(--accent); }
.track__dot {
  inline-size: 24px; block-size: 24px; border-radius: var(--r-full);
  display: grid; place-items: center; flex: none; position: relative; z-index: 1;
  background: var(--surface); border: 2px solid var(--border); color: var(--on-accent);
}
.track__step.is-done .track__dot { background: var(--accent); border-color: var(--accent); }
.track__step.is-here .track__dot {
  border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
}
.track__label { font-size: .6875rem; color: var(--text-faint); line-height: 1.3; }
.track__step.is-done .track__label,
.track__step.is-here .track__label { color: var(--text); font-weight: 600; }

@media (max-width: 520px) {
  .track__label { font-size: .625rem; }
}

/* ---------- 11a0b. What the platform is saying ---------- */
.announce {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  background: var(--accent-soft); color: var(--accent-soft-text);
  border-block-end: 1px solid var(--border);
}
.announce__body { font-size: .875rem; }
.announce a { font-weight: 700; text-decoration: underline; }

/* ---------- 11a0c. A promoted announcement on the home page ---------- */
.promo {
  position: relative; overflow: hidden;
  border-radius: var(--r-xl);
  padding: var(--s-10) var(--s-8);
  background: linear-gradient(135deg,
    var(--brand-navy) 0%,
    color-mix(in srgb, var(--brand-navy) 80%, var(--accent)) 100%);
  color: #fff;
  box-shadow: var(--shadow-2);
}
.promo + .promo { margin-top: var(--s-4); }
.promo__body { position: relative; z-index: 1; max-width: 46ch; }
.promo .title { color: #fff; }
.promo .lead { color: rgba(255,255,255,.82); margin-top: var(--s-3); }
.promo .btn { margin-top: var(--s-5); }

/* With an image behind it the text needs its own ground to sit on, or the
   contrast is whatever the picture happens to be. */
.promo--image { background-size: cover; background-position: center; }
.promo--image::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to inline-start,
    rgba(11,22,48,.15) 0%, rgba(11,22,48,.86) 62%);
}

/* Markup the platform wrote itself: given room and left alone. */
.promo--raw { padding: 0; background: none; color: inherit; box-shadow: none; }
.promo--raw > * { max-width: 100%; }
.promo--raw img { display: block; width: 100%; height: auto; border-radius: var(--r-xl); }

@media (max-width: 640px) {
  .promo { padding: var(--s-8) var(--s-5); border-radius: var(--r-lg); }
}

/* ---------- 11a1. When the backend cannot be reached ---------- */
.offline-bar {
  position: fixed; inset-inline: 0; inset-block-start: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  gap: var(--s-3) var(--s-4); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--danger); color: #fff; text-align: center;
  font-size: .875rem;
}
.offline-bar .btn { background: #fff; color: var(--danger); border-color: #fff; font-weight: 700; }

/* ---------- 11a2. Notices ---------- */
.notice-wrap { position: relative; display: inline-flex; }
.notice-bell { position: relative; }
.notice-bell__count {
  position: absolute; inset-block-start: 2px; inset-inline-end: 2px;
  min-width: 17px; height: 17px; padding: 0 4px; border-radius: var(--r-full);
  background: var(--danger); color: #fff;
  font-size: .625rem; font-weight: 700; line-height: 17px; text-align: center;
}
.notice-panel {
  position: absolute; inset-block-start: calc(100% + var(--s-2)); inset-inline-end: 0;
  z-index: 90; width: min(320px, calc(100vw - var(--s-8)));
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3); overflow: hidden;
}
.notice-panel[hidden] { display: none; }
.notice-panel__head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-block-end: 1px solid var(--border);
}
.notice-panel__list { max-height: min(60vh, 380px); overflow-y: auto; }
.notice {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); font-size: .875rem; color: var(--text-muted);
  border-block-end: 1px solid var(--border);
}
.notice:hover { background: var(--surface-2); }
.notice__dot { width: 7px; height: 7px; border-radius: var(--r-full); background: transparent; flex: none; }
/* Unread is not carried by colour alone: the weight changes with it. */
.notice.is-unread { color: var(--text); font-weight: 600; }
.notice.is-unread .notice__dot { background: var(--accent); }

@media (max-width: 640px) {
  /* On a phone the list is a sheet, not a dropdown clinging to a 40px button. */
  .notice-panel {
    position: fixed; inset-inline: var(--s-3); inset-block-start: auto;
    inset-block-end: calc(72px + env(safe-area-inset-bottom, 0px));
    width: auto;
  }
}

/* ---------- 11b. Bottom tab bar (phones) ---------- */
.tabbar { display: none; }
@media (max-width: 1024px) {
  .tabbar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 80;
    /* minmax(0, 1fr) rather than 1fr: a plain `1fr` track will not shrink
       below its content's min-content width, so one long label — "تسجيل
       الدخول" was the culprit — pushed the bar past the viewport and the
       phone browser zoomed the whole page out to fit it. */
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px) saturate(160%);
    border-top: 1px solid var(--border);
    /* clear the iPhone home indicator */
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @supports not (backdrop-filter: blur(1px)) { .tabbar { background: var(--surface); } }

  .tabbar__link {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: var(--s-2) var(--s-1) var(--s-3);
    min-height: 56px;                    /* a comfortable thumb target */
    font-size: .6875rem; font-weight: 600; color: var(--text-faint);
    transition: color .18s;
    position: relative; min-width: 0;
  }
  .tabbar__link span {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tabbar__link .icon { width: 22px; height: 22px; }
  .tabbar__link:hover { color: var(--text-muted); }
  .tabbar__link.is-active { color: var(--accent); }
  .tabbar__link.is-active::before {
    content: ""; position: absolute; top: 0; inset-inline: 28%;
    height: 2px; border-radius: 0 0 2px 2px; background: var(--accent);
  }

  /* Keep the bar from covering the end of the page. */
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .toast { inset-block-end: calc(76px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- 12. Footer ---------- */
.site-footer { background: var(--bg-band); border-top: 1px solid var(--border); padding-block: var(--s-16) var(--s-8); margin-top: auto; }
.site-footer__grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: var(--s-8); }
@media (max-width: 900px) { .site-footer__grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .site-footer__grid { grid-template-columns: 1fr; } }
.footer-title { font-size: .875rem; font-weight: 700; margin-bottom: var(--s-4); }
.footer-link { display: block; padding: var(--s-1) 0; font-size: .9375rem; color: var(--text-muted); transition: color .18s; }
.footer-link:hover { color: var(--accent); }
.site-footer__bottom { margin-top: var(--s-10); padding-top: var(--s-6); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--s-4); justify-content: space-between; align-items: center; font-size: .875rem; color: var(--text-muted); }

/* ---------- 13. Hero + search ---------- */
.hero { position: relative; padding-block: var(--s-20) var(--s-16); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(60% 70% at 70% 0%,  color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(50% 60% at 20% 10%, color-mix(in srgb, var(--info) 14%, transparent), transparent 70%);
}
.hero__inner { max-width: 820px; margin-inline: auto; text-align: center; }
.hero .lead { margin-top: var(--s-5); font-size: 1.125rem; }

.searchbar {
  margin-top: var(--s-8);
  display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: var(--s-3);
  padding: var(--s-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-2);
  text-align: start;
}
@media (max-width: 860px) { .searchbar { grid-template-columns: 1fr 1fr; } .searchbar .btn { grid-column: 1 / -1; } }
@media (max-width: 520px) { .searchbar { grid-template-columns: 1fr; } }
.searchbar .btn { height: 46px; }

.trustbar { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s-6); margin-top: var(--s-8); color: var(--text-muted); font-size: .875rem; }
.trustbar span { display: inline-flex; align-items: center; gap: var(--s-2); }

/* ---------- 14. Feature / step cards ---------- */
.feature { padding: var(--s-6); height: 100%; display: flex; flex-direction: column; gap: var(--s-3); }
.feature__icon {
  width: 48px; height: 48px; border-radius: var(--r-lg);
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text);
}
.card--rule-gold .feature__icon { background: var(--accent-soft); color: var(--accent-soft-text); }

.step { position: relative; padding: var(--s-6); }
.step__num {
  width: 40px; height: 40px; border-radius: var(--r-full);
  display: grid; place-items: center; font-weight: 800;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-en);
}

/* ---------- 15. Lawyer cards ---------- */
.lawyer-card { display: flex; flex-direction: column; height: 100%; }
.lawyer-card__body { padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.lawyer-card__foot { padding: var(--s-4) var(--s-6) var(--s-6); }
/* Side-by-side actions get too cramped below ~480px — stack them instead. */
@media (max-width: 480px) {
  .lawyer-card__foot { flex-direction: column; align-items: stretch; }
}
.avatar { border-radius: var(--r-lg); object-fit: cover; background: var(--surface-3); }
.avatar--lg { width: 88px; height: 88px; }
.avatar--md { width: 64px; height: 64px; }
.avatar--sm { width: 40px; height: 40px; border-radius: var(--r-full); }
.avatar--round { border-radius: var(--r-full); }
.verified { color: var(--info); }
.verified .icon { fill: currentColor; stroke: none; }

.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); font-size: .8125rem; color: var(--text-muted); }
.dot { display: inline-block; width: 3px; height: 3px; border-radius: 50%;
       background: var(--border-strong); vertical-align: middle; }
.meta-row .dot { display: block; }

.price-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); }
.price-grid > div { padding: var(--s-4) var(--s-2); text-align: center; }
.price-grid > div + div { border-inline-start: 1px solid var(--border); }
.price-grid .icon { margin-inline: auto; color: var(--text-muted); margin-bottom: var(--s-2); }
.price-grid strong { display: block; font-size: .875rem; }
/* An unavailable service greys the whole cell, but only the figure is struck. */
.price-grid .off { color: var(--text-faint); }
.price-grid .off strong { text-decoration: line-through; }

/* ---------- 16. Directory layout ---------- */
.directory { display: grid; grid-template-columns: 280px 1fr; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .directory { grid-template-columns: 1fr; } }
.filters { position: sticky; top: calc(var(--header-h) + var(--s-6)); }
@media (max-width: 1024px) { .filters { position: static; } }
.filter-group + .filter-group { margin-top: var(--s-6); padding-top: var(--s-6); border-top: 1px solid var(--border); }
.filter-group__title { font-size: .875rem; font-weight: 700; margin-bottom: var(--s-3); }

.results-bar { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: center; justify-content: space-between; padding: var(--s-4) var(--s-5); }

.pagination { display: flex; justify-content: center; gap: var(--s-2); margin-top: var(--s-10); }
.page-btn {
  min-width: 40px; height: 40px; padding: 0 var(--s-3);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface); font-weight: 700; font-size: .875rem;
  transition: all .18s;
}
.page-btn:hover { border-color: var(--primary); }
.page-btn.is-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

.empty { padding: var(--s-16) var(--s-6); text-align: center; color: var(--text-muted); }
.empty .icon { margin-inline: auto; margin-bottom: var(--s-4); color: var(--text-faint); }

/* ---------- 17. Profile page ---------- */
.profile-layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .profile-layout { grid-template-columns: 1fr; } }
.booking { position: sticky; top: calc(var(--header-h) + var(--s-6)); }
@media (max-width: 1024px) { .booking { position: static; } }

.tabs { display: flex; gap: var(--s-1); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {
  padding: var(--s-3) var(--s-4); font-weight: 700; font-size: .9375rem;
  color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .18s, border-color .18s;
}
.tab:hover { color: var(--text); }
.tab.is-active { color: var(--text); border-bottom-color: var(--accent); }
.tab-panel[hidden] { display: none; }

.stat-strip { display: flex; flex-wrap: wrap; gap: var(--s-6); }
.stat-strip > div { display: flex; align-items: center; gap: var(--s-3); }
.stat-strip .icon { color: var(--text-muted); }

.timeline { position: relative; padding-inline-start: var(--s-6); }
.timeline::before { content: ""; position: absolute; inset-block: 6px; inset-inline-start: 5px; width: 2px; background: var(--border); }
.timeline li { position: relative; padding-bottom: var(--s-6); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before {
  content: ""; position: absolute; inset-inline-start: calc(var(--s-6) * -1 + 1px); top: 7px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface);
}

.bullets li { position: relative; padding-inline-start: var(--s-5); padding-block: var(--s-1); }
.bullets li::before { content: ""; position: absolute; inset-inline-start: 0; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Calendar */
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s-1); }
.calendar__dow { text-align: center; font-size: .6875rem; font-weight: 700; color: var(--text-faint); padding-bottom: var(--s-2); }
.day {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--r);
  font-size: .8125rem; font-weight: 600; font-variant-numeric: tabular-nums;
  transition: all .15s;
}
.day:hover:not(.is-off) { background: var(--surface-2); }
.day.is-weekend { color: var(--danger); }
.day.is-off { color: var(--text-faint); pointer-events: none; }
.day.is-selected { background: var(--primary); color: var(--on-primary); }

.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-2); }
.slot {
  height: 42px; border-radius: var(--r); border: 1.5px solid var(--border);
  background: var(--surface); font-size: .875rem; font-weight: 600;
  transition: all .15s;
}
.slot:hover:not(.is-off) { border-color: var(--primary); }
.slot.is-selected { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.slot.is-off { color: var(--text-faint); text-decoration: line-through; pointer-events: none; opacity: .6; }

/* ---------- 18. Blog ---------- */
.blog-layout { display: grid; grid-template-columns: 320px 1fr; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .blog-layout { grid-template-columns: 1fr; } }
.article-card { display: flex; flex-direction: column; height: 100%; }
.article-card__media { position: relative; aspect-ratio: 16 / 9; background: var(--surface-3); overflow: hidden; }
.article-card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.article-card:hover .article-card__media img { transform: scale(1.04); }
.article-card__cat { position: absolute; top: var(--s-3); inset-inline-end: var(--s-3); background: var(--surface); color: var(--text); padding: var(--s-1) var(--s-3); border-radius: var(--r-full); font-size: .75rem; font-weight: 700; box-shadow: var(--shadow-1); }
.article-card__body { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.article-card__foot { padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }

.newsletter { background: var(--surface-inverse); color: var(--on-inverse); border-radius: var(--r-lg); padding: var(--s-6); }
.newsletter .input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); color: var(--on-inverse); }
.newsletter .input::placeholder { color: rgba(232,238,252,.5); }

/* ---------- 19. Dashboard shell ---------- */
/* The rail's colour is painted by the grid itself, so it keeps running to the
   bottom on long pages even though the sidebar is only one viewport tall. */
.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; background: var(--surface-inverse); }
@media (max-width: 1024px) { .app { grid-template-columns: 1fr; } }

.sidebar {
  background: var(--surface-inverse); color: var(--on-inverse);
  padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-6);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
@media (max-width: 1024px) { .sidebar { position: static; height: auto; } }
.sidebar__user { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); padding-bottom: var(--s-6); border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar__user img { width: 84px; height: 84px; border-radius: var(--r-lg); object-fit: cover; border: 2px solid var(--accent); }
.side-link {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-radius: var(--r);
  color: rgba(232,238,252,.6); font-weight: 600; font-size: .9375rem;
  position: relative; transition: all .18s;
}
.side-link:hover { color: var(--on-inverse); background: rgba(255,255,255,.06); }
.side-link.is-active { color: var(--on-inverse); background: rgba(255,255,255,.08); }
.side-link.is-active::before {
  content: ""; position: absolute; inset-inline-start: 0; inset-block: 8px;
  width: 3px; border-radius: 3px; background: var(--accent);
}
.side-link.is-active .icon { color: var(--accent); }
.sidebar__foot { margin-top: auto; }

.app-main { padding: var(--s-8); min-width: 0; background: var(--bg); }
@media (max-width: 640px) { .app-main { padding: var(--s-5) var(--s-4); } }
.app-head { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: flex-start; justify-content: space-between; margin-bottom: var(--s-8); }

.stat { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-2); }
.stat__top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.stat__icon { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; background: var(--surface-3); color: var(--text-muted); }
.card--rule-gold .stat__icon { background: var(--accent-soft); color: var(--accent-soft-text); }
.stat__value { font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.trend { display: inline-flex; align-items: center; gap: var(--s-1); font-size: .8125rem; font-weight: 600; }
.trend--up { color: var(--success); }
.trend--down { color: var(--danger); }

.list-row { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) 0; }
.list-row + .list-row { border-top: 1px solid var(--border); }
.list-row__icon { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; background: var(--surface-2); color: var(--text-muted); flex: none; }

.countdown { background: var(--info-soft); color: var(--text); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); text-align: center; }
.countdown__time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; direction: ltr; }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--s-1); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.toolbar__sep { width: 1px; align-self: stretch; background: var(--border); margin-inline: var(--s-2); }
.tool { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; color: var(--text-muted); transition: all .15s; }
.tool:hover { background: var(--surface-3); color: var(--text); }
.tool.is-active { background: var(--surface-3); color: var(--text); }

.editor { padding: var(--s-6); min-height: 340px; }
.editor__title { font-size: 1.75rem; font-weight: 800; border: 0; background: none; width: 100%; outline: none; padding: 0; margin-bottom: var(--s-4); }
.editor__title::placeholder { color: var(--text-faint); }
.editor__body { min-height: 240px; outline: none; color: var(--text-muted); line-height: 1.8; }
.editor__body:empty::before { content: attr(data-placeholder); color: var(--text-faint); }

/* ---------- 20. Auth ---------- */
.auth { min-height: calc(100vh - var(--header-h)); display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .auth { grid-template-columns: 1fr; } }
.auth__aside { background: var(--surface-inverse); color: var(--on-inverse); padding: var(--s-16) var(--s-10); display: flex; flex-direction: column; justify-content: center; gap: var(--s-6); }
@media (max-width: 900px) { .auth__aside { display: none; } }
.auth__form { padding: var(--s-16) var(--s-6); display: flex; flex-direction: column; justify-content: center; }
.auth__form > * { width: min(420px, 100%); margin-inline: auto; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); }
.seg button { padding: var(--s-2) var(--s-5); border-radius: var(--r-sm); font-weight: 700; font-size: .875rem; color: var(--text-muted); transition: all .18s; }
.seg button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

/* ---------- 21. Misc ---------- */
.page { display: flex; flex-direction: column; min-height: 100vh; }
.page > main { flex: 1; }

.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); font-size: .875rem; color: var(--text-muted); padding-block: var(--s-6); }
.breadcrumb a:hover { color: var(--accent); }

.cta-band { background: var(--surface-inverse); color: var(--on-inverse); border-radius: var(--r-xl); padding: var(--s-12); text-align: center; }
.cta-band .lead { color: rgba(232,238,252,.72); }

.toast {
  position: fixed; inset-block-end: var(--s-6); inset-inline: var(--s-6) auto;
  z-index: 200; display: flex; align-items: center; gap: var(--s-3);
  background: var(--surface-inverse); color: var(--on-inverse);
  padding: var(--s-4) var(--s-5); border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  font-size: .9375rem; font-weight: 600;
  transform: translateY(140%); opacity: 0;
  transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
}
.toast.is-visible { transform: translateY(0); opacity: 1; }
.toast .icon { color: var(--accent); }

.skip-link {
  position: absolute; inset-inline-start: -9999px; top: var(--s-2); z-index: 200;
  background: var(--primary); color: var(--on-primary); padding: var(--s-3) var(--s-5); border-radius: var(--r);
}
.skip-link:focus { inset-inline-start: var(--s-4); }

.reveal { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; }
.reveal.is-in { opacity: 1; transform: none; }

/* Client dashboard: main column + rail, collapsing to one column on tablets */
.dash-split { grid-template-columns: 1fr 340px; align-items: start; }
@media (max-width: 1100px) { .dash-split { grid-template-columns: 1fr; } }

/* ---------- FAQ accordion ---------- */
.faq-item { padding: 0; }
.faq-q {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-5) var(--s-6); font-weight: 700;
}
.faq-q::-webkit-details-marker { display: none; }
.faq-q:hover { color: var(--accent); }
.faq-chevron { transition: transform .2s; color: var(--text-muted); }
.faq-item[open] .faq-chevron { transform: rotate(180deg); }
.faq-a { padding: 0 var(--s-6) var(--s-5); color: var(--text-muted); line-height: 1.7; }

/* ==========================================================================
   Roles, task bank, assistant, account
   ========================================================================== */

/* ---------- header role badge ---------- */
.role-badge {
  display: inline-flex; align-items: center; gap: var(--s-3);
  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-1);
  border: 1.5px solid var(--border); border-radius: var(--r-full);
  background: var(--surface); transition: all .18s;
}
[dir="ltr"] .role-badge { padding: var(--s-1) var(--s-1) var(--s-1) var(--s-3); }
.role-badge:hover { border-color: var(--border-strong); background: var(--surface-2); }
.role-badge__mark {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.role-badge__text { display: flex; flex-direction: column; line-height: 1.2; }
.role-badge__text strong { font-size: .625rem; font-weight: 600; color: var(--text-faint); }
.role-badge__text span { font-size: .8125rem; font-weight: 700; }
@media (max-width: 1024px) { .role-badge__text { display: none; } .role-badge { padding: var(--s-1); } }

/* ---------- role picker cards ---------- */
.role-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-2);
  position: relative; text-align: start;
  padding: var(--s-5); border-radius: var(--r-lg);
  border: 1.5px solid var(--border); background: var(--surface);
  transition: all .18s;
}
.role-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-1); }
.role-card.is-active { border-color: var(--accent); background: var(--accent-soft); }
.role-card__icon {
  width: 44px; height: 44px; border-radius: var(--r); display: grid; place-items: center;
  background: var(--surface-3); color: var(--text);
}
.role-card.is-active .role-card__icon { background: var(--accent); color: var(--on-accent); }
.role-card__check {
  position: absolute; top: var(--s-3); inset-inline-end: var(--s-3);
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}

/* ---------- account quick links ---------- */
.account-link {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-2); font-weight: 600; font-size: .9375rem;
  color: var(--text-muted); transition: color .18s, padding .18s;
}
.account-link + .account-link { border-top: 1px solid var(--border); }
.account-link:hover { color: var(--text); padding-inline-start: var(--s-4); }
.account-link__go { margin-inline-start: auto; color: var(--text-faint); }
[dir="rtl"] .account-link__go { transform: scaleX(-1); }

/* ---------- task bank ---------- */
.task-card { display: flex; flex-direction: column; height: 100%; }
.task-card__body { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.task-card__meta {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3);
  padding-top: var(--s-4); margin-top: auto; border-top: 1px solid var(--border);
}
.task-card__meta > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.task-card__meta strong { font-size: .875rem; }
.task-card__meta .reward { color: var(--accent); font-size: 1rem; }
.task-card__foot { padding: 0 var(--s-5) var(--s-5); }
.task-card.is-taken { opacity: .82; }
@media (max-width: 480px) { .task-card__meta { grid-template-columns: 1fr 1fr; } }

/* ---------- assistant chat ---------- */
.chat {
  padding: var(--s-5); min-height: 300px; max-height: 460px; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--s-4);
  background: var(--surface-2); border-block: 1px solid var(--border);
}
.bubble {
  max-width: min(72ch, 88%); align-self: flex-start;
  padding: var(--s-4) var(--s-5); border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
}
/* The reader's own turn sits on the side the page reads from. */
.bubble--user {
  align-self: flex-end;
  background: var(--primary); color: var(--on-primary); border-color: var(--primary);
}
.bubble__who {
  display: block; font-size: .6875rem; font-weight: 700;
  letter-spacing: .04em; opacity: .6; margin-bottom: var(--s-2);
}
.bubble p { line-height: 1.75; font-size: .9375rem; }

.chat-composer { display: flex; gap: var(--s-3); padding: var(--s-4) var(--s-5); }
.chat-composer .input { flex: 1; }
@media (max-width: 520px) {
  .chat-composer { flex-direction: column; }
  .chat-composer .btn { width: 100%; }
}

.disclaimer {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border);
  background: var(--warning-soft); color: var(--warning);
  font-size: .8125rem; line-height: 1.6;
}
.disclaimer .icon { flex: none; margin-top: 2px; }

/* ==========================================================================
   AI drafting — the home offer, the client order flow, the lawyer workspace
   ========================================================================== */

/* ---------- home: the offer block ---------- */
.offer {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-10);
  align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  border-radius: var(--r-xl); padding: var(--s-10);
  box-shadow: var(--shadow-1);
}
@media (max-width: 900px) { .offer { grid-template-columns: 1fr; padding: var(--s-6); gap: var(--s-6); } }
.offer__copy { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-4); }
.offer__list { display: flex; flex-direction: column; }
.offer__list li {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) 0;
}
.offer__list li + li { border-top: 1px solid var(--border); }
.offer__price { text-align: end; flex: none; }
.offer__price strong { display: block; color: var(--accent); font-size: 1.125rem; }

/* ---------- client: ordering a draft ---------- */
.order-layout { display: grid; grid-template-columns: 1fr 340px; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .order-layout { grid-template-columns: 1fr; } }

.doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-3); }
@media (max-width: 640px) { .doc-grid { grid-template-columns: 1fr; } }
.doc-option {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-1);
  text-align: start; padding: var(--s-4);
  border: 1.5px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); transition: all .18s;
}
.doc-option:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.doc-option.is-active { border-color: var(--accent); background: var(--accent-soft); }
.doc-option__price { margin-top: var(--s-2); font-weight: 800; color: var(--accent); }

/* Numbered flow — the order genuinely matters here. */
.flow { counter-reset: flow; display: flex; flex-direction: column; gap: var(--s-4); }
.flow li { counter-increment: flow; position: relative; padding-inline-start: var(--s-10); }
.flow li::before {
  content: counter(flow);
  position: absolute; inset-inline-start: 0; top: 0;
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--primary); color: var(--on-primary);
  font-size: .75rem; font-weight: 800; font-family: var(--font-en);
}

/* ---------- lawyer: the workspace ---------- */
.workspace { display: grid; grid-template-columns: 340px 1fr; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .workspace { grid-template-columns: 1fr; } }

.draft-text {
  display: block; width: 100%; min-height: 340px;
  padding: var(--s-6); border: 0; border-block: 1px solid var(--border);
  margin-top: var(--s-4);
  background: var(--surface-2); color: var(--text);
  font-family: var(--font); font-size: .9375rem; line-height: 1.9;
  resize: vertical; outline: none;
}
.draft-text:focus { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }

.draft-foot {
  display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap;
  padding: var(--s-4) var(--s-6);
}

/* ==========================================================================
   Request ordering (client) and the lawyer's request inbox
   ========================================================================== */

/* ---------- client: picking a request on a lawyer's profile ---------- */
.req-list { display: flex; flex-direction: column; gap: var(--s-2); }
.req-item {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3); text-align: start;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface); transition: all .16s;
}
.req-item:hover { border-color: var(--border-strong); }
.req-item.is-active { border-color: var(--accent); background: var(--accent-soft); }
.req-item__icon {
  width: 32px; height: 32px; flex: none; border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text-muted);
}
.req-item.is-active .req-item__icon { background: var(--accent); color: var(--on-accent); }
.req-item strong { font-size: .875rem; }
.req-item__price { flex: none; font-weight: 800; font-size: .875rem; }

.pill-fast {
  display: inline-block; margin-inline-start: var(--s-2);
  padding: 1px var(--s-2); border-radius: var(--r-full);
  background: var(--success-soft); color: var(--success);
  font-size: .625rem; font-weight: 800;
}

/* ---------- lawyer: the inbox ---------- */
.inbox-row {
  display: flex; align-items: flex-start; gap: var(--s-4);
  padding: var(--s-4) 0;
}
.inbox-row + .inbox-row { border-top: 1px solid var(--border); }
.inbox-row.is-open { background: var(--surface-2); border-radius: var(--r); padding-inline: var(--s-3); }
.inbox-row__icon {
  width: 38px; height: 38px; flex: none; border-radius: var(--r);
  display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-muted);
}
.inbox-row__side {
  display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-2);
  flex: none; position: relative;
}
.inbox-row__actions { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 720px) {
  .inbox-row { flex-wrap: wrap; }
  .inbox-row__side { align-items: stretch; width: 100%; }
  .inbox-row__actions { justify-content: stretch; }
  .inbox-row__actions .btn { flex: 1; }
}

/* Inline trainee chooser — three names don't warrant a modal. */
.assign-pop {
  position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 40;
  min-width: 220px; padding: var(--s-3);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-2);
  display: flex; flex-direction: column; gap: 2px;
}
.assign-pop > p { padding: 0 var(--s-2) var(--s-2); }
.assign-pop button {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-2); border-radius: var(--r);
  font-size: .875rem; font-weight: 600; text-align: start;
}
.assign-pop button:hover { background: var(--surface-2); }
.assign-pop button span:nth-child(2) { flex: 1; }

/* ==========================================================================
   Call for quotes — the client's board and the lawyer's bid form
   ========================================================================== */
.quote-layout { display: grid; grid-template-columns: 1fr 340px; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .quote-layout { grid-template-columns: 1fr; } }

/* What a lawyer is shown instead of a person: no name, no contact. */
.anon-card {
  padding: var(--s-4); border-radius: var(--r-lg);
  border: 1px dashed var(--border-strong); background: var(--surface-2);
}
.anon-card__mark {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text-muted);
}

/* An incoming quote. The cheapest is flagged, since that is what was asked for. */
.offer-card {
  position: relative; display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  animation: offer-in .32s cubic-bezier(.2, .7, .3, 1) both;
}
@keyframes offer-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .offer-card { animation: none; } }

.offer-card.is-best { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-1); }
.offer-card__flag {
  position: absolute; top: -9px; inset-inline-start: var(--s-5);
  padding: 1px var(--s-3); border-radius: var(--r-full);
  background: var(--accent); color: var(--on-accent);
  font-size: .625rem; font-weight: 800;
}
.offer-card__end { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-2); flex: none; }
.offer-card__price { font-size: 1.375rem; }
@media (max-width: 620px) {
  .offer-card { flex-wrap: wrap; }
  .offer-card__end { align-items: stretch; width: 100%; }
  .offer-card__end .btn { width: 100%; }
}

.bid-form {
  display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--s-3);
  align-items: end; margin-top: var(--s-4);
}
@media (max-width: 640px) { .bid-form { grid-template-columns: 1fr 1fr; } .bid-form .btn { grid-column: 1 / -1; } }

/* ==========================================================================
   Rebuild — sign-up wizard, people cards, request rows, progress
   ========================================================================== */

/* A demo build must say so where the person is about to type real details. */
.demo-banner {
  display: block; padding: var(--s-3) var(--s-4); border-radius: var(--r);
  background: var(--warning-soft); color: var(--warning);
  font-size: .8125rem; font-weight: 600; line-height: 1.6;
  border-inline-start: 3px solid var(--warning);
}

.form-error {
  padding: var(--s-3) var(--s-4); border-radius: var(--r);
  background: var(--danger-soft); color: var(--danger);
  font-size: .875rem; font-weight: 600;
}

/* ---------- wizard stepper ---------- */
.stepper {
  display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5);
  list-style: none; padding: 0; margin: 0 0 var(--s-5);
}
.step-dot {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: .8125rem; font-weight: 600; color: var(--text-faint);
}
.step-dot__mark {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  border: 1.5px solid var(--border-strong); font-size: .75rem;
  font-variant-numeric: tabular-nums;
}
.step-dot.is-here { color: var(--text); }
.step-dot.is-here .step-dot__mark { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.step-dot.is-done { color: var(--success); }
.step-dot.is-done .step-dot__mark { border-color: var(--success); color: var(--success); }

/* ---------- free-text chips (a trainee's own words) ---------- */
.chip-input { display: flex; gap: var(--s-2); margin-top: var(--s-2); }
.chip-input .input { flex: 1; }
.chip .icon { pointer-events: none; }
.chip button {
  display: inline-flex; margin-inline-start: var(--s-1);
  color: inherit; opacity: .6;
}
.chip button:hover { opacity: 1; }

/* ---------- review list ---------- */
.review { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-5); margin: 0; }
.review dt { color: var(--text-muted); font-size: .875rem; }
.review dd { margin: 0; font-weight: 600; font-size: .9375rem; }
@media (max-width: 520px) { .review { grid-template-columns: 1fr; gap: 0 0; }
  .review dd { margin-bottom: var(--s-3); } }

.note-inline {
  display: flex; align-items: flex-start; gap: var(--s-2);
  margin-top: var(--s-5); padding: var(--s-3) var(--s-4);
  background: var(--info-soft); color: var(--info);
  border-radius: var(--r); font-size: .8125rem; line-height: 1.6;
}
.note-inline .icon { flex: none; margin-top: 2px; }

/* ---------- one-click demo accounts ---------- */
.demo-card {
  display: flex; flex-direction: column; align-items: center; gap: var(--s-2);
  padding: var(--s-4) var(--s-2); border-radius: var(--r-lg);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: .875rem; transition: all .18s;
}
.demo-card:hover { border-color: var(--accent); transform: translateY(-2px); }

/* ---------- people cards ---------- */
.person-card { display: flex; flex-direction: column; height: 100%; }
.person-card__body { display: block; padding: var(--s-5); flex: 1; color: inherit; }
.person-card__foot {
  padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border);
  display: flex; align-items: center;
}
.person-link { font-weight: 700; color: inherit; }
.person-link:hover { color: var(--accent); text-decoration: underline; }

.role-badge__dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex: none;
}

/* ---------- progress bar (training hours) ---------- */
.bar {
  width: 100%; height: 7px; border-radius: 99px;
  background: var(--surface-3); overflow: hidden;
}
.bar > span {
  display: block; height: 100%; border-radius: 99px;
  background: var(--accent); transition: width .4s ease;
}

/* ---------- request rows ---------- */
.req-row { display: flex; align-items: flex-start; gap: var(--s-4); padding: var(--s-4) 0; }
.req-row + .req-row { border-top: 1px solid var(--border); }
.req-row__icon {
  width: 38px; height: 38px; flex: none; border-radius: var(--r);
  display: grid; place-items: center; background: var(--surface-2); color: var(--text-muted);
}
.req-row__side {
  display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-2);
  flex: none; position: relative;
}
.req-row__actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 720px) {
  /* The icon and the title belong on one line. Left to wrap on its own the
     text block took a line of its own and the row read as three stacked
     fragments rather than one request. `flex: 1 1 0` lets it shrink to the
     space that is left instead of demanding its content width first. */
  .req-row { flex-wrap: wrap; row-gap: var(--s-3); gap: var(--s-3); }
  .req-row > .grow { flex: 1 1 0; }
  .req-row__side {
    width: 100%; flex-direction: row; align-items: center; flex-wrap: wrap;
    gap: var(--s-2) var(--s-3);
  }
  .req-row__actions { width: 100%; justify-content: flex-start; }
  .req-row__actions .btn { flex: 1 1 auto; min-height: 44px; }
}

/* ---------- leaderboard ---------- */
.rank-table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.rank-table th, .rank-table td { padding: var(--s-3) var(--s-5); text-align: start; white-space: nowrap; }
.rank-table thead th { font-size: .75rem; color: var(--text-faint); font-weight: 600; }
.rank-table tbody tr { border-top: 1px solid var(--border); }
.rank-table tbody tr.is-me td { background: var(--accent-soft); color: var(--accent-soft-text); }

/* ---------- article body ---------- */
.article-body p { margin-bottom: var(--s-5); line-height: 1.9; color: var(--text); }
.article-body p:last-child { margin-bottom: 0; }

/* ---------- a written opinion: a client review, or a comment ---------- */
.testimony {
  padding: var(--s-5); border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface);
}
.testimony p { line-height: 1.75; }

/* A five-across stat row, folding the same way the others do. */
.grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1200px) { .grid-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px)  { .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px)  { .grid-5 { grid-template-columns: 1fr; } }

/* ---------- rating: picking one, and reading the spread ---------- */
.stars-pick { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
/* Emitted 5→1 and reversed, so `:hover ~ *` reaches the lower stars. */
.stars-pick__row { display: flex; flex-direction: row-reverse; align-items: center; gap: var(--s-1); }
.star-pick {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r);
  color: var(--border-strong); transition: color .12s, transform .12s, background-color .12s;
}
.star-pick svg { width: 30px; height: 30px; }
.star-pick:hover, .star-pick:focus-visible { background: var(--surface-2); transform: translateY(-1px); }
.star-pick.is-on { color: var(--accent); }
/* Hovering one star lights it and every star below it, the way a scale reads. */
.stars-pick__row:hover .star-pick { color: var(--border-strong); }
.stars-pick__row:hover .star-pick:hover,
.stars-pick__row:hover .star-pick:hover ~ .star-pick { color: var(--accent); }
.stars-pick__word { font-weight: 700; font-size: .9375rem; color: var(--text-muted); }
.stars-pick__word.is-set { color: var(--text); }

.rating-summary {
  display: grid; grid-template-columns: max-content 1fr; gap: var(--s-8);
  align-items: center; padding: var(--s-5) 0;
}
@media (max-width: 560px) { .rating-summary { grid-template-columns: 1fr; gap: var(--s-5); } }
.rating-summary__score { display: flex; flex-direction: column; align-items: center; }
.rating-summary__score .display { line-height: 1; }
.rating-summary__spread { min-width: 0; }
.rating-bar { display: grid; grid-template-columns: 46px 1fr 28px; gap: var(--s-3); align-items: center; }
.rating-bar + .rating-bar { margin-top: var(--s-2); }
.rating-bar__label { display: inline-flex; align-items: center; gap: var(--s-1); font-size: .8125rem; color: var(--text-muted); }
.rating-bar__label svg { color: var(--accent); }
.rating-bar__track { height: 8px; border-radius: var(--r-full); background: var(--surface-3); overflow: hidden; }
.rating-bar__track > span { display: block; height: 100%; background: var(--accent); border-radius: var(--r-full); }
.rating-bar__n { font-size: .75rem; color: var(--text-faint); text-align: end; }
/* Hovering the scale fills the stars it covers, not just tints them. */
.stars-pick__row:hover .star-pick svg { fill: none; }
.stars-pick__row:hover .star-pick:hover svg,
.stars-pick__row:hover .star-pick:hover ~ .star-pick svg { fill: currentColor; }

/* ---------- the call room ---------- */
.call-card { max-width: 520px; margin-inline: auto; }

.call-stage { max-width: 1000px; margin-inline: auto; }
.call-stage__remote {
  position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-xl); overflow: hidden;
  background: var(--surface-inverse); color: var(--on-inverse);
}
@media (max-width: 640px) { .call-stage__remote { aspect-ratio: 3 / 4; } }
.call-stage__remote > video { width: 100%; height: 100%; object-fit: cover; background: #000; }

.call-stage__placeholder {

  align-items: center; justify-content: center; text-align: center; padding: var(--s-6);
}
.call-stage__placeholder .small { color: rgba(232, 238, 252, .72); }

.call-stage__badge {
  position: absolute; inset-block-start: var(--s-4); inset-inline-start: var(--s-4);
  background: rgba(6, 12, 24, .6); color: #fff; border-radius: var(--r-full);
  padding: var(--s-1) var(--s-3); font-size: .8125rem; font-weight: 700;
  backdrop-filter: blur(6px);
}

.call-stage__self {
  position: absolute; inset-block-end: var(--s-4); inset-inline-end: var(--s-4);
  width: 168px; aspect-ratio: 4 / 3; border-radius: var(--r-lg); overflow: hidden;
  background: #0b1220; border: 2px solid rgba(255, 255, 255, .18); box-shadow: var(--shadow-2);
  display: grid; place-items: center;
}
@media (max-width: 640px) { .call-stage__self { width: 108px; } }
.call-stage__self > video { width: 100%; height: 100%; object-fit: cover; }
.call-stage__self > .tiny {
  position: absolute; inset-block-end: 4px; inset-inline-start: 8px;
  color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
}
/* A voice call has no picture to show, so the tile is just a label. */
.call-stage__self.is-audio > video { display: none; }

.call-bar { display: flex; justify-content: center; gap: var(--s-4); margin-top: var(--s-6); }
.call-btn {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-3); color: var(--text); box-shadow: var(--shadow-1);
  transition: background-color .15s, color .15s, transform .12s;
}
.call-btn:hover { transform: translateY(-2px); }
.call-btn.is-off { background: var(--danger-soft); color: var(--danger); }
.call-btn--end { background: var(--danger); color: #fff; }
.call-btn--end:hover { background: #a11616; }
.call-btn svg { width: 24px; height: 24px; }

/* A labelled rule between "continue with Google" and the form below it. */
.or-rule {
  display: flex; align-items: center; gap: var(--s-4);
  margin: var(--s-6) 0; color: var(--text-faint); font-size: .8125rem;
}
.or-rule::before, .or-rule::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}


/* --- bundle-only: the router swaps views inside #app --- */
#app { display: flex; flex-direction: column; flex: 1; }
#app > main { flex: 1; }

/* ==========================================================================
   Theme — light / dark
   Runs synchronously in <head>, before any pixel is painted, so a dark-mode
   visitor never gets a white flash on load.
   ========================================================================== */
(function (global) {
  "use strict";

  var STORAGE_KEY = "sanad.theme";
  var media = global.matchMedia ? global.matchMedia("(prefers-color-scheme: dark)") : null;

  function read() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function write(v) {
    try {
      if (v) localStorage.setItem(STORAGE_KEY, v); else localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* private mode */ }
  }

  // An explicit choice wins; otherwise follow the OS.
  var stored = read();
  var current = (stored === "dark" || stored === "light")
    ? stored
    : (media && media.matches ? "dark" : "light");

  function paint(theme) {
    var html = document.documentElement;
    if (theme === "dark") html.setAttribute("data-theme", "dark");
    else html.setAttribute("data-theme", "light");
    // Keeps the mobile browser chrome in step with the page.
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#0a1020" : "#f7f8fd");
  }

  paint(current);

  // No explicit choice yet? Then keep tracking the OS while the tab is open.
  if (media && !stored) {
    var onSystem = function (e) {
      if (read()) return;
      current = e.matches ? "dark" : "light";
      paint(current);
      notify();
    };
    if (media.addEventListener) media.addEventListener("change", onSystem);
    else if (media.addListener) media.addListener(onSystem);
  }

  var listeners = [];
  function notify() {
    listeners.forEach(function (fn) { try { fn(current); } catch (e) { console.error(e); } });
    document.dispatchEvent(new CustomEvent("themechange", { detail: { theme: current } }));
  }

  global.Theme = {
    get current() { return current; },
    get isDark() { return current === "dark"; },
    set: function (theme) {
      if (theme !== "dark" && theme !== "light") return;
      current = theme;
      write(theme);
      paint(theme);
      notify();
    },
    toggle: function () { global.Theme.set(current === "dark" ? "light" : "dark"); },
    /** Drop the saved preference and hand control back to the OS. */
    useSystem: function () {
      write(null);
      current = media && media.matches ? "dark" : "light";
      paint(current);
      notify();
    },
    onChange: function (fn, runNow) {
      listeners.push(fn);
      if (runNow !== false) { try { fn(current); } catch (e) { console.error(e); } }
    }
  };
})(window);

      body: { ar: "الخلط بين المادتين 75 و77 هو أكثر ما يُوقع أصحاب العمل في التعويض.\n\nالمادة 75\nتعالج إنهاء العقد غير محدد المدة بإشعار مسبق. الإنهاء هنا مشروع متى استُوفيت مدة الإشعار.\n\nالمادة 77\nتعالج ثمن الإنهاء إذا كان بلا سبب مشروع: تعويض متفق عليه، وإن لم يوجد فأجر خمسة عشر يوماً عن كل سنة.\n\nخلاصة\n75 عن الكيفية، و77 عن الثمن. والإشعار وحده لا يجعل الإنهاء مبرراً.",

  /* ---------- filling the cache ----------

    // already holds is the difference between a page missing one section and
    // a page that has decided nobody is signed in.

    // own rule rather than by this file being careful.

    cache.announcements = take("announcements", inAnnouncement, cache.announcements);

    cache.agreements = take("agreements", inAgreement, cache.agreements);

  function dataProblem(errors) {
    console.error("Supabase read failed", errors);
    // Nothing answered at all: that is not twenty table-shaped problems, it is
    // one network-shaped one, and it has its own bar with a retry on it.
    var allNetwork = errors.every(function (e) { return e.code === "network"; });
    if (allNetwork) return offline();
    var line = errors.map(function (e) {
      return e.table + ": " + e.message + (e.code ? " (" + e.code + ")" : "");
    }).join(" · ");

      title.textContent = t("sys.dataFailed");
      var body = document.createElement("span");
      body.setAttribute("data-datafail-detail", "");
      bar.appendChild(title); bar.appendChild(body);
      (document.body || document.documentElement).appendChild(bar);

  function announcements() {
    if (!global.Models || !global.Models.announcementsFor) return "";
    var list = global.Models.announcementsFor(Session.role()).filter(function (a) {
      return (a.placement || "bar") === "bar";
    });
    if (!list.length) return "";
    return list.map(function (a) {
      var text = global.App.esc(a.title) +
        (a.body ? ' <span class="muted">' + global.App.esc(a.body) + "</span>" : "");
      return '<div class="announce" data-announce>' +
        Icons.svg("bell", "icon-sm") +
        '<span class="announce__body">' + text +
          (a.link ? ' <a href="' + global.App.esc(a.link) + '" rel="noopener">' +
            global.App.esc(I18N.t("notice.open")) + "</a>" : "") +
        "</span></div>";

  }

  function header(active) {
    var links = navItems().map(function (item) {
      return '<a class="nav__link' + (item.id === active ? " is-active" : "") + '" href="' + item.href +
        '" data-i18n="' + item.key + '"' + (item.id === active ? ' aria-current="page"' : "") + "></a>";
    }).join("");

    return announcements() +
      '<header class="site-header"><div class="container site-header__inner">' +
      brand() +
      '<nav class="nav" data-i18n-attr="aria-label:a11y.menu">' + links + "</nav>" +
      '<div class="header-actions">' + themeButton() + langButton() +
        '<span class="notice-wrap">' + bell() + noticePanel() + "</span>" +
        identity() + "</div>" +
      "</div></header>";
  }

  /** Phones navigate from the bottom; the account tab closes the set. */
  function tabbar(active) {

    // first five and always ends with the account. Anything cut here is still
    // in the header on wider screens and in the footer everywhere.
    var items = navItems().slice(0, 5);
    items.push(Session.isGuest()
      ? { key: "auth.signIn", tab: "tab.login", href: "login.html", id: "login", icon: "user" }

      items.map(function (item) {
        var on = item.id === active;
        return '<a class="tabbar__link' + (on ? " is-active" : "") + '" href="' + item.href + '"' +
          (on ? ' aria-current="page"' : "") + ">" + Icons.svg(item.icon || "grid") +
          '<span data-i18n="' + (item.tab || item.key) + '"></span></a>';

    function col(titleKey, items) {
      return '<div><h3 class="footer-title" data-i18n="' + titleKey + '"></h3>' +
        items.map(function (it) {

        }).join("") + "</div>";
    }

      '<div class="site-footer__grid">' +
        '<div style="max-width:340px">' + brand() +

          '<span data-i18n="footer.madeIn"></span></span>' +
