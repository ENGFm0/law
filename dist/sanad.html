<style>
/* ==========================================================================
   سند | Sanad — Design System
   Tokens first: every colour is a variable, so [data-theme="dark"] flips the
   whole site by redefining ~30 values instead of touching components.
   ========================================================================== */

/* ---------- 1. Tokens : Light (default) ---------- */
:root {
  color-scheme: light;

  /* Brand */
  --brand-navy:        #0f172a;
  --brand-gold:        #c8912a;

  /* Surfaces */
  --bg:                #f7f8fd;
  --bg-band:           #e9eefb;   /* the lavender section band */
  --surface:           #ffffff;
  --surface-2:         #f1f4fd;
  --surface-3:         #e4ebfa;
  --surface-inverse:   #101a2e;   /* dark sidebars / dark cards in light mode */
  --on-inverse:        #e8eefc;

  /* Text */
  --text:              #111c2d;
  --text-muted:        #5a6478;
  --text-faint:        #8b93a7;

  /* Lines */
  --border:            #e2e8f2;
  --border-strong:     #cbd5e6;

  /* Actions */
  --primary:           #0f172a;
  --primary-hover:     #1e293b;
  --on-primary:        #ffffff;
  --accent:            #d97706;
  --accent-hover:      #b45309;
  --on-accent:         #ffffff;
  --accent-soft:       #fdf0dd;
  --accent-soft-text:  #96560a;

  /* Status */
  --success:           #15803d;
  --success-soft:      #dcfce7;
  --warning:           #b45309;
  --warning-soft:      #fef3c7;
  --danger:            #b91c1c;
  --danger-soft:       #fee2e2;
  --info:              #1d4ed8;
  --info-soft:         #dbeafe;

  /* Depth */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 20px rgba(15, 23, 42, .05);
  --shadow-2: 0 10px 30px rgba(15, 23, 42, .12);
  --shadow-3: 0 20px 50px rgba(15, 23, 42, .16);
  --ring:     0 0 0 3px rgba(15, 23, 42, .12);

  /* Shape */
  --r-sm: 4px;
  --r:    6px;
  --r-lg: 10px;
  --r-xl: 16px;
  --r-full: 999px;

  /* Rhythm (4px base) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px;

  --container: 1200px;
  --header-h: 72px;

  /* Type */
  --font-ar: "Tajawal", "Cairo", "Segoe UI", system-ui, sans-serif;
  --font-en: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font: var(--font-ar);
}

/* ---------- 2. Tokens : Dark ---------- */
[data-theme="dark"] {
  color-scheme: dark;

  --brand-navy:        #dbe3f7;
  --brand-gold:        #e5b451;

  --bg:                #0a1020;
  --bg-band:           #0e1729;
  --surface:           #121c31;
  --surface-2:         #18243d;
  --surface-3:         #1f2d49;
  --surface-inverse:   #060c18;
  --on-inverse:        #e8eefc;

  --text:              #e8edf8;
  --text-muted:        #a3aec6;
  --text-faint:        #7c88a3;

  --border:            #24314f;
  --border-strong:     #33425f;

  --primary:           #e9eefb;
  --primary-hover:     #ffffff;
  --on-primary:        #0a1020;
  --accent:            #f0a83a;
  --accent-hover:      #f7bb5c;
  --on-accent:         #241701;
  --accent-soft:       #3a2a10;
  --accent-soft-text:  #f3bd68;

  --success:           #4ade80;
  --success-soft:      #10331f;
  --warning:           #fbbf24;
  --warning-soft:      #3a2a10;
  --danger:            #f87171;
  --danger-soft:       #3b1618;
  --info:              #93b4fd;
  --info-soft:         #16264a;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 20px rgba(0, 0, 0, .35);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5);
  --shadow-3: 0 20px 50px rgba(0, 0, 0, .6);
  --ring:     0 0 0 3px rgba(233, 238, 251, .18);
}

/* ---------- 3. Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 16px);
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}

/* English switches the type stack and the writing direction */
html[lang="en"] { --font: var(--font-en); }

img, svg, video { max-width: 100%; display: block; }
img { height: auto; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }

h1, h2, h3, h4, h5 { margin: 0; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
p  { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

::selection { background: var(--accent); color: var(--on-accent); }

/* Only fade colours, never layout — avoids the "everything slides" theme flash */
body, .card, .panel, .btn, .input, .site-header, .chip, .tag, .stat, .field {
  transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto; }
}

/* ---------- 4. Layout primitives ---------- */
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--s-6); }
@media (max-width: 640px) { .container { padding-inline: var(--s-4); } }

.section      { padding-block: var(--s-20); }
.section--tight { padding-block: var(--s-12); }
.section--band  { background: var(--bg-band); }
@media (max-width: 768px) { .section { padding-block: var(--s-12); } }

.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.between { justify-content: space-between; }
.wrap    { flex-wrap: wrap; }
.gap-1 { gap: var(--s-1);} .gap-2 { gap: var(--s-2);} .gap-3 { gap: var(--s-3);}
.gap-4 { gap: var(--s-4);} .gap-6 { gap: var(--s-6);} .gap-8 { gap: var(--s-8);}
.grow  { flex: 1 1 auto; }

.grid { display: grid; gap: var(--s-6); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px)  { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

.hidden { display: none !important; }
/* Author-level display rules (.field, .row) outrank the UA's [hidden] rule,
   so state it explicitly or hidden elements stay on screen. */
[hidden] { display: none !important; }

/* ---------- 5. Typography helpers ---------- */
.display   { font-size: clamp(2rem, 1.2rem + 3.2vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.18; }
.headline  { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2rem); font-weight: 700; }
.title     { font-size: 1.25rem; font-weight: 700; }
.subtitle  { font-size: 1.0625rem; font-weight: 600; }
.lead      { font-size: 1.0625rem; color: var(--text-muted); line-height: 1.7; }
.muted     { color: var(--text-muted); }
.faint     { color: var(--text-faint); }
.small     { font-size: .875rem; }
.tiny      { font-size: .75rem; }
.center    { text-align: center; }
/* Numbers read left-to-right inside Arabic text. `unicode-bidi: isolate` does
   that on its own — an earlier `display: inline-block` did too, but it also
   dropped any <td class="num"> out of its table row. */
.num       { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

.eyebrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: .8125rem; font-weight: 700; letter-spacing: .06em;
  color: var(--accent-soft-text); background: var(--accent-soft);
  padding: var(--s-1) var(--s-3); border-radius: var(--r-full);
}

.section-head { max-width: 640px; margin-bottom: var(--s-10); }
.section-head .lead { margin-top: var(--s-3); }
.section-head.center { margin-inline: auto; }

/* ---------- 6. Icons ---------- */
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
.icon-xl { width: 28px; height: 28px; }
/* A star that has been earned is solid; an empty one stays an outline. That
   difference is the whole point of a star rating, and stroke alone loses it. */
.icon--solid { fill: currentColor; }

/* Arrows must point "forward" in whichever direction the page reads */
[dir="rtl"] .icon-flip { transform: scaleX(-1); }

/* ---------- 7. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-5); height: 44px;
  border-radius: var(--r);
  font-weight: 700; font-size: .9375rem;
  border: 1.5px solid transparent;
  white-space: nowrap;
  transition: background-color .18s, border-color .18s, color .18s, transform .18s, box-shadow .18s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-2); }

.btn--accent  { background: var(--accent); color: var(--on-accent); }
.btn--accent:hover { background: var(--accent-hover); box-shadow: var(--shadow-2); }

.btn--outline { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
.btn--outline:hover { border-color: var(--primary); background: var(--surface-2); }

.btn--ghost   { color: var(--text-muted); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); }

.btn--sm  { height: 36px; padding: 0 var(--s-4); font-size: .875rem; }
.btn--lg  { height: 52px; padding: 0 var(--s-8); font-size: 1rem; }
.btn--block { width: 100%; }
.btn[disabled], .btn.is-disabled { opacity: .5; pointer-events: none; }

/* ---------- 8. Cards & panels ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card--pad { padding: var(--s-6); }
.card--hover { transition: transform .2s, box-shadow .2s, border-color .2s; }
.card--hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
/* 4px category rule along the top, per the brand spec */
.card--rule-navy  { border-top: 4px solid var(--primary); }
.card--rule-gold  { border-top: 4px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.panel__head { padding: var(--s-5) var(--s-6); border-bottom: 1px solid var(--border); }
.panel__body { padding: var(--s-6); }

.divider { height: 1px; background: var(--border); border: 0; margin: var(--s-5) 0; }

/* ---------- 9. Chips, tags, pills ---------- */
.tag {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 3px var(--s-3); border-radius: var(--r-full);
  background: var(--surface-3); color: var(--text-muted);
  font-size: .75rem; font-weight: 600;
}
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-full);
  border: 1.5px solid var(--border-strong); background: var(--surface);
  font-size: .875rem; font-weight: 600; color: var(--text-muted);
  transition: all .18s;
}
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip.is-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-soft-text); }

.status { display: inline-flex; align-items: center; gap: var(--s-2); padding: 3px var(--s-3); border-radius: var(--r-full); font-size: .75rem; font-weight: 700; }
.status--ok    { background: var(--success-soft); color: var(--success); }
.status--warn  { background: var(--warning-soft); color: var(--warning); }
.status--info  { background: var(--info-soft);    color: var(--info); }
.status--muted { background: var(--surface-3);    color: var(--text-muted); }

.rating { display: inline-flex; align-items: center; gap: var(--s-1); font-weight: 700; font-size: .875rem; }
.rating .icon { color: var(--accent); fill: var(--accent); stroke: none; }

/* ---------- 10. Forms ---------- */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.label { font-size: .875rem; font-weight: 600; color: var(--text-muted); }

.input, .select, .textarea {
  width: 100%; height: 46px;
  padding: 0 var(--s-4);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  transition: border-color .18s, box-shadow .18s, background-color .25s;
}
.textarea { height: auto; min-height: 120px; padding: var(--s-3) var(--s-4); resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }

.select {
  appearance: none;
  /* Neutral grey chevron: one asset that stays legible in both themes. */
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2389919f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-size: 16px 16px;
  padding-inline-end: var(--s-4);
  padding-inline-start: var(--s-10);
}
[dir="rtl"] .select { background-position: left var(--s-4) center; }
[dir="ltr"] .select {
  background-position: right var(--s-4) center;
  padding-inline-start: var(--s-4);
  padding-inline-end: var(--s-10);
}

.input-group { position: relative; display: flex; align-items: center; }
.input-group .icon { position: absolute; inset-inline-start: var(--s-4); color: var(--text-faint); pointer-events: none; }
.input-group .input { padding-inline-start: calc(var(--s-4) * 2 + 20px); }

.check { display: flex; align-items: center; gap: var(--s-3); cursor: pointer; padding: var(--s-1) 0; font-size: .9375rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
.check span { color: var(--text-muted); }
.check:hover span { color: var(--text); }

/* ---------- 11. Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
@supports not (backdrop-filter: blur(1px)) { .site-header { background: var(--surface); } }

.site-header__inner { display: flex; align-items: center; gap: var(--s-6); height: var(--header-h); }

.brand { display: flex; align-items: center; gap: var(--s-3); font-weight: 800; }
.brand__mark { width: 38px; height: 38px; flex: none; }
.brand__text { display: flex; align-items: baseline; gap: var(--s-2); font-size: 1.125rem; letter-spacing: -.01em; }
.brand__sep { width: 2px; height: 18px; background: var(--accent); border-radius: 2px; align-self: center; }
.brand__latin { font-family: var(--font-en); font-weight: 800; }

.nav { display: flex; align-items: center; gap: var(--s-1); margin-inline: auto; }
.nav__link {
  position: relative; padding: var(--s-2) var(--s-4); border-radius: var(--r); white-space: nowrap;
  font-size: .9375rem; font-weight: 600; color: var(--text-muted);
  transition: color .18s, background-color .18s;
}
.nav__link:hover { color: var(--text); background: var(--surface-2); }
.nav__link.is-active { color: var(--text); }
.nav__link.is-active::after {
  content: ""; position: absolute; inset-inline: var(--s-4); bottom: -2px;
  height: 2px; background: var(--accent); border-radius: 2px;
}

.header-actions { display: flex; align-items: center; gap: var(--s-2); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-1);
  width: 40px; height: 40px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
  transition: all .18s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn--wide { width: auto; padding: 0 var(--s-3); font-size: .8125rem; font-weight: 700; }
.lang-btn__code { font-family: var(--font-en); letter-spacing: .04em; }

/* The two theme glyphs swap so the button always shows what you'd switch TO */
[data-theme="dark"] .icon-moon,
:root:not([data-theme="dark"]) .icon-sun { display: none; }

/* Phone: the top nav collapses into the bottom tab bar below. */
@media (max-width: 1024px) {
  .nav { display: none; }
}

/* ---------- 11b. Bottom tab bar (phones) ---------- */
.tabbar { display: none; }
@media (max-width: 1024px) {
  .tabbar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 80;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px) saturate(160%);
    border-top: 1px solid var(--border);
    /* clear the iPhone home indicator */
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @supports not (backdrop-filter: blur(1px)) { .tabbar { background: var(--surface); } }

  .tabbar__link {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: var(--s-2) var(--s-1) var(--s-3);
    font-size: .6875rem; font-weight: 600; color: var(--text-faint);
    transition: color .18s;
    position: relative; min-width: 0;
  }
  .tabbar__link span {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tabbar__link .icon { width: 22px; height: 22px; }
  .tabbar__link:hover { color: var(--text-muted); }
  .tabbar__link.is-active { color: var(--accent); }
  .tabbar__link.is-active::before {
    content: ""; position: absolute; top: 0; inset-inline: 28%;
    height: 2px; border-radius: 0 0 2px 2px; background: var(--accent);
  }

  /* Keep the bar from covering the end of the page. */
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .toast { inset-block-end: calc(76px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- 12. Footer ---------- */
.site-footer { background: var(--bg-band); border-top: 1px solid var(--border); padding-block: var(--s-16) var(--s-8); margin-top: auto; }
.site-footer__grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: var(--s-8); }
@media (max-width: 900px) { .site-footer__grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .site-footer__grid { grid-template-columns: 1fr; } }
.footer-title { font-size: .875rem; font-weight: 700; margin-bottom: var(--s-4); }
.footer-link { display: block; padding: var(--s-1) 0; font-size: .9375rem; color: var(--text-muted); transition: color .18s; }
.footer-link:hover { color: var(--accent); }
.site-footer__bottom { margin-top: var(--s-10); padding-top: var(--s-6); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--s-4); justify-content: space-between; align-items: center; font-size: .875rem; color: var(--text-muted); }

/* ---------- 13. Hero + search ---------- */
.hero { position: relative; padding-block: var(--s-20) var(--s-16); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(60% 70% at 70% 0%,  color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(50% 60% at 20% 10%, color-mix(in srgb, var(--info) 14%, transparent), transparent 70%);
}
.hero__inner { max-width: 820px; margin-inline: auto; text-align: center; }
.hero .lead { margin-top: var(--s-5); font-size: 1.125rem; }

.searchbar {
  margin-top: var(--s-8);
  display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: var(--s-3);
  padding: var(--s-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-2);
  text-align: start;
}
@media (max-width: 860px) { .searchbar { grid-template-columns: 1fr 1fr; } .searchbar .btn { grid-column: 1 / -1; } }
@media (max-width: 520px) { .searchbar { grid-template-columns: 1fr; } }
.searchbar .btn { height: 46px; }

.trustbar { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s-6); margin-top: var(--s-8); color: var(--text-muted); font-size: .875rem; }
.trustbar span { display: inline-flex; align-items: center; gap: var(--s-2); }

/* ---------- 14. Feature / step cards ---------- */
.feature { padding: var(--s-6); height: 100%; display: flex; flex-direction: column; gap: var(--s-3); }
.feature__icon {
  width: 48px; height: 48px; border-radius: var(--r-lg);
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text);
}
.card--rule-gold .feature__icon { background: var(--accent-soft); color: var(--accent-soft-text); }

.step { position: relative; padding: var(--s-6); }
.step__num {
  width: 40px; height: 40px; border-radius: var(--r-full);
  display: grid; place-items: center; font-weight: 800;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-en);
}

/* ---------- 15. Lawyer cards ---------- */
.lawyer-card { display: flex; flex-direction: column; height: 100%; }
.lawyer-card__body { padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.lawyer-card__foot { padding: var(--s-4) var(--s-6) var(--s-6); }
/* Side-by-side actions get too cramped below ~480px — stack them instead. */
@media (max-width: 480px) {
  .lawyer-card__foot { flex-direction: column; align-items: stretch; }
}
.avatar { border-radius: var(--r-lg); object-fit: cover; background: var(--surface-3); }
.avatar--lg { width: 88px; height: 88px; }
.avatar--md { width: 64px; height: 64px; }
.avatar--sm { width: 40px; height: 40px; border-radius: var(--r-full); }
.avatar--round { border-radius: var(--r-full); }
.verified { color: var(--info); }
.verified .icon { fill: currentColor; stroke: none; }

.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); font-size: .8125rem; color: var(--text-muted); }
.dot { display: inline-block; width: 3px; height: 3px; border-radius: 50%;
       background: var(--border-strong); vertical-align: middle; }
.meta-row .dot { display: block; }

.price-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); }
.price-grid > div { padding: var(--s-4) var(--s-2); text-align: center; }
.price-grid > div + div { border-inline-start: 1px solid var(--border); }
.price-grid .icon { margin-inline: auto; color: var(--text-muted); margin-bottom: var(--s-2); }
.price-grid strong { display: block; font-size: .875rem; }
/* An unavailable service greys the whole cell, but only the figure is struck. */
.price-grid .off { color: var(--text-faint); }
.price-grid .off strong { text-decoration: line-through; }

/* ---------- 16. Directory layout ---------- */
.directory { display: grid; grid-template-columns: 280px 1fr; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .directory { grid-template-columns: 1fr; } }
.filters { position: sticky; top: calc(var(--header-h) + var(--s-6)); }
@media (max-width: 1024px) { .filters { position: static; } }
.filter-group + .filter-group { margin-top: var(--s-6); padding-top: var(--s-6); border-top: 1px solid var(--border); }
.filter-group__title { font-size: .875rem; font-weight: 700; margin-bottom: var(--s-3); }

.results-bar { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: center; justify-content: space-between; padding: var(--s-4) var(--s-5); }

.pagination { display: flex; justify-content: center; gap: var(--s-2); margin-top: var(--s-10); }
.page-btn {
  min-width: 40px; height: 40px; padding: 0 var(--s-3);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface); font-weight: 700; font-size: .875rem;
  transition: all .18s;
}
.page-btn:hover { border-color: var(--primary); }
.page-btn.is-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

.empty { padding: var(--s-16) var(--s-6); text-align: center; color: var(--text-muted); }
.empty .icon { margin-inline: auto; margin-bottom: var(--s-4); color: var(--text-faint); }

/* ---------- 17. Profile page ---------- */
.profile-layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .profile-layout { grid-template-columns: 1fr; } }
.booking { position: sticky; top: calc(var(--header-h) + var(--s-6)); }
@media (max-width: 1024px) { .booking { position: static; } }

.tabs { display: flex; gap: var(--s-1); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {
  padding: var(--s-3) var(--s-4); font-weight: 700; font-size: .9375rem;
  color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .18s, border-color .18s;
}
.tab:hover { color: var(--text); }
.tab.is-active { color: var(--text); border-bottom-color: var(--accent); }
.tab-panel[hidden] { display: none; }

.stat-strip { display: flex; flex-wrap: wrap; gap: var(--s-6); }
.stat-strip > div { display: flex; align-items: center; gap: var(--s-3); }
.stat-strip .icon { color: var(--text-muted); }

.timeline { position: relative; padding-inline-start: var(--s-6); }
.timeline::before { content: ""; position: absolute; inset-block: 6px; inset-inline-start: 5px; width: 2px; background: var(--border); }
.timeline li { position: relative; padding-bottom: var(--s-6); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before {
  content: ""; position: absolute; inset-inline-start: calc(var(--s-6) * -1 + 1px); top: 7px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface);
}

.bullets li { position: relative; padding-inline-start: var(--s-5); padding-block: var(--s-1); }
.bullets li::before { content: ""; position: absolute; inset-inline-start: 0; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Calendar */
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s-1); }
.calendar__dow { text-align: center; font-size: .6875rem; font-weight: 700; color: var(--text-faint); padding-bottom: var(--s-2); }
.day {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--r);
  font-size: .8125rem; font-weight: 600; font-variant-numeric: tabular-nums;
  transition: all .15s;
}
.day:hover:not(.is-off) { background: var(--surface-2); }
.day.is-weekend { color: var(--danger); }
.day.is-off { color: var(--text-faint); pointer-events: none; }
.day.is-selected { background: var(--primary); color: var(--on-primary); }

.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-2); }
.slot {
  height: 42px; border-radius: var(--r); border: 1.5px solid var(--border);
  background: var(--surface); font-size: .875rem; font-weight: 600;
  transition: all .15s;
}
.slot:hover:not(.is-off) { border-color: var(--primary); }
.slot.is-selected { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.slot.is-off { color: var(--text-faint); text-decoration: line-through; pointer-events: none; opacity: .6; }

/* ---------- 18. Blog ---------- */
.blog-layout { display: grid; grid-template-columns: 320px 1fr; gap: var(--s-8); align-items: start; }
@media (max-width: 1024px) { .blog-layout { grid-template-columns: 1fr; } }
.article-card { display: flex; flex-direction: column; height: 100%; }
.article-card__media { position: relative; aspect-ratio: 16 / 9; background: var(--surface-3); overflow: hidden; }
.article-card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.article-card:hover .article-card__media img { transform: scale(1.04); }
.article-card__cat { position: absolute; top: var(--s-3); inset-inline-end: var(--s-3); background: var(--surface); color: var(--text); padding: var(--s-1) var(--s-3); border-radius: var(--r-full); font-size: .75rem; font-weight: 700; box-shadow: var(--shadow-1); }
.article-card__body { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.article-card__foot { padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }

.newsletter { background: var(--surface-inverse); color: var(--on-inverse); border-radius: var(--r-lg); padding: var(--s-6); }
.newsletter .input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); color: var(--on-inverse); }
.newsletter .input::placeholder { color: rgba(232,238,252,.5); }

/* ---------- 19. Dashboard shell ---------- */
/* The rail's colour is painted by the grid itself, so it keeps running to the
   bottom on long pages even though the sidebar is only one viewport tall. */
.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; background: var(--surface-inverse); }
@media (max-width: 1024px) { .app { grid-template-columns: 1fr; } }

.sidebar {
  background: var(--surface-inverse); color: var(--on-inverse);
  padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-6);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
@media (max-width: 1024px) { .sidebar { position: static; height: auto; } }
.sidebar__user { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); padding-bottom: var(--s-6); border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar__user img { width: 84px; height: 84px; border-radius: var(--r-lg); object-fit: cover; border: 2px solid var(--accent); }
.side-link {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-radius: var(--r);
  color: rgba(232,238,252,.6); font-weight: 600; font-size: .9375rem;
  position: relative; transition: all .18s;
}
.side-link:hover { color: var(--on-inverse); background: rgba(255,255,255,.06); }
.side-link.is-active { color: var(--on-inverse); background: rgba(255,255,255,.08); }
.side-link.is-active::before {
  content: ""; position: absolute; inset-inline-start: 0; inset-block: 8px;
  width: 3px; border-radius: 3px; background: var(--accent);
}
.side-link.is-active .icon { color: var(--accent); }
.sidebar__foot { margin-top: auto; }

.app-main { padding: var(--s-8); min-width: 0; background: var(--bg); }
@media (max-width: 640px) { .app-main { padding: var(--s-5) var(--s-4); } }
.app-head { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: flex-start; justify-content: space-between; margin-bottom: var(--s-8); }

.stat { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-2); }
.stat__top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.stat__icon { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; background: var(--surface-3); color: var(--text-muted); }
.card--rule-gold .stat__icon { background: var(--accent-soft); color: var(--accent-soft-text); }
.stat__value { font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.trend { display: inline-flex; align-items: center; gap: var(--s-1); font-size: .8125rem; font-weight: 600; }
.trend--up { color: var(--success); }
.trend--down { color: var(--danger); }

.list-row { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) 0; }
.list-row + .list-row { border-top: 1px solid var(--border); }
.list-row__icon { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; background: var(--surface-2); color: var(--text-muted); flex: none; }

.countdown { background: var(--info-soft); color: var(--text); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); text-align: center; }
.countdown__time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; direction: ltr; }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--s-1); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.toolbar__sep { width: 1px; align-self: stretch; background: var(--border); margin-inline: var(--s-2); }
.tool { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; color: var(--text-muted); transition: all .15s; }
.tool:hover { background: var(--surface-3); color: var(--text); }
.tool.is-active { background: var(--surface-3); color: var(--text); }

.editor { padding: var(--s-6); min-height: 340px; }
.editor__title { font-size: 1.75rem; font-weight: 800; border: 0; background: none; width: 100%; outline: none; padding: 0; margin-bottom: var(--s-4); }
.editor__title::placeholder { color: var(--text-faint); }
.editor__body { min-height: 240px; outline: none; color: var(--text-muted); line-height: 1.8; }
.editor__body:empty::before { content: attr(data-placeholder); color: var(--text-faint); }

/* ---------- 20. Auth ---------- */
.auth { min-height: calc(100vh - var(--header-h)); display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .auth { grid-template-columns: 1fr; } }
.auth__aside { background: var(--surface-inverse); color: var(--on-inverse); padding: var(--s-16) var(--s-10); display: flex; flex-direction: column; justify-content: center; gap: var(--s-6); }
@media (max-width: 900px) { .auth__aside { display: none; } }
.auth__form { padding: var(--s-16) var(--s-6); display: flex; flex-direction: column; justify-content: center; }
.auth__form > * { width: min(420px, 100%); margin-inline: auto; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); }
.seg button { padding: var(--s-2) var(--s-5); border-radius: var(--r-sm); font-weight: 700; font-size: .875rem; color: var(--text-muted); transition: all .18s; }
.seg button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

/* ---------- 21. Misc ---------- */
.page { display: flex; flex-direction: column; min-height: 100vh; }
.page > main { flex: 1; }

.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); font-size: .875rem; color: var(--text-muted); padding-block: var(--s-6); }
.breadcrumb a:hover { color: var(--accent); }

.cta-band { background: var(--surface-inverse); color: var(--on-inverse); border-radius: var(--r-xl); padding: var(--s-12); text-align: center; }
.cta-band .lead { color: rgba(232,238,252,.72); }

.toast {
  position: fixed; inset-block-end: var(--s-6); inset-inline: var(--s-6) auto;
  z-index: 200; display: flex; align-items: center; gap: var(--s-3);
  background: var(--surface-inverse); color: var(--on-inverse);
  padding: var(--s-4) var(--s-5); border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  font-size: .9375rem; font-weight: 600;
  transform: translateY(140%); opacity: 0;
  transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
}
.toast.is-visible { transform: translateY(0); opacity: 1; }
.toast .icon { color: var(--accent); }

.skip-link {
  position: absolute; inset-inline-start: -9999px; top: var(--s-2); z-index: 200;
  background: var(--primary); color: var(--on-primary); padding: var(--s-3) var(--s-5); border-radius: var(--r);
}
.skip-link:focus { inset-inline-start: var(--s-4); }

.reveal { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; }
.reveal.is-in { opacity: 1; transform: none; }

/* Client dashboard: main column + rail, collapsing to one column on tablets */
.dash-split { grid-template-columns: 1fr 340px; align-items: start; }
@media (max-width: 1100px) { .dash-split { grid-template-columns: 1fr; } }

/* ---------- FAQ accordion ---------- */
.faq-item { padding: 0; }
.faq-q {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-5) var(--s-6); font-weight: 700;
}
.faq-q::-webkit-details-marker { display: none; }
.faq-q:hover { color: var(--accent); }
.faq-chevron { transition: transform .2s; color: var(--text-muted); }
.faq-item[open] .faq-chevron { transform: rotate(180deg); }
.faq-a { padding: 0 var(--s-6) var(--s-5); color: var(--text-muted); line-height: 1.7; }

/* ==========================================================================
   Roles, task bank, assistant, account
   ========================================================================== */

/* ---------- header role badge ---------- */
.role-badge {
  display: inline-flex; align-items: center; gap: var(--s-3);
  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-1);
  border: 1.5px solid var(--border); border-radius: var(--r-full);
  background: var(--surface); transition: all .18s;
}
[dir="ltr"] .role-badge { padding: var(--s-1) var(--s-1) var(--s-1) var(--s-3); }
.role-badge:hover { border-color: var(--border-strong); background: var(--surface-2); }
.role-badge__mark {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.role-badge__text { display: flex; flex-direction: column; line-height: 1.2; }
.role-badge__text strong { font-size: .625rem; font-weight: 600; color: var(--text-faint); }
.role-badge__text span { font-size: .8125rem; font-weight: 700; }
@media (max-width: 1024px) { .role-badge__text { display: none; } .role-badge { padding: var(--s-1); } }

/* ---------- role picker cards ---------- */
.role-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-2);
  position: relative; text-align: start;
  padding: var(--s-5); border-radius: var(--r-lg);
  border: 1.5px solid var(--border); background: var(--surface);
  transition: all .18s;
}
.role-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-1); }
.role-card.is-active { border-color: var(--accent); background: var(--accent-soft); }
.role-card__icon {
  width: 44px; height: 44px; border-radius: var(--r); display: grid; place-items: center;
  background: var(--surface-3); color: var(--text);
}
.role-card.is-active .role-card__icon { background: var(--accent); color: var(--on-accent); }
.role-card__check {
  position: absolute; top: var(--s-3); inset-inline-end: var(--s-3);
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}

/* ---------- account quick links ---------- */
.account-link {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-2); font-weight: 600; font-size: .9375rem;
  color: var(--text-muted); transition: color .18s, padding .18s;
}
.account-link + .account-link { border-top: 1px solid var(--border); }
.account-link:hover { color: var(--text); padding-inline-start: var(--s-4); }
.account-link__go { margin-inline-start: auto; color: var(--text-faint); }
[dir="rtl"] .account-link__go { transform: scaleX(-1); }

/* ---------- task bank ---------- */
.task-card { display: flex; flex-direction: column; height: 100%; }
.task-card__body { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
.task-card__meta {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3);
  padding-top: var(--s-4); margin-top: auto; border-top: 1px solid var(--border);
}
.task-card__meta > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.task-card__meta strong { font-size: .875rem; }
.task-card__meta .reward { color: var(--accent); font-size: 1rem; }
.task-card__foot { padding: 0 var(--s-5) var(--s-5); }
.task-card.is-taken { opacity: .82; }
@media (max-width: 480px) { .task-card__meta { grid-template-columns: 1fr 1fr; } }

/* ---------- assistant chat ---------- */
.chat {
  padding: var(--s-5); min-height: 300px; max-height: 460px; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--s-4);
  background: var(--surface-2); border-block: 1px solid var(--border);
}
.bubble {
  max-width: min(72ch, 88%); align-self: flex-start;
  padding: var(--s-4) var(--s-5); border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
}
/* The reader's own turn sits on the side the page reads from. */
.bubble--user {
  align-self: flex-end;
  background: var(--primary); color: var(--on-primary); border-color: var(--primary);
}
.bubble__who {
  display: block; font-size: .6875rem; font-weight: 700;
  letter-spacing: .04em; opacity: .6; margin-bottom: var(--s-2);
}
.bubble p { line-height: 1.75; font-size: .9375rem; }

.chat-composer { display: flex; gap: var(--s-3); padding: var(--s-4) var(--s-5); }
.chat-composer .input { flex: 1; }
@media (max-width: 520px) {
  .chat-composer { flex-direction: column; }
  .chat-composer .btn { width: 100%; }
}

.disclaimer {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border);
  background: var(--warning-soft); color: var(--warning);
  font-size: .8125rem; line-height: 1.6;
}
.disclaimer .icon { flex: none; margin-top: 2px; }

/* ==========================================================================
   AI drafting — the home offer, the client order flow, the lawyer workspace
   ========================================================================== */

/* ---------- home: the offer block ---------- */
.offer {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-10);
  align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  border-radius: var(--r-xl); padding: var(--s-10);
  box-shadow: var(--shadow-1);
}

    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }

    try {

    } catch (e) { /* private mode */ }

  var stored = read();
  var current = (stored === "dark" || stored === "light")
    ? stored

    // Keeps the mobile browser chrome in step with the page.

   of them async would have been the obvious move and the wrong one: it changes
   every page to serve a decision about where rows live.

   at once, and writes go into it immediately and to the database behind. The
   pages never learn which backend answered.

      type_id: r.typeId, title: flat(r.title), brief: flat(r.brief),

/* ==========================================================================

   to exchange an offer, an answer and a handful of ICE candidates first, and
   that exchange needs a channel neither peer owns. This module is that
   channel, behind one small interface:

       Signal.open(room, onMessage) -> { send(msg), close() }

   The transport underneath is swappable, and only one of them is real:

     • "local"    — BroadcastChannel between tabs of the same browser. Enough to
                    build and test the whole call flow, and enough for a demo,
                    but it will never reach another device.
     • "supabase" — a Realtime channel. Same shape, works across the internet.

        close: function () { try { bc.close(); } catch (e) {} }

    // the delivery we need. The key is rewritten each time so it always fires.

      var msg;
      try { msg = JSON.parse(ev.newValue); } catch (e) { return; }
      if (msg && msg.from !== me) onMessage(msg.body, msg.from);

    global.addEventListener("storage", onStorage);
    return {
      id: me,
      send: function (body) {
        try {
          localStorage.setItem(name, JSON.stringify({ from: me, body: body, at: Date.now() }));
        } catch (e) {}

      close: function () { global.removeEventListener("storage", onStorage); }

    if (!sb) return null;

    channel.on("broadcast", { event: "signal" }, function (payload) {
      var msg = payload.payload;

      id: me,
      send: function (body) {

      },

            return '<span class="tag">' + esc(tx(s)) + "</span>";
          }).join("") +
        "</div>" +
      "</a>" +
      '<div class="person-card__foot">' + progressBar(prog.pct) + "</div></article>";
  }

  function progressBar(pct) {
    return '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100">' +
      '<span style="width:' + pct + '%"></span></div>';
  }

  /* ---------- articles ---------- */
  function articleCard(a) {
    var author = M.user(a.authorId);
    var cat = M.specialty(a.cat);
    var likes = M.likesOf(a.id);
    var comments = M.commentsOn(a.id).length;
    return '<article class="card card--hover article-card">' +
      '<a class="article-card__media" href="article.html?id=' + esc(a.id) + '">' +
        '<img src="' + App.asset(a.cover) + '" alt="" loading="lazy" width="800" height="450">' +
        (cat ? '<span class="article-card__cat">' + esc(tx(cat)) + "</span>" : "") +
      "</a>" +
      '<div class="article-card__body">' +
        '<div class="meta-row"><span>' + esc(tx(a.date)) + "</span><span class=\"dot\"></span>" +
          '<span class="row gap-1">' + Icons.svg("clock", "icon-sm") +
          esc(I18N.t("blog.readTime", { n: I18N.num(a.read) })) + "</span></div>" +
        '<h3 class="subtitle"><a href="article.html?id=' + esc(a.id) + '">' + esc(tx(a.title)) + "</a></h3>" +
        '<p class="small muted">' + esc(tx(a.excerpt)) + "</p>" +
      "</div>" +
      '<div class="article-card__foot">' +
        '<span class="row gap-2 small">' + avatar(author, "sm") + personLink(author) + "</span>" +
        '<span class="row gap-3 small muted">' +
          '<span class="row gap-1">' + Icons.svg("heart", "icon-sm") + num(likes.count) + "</span>" +
          '<span class="row gap-1">' + Icons.svg("comment", "icon-sm") + num(comments) + "</span>" +
        "</span>" +
      "</div></article>";
  }

  /* ---------- requests ---------- */
  var STATUS_STYLE = {
    new: "warn", quoting: "info", assigned: "info", scheduled: "info",
    drafted: "ok", open_to_interns: "warn", with_intern: "info", in_progress: "warn",
    delivered: "ok", completed: "muted", cancelled: "muted",
    pending: "warn", verified: "ok", rejected: "muted"
  };

  function statusPill(status) {
    return '<span class="status status--' + (STATUS_STYLE[status] || "muted") + '">' +
      esc(I18N.t("status." + status)) + "</span>";
  }

  function requestRow(r, opts) {
    opts = opts || {};
    var st = M.requestState(r);
    var type = M.serviceType(r.typeId);
    var other = M.user(opts.showClient ? r.clientId : r.lawyerId);
    // A caller may show a different status than the one stored — the client's
    // view deliberately hides how the work is being produced.
    var shown = opts.status || st.status;
    return '<div class="req-row">' +
      '<span class="req-row__icon">' + Icons.svg(type ? type.icon : "file-text", "icon-sm") + "</span>" +
      '<div class="grow" style="min-width:0">' +
        '<div class="row gap-2 wrap"><strong class="small">' + esc(tx(r.title)) + "</strong>" +
          (type ? '<span class="tag">' + esc(tx(type.title)) + "</span>" : "") + "</div>" +
        '<p class="tiny muted">' + (other ? esc(tx(other.name)) + ' <span class="dot"></span> ' : "") +
          esc(tx(r.ago)) + "</p>" +
        (r.brief ? '<p class="tiny faint">' + esc(tx(r.brief)) + "</p>" : "") +
      "</div>" +
      '<div class="req-row__side">' + statusPill(shown) +
        '<strong class="tiny">' + num(r.price) + " " + sar() + "</strong>" +
        (opts.actions ? '<div class="req-row__actions">' + opts.actions(r, st) + "</div>" : "") +
      "</div></div>";
  }

  /* ---------- signing in with Google ----------
     Shown always, so the page does not change shape between the demo and the
     connected project. On the demo it says why it cannot work yet rather than
     failing silently when pressed. */
  function googleButton() {
    var live = global.SB && global.SB.configured();
    var mark =
      '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke:none">' +
        '<path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/>' +
        '<path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/>' +
        '<path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.8V7.6H3.1a10 10 0 0 0 0 8.8L6.4 14z"/>' +
        '<path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.6l3.3 2.6C7.2 7.6 9.4 5.9 12 5.9z"/>' +
      "</svg>";
    return '<button class="btn btn--outline btn--block" type="button" data-google' +
      (live ? "" : " disabled") + ">" + mark +
      '<span data-i18n="auth.google"></span></button>' +
      (live ? "" : '<p class="tiny faint center" style="margin-top:var(--s-2)" ' +
        'data-i18n="auth.googleOnly"></p>') +
      '<div class="or-rule"><span data-i18n="auth.or"></span></div>';
  }

  /* ---------- misc ---------- */
  function empty(iconName, textKey) {
    return '<div class="card empty">' + Icons.svg(iconName, "icon-xl") +
      '<p class="subtitle">' + esc(I18N.t(textKey)) + "</p></div>";
  }

  function sectionHead(titleKey, leadKey) {
    return '<div class="section-head"><h2 class="headline" data-i18n="' + titleKey + '"></h2>' +
      (leadKey ? '<p class="lead" data-i18n="' + leadKey + '"></p>' : "") + "</div>";
  }

  global.C = {
    sar: sar, num: num, avatar: avatar, personLink: personLink, stars: stars,
    ratingLine: ratingLine, verifiedMark: verifiedMark, progressBar: progressBar,
    starPicker: starPicker, ratingSummary: ratingSummary, reviewCard: reviewCard,
    lawyerCard: lawyerCard, internCard: internCard, articleCard: articleCard,
    statusPill: statusPill, requestRow: requestRow, empty: empty, sectionHead: sectionHead,
    googleButton: googleButton
  };
})(window);
</script>
<script>/* ==========================================================================
   Home — one address, three landings.

   A client (and a guest) gets a deliberately short front page: what the
   platform is, three ways in, a few lawyers, a couple of articles.
   A lawyer and a trainee get a working dashboard instead, because for them
   this is where the day starts, not a brochure.
   ========================================================================== */
Pages.define("home", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-home]");
  if (!host) return;

  /* ---------- shared pieces ---------- */
  function stat(iconName, labelKey, value, rule) {
    return '<div class="card stat' + (rule ? " card--rule-" + rule : "") + '">' +
      '<div class="stat__top"><span class="small muted" data-i18n="' + labelKey + '"></span>' +
        '<span class="stat__icon">' + Icons.svg(iconName, "icon-sm") + "</span></div>" +
      '<span class="stat__value num">' + value + "</span></div>";
  }

  function sideLink(href, iconName, labelKey) {
    return '<a class="account-link" href="' + href + '">' +
      '<span class="stat__icon">' + Icons.svg(iconName, "icon-sm") + "</span>" +
      '<span class="grow" data-i18n="' + labelKey + '"></span>' +
      '<span class="account-link__go">' + Icons.svg("arrow", "icon-sm") + "</span></a>";
  }

  function pendingNotice() {
    return '<div class="card card--pad card--rule-gold" style="margin-bottom:var(--s-6)">' +
      '<h2 class="subtitle" data-i18n="dash.pendingTitle"></h2>' +
      '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="dash.pendingBody"></p></div>';
  }

  function greeting(leadKey) {
    var u = Session.user();
    return '<header style="margin-bottom:var(--s-8)">' +
      '<h1 class="headline" data-i18n="dash.hello" data-i18n-vars=\'' +
        JSON.stringify({ name: tx(u.name).split(" ").slice(0, 2).join(" ") }).replace(/'/g, "&#39;") +
      '\'></h1>' +
      '<p class="lead" data-i18n="' + leadKey + '"></p></header>';
  }

  function rankCard(role) {
    var u = Session.user();
    var r = M.rankOf(u.id, role);
    var s = M.scoreOf(u);
    return '<div class="card card--pad">' +
      '<h2 class="subtitle" data-i18n="dash.myRank"></h2>' +
      '<p class="display" style="margin:var(--s-3) 0">' +
        (r.rank
          ? '<span class="num">' + I18N.num(r.rank) + "</span>" +
            '<span class="lead" style="font-size:1rem"> ' + esc(I18N.t("dash.of")) + " " +
            '<span class="num">' + I18N.num(r.of) + "</span></span>"
          : "—") + "</p>" +
      C.progressBar(s.total) +
      '<p class="tiny muted" style="margin-top:var(--s-3)" data-i18n="dash.rankHint"></p></div>';
  }

  /* ---------- client / guest ---------- */
  function paths() {
    var items = [
      { href: "lawyers.html",  icon: "scale", t: "home.pathBrowse", b: "home.pathBrowseBody" },
      { href: "services.html", icon: "tag",   t: "home.pathOrder",  b: "home.pathOrderBody" },
      { href: "quotes.html",   icon: "gavel", t: "home.pathQuote",  b: "home.pathQuoteBody" }
    ];
    return '<div class="grid grid-3">' + items.map(function (it) {
      return '<a class="card card--hover feature" href="' + it.href + '">' +
        '<span class="feature__icon">' + Icons.svg(it.icon, "icon-lg") + "</span>" +
        '<h3 class="subtitle" data-i18n="' + it.t + '"></h3>' +
        '<p class="small muted" data-i18n="' + it.b + '"></p></a>';
    }).join("") + "</div>";
  }

  function clientHome() {
    var top = M.leaderboard("lawyer").slice(0, 3).map(function (row) { return row.user; });
    var posts = M.articles().slice(0, 2);

    return (
      '<section class="hero"><div class="container hero__inner">' +
        '<span class="eyebrow" data-i18n="home.eyebrow"></span>' +
        '<h1 class="display" data-i18n="home.heroTitle"></h1>' +
        '<p class="lead" data-i18n="home.heroLead"></p>' +
        '<form class="searchbar" data-home-search>' +
          '<input class="input" name="q" data-i18n-attr="placeholder:home.searchPlaceholder">' +
          '<select class="select" name="specialty" data-any-specialty></select>' +
          '<select class="select" name="city" data-any-city></select>' +
          '<button class="btn btn--primary" type="submit" data-i18n="home.search"></button>' +
        "</form>" +
        '<div class="trustbar">' +
          ["shield-check:home.trust1", "lock:home.trust2", "verified:home.trust3"].map(function (p) {
            var bits = p.split(":");
            return "<span>" + Icons.svg(bits[0], "icon-sm") + '<span data-i18n="' + bits[1] + '"></span></span>';
          }).join("") +
        "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        C.sectionHead("home.pathsTitle", "home.pathsLead") + paths() +
      "</div></section>" +

      '<section class="section section--band"><div class="container reveal">' +
        '<div class="row between wrap gap-4" style="margin-bottom:var(--s-8)">' +
          '<div><h2 class="headline" data-i18n="home.featuredTitle"></h2>' +
            '<p class="lead" data-i18n="home.featuredLead"></p></div>' +
          '<a class="btn btn--outline" href="lawyers.html" data-i18n="home.viewAll"></a></div>' +
        '<div class="grid grid-3">' + top.map(C.lawyerCard).join("") + "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        '<div class="row between wrap gap-4" style="margin-bottom:var(--s-8)">' +
          '<div><h2 class="headline" data-i18n="home.blogTitle"></h2>' +
            '<p class="lead" data-i18n="home.blogLead"></p></div>' +
          '<a class="btn btn--outline" href="blog.html" data-i18n="home.viewAll"></a></div>' +
        '<div class="grid grid-2">' + posts.map(C.articleCard).join("") + "</div>" +
      "</div></section>" +

      '<section class="section section--tight"><div class="container reveal">' +
        '<div class="cta-band">' +
          '<h2 class="headline" data-i18n="home.ctaTitle"></h2>' +
          '<p class="lead" data-i18n="home.ctaLead"></p>' +
          '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
            '<a class="btn btn--accent btn--lg" href="lawyers.html" data-i18n="home.ctaPrimary"></a>' +
            '<a class="btn btn--ghost btn--lg" href="signup.html" data-i18n="home.ctaSecondary"></a>' +
          "</div></div>" +
      "</div></section>"
    );
  }

  /* ---------- lawyer ---------- */
  function lawyerHome() {
    var u = Session.user();
    var mine = M.requestsForLawyer(u.id);
    var live = mine.filter(function (r) {
      var st = M.requestState(r).status;
      return st !== "completed" && st !== "cancelled";
    });
    var needsMe = live.filter(function (r) {
      var st = M.requestState(r);
      return !st.assignedTo && (st.status === "new" || st.status === "drafted" || st.status === "assigned");
    });
    var revenue = mine.reduce(function (t, r) { return t + (r.price || 0); }, 0);
    var rating = M.ratingOf(u.id);
    // What has gone out to trainees is part of reading the month honestly.
    var toInterns = mine.reduce(function (t, r) {
      var pay = M.taskPay(r);
      return t + (pay && pay.kind === "share" ? pay.amount : 0);
    }, 0);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      greeting("dash.lawyerLead") +
      (Session.isVerified() ? "" : pendingNotice()) +
      '<div class="grid grid-5">' +
        stat("inbox", "dash.awaitingYou", I18N.num(needsMe.length), "gold") +
        stat("file-text", "dash.activeRequests", I18N.num(live.length)) +
        stat("wallet", "dash.revenue", I18N.num(revenue)) +
        stat("graduation", "pay.paidOut", I18N.num(toInterns)) +
        stat("star", "dash.overallRating", rating.avg.toFixed(1)) +
      "</div>" +

      '<div class="grid dash-split" style="margin-top:var(--s-10)">' +
        '<section class="card card--pad">' +
          '<div class="row between gap-3" style="margin-bottom:var(--s-5)">' +
            '<h2 class="subtitle" data-i18n="dash.latestWork"></h2>' +
            '<a class="btn btn--outline btn--sm" href="requests.html" data-i18n="dash.openInbox"></a></div>' +
          (live.length
            ? '<div class="req-list">' + live.slice(0, 4).map(function (r) {
                return C.requestRow(r, { showClient: true });
              }).join("") + "</div>"
            : '<p class="small muted" data-i18n="dash.nothingYet"></p>') +
        "</section>" +

        '<aside class="stack gap-4">' +
          rankCard("lawyer") +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" style="margin-bottom:var(--s-4)" data-i18n="dash.quickActions"></h2>' +
            '<div class="stack gap-2">' +
              sideLink("assistant.html", "sparkle", "dash.aiAssist") +
              sideLink("services.html", "tag", "dash.manageServices") +
              sideLink("editor.html", "edit", "dash.writeArticle") +
              sideLink("lawyer.html?id=" + encodeURIComponent(u.id), "user", "dash.completeProfile") +
            "</div></div>" +
        "</aside>" +
      "</div></div>";
  }

  /* ---------- trainee ---------- */
  function internHome() {
    var u = Session.user();
    var mine = M.requestsForIntern(u.id);
    var done = mine.filter(function (r) {
      var st = M.requestState(r).status;
      return st === "delivered" || st === "completed";
    });
    var prog = M.certProgress(u.id);

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      greeting("dash.internLead") +
      (Session.isVerified() ? "" : pendingNotice()) +
      '<div class="grid grid-4">' +
        stat("inbox", "dash.assignedCount", I18N.num(mine.length), "gold") +
        stat("check", "dash.doneCount", I18N.num(done.length)) +
        stat("clock", "dash.hoursLogged", I18N.num(prog.hours)) +
        stat("wallet", "pay.earned", I18N.num(M.earnedBy(u.id))) +
      "</div>" +

      '<div class="grid dash-split" style="margin-top:var(--s-10)">' +
        '<section class="card card--pad">' +
          '<div class="row between gap-3" style="margin-bottom:var(--s-5)">' +
            '<h2 class="subtitle" data-i18n="tasks.assignedToMe"></h2>' +
            '<a class="btn btn--outline btn--sm" href="requests.html" data-i18n="dash.openInbox"></a></div>' +
          (mine.length
            ? '<div class="req-list">' + mine.slice(0, 4).map(function (r) {
                return C.requestRow(r, { showClient: true });
              }).join("") + "</div>"
            : '<p class="small muted" data-i18n="dash.nothingYet"></p>') +
        "</section>" +

        '<aside class="stack gap-4">' +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" data-i18n="cert.title"></h2>' +
            '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)" data-i18n="cert.progress"></p>' +
            C.progressBar(prog.pct) +
            '<p class="tiny muted" style="margin-top:var(--s-3)">' +
              esc(I18N.t(prog.eligible ? "cert.eligible" : "cert.remaining",
                         { n: I18N.num(Math.max(0, prog.needed - prog.hours)) })) + "</p></div>" +
          rankCard("intern") +
          '<div class="card card--pad">' +
            '<h2 class="subtitle" style="margin-bottom:var(--s-4)" data-i18n="dash.quickActions"></h2>' +
            '<div class="stack gap-2">' +
              sideLink("services.html", "graduation", "dash.mySkills") +
              sideLink("editor.html", "edit", "dash.writeArticle") +
              sideLink("intern.html?id=" + encodeURIComponent(u.id), "user", "dash.completeProfile") +
            "</div></div>" +
        "</aside>" +
      "</div></div>";
  }

  /* ---------- draw ---------- */
  App.onRender(function () {
    var role = Session.role();
    host.innerHTML = role === "lawyer" ? lawyerHome()
                   : role === "intern" ? internHome()
                   : clientHome();

    fillAny("[data-any-specialty]", global.SEED.specialties, "dir.anySpecialty");
    fillAny("[data-any-city]", global.SEED.cities, "dir.anyCity");
    I18N.apply(host);
    App.observeReveals(host);
  });

  function fillAny(sel, list, anyKey) {
    var el = $(sel, host);
    if (!el) return;
    el.innerHTML = '<option value="">' + esc(I18N.t(anyKey)) + "</option>" +
      list.map(function (o) {
        return '<option value="' + esc(o.id) + '">' + esc(tx(o)) + "</option>";
      }).join("");
  }

  /* The front-page search is just a shortcut into the directory's own filters. */
  host.addEventListener("submit", function (ev) {
    var form = ev.target.closest("[data-home-search]");
    if (!form) return;
    ev.preventDefault();
    var q = new URLSearchParams();
    ["q", "specialty", "city"].forEach(function (n) {
      var v = form.querySelector('[name="' + n + '"]').value;
      if (v) q.set(n, v);
    });
    App.go("lawyers.html" + (q.toString() ? "?" + q : ""));
  });
});

/* ==========================================================================
   Requests — the same URL, three jobs.

     client : what I asked for, running and finished. Never a word about how
              the work was produced — that is the lawyer's business.
     lawyer : the inbox. What the assistant has drafted, what needs my pen,
              what I routed to a trainee.
     intern : the work routed to me, and the button that logs its hours.
   ========================================================================== */
Pages.define("requests", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-requests]");
  if (!host) return;

  var open = null;      // request id whose editor/detail panel is expanded
  var rating = {};      // requestId -> stars picked but not yet sent
  var arguing = null;   // requestId whose refusal form is open
  var revising = null;  // requestId whose revision form is open

  function guest() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("lock", "auth.guestHint") +
      '<p class="center" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="login.html" data-i18n="auth.signIn"></a></p></div>';
  }

  /* ====================================================== client ========== */
  function clientView() {
    var me = Session.user();
    var live = M.requestsForClient(me.id, "open");
    var past = M.requestsForClient(me.id, "past");

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="req.heading"></h1>' +
        '<p class="lead" data-i18n="req.leadClient"></p></header>' +

      '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
        '<h2 class="subtitle" style="margin-bottom:var(--s-5)" data-i18n="req.current"></h2>' +
        (live.length
          ? '<div class="req-list">' + live.map(clientRow).join("") + "</div>"
          : '<p class="small muted" data-i18n="req.noneCurrent"></p>') +
      "</section>" +

      '<section class="card card--pad">' +
        '<h2 class="subtitle" style="margin-bottom:var(--s-5)" data-i18n="req.past"></h2>' +
        (past.length
          ? '<div class="req-list">' + past.map(clientRow).join("") + "</div>"
          : '<p class="small muted" data-i18n="req.nonePast"></p>') +
      "</section></div>";
  }

  /* What the client is allowed to see. Drafting, assistant queues and trainee
     routing are how the work gets done, not something the client ordered — so
     all three collapse into one honest word: in progress. */
  var CLIENT_STATUS = {
    drafted: "in_progress", with_intern: "in_progress", assigned: "in_progress",
    open_to_interns: "in_progress"
  };

  function clientRow(r) {
    var st = M.requestState(r);
    var lawyer = M.user(r.lawyerId);
    var canRate = (st.status === "delivered" || st.status === "completed") && !st.rated;

    return '<div>' + C.requestRow(r, {
      status: CLIENT_STATUS[st.status] || st.status,
      actions: function () {
        var type = M.serviceType(r.typeId);
        var live = type && type.mode === "live" &&
          ["delivered", "completed", "cancelled"].indexOf(st.status) === -1;
        return (live
            ? '<a class="btn btn--primary btn--sm" href="call.html?id=' + esc(r.id) + '">' +
              Icons.svg(type.icon, "icon-sm") + esc(I18N.t("inbox.join")) + "</a>"
            : "") +
          '<button class="btn btn--ghost btn--sm" type="button" data-detail="' + esc(r.id) + '">' +
            esc(I18N.t("req.openDetails")) + "</button>" +
          (canRate
            ? '<button class="btn btn--outline btn--sm" type="button" data-rate="' + esc(r.id) + '">' +
              Icons.svg("star", "icon-sm") + esc(I18N.t("rate.cta")) + "</button>"
            : st.rated
              ? '<span class="tiny muted">' + esc(I18N.t("rate.already")) + "</span>"
              : "");
      }
    }) +
    (open === r.id ? clientDetail(r, st, lawyer) : "") + "</div>";
  }

  function clientDetail(r, st, lawyer) {
    return '<div class="card card--pad" style="margin:var(--s-2) 0 var(--s-4)">' +
      '<div class="row between wrap gap-3">' +
        '<div class="row gap-3">' + C.avatar(lawyer, "sm") +
          '<div><span class="tiny muted" data-i18n="req.byLawyer"></span>' +
          "<div>" + C.personLink(lawyer) + "</div></div></div>" +
        '<button class="icon-btn" type="button" data-detail-close>' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<h3 class="subtitle" style="margin-top:var(--s-5)" data-i18n="req.deliverable"></h3>' +
      (st.body
        ? '<pre class="draft-text" style="min-height:auto" readonly>' + esc(st.body) + "</pre>"
        : '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="req.noDeliverable"></p>') +
      acceptPanel(r) +
      (rating[r.id] !== undefined ? rateForm(r) : "") +
    "</div>";
  }


  /* ---- accepting a delivery, and refusing one -------------------------
     The client is not asked to trust that somebody will eventually settle
     this. The window is on screen with its deadline, the one revision is
     offered before the right to refuse rather than instead of it, and a
     refusal says plainly that the money stops moving until it is decided. */
  function timeLeft(ms) {
    var h = Math.floor(ms / 3600e3), d = Math.floor(h / 24);
    if (d > 0) return I18N.t("accept.leftDays", { d: d, h: h - d * 24 });
    if (h > 0) return I18N.t("accept.leftHours", { h: h });
    return I18N.t("accept.leftSoon");
  }

  function outcomeLine(res) {
    if (res.outcome === "release") return I18N.t("accept.outRelease");
    if (res.outcome === "refund") return I18N.t("accept.outRefund");
    return I18N.t("accept.outSplit", { p: res.lawyerPct });
  }

  function acceptPanel(r) {
    var a = M.acceptance(r);
    if (!a.delivered) return "";
    var d = a.dispute;

    // Decided: the outcome and the reason behind it, in the same words the
    // lawyer sees — there is no version of this the other party cannot read.
    if (d && d.status === "resolved") {
      var s = M.settlement(r);
      return card("gold",
        '<h3 class="subtitle">' + esc(I18N.t("accept.decided")) + "</h3>" +
        '<p style="margin-top:var(--s-2)">' + esc(outcomeLine(d.resolution)) + "</p>" +
        (s && s.refund > 0
          ? '<p class="small" style="margin-top:var(--s-2)">' +
            esc(I18N.t("accept.refunded")) + ": " + C.num(Math.round(s.refund / 100)) + " " + C.sar() + "</p>"
          : "") +
        '<p class="tiny muted" style="margin-top:var(--s-3)">' +
          esc(I18N.t("accept.decisionReason")) + "</p>" +
        '<p class="small">' + esc(d.resolution.reason) + "</p>");
    }

    if (d) {
      return card("gold",
        '<h3 class="subtitle">' + esc(I18N.t("accept.disputeOpen")) + "</h3>" +
        '<p class="small" style="margin-top:var(--s-2)">' + esc(I18N.t("accept.frozen")) + "</p>" +
        '<p class="tiny muted" style="margin-top:var(--s-3)">' + esc(I18N.t("accept.yourReason")) + "</p>" +
        '<p class="small">' + esc(d.reason) + "</p>");
    }

    if (a.settled) {
      return card("", '<p class="small">' + Icons.svg("check", "icon-sm") + " " +
        esc(I18N.t(a.autoAccepted ? "accept.auto" : "accept.accepted")) + "</p>");
    }

    if (revising === r.id) return card("gold", form("revise", r));
    if (arguing === r.id) return card("gold", form("dispute", r));

    return card("gold",
      '<h3 class="subtitle">' + esc(I18N.t("accept.heading")) + "</h3>" +
      '<p class="small" style="margin-top:var(--s-2)">' + esc(I18N.t("accept.lead")) + "</p>" +
      (a.msLeft != null
        ? '<p class="small" style="margin-top:var(--s-3)"><strong>' + esc(timeLeft(a.msLeft)) +
          "</strong></p>" +
          '<p class="tiny muted">' + esc(I18N.t("accept.autoNote")) + "</p>"
        : "") +
      '<p class="tiny muted" style="margin-top:var(--s-2)">' +
        esc(I18N.t(a.canRevise ? "accept.reviseOnce" : "accept.reviseUsed")) + "</p>" +
      '<div class="row gap-3 wrap" style="margin-top:var(--s-4)">' +
        '<button class="btn btn--primary btn--sm" type="button" data-accept="' + esc(r.id) + '">' +
          Icons.svg("check", "icon-sm") + esc(I18N.t("accept.cta")) + "</button>" +
        (a.canRevise
          ? '<button class="btn btn--outline btn--sm" type="button" data-revise="' + esc(r.id) + '">' +
            esc(I18N.t("accept.revise")) + "</button>"
          : "") +
        // Refusing is deliberately the quiet option: it is a right, not the
        // expected next step.
        '<button class="btn btn--ghost btn--sm" type="button" data-argue="' + esc(r.id) + '">' +
          esc(I18N.t("accept.dispute")) + "</button>" +
      "</div>");
  }

  function card(rule, inner) {
    return '<div class="card card--pad' + (rule ? " card--rule-" + rule : "") +
      '" style="margin-top:var(--s-6)">' + inner + "</div>";
  }

  function form(kind, r) {
    var revise = kind === "revise";
    return '<h3 class="subtitle">' +
        esc(I18N.t(revise ? "accept.revise" : "accept.dispute")) + "</h3>" +
      '<p class="small" style="margin-top:var(--s-2)">' +
        esc(I18N.t(revise ? "accept.reviseWhat" : "accept.disputeWhy")) + "</p>" +
      '<textarea class="input" rows="4" style="margin-top:var(--s-3)" data-argue-body></textarea>' +
      '<div class="row gap-3" style="margin-top:var(--s-4)">' +
        '<button class="btn btn--primary btn--sm" type="button" data-' +
          (revise ? "revise-send" : "argue-send") + '="' + esc(r.id) + '">' +
          esc(I18N.t(revise ? "accept.reviseSend" : "accept.disputeSend")) + "</button>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-argue-cancel>' +
          esc(I18N.t("accept.cancel")) + "</button>" +
      "</div>";
  }

  function rateForm(r) {
    var lawyer = M.user(r.lawyerId);
    return '<div class="card card--pad card--rule-gold" style="margin-top:var(--s-6)">' +
      '<h3 class="subtitle" data-i18n="rate.title"></h3>' +
      '<p class="tiny muted" style="margin-top:var(--s-1)">' +
        esc(lawyer ? tx(lawyer.name) : "") + " · " + esc(tx(r.title)) + "</p>" +
      '<div style="margin:var(--s-5) 0">' + C.starPicker(rating[r.id] || 0, r.id) + "</div>" +
      '<textarea class="textarea" data-rate-body ' +
        'data-i18n-attr="placeholder:rate.placeholder"></textarea>' +
      '<p class="tiny faint" style="margin-top:var(--s-2)" data-i18n="rate.commentOptional"></p>' +
      '<button class="btn btn--accent" type="button" style="margin-top:var(--s-4)" ' +
        'data-rate-send="' + esc(r.id) + '" data-i18n="rate.submit"></button></div>';
  }

  /* ====================================================== lawyer ========== */
  var FILTERS = [
    { id: "all",      key: "inbox.all" },
    { id: "ai",       key: "inbox.withAi" },
    { id: "manual",   key: "inbox.withoutAi" },
    { id: "live",     key: "inbox.live" },
    { id: "assigned", key: "inbox.assigned" }
  ];
  var filter = "all";

  function bucket(r) {
    var st = M.requestState(r);
    if (st.assignedTo) return "assigned";
    var t = M.serviceType(r.typeId);
    if (t && t.mode === "live") return "live";
    return r.ai ? "ai" : "manual";
  }

  function inboxStatus(r) {
    var st = M.requestState(r);
    if (st.status === "delivered" || st.status === "completed") return { cls: "ok", key: "inbox.done" };
    if (st.assignedTo) return { cls: "info", key: "inbox.assigned" };
    var t = M.serviceType(r.typeId);
    if (t && t.mode === "live") return { cls: "info", key: "inbox.scheduled" };
    if (r.ai && st.status === "drafted") return { cls: "ok", key: "inbox.aiReady" };
    if (r.ai) return { cls: "muted", key: "inbox.aiQueued" };
    return { cls: "warn", key: "inbox.needsYou" };
  }

  function lawyerActions(r) {
    var st = M.requestState(r);
    var t = M.serviceType(r.typeId) || {};
    if (st.status === "delivered" || st.status === "completed") return "";

    if (st.status === "open_to_interns" && !st.assignedTo) {
      var n = Store.applicants(r.id).length;
      return '<span class="tiny muted">' +
          esc(I18N.t("task.competing", { n: I18N.num(n) })) + "</span>" +
        '<button class="btn btn--outline btn--sm" type="button" data-open="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.applicants")) + "</button>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-unassign="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.withdrawOffer")) + "</button>";
    }

    if (st.assignedTo) {
      var who = M.user(st.assignedTo);
      return '<span class="tiny muted">' +
          esc(I18N.t("inbox.assignedTo", { name: who ? tx(who.name) : "" })) + "</span>" +
        '<span>' + payLine(r, "pay.share") + "</span>" +
        '<button class="btn btn--ghost btn--sm" type="button" data-unassign="' + esc(r.id) + '">' +
          esc(I18N.t("inbox.unassign")) + "</button>";
    }

    if (t.mode === "live") {
      return '<a class="btn btn--primary btn--sm" href="call.html?id=' + esc(r.id) + '">' +
        Icons.svg(t.icon, "icon-sm") + esc(I18N.t("inbox.join")) + "</a>";
    }

    var main = r.ai
      ? (st.status === "drafted"
          ? '<button class="btn btn--primary btn--sm" type="button" data-open="' + esc(r.id) + '">' +
            esc(I18N.t("inbox.review")) + "</button>"
          : '<button class="btn btn--outline btn--sm" type="button" data-gen="' + esc(r.id) + '">' +
            Icons.svg("sparkle", "icon-sm") + esc(I18N.t("inbox.generate")) + "</button>")
      : '<button class="btn btn--outline btn--sm" type="button" data-open="' + esc(r.id) + '">' +
        esc(I18N.t("inbox.writeSelf")) + "</button>";

    return main +
      '<button class="btn btn--ghost btn--sm" type="button" data-assign="' + esc(r.id) + '">' +
        Icons.svg("graduation", "icon-sm") + esc(I18N.t("inbox.assign")) + "</button>";
  }

  function lawyerView() {
    var me = Session.user();
    var all = M.requestsForLawyer(me.id);
    var rows = all.filter(function (r) { return filter === "all" || bucket(r) === filter; });

    var chips = FILTERS.map(function (f) {
      var n = f.id === "all" ? all.length
        : all.filter(function (r) { return bucket(r) === f.id; }).length;
      return '<button type="button" class="chip' + (filter === f.id ? " is-active" : "") +
        '" data-filter="' + f.id + '">' + esc(I18N.t(f.key)) +
        ' <span class="num">' + I18N.num(n) + "</span></button>";
    }).join("");

    return '<div class="container" style="padding-block:var(--s-10) var(--s-20)">' +
      '<header style="margin-bottom:var(--s-6)">' +
        '<h1 class="headline" data-i18n="inbox.title"></h1>' +
        '<p class="lead" data-i18n="inbox.lead"></p></header>' +
      '<div class="row gap-2 wrap" style="margin-bottom:var(--s-5)">' + chips + "</div>" +
      '<p class="small muted" style="margin-bottom:var(--s-4)">' +
        esc(I18N.t("inbox.count", { n: I18N.num(rows.length) })) + "</p>" +

      (rows.length
        ? rows.map(function (r) {
            var st = inboxStatus(r);
            var client = M.user(r.clientId);
            var t = M.serviceType(r.typeId) || {};
            return "<div>" +
              '<div class="inbox-row' + (open === r.id ? " is-open" : "") + '">' +
                '<span class="inbox-row__icon">' + Icons.svg(t.icon || "file-text", "icon-sm") + "</span>" +
                '<div class="grow" style="min-width:0">' +
                  '<div class="row gap-2 wrap"><strong class="small">' + esc(tx(r.title)) + "</strong>" +
                    '<span class="tag">' + esc(tx(t.title || {})) + "</span></div>" +
                  '<p class="tiny muted">' + esc(client ? tx(client.name) : "") +
                    ' <span class="dot"></span> ' + esc(tx(r.ago)) + "</p>" +
                  (r.brief ? '<p class="tiny faint">' + esc(I18N.t("inbox.clientNote")) + ": " +
                    esc(tx(r.brief)) + "</p>" : "") +
                "</div>" +
                '<div class="inbox-row__side">' +
                  '<span class="status status--' + st.cls + '">' + esc(I18N.t(st.key)) + "</span>" +
                  '<strong class="tiny"><span class="num">' + I18N.num(r.price) + "</span> " +
