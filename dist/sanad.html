    var el = $("[data-ed-error]", host);
    if (!el) return;
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  function mine() {
    var me = Session.user();
    var list = M.articlesBy(me.id);
    if (!list.length) return "";
    return '<section style="margin-top:var(--s-10)">' +
      '<h2 class="subtitle" data-i18n="ed.mine"></h2>' +
      '<div class="req-list" style="margin-top:var(--s-4)">' + list.map(function (a) {
        var status = Store.articleState(a.id).status || a.status || "published";
        return '<div class="req-row">' +
          '<span class="req-row__icon">' + Icons.svg("file-text", "icon-sm") + "</span>" +
          '<div class="grow" style="min-width:0">' +
            '<a class="small" href="article.html?id=' + esc(a.id) + '"><strong>' +
              esc(tx(a.title)) + "</strong></a>" +
            '<p class="tiny muted">' + esc(tx(a.date || {})) + "</p></div>" +
          '<div class="req-row__side"><span class="status status--' +
            (status === "published" ? "ok" : "warn") + '" data-i18n="' +
            (status === "published" ? "dash.published" : "blog.pending") + '"></span></div></div>';
      }).join("") + "</div></section>";
  }

  App.onRender(function () {
    if (!Session.is("lawyer") && !Session.is("intern")) {
      host.innerHTML = '<div class="container" style="padding-block:var(--s-16)">' +
        C.empty("lock", "ed.onlyPros") +
        '<p class="center" style="margin-top:var(--s-6)">' +
          '<a class="btn btn--primary" href="blog.html" data-i18n="art.back"></a></p></div>';
      I18N.apply(host);
      return;
    }

    var isLawyer = Session.is("lawyer");
    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20);max-width:820px">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="ed.heading"></h1>' +
        '<p class="lead" data-i18n="' + (isLawyer ? "ed.leadLawyer" : "ed.leadIntern") + '"></p></header>' +

      '<div class="card card--pad stack gap-4">' +
        '<label class="field"><span class="label" data-i18n="ed.title"></span>' +
          '<input class="input" data-ed="title" value="' + esc(draft.title) + '"></label>' +
        '<label class="field"><span class="label" data-i18n="ed.cat"></span>' +
          '<select class="select" data-ed="cat">' + global.SEED.specialties.map(function (s) {
            return '<option value="' + esc(s.id) + '"' + (draft.cat === s.id ? " selected" : "") + ">" +
              esc(tx(s)) + "</option>";
          }).join("") + "</select></label>" +
        '<label class="field"><span class="label" data-i18n="ed.excerpt"></span>' +
          '<textarea class="textarea" data-ed="excerpt" rows="2">' + esc(draft.excerpt) + "</textarea></label>" +
        '<label class="field"><span class="label" data-i18n="ed.body"></span>' +
          '<textarea class="draft-text" data-ed="body">' + esc(draft.body) + "</textarea></label>" +
        '<p class="form-error" data-ed-error hidden></p>' +
        '<div class="row gap-3">' +
          '<button class="btn btn--primary" type="button" data-ed-save data-i18n="' +
            (isLawyer ? "ed.publish" : "ed.submit") + '"></button></div>' +
      "</div>" +

      mine() +
    "</div>";

    I18N.apply(host);
  });

  host.addEventListener("input", function (ev) {
    var f = ev.target.closest("[data-ed]");
    if (f) draft[f.getAttribute("data-ed")] = f.value;
  });
  host.addEventListener("change", function (ev) {
    var f = ev.target.closest("[data-ed]");
    if (f) draft[f.getAttribute("data-ed")] = f.value;
  });

  host.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-ed-save]")) return;
    if (!draft.title.trim()) { error("ed.needTitle"); return; }
    if (draft.body.trim().length < 40) { error("ed.needBody"); return; }
    error(null);

    var isLawyer = Session.is("lawyer");
    var excerpt = draft.excerpt.trim() || draft.body.trim().slice(0, 140) + "…";
    Store.addArticle({
      authorId: Session.user().id,
      cat: draft.cat,
      cover: COVERS[draft.cat] || "cover-contracts.svg",
      read: Math.max(1, Math.round(draft.body.split(/\s+/).length / 200)),
      status: isLawyer ? "published" : "pending",
      likes: 0,
      date: { ar: I18N.t("common.today"), en: I18N.t("common.today") },
      title: { ar: draft.title, en: draft.title },
      excerpt: { ar: excerpt, en: excerpt },
      body: { ar: draft.body, en: draft.body }
    });
    draft = { title: "", cat: draft.cat, excerpt: "", body: "" };
    App.toast(I18N.t(isLawyer ? "ed.published" : "ed.sent"), "check");
  });
});

/* ==========================================================================
   Reverse auction — one brief, many lawyers, a closing bell.

   The client writes once; every matching lawyer sees the case but never the
   person. Offers arrive while the clock runs, the client takes the one they
   want, and if nobody is taken before the window closes the request cancels
   itself. A signed-in lawyer sees the same board from the other side and
   bids by hand; the rest of the field is simulated.
   ========================================================================== */
Pages.define("quotes", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var compose = $("[data-quote-compose]");
  if (!compose) return;

  var MODES = [
    { id: "call", icon: "phone", key: "lawyer.call", typeId: "call" },
    { id: "video", icon: "video", key: "req.video", typeId: "video" },
    { id: "written", icon: "chat", key: "req.written", typeId: "written" }
  ];
  var WINDOWS = [15, 30, 60];

  var draft = { city: "", specialty: "", mode: "call", window: 30 };
  var sort = "price";
  var offerTimers = [];

  // The clock outlives a view swap in the bundled build, so it is parked on
  // the window and cleared before a fresh run starts another one.
  clearInterval(global.__quoteTicker);
  var ticker = null;

  function q() { return Store.getQuote(); }
  function remaining(cur) { return Math.max(0, Math.floor((cur.expiresAt - Date.now()) / 1000)); }
  function clock(total) {
    var m = Math.floor(total / 60), s = total % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function modeOf(id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
    return MODES[0];
  }
  /** A lawyer's own price for that mode, or the middle of the band if unlisted. */
  function priceFor(u, modeId) {
    var typeId = modeOf(modeId).typeId;
    var own = M.servicesOf(u.id).filter(function (s) { return s.typeId === typeId; })[0];
    if (own) return own.price;
    var band = M.priceBand(typeId);
    return Math.round((band.min + band.max) / 2 / 5) * 5;
  }

  /* ================================================== client: compose ===== */
  function drawCompose() {
    var citySel = $("[data-quote-city]");
    if (citySel) {
      citySel.innerHTML = '<option value="">' + esc(I18N.t("quotes.anyCity")) + "</option>" +
        global.SEED.cities.map(function (c) {
          return '<option value="' + esc(c.id) + '">' + esc(tx(c)) + "</option>";
        }).join("");
      citySel.value = draft.city;
    }
    var specSel = $("[data-quote-spec]");
    if (specSel) {
      specSel.innerHTML = '<option value="">' + esc(I18N.t("quotes.anySpecialty")) + "</option>" +
        global.SEED.specialties.map(function (s) {
          return '<option value="' + esc(s.id) + '">' + esc(tx(s)) + "</option>";
        }).join("");
      specSel.value = draft.specialty;
    }
    drawChips();
    drawPreview();
  }

  function drawChips() {
    var modes = $("[data-quote-modes]");
    if (modes) {
      modes.innerHTML = MODES.map(function (m) {
        return '<button type="button" class="chip' + (draft.mode === m.id ? " is-active" : "") +
          '" data-mode="' + m.id + '">' + Icons.svg(m.icon, "icon-sm") + esc(I18N.t(m.key)) + "</button>";
      }).join("");
    }
    var win = $("[data-quote-window]");
    if (win) {
      win.innerHTML = WINDOWS.map(function (n) {
        return '<button type="button" class="chip' + (draft.window === n ? " is-active" : "") +
          '" data-window="' + n + '">' + esc(I18N.t("quotes.minutes", { n: I18N.num(n) })) + "</button>";
      }).join("");
    }
  }

  /** Exactly what a lawyer will receive — proof the client is not in it. */
  function drawPreview() {
    var prev = $("[data-quote-preview]");
    if (!prev) return;
    var city = draft.city ? tx(M.city(draft.city)) : I18N.t("quotes.anyCity");
    var sp = draft.specialty ? tx(M.specialty(draft.specialty)) : I18N.t("quotes.anySpecialty");
    prev.innerHTML =
      '<p class="tiny muted">' + esc(I18N.t("bids.clientHidden")) + "</p>" +
      '<div class="anon-card" style="margin-top:var(--s-3)"><div class="row gap-3">' +
        '<span class="anon-card__mark">' + Icons.svg("user", "icon-sm") + "</span>" +
        "<div><strong class=\"small\">" + esc(I18N.t("quotes.anonId", { id: "4821" })) + "</strong>" +
        '<p class="tiny muted">' + esc(city) + ' <span class="dot"></span> ' + esc(sp) +
          ' <span class="dot"></span> ' + esc(I18N.t(modeOf(draft.mode).key)) + "</p></div>" +
      "</div></div>";
  }

  /* ================================================== client: the board === */
  function offerRow(cur, o) {
    var l = M.user(o.lawyer);
    if (!l) return "";
    var best = o.price === Math.min.apply(null, cur.offers.map(function (x) { return x.price; }));
    return '<article class="offer-card' + (best ? " is-best" : "") + '">' +
      (best ? '<span class="offer-card__flag">' + esc(I18N.t("quotes.bestPrice")) + "</span>" : "") +
      C.avatar(l, "md") +
      '<div class="grow" style="min-width:0">' +
        "<strong class=\"small\">" + esc(tx(l.name)) + "</strong>" +
        '<p class="tiny muted">' + esc(tx(l.title || {})) + "</p>" +
        '<div class="meta-row" style="margin-top:var(--s-2)">' + C.ratingLine(l.id) +
          '<span class="dot"></span><span class="muted">' +
            esc(I18N.t("lawyer.years", { n: I18N.num(l.years || 0) })) + "</span>" +
          '<span class="dot"></span><span class="muted">' +
            esc(I18N.t("quotes.within", { n: I18N.num(o.eta) })) + "</span></div>" +
      "</div>" +
      '<div class="offer-card__end">' +
        '<strong class="offer-card__price"><span class="num">' + I18N.num(o.price) + "</span> " +
          '<span class="small muted">' + esc(I18N.t("common.sar")) + "</span></strong>" +
        '<button class="btn btn--accent btn--sm" type="button" data-accept="' + esc(o.lawyer) + '">' +
          esc(I18N.t("quotes.accept")) + "</button>" +
      "</div></article>";
  }

  function sortedOffers(cur) {
    return cur.offers.slice().sort(function (a, b) {
      if (sort === "rating") return M.ratingOf(b.lawyer).avg - M.ratingOf(a.lawyer).avg;
      if (sort === "speed") return a.eta - b.eta;
      return a.price - b.price;
    });
  }

  function drawLive() {
    var host = $("[data-quote-live]");
    var cur = q();
    if (!host) return;

    compose.hidden = !!cur;
    host.hidden = !cur;
    if (!cur) return;

    if (cur.status === "accepted") {
      var won = M.user(cur.acceptedBy);
      host.innerHTML =
        '<div class="card card--rule-gold card--pad center stack gap-4" style="align-items:center">' +
          '<span class="feature__icon" style="background:var(--success-soft);color:var(--success)">' +
            Icons.svg("check", "icon-lg") + "</span>" +
          '<h1 class="headline">' + esc(I18N.t("quotes.acceptedTitle")) + "</h1>" +
          '<p class="lead">' + esc(I18N.t("quotes.acceptedBody", { name: won ? tx(won.name) : "" })) + "</p>" +
          '<a class="btn btn--primary" href="' + (won ? M.profileHref(won) : "#") + '">' +
            esc(I18N.t("dir.viewProfile")) + "</a>" +
          '<button class="btn btn--ghost btn--sm" type="button" data-quote-reset>' +
            esc(I18N.t("quotes.newRequest")) + "</button></div>";
      return;
    }
    if (cur.status === "expired" || cur.status === "cancelled") {
      host.innerHTML =
        '<div class="card card--pad center stack gap-4" style="align-items:center">' +
          '<span class="feature__icon">' + Icons.svg("clock", "icon-lg") + "</span>" +
          '<h1 class="headline">' +
            esc(I18N.t(cur.status === "expired" ? "quotes.expired" : "quotes.cancelled")) + "</h1>" +
          '<p class="lead">' +
            esc(I18N.t(cur.status === "expired" ? "quotes.expiredBody" : "quotes.cancelled")) + "</p>" +
          '<button class="btn btn--accent" type="button" data-quote-reset>' +
            esc(I18N.t("quotes.repost")) + "</button></div>";
      return;
    }

    var left = remaining(cur);
    var city = cur.city ? tx(M.city(cur.city)) : I18N.t("quotes.anyCity");
    host.innerHTML =
      '<div class="card card--rule-gold card--pad" style="margin-bottom:var(--s-6)">' +
        '<div class="row between wrap gap-6">' +
          '<div class="grow" style="min-width:220px">' +
            '<span class="status status--ok">' + esc(I18N.t("quotes.live")) + "</span>" +
            '<h1 class="title" style="margin-top:var(--s-3)">' + esc(cur.brief.slice(0, 90)) +
              (cur.brief.length > 90 ? "…" : "") + "</h1>" +
            '<p class="small muted" style="margin-top:var(--s-2)">' + esc(city) +
              ' <span class="dot"></span> ' + esc(I18N.t(modeOf(cur.mode).key)) + "</p></div>" +
          '<div class="countdown" style="min-width:180px">' +
            '<div class="countdown__time" data-quote-clock>' + clock(left) + "</div>" +
            '<p class="tiny muted">' + esc(I18N.t("quotes.timeLeft")) + "</p></div>" +
        "</div>" +
        '<hr class="divider">' +
        '<div class="row between wrap gap-3">' +
          "<strong class=\"small\">" + esc(I18N.t("quotes.offersIn", { n: I18N.num(cur.offers.length) })) + "</strong>" +
          '<button class="btn btn--ghost btn--sm" type="button" data-quote-cancel>' +
            esc(I18N.t("quotes.cancel")) + "</button></div>" +
      "</div>" +
      (cur.offers.length
        ? '<div class="row gap-2 wrap" style="margin-bottom:var(--s-4)">' +
            [["price", "quotes.sortPrice"], ["rating", "quotes.sortRating"], ["speed", "quotes.sortSpeed"]]
              .map(function (p) {
                return '<button type="button" class="chip' + (sort === p[0] ? " is-active" : "") +
                  '" data-sort="' + p[0] + '">' + esc(I18N.t(p[1])) + "</button>";
              }).join("") + "</div>" +
          '<div class="stack gap-3">' + sortedOffers(cur).map(function (o) {
            return offerRow(cur, o);
          }).join("") + "</div>"
        : '<div class="card empty">' + Icons.svg("clock", "icon-xl") +
          '<p class="subtitle">' + esc(I18N.t("quotes.waiting")) + "</p></div>");
  }

  /* ================================================== lawyer: bidding ===== */
  function drawBids() {
    var host = $("[data-quote-bids]");
    if (!host) return;
    var cur = q();
    var me = Session.user();

    host.hidden = false;
    if (!cur) {
      host.innerHTML = '<div class="card empty">' + Icons.svg("gavel", "icon-xl") +
        '<p class="subtitle">' + esc(I18N.t("bids.none")) + "</p></div>";
      return;
    }

    var open = cur.status === "open" && remaining(cur) > 0;
    var mine = cur.offers.filter(function (o) { return o.lawyer === me.id; })[0];

    if (!open) {
      var won = cur.status === "accepted" && cur.acceptedBy === me.id;
      host.innerHTML = '<div class="card empty">' + Icons.svg(won ? "trophy" : "clock", "icon-xl") +
        '<p class="subtitle">' +
        esc(I18N.t(won ? "bids.won" : (cur.status === "accepted" && mine) ? "bids.lost" : "bids.none")) +
        "</p></div>";
      return;
    }

    var city = cur.city ? tx(M.city(cur.city)) : I18N.t("quotes.anyCity");
    var spec = cur.specialty ? tx(M.specialty(cur.specialty)) : I18N.t("quotes.anySpecialty");

    host.innerHTML = '<div class="card card--pad">' +
      '<div class="row between wrap gap-3" style="margin-bottom:var(--s-5)">' +
        '<h1 class="headline" data-i18n="bids.title"></h1>' +
        '<span class="countdown__time" data-bids-clock>' +
          esc(I18N.t("bids.closesIn")) + " " + clock(remaining(cur)) + "</span></div>" +
      '<p class="lead" data-i18n="bids.lead"></p>' +

      '<div class="anon-card" style="margin-top:var(--s-6)">' +
        '<div class="row gap-3" style="align-items:flex-start">' +
          '<span class="anon-card__mark">' + Icons.svg("user", "icon-sm") + "</span>" +
          '<div class="grow" style="min-width:0">' +
            "<strong class=\"small\">" + esc(I18N.t("quotes.anonId", { id: esc(cur.id) })) + "</strong>" +
            '<p class="tiny muted">' + esc(city) + ' <span class="dot"></span> ' + esc(spec) +
              ' <span class="dot"></span> ' + esc(I18N.t(modeOf(cur.mode).key)) + "</p></div></div>" +
        '<p class="small" style="margin-top:var(--s-3)">' + esc(cur.brief) + "</p>" +
        '<p class="tiny faint row gap-2" style="margin-top:var(--s-3)">' + Icons.svg("lock", "icon-sm") +
          esc(I18N.t("bids.clientHidden")) + "</p></div>" +

      '<p class="tiny muted" style="margin-top:var(--s-4)">' +
        esc(I18N.t("bids.competing", { n: I18N.num(cur.offers.length) })) + "</p>" +

      (mine
        ? '<p class="status status--ok" style="width:100%;justify-content:center;margin-top:var(--s-4)">' +
          Icons.svg("check", "icon-sm") + esc(I18N.t("bids.already")) + " — " +
          '<span class="num">' + I18N.num(mine.price) + "</span> " + esc(I18N.t("common.sar")) + "</p>"
        : '<form class="bid-form" data-bid-form>' +
            '<label class="field"><span class="tiny muted">' + esc(I18N.t("bids.yourPrice")) + "</span>" +
              '<input class="input num" type="number" min="40" step="5" data-bid-price value="' +
                priceFor(me, cur.mode) + '"></label>' +
            '<label class="field"><span class="tiny muted">' + esc(I18N.t("bids.yourEta")) + "</span>" +
              '<input class="input num" type="number" min="1" max="72" step="1" data-bid-eta value="4"></label>' +
            '<button class="btn btn--accent" type="submit">' + esc(I18N.t("bids.submit")) + "</button>" +
          "</form>") +
    "</div>";
    I18N.apply(host);
  }

  /* ================================================== the field =========== */
  function scheduleOffers(cur) {
    offerTimers.forEach(clearTimeout);
    offerTimers = [];

    // Whoever is signed in bids by hand; the simulation stands in for the rest.
    var meId = Session.user() ? Session.user().id : null;
    var eligible = M.listedLawyers().filter(function (l) { return l.id !== meId; });
    var pool = eligible.filter(function (l) {
      if (cur.specialty && (l.specialties || []).indexOf(cur.specialty) === -1) return false;
      if (cur.city && l.city !== cur.city) return false;
      return true;
    });
    if (pool.length < 3) pool = eligible.slice();

    pool.slice(0, 5).forEach(function (l, i) {
      var base = priceFor(l, cur.mode);
      // A competitive board: bids land between 25% under and 10% over list.
      var factor = 0.75 + ((i * 37) % 35) / 100;
      var price = Math.max(40, Math.round(base * factor / 5) * 5);
      var eta = 2 + ((i * 3) % 10);
      offerTimers.push(setTimeout(function () {
        Store.addOffer({ lawyer: l.id, price: price, eta: eta });
      }, 2200 + i * 2600));
    });
  }

  function startTicker() {
    clearInterval(ticker);
    ticker = global.__quoteTicker = setInterval(function () {
      var cur = q();
      if (!cur || cur.status !== "open") { clearInterval(ticker); return; }
      var left = remaining(cur);
      var el = $("[data-quote-clock]");
      if (el) el.textContent = clock(left);
      var bel = $("[data-bids-clock]");
      if (bel) bel.textContent = I18N.t("bids.closesIn") + " " + clock(left);
      if (left <= 0) {
        clearInterval(ticker);
        offerTimers.forEach(clearTimeout);
        Store.setQuoteStatus("expired");
        App.toast(I18N.t("quotes.expired"), "clock");
      }
    }, 1000);
  }

  /* ================================================== draw =============== */
  App.onRender(function () {
    var isLawyer = Session.is("lawyer");
    var bids = $("[data-quote-bids]");
    var live = $("[data-quote-live]");

    if (isLawyer) {
      compose.hidden = true;
      if (live) live.hidden = true;
      drawBids();
    } else {
      if (bids) { bids.hidden = true; bids.innerHTML = ""; }
      drawCompose();
      drawLive();
    }

    var cur = q();
    if (cur && cur.status === "open") { startTicker(); if (!isLawyer) scheduleOffers(cur); }
  });

  /* ================================================== events ============= */
  compose.addEventListener("click", function (ev) {
    var m = ev.target.closest("[data-mode]");
    if (m) { draft.mode = m.getAttribute("data-mode"); drawChips(); drawPreview(); return; }
    var w = ev.target.closest("[data-window]");
    if (w) { draft.window = parseInt(w.getAttribute("data-window"), 10); drawChips(); }
  });

  compose.addEventListener("change", function (ev) {
    var isCity = ev.target.matches("[data-quote-city]");
    var isSpec = ev.target.matches("[data-quote-spec]");
    // The textarea also fires `change` when it loses focus — which happens on
    // the way to clicking a chip. Redrawing then would tear the chip out from
    // under the pointer and swallow the click, so only the selects redraw.
    if (!isCity && !isSpec) return;
    if (isCity) draft.city = ev.target.value;
    if (isSpec) draft.specialty = ev.target.value;
    drawPreview();
  });

  var form = $("[data-quote-form]");
  if (form) {
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var brief = $("#q-brief").value.trim();
      if (brief.length < 10) { App.toast(I18N.t("quotes.needBrief"), "file-text"); return; }
      var cur = Store.openQuote({
        id: "4821", brief: brief, city: draft.city, specialty: draft.specialty,
        mode: draft.mode, minutes: draft.window,
        expiresAt: Date.now() + draft.window * 60000,
        status: "open", offers: []
      });
      App.toast(I18N.t("quotes.published"), "check");
      startTicker();
      scheduleOffers(cur);
      global.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  var live = $("[data-quote-live]");
  if (live) {
    live.addEventListener("click", function (ev) {
      var so = ev.target.closest("[data-sort]");
      if (so) { sort = so.getAttribute("data-sort"); drawLive(); return; }

      var ac = ev.target.closest("[data-accept]");
      if (ac) {
        var id = ac.getAttribute("data-accept");
        offerTimers.forEach(clearTimeout);
        clearInterval(ticker);
        Store.setQuoteStatus("accepted", { acceptedBy: id });
        var who = M.user(id);
        App.toast(I18N.t("quotes.accepted", { name: who ? tx(who.name) : "" }), "check");
        return;
      }
      if (ev.target.closest("[data-quote-cancel]")) {
        offerTimers.forEach(clearTimeout);
        clearInterval(ticker);
        Store.setQuoteStatus("cancelled");
        App.toast(I18N.t("quotes.cancelled"), "close");
        return;
      }
      if (ev.target.closest("[data-quote-reset]")) Store.clearQuote();
    });
  }

  var bidsHost = $("[data-quote-bids]");
  if (bidsHost) {
    bidsHost.addEventListener("submit", function (ev) {
      if (!ev.target.matches("[data-bid-form]")) return;
      ev.preventDefault();
      var price = parseInt($("[data-bid-price]").value, 10);
      var eta = parseInt($("[data-bid-eta]").value, 10) || 4;
      if (!price || price < 40) { App.toast(I18N.t("bids.badPrice"), "file-text"); return; }
      App.toast(I18N.t(Store.addOffer({ lawyer: Session.user().id, price: price, eta: eta })
        ? "bids.submitted" : "bids.already"), "check");
    });
  }
});

/* ==========================================================================
   The assistant — a lawyer's tool, and only a lawyer's.

   A client never reaches this page and never sees the word. What they buy is
   a document at a stated price; how it gets written is the lawyer's business,
   and nothing here is published until the lawyer approves it.

   Two halves: the knowledge base the drafting reads from (the lawyer's own
   files plus the regulations they switch on), and the queue of their own
   requests waiting to be drafted.
   ========================================================================== */
Pages.define("assistant", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-assistant]");
  if (!host) return;

  var files = null;          // the lawyer's uploads, this session only
  var regs = {};             // regulation id -> on
  var uploads = 0;
  var openDraft = null;

  function ensure() {
    if (!files) files = global.SEED.lawyerFiles.slice();
    global.SEED.regulations.forEach(function (r) {
      if (!(r.id in regs)) regs[r.id] = r.on;
    });
  }

  function gate() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("lock", "ai.forLawyers") +
      '<p class="center" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="index.html" data-i18n="art.back"></a></p></div>';
  }

  /* ---------- knowledge base ---------- */
  function kb() {
    var on = global.SEED.regulations.filter(function (r) { return regs[r.id]; }).length;
    return '<aside class="stack gap-6">' +
      '<section class="card card--pad">' +
        '<div class="row between gap-3">' +
          '<h2 class="subtitle" data-i18n="ai.myFiles"></h2>' +
          '<button class="btn btn--outline btn--sm" type="button" data-kb-upload>' +
            Icons.svg("upload", "icon-sm") + '<span data-i18n="ai.upload"></span></button></div>' +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="ai.myFilesHint"></p>' +
        '<div style="margin-top:var(--s-4)">' + files.map(function (f) {
          return '<div class="list-row">' +
            '<span class="list-row__icon" style="color:var(--accent)">' +
              Icons.svg("file-text", "icon-sm") + "</span>" +
            '<div class="grow"><strong class="small">' + esc(tx(f)) + "</strong>" +
              '<p class="tiny muted">' + esc(I18N.t(f.kind === "template" ? "ai.template" : "ai.precedent")) +
                ' <span class="dot"></span> <span class="num">' + esc(f.size) + "</span></p></div>" +
            '<button class="icon-btn" type="button" data-kb-remove="' + esc(f.id) + '" ' +
              'data-i18n-attr="aria-label:ai.removeFile">' + Icons.svg("close", "icon-sm") + "</button></div>";
        }).join("") + "</div>" +
      "</section>" +

      '<section class="card card--pad">' +
        '<div class="row between gap-3">' +
          '<h2 class="subtitle" data-i18n="ai.regs"></h2>' +
          '<span class="tag">' + esc(I18N.t("ai.regsOn", { n: I18N.num(on) })) + "</span></div>" +
        '<p class="tiny muted" style="margin-top:var(--s-2)" data-i18n="ai.regsHint"></p>' +
        '<div class="stack gap-2" style="margin-top:var(--s-4)">' +
          global.SEED.regulations.map(function (r) {
            return '<label class="check"><input type="checkbox" data-reg="' + esc(r.id) + '"' +
              (regs[r.id] ? " checked" : "") + "><span>" + esc(tx(r)) + "</span></label>";
          }).join("") + "</div>" +
      "</section></aside>";
  }

  /* ---------- the queue: this lawyer's own drafting work ---------- */
  function queue() {
    var me = Session.user();
    var rows = M.requestsForLawyer(me.id).filter(function (r) {
      var st = M.requestState(r).status;
      var type = M.serviceType(r.typeId);
      return type && type.mode !== "live" && st !== "delivered" && st !== "completed" &&
             st !== "cancelled" && !M.requestState(r).assignedTo;
    });

    return '<section class="card card--pad">' +
      '<div class="row between gap-3">' +
        '<h2 class="subtitle" data-i18n="ai.queue"></h2>' +
        '<span class="tag num">' + I18N.num(rows.length) + "</span></div>" +
      (rows.length
        ? '<div style="margin-top:var(--s-4)">' + rows.map(function (r) {
            var st = M.requestState(r).status;
            var ready = st === "drafted";
            var client = M.user(r.clientId);
            return '<div class="list-row">' +
              '<span class="list-row__icon">' + Icons.svg(ready ? "sparkle" : "clock", "icon-sm") + "</span>" +
              '<div class="grow" style="min-width:0"><strong class="small">' + esc(tx(r.title)) + "</strong>" +
                '<p class="tiny muted">' + esc(client ? tx(client.name) : "") +
                  ' <span class="dot"></span> ' + esc(tx(r.ago)) + "</p>" +
                '<p class="tiny faint">' + esc(tx(r.brief)) + "</p></div>" +
              '<div class="stack gap-2" style="align-items:flex-end">' +
                '<span class="status status--' + (ready ? "ok" : "muted") + '">' +
                  esc(I18N.t(ready ? "ai.stateDrafted" : "ai.stateQueued")) + "</span>" +
                '<button class="btn btn--sm ' + (ready ? "btn--primary" : "btn--outline") +
                  '" type="button" data-req="' + esc(r.id) + '">' +
                  esc(I18N.t(ready ? "ai.openDraft" : "ai.generate")) + "</button></div></div>";
          }).join("") + "</div>"
        : '<p class="muted center" style="padding:var(--s-6)" data-i18n="ai.queueEmpty"></p>') +
    "</section>";
  }

  function editor() {
    if (!openDraft) return "";
    var r = M.request(openDraft);
    if (!r) return "";
    var client = M.user(r.clientId);
    var st = M.requestState(r);
    var body = st.body || (r.doc && global.SEED.draftBodies[r.doc] ? tx(global.SEED.draftBodies[r.doc]) : "");
    var onRegs = global.SEED.regulations.filter(function (x) { return regs[x.id]; })
      .slice(0, 3).map(function (x) { return tx(x); }).join("، ");

    return '<section class="panel" style="margin-top:var(--s-6)">' +
      '<div class="panel__head row between wrap gap-3">' +
        "<div><h2 class=\"subtitle\">" + esc(I18N.t("ai.draftFor")) + " " +
          esc(client ? tx(client.name) : "") + "</h2>" +
          '<p class="tiny muted">' + esc(tx(r.title)) + ' <span class="dot"></span> ' +
            esc(I18N.t("ai.aiSource")) + "</p></div>" +
        '<button class="icon-btn" type="button" data-draft-close ' +
          'data-i18n-attr="aria-label:ai.discard">' + Icons.svg("close", "icon-sm") + "</button>" +
      "</div>" +
      '<div style="padding:var(--s-4) var(--s-6) 0">' +
        '<p class="tiny muted">' + esc(I18N.t("ai.basedOn")) + ": " + esc(onRegs) + "</p>" +
        '<p class="tiny muted" style="margin-top:var(--s-1)" data-i18n="ai.editHint"></p></div>' +
      '<textarea class="draft-text" data-draft-body spellcheck="false">' + esc(body) + "</textarea>" +
      '<div class="draft-foot">' +
        '<div><span class="tiny muted" data-i18n="ai.earns"></span>' +
          '<strong style="display:block;color:var(--accent)"><span class="num">' +
            I18N.num(r.price) + "</span> " + esc(I18N.t("common.sar")) + "</strong></div>" +
        '<span class="tiny muted grow">' + esc(I18N.t("ai.reviewMinutes", { n: I18N.num(6) })) + "</span>" +
        '<button class="btn btn--accent" type="button" data-draft-approve>' +
          Icons.svg("check", "icon-sm") + '<span data-i18n="ai.approve"></span></button>' +
      "</div></section>";
  }

  function howItWorks() {
    return '<section class="section section--tight"><div class="container">' +
      '<h2 class="headline" data-i18n="ai.howTitle"></h2>' +
      '<div class="grid grid-4" style="margin-top:var(--s-6)">' +
        [1, 2, 3, 4].map(function (n) {
          return '<div class="card card--pad step"><span class="step__num num">' + I18N.num(n) + "</span>" +
            '<h3 class="subtitle" style="margin-top:var(--s-3)" data-i18n="ai.step' + n + '"></h3>' +
            '<p class="small muted" data-i18n="ai.step' + n + 'Body"></p></div>';
        }).join("") + "</div></div></section>";
  }

  App.onRender(function () {
    if (!Session.is("lawyer")) { host.innerHTML = gate(); I18N.apply(host); return; }
    ensure();

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-12)">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="ai.lawyerHeading"></h1>' +
        '<p class="lead" data-i18n="ai.lawyerLead"></p>' +
        '<p class="disclaimer" style="margin-top:var(--s-4)">' + Icons.svg("lock", "icon-sm") +
          '<span data-i18n="ai.disclaimer"></span></p>' +
      "</header>" +
      '<div class="grid dash-split">' +
        "<div>" + queue() + editor() + "</div>" +
        kb() +
      "</div></div>" + howItWorks();

    I18N.apply(host);
  });

  host.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-kb-upload]")) {
      uploads++;
      files = files.concat([{ id: "up-" + uploads, kind: "template", size: "36 KB",
        ar: "ملف مرفوع " + uploads, en: "Uploaded file " + uploads }]);
      App.toast(I18N.t("ai.uploaded"), "check");
      App.rerender();
      return;
    }

    var rm = ev.target.closest("[data-kb-remove]");
    if (rm) {
      var fid = rm.getAttribute("data-kb-remove");
      files = files.filter(function (f) { return f.id !== fid; });
      App.toast(I18N.t("ai.removed"), "close");
      App.rerender();
      return;
    }

    var req = ev.target.closest("[data-req]");
    if (req) {
      var rid = req.getAttribute("data-req");
      if (M.requestState(M.request(rid)).status === "drafted") {
        openDraft = rid;
        App.rerender();
      } else {
        // Drafting takes a beat, so the state change reads as work happening.
        req.disabled = true;
        req.textContent = I18N.t("ai.generating");
        setTimeout(function () {
          openDraft = rid;
          Store.setRequest(rid, { status: "drafted" });
          App.toast(I18N.t("ai.generated"), "sparkle");
        }, 700);
      }
      return;
    }

    if (ev.target.closest("[data-draft-close]")) { openDraft = null; App.rerender(); return; }

    if (ev.target.closest("[data-draft-approve]")) {
      var box = $("[data-draft-body]", host);
      var id = openDraft;
      openDraft = null;
      Store.setRequest(id, { status: "delivered", body: box ? box.value : null });
      App.toast(I18N.t("ai.approved"), "check");
    }
  });

  host.addEventListener("change", function (ev) {
    var reg = ev.target.closest("[data-reg]");
    if (!reg) return;
    regs[reg.getAttribute("data-reg")] = reg.checked;
    App.rerender();
  });
});

/* ==========================================================================
   Account — who you are, which of your roles you are currently looking
   through, and the switch between them. One account, several roles: that
   decision lives here.
   ========================================================================== */
Pages.define("account", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var host = $("[data-account]");
  if (!host) return;

  function guest() {
    return '<div class="container" style="padding-block:var(--s-16)">' +
      C.empty("user", "account.guest") +
      '<div class="row center gap-3" style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="login.html" data-i18n="auth.signIn"></a>' +
        '<a class="btn btn--outline" href="signup.html" data-i18n="auth.createAccount"></a></div></div>';
  }

  function roleCards(u) {
    var have = Session.myRoles();
    var active = Session.role();
    return Session.allRoles().map(function (r) {
      var owned = have.indexOf(r.id) !== -1;
      return '<button type="button" class="role-card' + (active === r.id ? " is-active" : "") +
        '" data-role="' + r.id + '"' + (owned ? "" : ' data-add="1"') + ">" +
        '<span class="role-card__icon">' + Icons.svg(r.icon, "icon-lg") + "</span>" +
        "<strong>" + esc(I18N.t(r.nameKey)) + "</strong>" +
        '<span class="tiny muted">' + esc(I18N.t(owned ? "role.current" : "account.addRole")) + "</span>" +
        (active === r.id ? '<span class="role-card__check">' + Icons.svg("check", "icon-sm") + "</span>" : "") +
      "</button>";
    }).join("");
  }

  function details(u) {
    function row(labelKey, value) {
      return "<div><span class=\"tiny muted\">" + esc(I18N.t(labelKey)) + "</span>" +
        '<p class="small"><strong>' + esc(value || "—") + "</strong></p></div>";
    }
    return '<section class="card card--pad">' +
      '<h2 class="subtitle" data-i18n="account.details"></h2>' +
      '<div class="grid grid-2" style="gap:var(--s-4);margin-top:var(--s-5)">' +
        row("auth.fullName", tx(u.name)) +
        row("auth.email", u.email) +
        row("account.phone", u.phone) +
        row("account.city", u.city ? tx(M.city(u.city) || {}) : "") +
      "</div></section>";
  }

  App.onRender(function () {
    if (Session.isGuest()) { host.innerHTML = guest(); I18N.apply(host); return; }

    var u = Session.user();
    var pro = Session.is("lawyer") || Session.is("intern");

    host.innerHTML = '<div class="container" style="padding-block:var(--s-10) var(--s-20);max-width:900px">' +
      '<header style="margin-bottom:var(--s-8)">' +
        '<h1 class="headline" data-i18n="account.heading"></h1>' +
        '<p class="lead" data-i18n="account.lead"></p></header>' +

      '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
        '<div class="row gap-5 wrap">' + C.avatar(u, "lg") +
          '<div class="grow" style="min-width:0">' +
            '<span class="tiny muted" data-i18n="account.signedInAs"></span>' +
            '<h2 class="title">' + esc(tx(u.name)) + "</h2>" +
            '<p class="small muted num" dir="ltr">' + esc(u.email) + "</p>" +
            (Session.isVerified() ? "" :
              '<p class="note-inline" style="margin-top:var(--s-3)" data-i18n="signup.pendingNote"></p>') +
          "</div>" +
          '<div class="stack gap-2">' +
            (pro ? '<a class="btn btn--outline btn--sm" href="' + M.profileHref(u) + '" ' +
              'data-i18n="account.viewProfile"></a>' : "") +
            '<button class="btn btn--ghost btn--sm" type="button" data-signout>' +
              Icons.svg("logout", "icon-sm") + '<span data-i18n="dash.logout"></span></button>' +
          "</div>" +
        "</div></section>" +

      '<section class="card card--pad" style="margin-bottom:var(--s-6)">' +
        '<h2 class="subtitle" data-i18n="account.myRoles"></h2>' +
        '<p class="small muted" style="margin-top:var(--s-2)" data-i18n="account.addRoleHint"></p>' +
        '<div class="grid grid-3" style="margin-top:var(--s-5)">' + roleCards(u) + "</div></section>" +

      details(u) +

      '<section class="card card--pad" style="margin-top:var(--s-6)">' +
        '<h2 class="subtitle" data-i18n="account.reset"></h2>' +
        '<p class="small muted" style="margin:var(--s-2) 0 var(--s-4)" data-i18n="account.resetHint"></p>' +
        '<button class="btn btn--outline btn--sm" type="button" data-reset>' +
          Icons.svg("trash", "icon-sm") + '<span data-i18n="account.reset"></span></button></section>' +
    "</div>";

    I18N.apply(host);
  });

  host.addEventListener("click", function (ev) {
    var r = ev.target.closest("[data-role]");
    if (r) {
      var id = r.getAttribute("data-role");
      if (r.hasAttribute("data-add")) {
        // A second role starts unverified for anyone but a client — the licence
        // still has to be checked before work can reach them.
        Store.addRole(Session.user().id, id, {});
        Session.switchRole(id);
        App.toast(I18N.t("account.roleAdded", { role: I18N.t(Session.roleDef(id).nameKey) }), "check");
      } else if (Session.switchRole(id)) {
        App.toast(I18N.t("role.changed", { role: I18N.t(Session.roleDef(id).nameKey) }), "check");
      }
      return;
    }

    if (ev.target.closest("[data-signout]")) {
      Session.signOut().then(function () { App.go("index.html"); });
      return;
    }

    if (ev.target.closest("[data-reset]")) {
      Store.resetWork();
      App.toast(I18N.t("account.resetDone"), "trash");
    }
  });
});

/* ==========================================================================
   Sign-in. Also offers the seeded demo people, so the three interfaces can be
   seen without registering three times.
   ========================================================================== */
Pages.define("login", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session;
  var $ = App.$, esc = App.esc, tx = App.tx;

  var form = $("[data-login]");
  if (!form) return;

  function error(key) {
    var el = $("[data-login-error]");
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  App.onRender(function () {
    var slot = $("[data-google]") ? null : $("[data-google-slot]");
    if (slot) slot.innerHTML = global.C.googleButton();

    var points = $("[data-auth-points]");
    if (points) {
      points.innerHTML = ["auth.asidePoint1", "auth.asidePoint2", "auth.asidePoint3"].map(function (k) {
        return '<li class="row gap-3">' + Icons.svg("check") + "<span>" + esc(I18N.t(k)) + "</span></li>";
      }).join("");
    }

    var demo = $("[data-demo-accounts]");
    if (demo) {
      // One seeded person per role, so each interface is one click away.
      var picks = [
        { id: "u-fahad", roleKey: "role.client" },
        { id: "u-ahmed", roleKey: "role.lawyer" },
        { id: "u-jaid",  roleKey: "role.intern" }
      ];
      demo.innerHTML = picks.map(function (p) {
        var u = M.user(p.id);
        return '<button type="button" class="demo-card" data-demo="' + esc(p.id) + '">' +
          global.C.avatar(u, "sm") +
          "<strong>" + esc(tx(u.name).split(" ").slice(0, 2).join(" ")) + "</strong>" +
          '<span class="tiny muted">' + esc(I18N.t(p.roleKey)) + "</span></button>";
      }).join("");
    }
  });

  var demoHost = $("[data-demo-accounts]");
  if (demoHost) {
    demoHost.addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-demo]");
      if (!btn) return;
      Store.signIn(btn.getAttribute("data-demo"));
      App.go("index.html");
    });
  }

  var authBox = form.closest("section") || document;
  authBox.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-google]")) return;
    global.SB.signInWithGoogle(global.location.origin +
      global.location.pathname.replace(/login\.html$/, "index.html"))
      .catch(function () { App.toast(I18N.t("auth.googleFailed"), "close"); });
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = form.querySelector('[name="email"]').value.trim();
    var pass = form.querySelector('[name="password"]').value;
    if (!email) { error("signup.needEmail"); return; }
    var button = form.querySelector('[type="submit"]');
    if (button) { button.disabled = true; button.textContent = I18N.t("auth.working"); }
    Session.signIn(email, pass).then(function (res) {
      if (button) { button.disabled = false; button.textContent = I18N.t("auth.signIn"); }
      if (!res.ok) { error("login." + res.error); return; }
      App.go("index.html");
    });
  });
});

/* ==========================================================================
   Sign-up — one wizard, three endings.
   Step 3 is where the roles diverge: a lawyer proves a licence, a trainee
   describes where they study and what they can do, a client skips it.
   ========================================================================== */
Pages.define("signup", function (global) {
  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session;
  var $ = App.$, $$ = App.$$, esc = App.esc, tx = App.tx;

  var form = $("[data-signup]");
  if (!form) return;

  var state = { step: 1, role: null, avatar: null, skills: [], specialties: [] };
  var LAST = 4;

  /* A client needs no proof of standing, so their wizard is a step shorter. */
  function steps() {
    return state.role === "client" ? [1, 2, 4] : [1, 2, 3, 4];
  }
  function stepIndex() { return steps().indexOf(state.step); }

  function drawStepper() {
    var host = $("[data-stepper]");
    if (!host) return;
    var seq = steps();
    var labels = { 1: "signup.stepRole", 2: "signup.stepBasics", 3: "signup.stepProof", 4: "signup.stepReview" };
    host.innerHTML = seq.map(function (n, i) {
      var done = seq.indexOf(state.step) > i;
      var here = state.step === n;
      return '<li class="step-dot' + (here ? " is-here" : "") + (done ? " is-done" : "") + '">' +
        '<span class="step-dot__mark">' + (done ? Icons.svg("check", "icon-sm") : I18N.num(i + 1)) + "</span>" +
        '<span data-i18n="' + labels[n] + '"></span></li>';
    }).join("");
    I18N.apply(host);
  }

  function drawRoles() {
    var host = $("[data-role-picker]");
    if (!host) return;
    host.innerHTML = Session.allRoles().map(function (r) {
      var descKey = r.id === "client" ? "role.clientDesc"
                  : r.id === "lawyer" ? "role.lawyerDesc" : "role.internDesc";
      return '<button type="button" class="role-card' + (state.role === r.id ? " is-active" : "") +
        '" data-pick="' + r.id + '">' +
        '<span class="role-card__icon">' + Icons.svg(r.icon, "icon-lg") + "</span>" +
        "<strong>" + esc(I18N.t(r.nameKey)) + "</strong>" +
        '<span class="tiny muted">' + esc(I18N.t(descKey)) + "</span>" +
        (state.role === r.id ? '<span class="role-card__check">' + Icons.svg("check", "icon-sm") + "</span>" : "") +
        "</button>";
    }).join("");
  }

  function drawCities() {
    var sel = $("[data-city-options]");
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = SEEDCITIES().map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(tx(c)) + "</option>";
    }).join("");
    if (cur) sel.value = cur;
  }
  function SEEDCITIES() { return global.SEED.cities; }

  /* ---------- step 3, per role ---------- */
  function drawProof() {
    var title = $("[data-step3-title]");
    var host = $("[data-step3-fields]");
    if (!host) return;

    if (state.role === "lawyer") {
      title.textContent = I18N.t("signup.licenceTitle");
      host.innerHTML =
        '<div class="grid grid-2" style="gap:var(--s-4)">' +
          field("licenceNumber", "signup.licenceNo", "text", "num") +
          field("licenceAuthority", "signup.licenceAuthority") +
          field("licenceExpiry", "signup.licenceExpiry", "date") +
          field("years", "signup.years", "number") +
        "</div>" +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.licenceFile")) + "</span>" +
          '<input class="input" name="licenceFile" type="file" accept="image/*,.pdf"></label>' +
        '<p class="tiny faint" style="margin-top:var(--s-2)">' + esc(I18N.t("signup.uploadNote")) + "</p>" +
        '<div class="field" style="margin-top:var(--s-5)">' +
          '<span class="label">' + esc(I18N.t("signup.specialties")) + "</span>" +
          '<div class="row gap-2 wrap" data-spec-picker></div></div>' +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.bio")) + "</span>" +
          '<textarea class="textarea" name="bio"></textarea></label>';
      drawSpecialties();
    } else {
      title.textContent = I18N.t("signup.internTitle");
      host.innerHTML =
        '<div class="grid grid-2" style="gap:var(--s-4)">' +
          field("university", "signup.university") +
          field("level", "signup.level") +
        "</div>" +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.cv")) + "</span>" +
          '<input class="input" name="cvFile" type="file" accept=".pdf,.doc,.docx"></label>' +
        '<p class="tiny faint" style="margin-top:var(--s-2)">' + esc(I18N.t("signup.uploadNote")) + "</p>" +
        '<div class="field" style="margin-top:var(--s-5)">' +
          '<span class="label">' + esc(I18N.t("signup.skills")) + "</span>" +
          '<p class="tiny muted">' + esc(I18N.t("signup.skillsHint")) + "</p>" +
          '<div class="chip-input"><input class="input" data-skill-input ' +
            'placeholder="' + esc(I18N.t("signup.skillPlaceholder")) + '">' +
            '<button class="btn btn--outline btn--sm" type="button" data-skill-add>' +
              esc(I18N.t("signup.add")) + "</button></div>" +
          '<div class="row gap-2 wrap" style="margin-top:var(--s-3)" data-skill-list></div></div>' +
        '<label class="field" style="margin-top:var(--s-4)">' +
          '<span class="label">' + esc(I18N.t("signup.bio")) + "</span>" +
          '<textarea class="textarea" name="bio"></textarea></label>';
      drawSkills();
    }
  }

  function field(name, labelKey, type, cls) {
    return '<label class="field"><span class="label">' + esc(I18N.t(labelKey)) + "</span>" +
      '<input class="input' + (cls ? " " + cls : "") + '" name="' + name +
      '" type="' + (type || "text") + '"></label>';
  }

  function drawSpecialties() {
    var host = $("[data-spec-picker]");
    if (!host) return;
    host.innerHTML = global.SEED.specialties.map(function (s) {
      return '<button type="button" class="chip' + (state.specialties.indexOf(s.id) !== -1 ? " is-active" : "") +
        '" data-spec="' + esc(s.id) + '">' + esc(tx(s)) + "</button>";
    }).join("");
  }

  function drawSkills() {
    var host = $("[data-skill-list]");
    if (!host) return;
    host.innerHTML = state.skills.length
      ? state.skills.map(function (sk, i) {
          return '<span class="chip is-active">' + esc(sk) +
            '<button type="button" data-skill-del="' + i + '" aria-label="×">' +
            Icons.svg("close", "icon-sm") + "</button></span>";
        }).join("")
      : '<span class="tiny faint">' + esc(I18N.t("signup.noSkills")) + "</span>";
  }

  /* ---------- step 4 ---------- */
  function drawReview() {
    var host = $("[data-review]");
    if (!host) return;
    var d = collect();
    var rows = [
      ["signup.role", I18N.t(Session.roleDef(state.role).nameKey)],
      ["auth.fullName", d.name],
      ["auth.email", d.email],
      ["signup.phone", d.phone],
      ["home.city", d.city ? tx(M.city(d.city)) : ""]
    ];
    if (state.role === "lawyer") {
      rows.push(["signup.licenceNo", d.licenceNumber], ["signup.licenceExpiry", d.licenceExpiry]);
      rows.push(["signup.specialties", state.specialties.map(function (id) { return tx(M.specialty(id)); }).join("، ")]);
    }
    if (state.role === "intern") {
      rows.push(["signup.university", d.university], ["signup.level", d.level]);
      rows.push(["signup.skills", state.skills.join("، ")]);
    }
    host.innerHTML = '<dl class="review">' + rows.map(function (r) {
      return "<dt>" + esc(I18N.t(r[0])) + "</dt><dd>" + (esc(r[1]) || '<span class="faint">—</span>') + "</dd>";
    }).join("") + "</dl>" +
    (state.role !== "client"
      ? '<p class="note-inline">' + Icons.svg("clock", "icon-sm") + esc(I18N.t("signup.pendingNote")) + "</p>"
      : "");
  }

  function collect() {
    var d = {};
    $$("input,select,textarea", form).forEach(function (el) {
      if (el.name && el.type !== "file" && el.type !== "checkbox") d[el.name] = el.value.trim();
    });
    return d;
  }

  /* ---------- navigation ---------- */
  function show() {
    $$("[data-step]", form).forEach(function (sec) {
      sec.hidden = String(state.step) !== sec.getAttribute("data-step");
    });
    var seq = steps(), i = stepIndex();
    $("[data-back]").hidden = i <= 0;
    $("[data-next]").hidden = i >= seq.length - 1;
    $("[data-finish]").hidden = i < seq.length - 1;
    var gslot = $("[data-google-slot]");
    if (gslot) gslot.innerHTML = state.step === 1 ? global.C.googleButton() : "";
    if (state.step === 3) drawProof();
    if (state.step === 4) drawReview();
    drawStepper();
    error(null);
  }

  function error(key) {
    var el = $("[data-signup-error]");
    if (!el) return;
    el.hidden = !key;
    if (key) el.textContent = I18N.t(key);
  }

  function validate() {
    var d = collect();
    if (state.step === 1 && !state.role) return "signup.needRole";
    if (state.step === 2) {
      if (!d.name) return "signup.needName";
      if (!/^\S+@\S+\.\S+$/.test(d.email || "")) return "signup.needEmail";
      if (!d.password || d.password.length < 4) return "signup.needPassword";
      if (Store.findAccount(d.email)) return "signup.emailTaken";
    }
    if (state.step === 3 && state.role === "lawyer" && !d.licenceNumber) return "signup.needLicence";
    if (state.step === 3 && state.role === "intern" && !d.university) return "signup.needUniversity";
    return null;
  }

  App.onRender(function () {
    // Google returns a client, so the door only belongs on the first step —
    // a lawyer still has a licence to give us before anything else happens.
    var slot = $("[data-google-slot]");
    if (slot) slot.innerHTML = state.step === 1 ? global.C.googleButton() : "";

    drawRoles(); drawCities(); drawStepper();
    if (state.step === 3) drawProof();
    if (state.step === 4) drawReview();
  });

  form.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-google]")) {
      global.SB.signInWithGoogle(global.location.origin +
        global.location.pathname.replace(/signup\.html$/, "index.html"))
        .catch(function () { App.toast(I18N.t("auth.googleFailed"), "close"); });
      return;
    }

    var pick = ev.target.closest("[data-pick]");
    if (pick) { state.role = pick.getAttribute("data-pick"); drawRoles(); drawStepper(); return; }

    var sp = ev.target.closest("[data-spec]");
    if (sp) {
      var id = sp.getAttribute("data-spec");
      var at = state.specialties.indexOf(id);
      at === -1 ? state.specialties.push(id) : state.specialties.splice(at, 1);

      return;
    }

    if (ev.target.closest("[data-skill-add]")) { addSkill(); return; }
    var del = ev.target.closest("[data-skill-del]");
    if (del) { state.skills.splice(+del.getAttribute("data-skill-del"), 1); drawSkills(); return; }

    if (ev.target.closest("[data-next]")) {
      var bad = validate();
      if (bad) { error(bad); return; }
      var seq = steps();
      state.step = seq[Math.min(stepIndex() + 1, seq.length - 1)];
      show();
      return;
    }
    if (ev.target.closest("[data-back]")) {
      var s2 = steps();
      state.step = s2[Math.max(stepIndex() - 1, 0)];
      show();
    }
  });

  function addSkill() {
    var input = $("[data-skill-input]");
    var v = input.value.trim();
    if (!v) return;
    if (state.skills.indexOf(v) === -1) state.skills.push(v);
    input.value = "";
    drawSkills();
  }
  form.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.matches("[data-skill-input]")) { ev.preventDefault(); addSkill(); }
  });

  /* A picked image is read into a data URI — there is nowhere to upload it. */
  form.addEventListener("change", function (ev) {
    if (ev.target.name === "avatar" && ev.target.files && ev.target.files[0]) {
      var reader = new FileReader();
      reader.onload = function () { state.avatar = reader.result; };
      reader.readAsDataURL(ev.target.files[0]);
    }
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var bad = validate();
    if (bad) { error(bad); return; }
    if (!form.querySelector('[name="terms"]').checked) { error("signup.needTerms"); return; }

    var d = collect();
    var fileOf = function (n) {
      var el = form.querySelector('[name="' + n + '"]');
      return el && el.files && el.files[0] ? el.files[0].name : null;
    };
    var name = { ar: d.name, en: d.name };

    var button = $("[data-finish]");
    if (button) { button.disabled = true; button.textContent = I18N.t("auth.working"); }

    Store.register({
      role: state.role, name: name, email: d.email, phone: d.phone,
      city: d.city, password: d.password, avatar: state.avatar,
      licenceNumber: d.licenceNumber, licenceAuthority: d.licenceAuthority,
      licenceExpiry: d.licenceExpiry, licenceFile: fileOf("licenceFile"),
      specialties: state.specialties, years: +d.years || 0, bio: { ar: d.bio, en: d.bio },
      university: { ar: d.university, en: d.university }, level: { ar: d.level, en: d.level },
      skills: state.skills.map(function (s) { return { ar: s, en: s }; }),
      cvFile: fileOf("cvFile")
    }).then(function (res) {
      if (button) { button.disabled = false; I18N.apply(button.parentNode); }
      if (!res.ok) {
        // A backend can fail in ways the demo never could — a refused address,
        // an unconfirmed mailbox — so show what it said when we have no phrase
        // of our own for it.
        error("signup." + res.error);
        if (res.message && I18N.t("signup." + res.error) === "signup." + res.error) {
          var el = $("[data-signup-error]");
          if (el) { el.hidden = false; el.textContent = res.message; }
        }
        return;
      }
      App.toast(I18N.t("signup.welcome", { name: d.name.split(" ")[0] }), "check");
      setTimeout(function () { App.go("index.html"); }, 900);
    });
  });

  show();
});

/* ==========================================================================

   missing device, an insecure origin — is caught and said in plain words,

  "use strict";

  var I18N = global.I18N, Icons = global.Icons, M = global.Models,
      App = global.App, Store = global.Store, Session = global.Session, C = global.C;
  var $ = App.$, esc = App.esc, tx = App.tx;

  if (!host) return;

  var phase = "ready";        // ready | live | ended
  var error = null;
  var call = null;
  var muted = false, camOff = false;
  var timer = null, seconds = 0, endedBy = null;

  function request() { return requestId ? M.request(requestId) : null; }

  /** Voice or video, taken from the service the client actually bought. */
  function wantsVideo() {
    var r = request();
    var t = r && M.serviceType(r.typeId);
    return !t || t.id !== "call";
  }

  function other() {
    var r = request();
    if (!r) return null;
    var me = Session.user();
    if (!me) return null;
    return M.user(me.id === r.clientId ? r.lawyerId : r.clientId);
  }

  function mayJoin() {
    var r = request(), me = Session.user();
    if (!r || !me) return false;
    var st = M.requestState(r);
    return me.id === r.clientId || me.id === r.lawyerId || st.assignedTo === me.id;
  }

  function clock() {
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ---------- the three screens ---------- */
  function readyScreen() {
    var r = request(), them = other();
    return '<div class="call-card card card--pad">' +
      '<span class="feature__icon" style="margin-inline:auto">' +
        Icons.svg(wantsVideo() ? "video" : "phone", "icon-lg") + "</span>" +
      '<h1 class="headline center" style="margin-top:var(--s-4)" data-i18n="' +
        (wantsVideo() ? "call.video" : "call.audio") + '"></h1>' +
      (them
        ? '<p class="lead center">' + esc(I18N.t("call.with", { name: tx(them.name) })) + "</p>" +
          '<div class="row center" style="margin-top:var(--s-5)">' + C.avatar(them, "lg") + "</div>"
        : "") +
      (r ? '<p class="small muted center" style="margin-top:var(--s-4)">' + esc(tx(r.title)) + "</p>" : "") +
      (error ? '<p class="form-error center" style="margin-top:var(--s-5)">' +
        esc(I18N.t("call." + error)) + "</p>" : "") +
      '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
        '<button class="btn btn--accent btn--lg" type="button" data-join>' +
          Icons.svg(wantsVideo() ? "video" : "phone", "icon-sm") +
          "<span>" + esc(I18N.t(error ? "call.retry" : "call.join")) + "</span></button>" +
        '<a class="btn btn--ghost" href="requests.html" data-i18n="call.back"></a>' +
      "</div>" +
      '<p class="tiny faint center" style="margin-top:var(--s-4)" data-i18n="call.joinHint"></p>' +
      (global.Signal.isRemote() ? "" :
        '<p class="note-inline" style="margin-top:var(--s-6)">' +
          '<span><span data-i18n="call.localOnly"></span> ' +
          '<span data-i18n="call.openSecond"></span></span></p>' +
        '<div class="row center" style="margin-top:var(--s-3)">' +
          '<button class="btn btn--outline btn--sm" type="button" data-copy-link>' +
            Icons.svg("file-text", "icon-sm") +
            '<span data-i18n="call.copyLink"></span></button></div>') +
    "</div>";
  }

  function liveScreen() {
    var them = other();
    return '<div class="call-stage">' +
      '<div class="call-stage__remote">' +
        '<video data-remote autoplay playsinline></video>' +
        '<div class="call-stage__placeholder" data-placeholder>' +
          (them ? C.avatar(them, "lg") : "") +
          '<p class="subtitle" style="margin-top:var(--s-4)">' +
            esc(them ? tx(them.name) : "") + "</p>" +
          '<p class="small" data-call-status>' + esc(I18N.t("call.waiting")) + "</p>" +
        "</div>" +
        '<div class="call-stage__badge"><span class="num" data-clock>00:00</span></div>' +
        '<div class="call-stage__self' + (wantsVideo() ? "" : " is-audio") + '">' +
          '<video data-local autoplay playsinline muted></video>' +
          '<span class="tiny" data-i18n="call.you"></span>' +
        "</div>" +
      "</div>" +
      '<div class="call-bar">' +
        '<button class="call-btn" type="button" data-mute ' +
          'data-i18n-attr="aria-label:call.mute">' + Icons.svg("mic") + "</button>" +
        (wantsVideo()
          ? '<button class="call-btn" type="button" data-cam ' +
            'data-i18n-attr="aria-label:call.camOff">' + Icons.svg("video") + "</button>"
          : "") +
        '<button class="call-btn call-btn--end" type="button" data-hang ' +
          'data-i18n-attr="aria-label:call.hangUp">' + Icons.svg("phone-off") + "</button>" +
      "</div></div>";
  }

  function endedScreen() {
    var r = request();
    var me = Session.user();
    var canDeliver = r && me && me.id === r.lawyerId &&
      ["delivered", "completed"].indexOf(M.requestState(r).status) === -1;
    return '<div class="call-card card card--pad center">' +
      '<span class="feature__icon" style="margin-inline:auto">' + Icons.svg("check", "icon-lg") + "</span>" +
      '<h1 class="headline" style="margin-top:var(--s-4)" data-i18n="call.ended"></h1>' +
      (endedBy === "peer" ? '<p class="lead" data-i18n="call.endedByPeer"></p>' : "") +
      '<p class="small muted" style="margin-top:var(--s-4)">' + esc(I18N.t("call.duration")) +
        ': <strong class="num">' + esc(clock()) + "</strong></p>" +
      '<div class="row center gap-3 wrap" style="margin-top:var(--s-8)">' +
        (canDeliver
          ? '<button class="btn btn--accent" type="button" data-deliver data-i18n="call.markDone"></button>'
          : "") +
        '<a class="btn btn--outline" href="requests.html" data-i18n="call.back"></a>' +
      "</div></div>";
  }

  function gate(key) {
    return '<div class="call-card card card--pad center">' +
      C.empty("lock", key) +
      '<p style="margin-top:var(--s-6)">' +
        '<a class="btn btn--primary" href="requests.html" data-i18n="call.back"></a></p></div>';
  }

  /* ---------- draw ---------- */
  App.onRender(function () {
    if (Session.isGuest()) { host.innerHTML = gate("auth.guestHint"); I18N.apply(host); return; }
    if (requestId && !mayJoin()) { host.innerHTML = gate("call.notYours"); I18N.apply(host); return; }

    host.innerHTML = '<div class="container" style="padding-block:var(--s-8) var(--s-16)">' +
      (phase === "live" ? liveScreen() : phase === "ended" ? endedScreen() : readyScreen()) +
      "</div>";
    I18N.apply(host);
    if (phase === "live") attachStreams();
    syncButtons();
  });

  /* The <video> elements are recreated by every redraw, so the streams have to
     be re-attached rather than set once at join time. */
  var localStream = null, remoteStream = null;
  function attachStreams() {
    var l = $("[data-local]", host), r = $("[data-remote]", host);
    if (l && localStream) l.srcObject = localStream;
    if (r && remoteStream) r.srcObject = remoteStream;
    var ph = $("[data-placeholder]", host);
    if (ph) ph.hidden = !!remoteStream;
  }

  function syncButtons() {
    var mb = $("[data-mute]", host), cb = $("[data-cam]", host);
    if (mb) {

      cb.classList.toggle("is-off", camOff);
      cb.setAttribute("aria-label", I18N.t(camOff ? "call.camOn" : "call.camOff"));
      cb.innerHTML = Icons.svg(camOff ? "video-off" : "video");
    }
  }

  function status(key) {
    var el = $("[data-call-status]", host);
    if (el) el.textContent = I18N.t(key);
  }

    if (!global.RTC.supported()) { error = "unsupported"; App.rerender(); return; }
    // getUserMedia is only handed out on a secure origin; localhost counts.
    if (!global.isSecureContext) { error = "insecure"; App.rerender(); return; }

    var them = other();
    call = new global.RTC.Call({
      room: requestId || "lobby",

      // Two offers can collide; the polite side yields. Comparing the two user
      // ids gives each peer the opposite answer with nothing to exchange.
      polite: !!(them && Session.user().id < them.id),
      on: {
        local: function (s) { localStream = s; },
        remote: function (s) { remoteStream = s; attachStreams(); status("call.connected"); },

          var stage = $(".call-stage", host);

          if (st === "disconnected") status("call.reconnecting");

        ended: function (who) { endedBy = who; finish(); }
      }

    call.getMedia().then(function () {
      phase = "live";
      App.rerender();
      call.connect();
      status("call.waiting");
      startTimer();
    }).catch(function (e) {
      error = e.code || "failed";
      App.rerender();
    });
  }

  function startTimer() {
    if (timer) return;

      seconds++;

      if (el) el.textContent = clock();

  }

  function finish() {
    clearInterval(timer);

    localStream = null;
    remoteStream = null;
    phase = "ended";
    App.rerender();
  }

  /* ---------- events ---------- */
  host.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-join]")) { join(); return; }

    if (ev.target.closest("[data-copy-link]")) {
      var url = global.location.href;
      if (global.navigator.clipboard) global.navigator.clipboard.writeText(url);
      App.toast(I18N.t("call.copied"), "check");
      return;
    }

    if (ev.target.closest("[data-mute]")) {
      muted = !muted;
      if (call) call.setMuted(muted);
      syncButtons();
      return;
    }

    if (ev.target.closest("[data-cam]")) {
      camOff = !camOff;
      if (call) call.setCameraOff(camOff);
      syncButtons();
      return;
    }

    if (ev.target.closest("[data-hang]")) {
      if (call) call.hangUp(); else finish();
      return;
    }

    if (ev.target.closest("[data-deliver]")) {
      Store.setRequest(requestId, { status: "delivered" });
      App.toast(I18N.t("inbox.completed"), "check");
      setTimeout(function () { App.go("requests.html"); }, 800);
    }
  });

  // Leaving the page must release the camera; the light staying on is alarming.
  global.addEventListener("pagehide", function () { if (call) call.hangUp(); });
});

/* ==========================================================================
   The staff desk.

   Three jobs that all come down to the same thing — somebody neutral has to
   decide, and has to be answerable for it afterwards:

     • who is allowed to work here at all (the licence queue)
     • what happens to money the client has refused to release (disputes)
     • what the platform takes, and whether tax is being charged

   Every action here is written to a record that is appended to and never
   edited, because a decision nobody can be asked about later is not a
   decision — it is just something that happened.
   ========================================================================== */
Pages.define("admin", function (global) {

      '<div class="row between wrap gap-3">' +
        '<div class="row gap-3">' + C.avatar(u, "sm") +
          "<div><strong>" + esc(tx(u.name)) + "</strong>" +

      (split.intern > 0
        ? '<div class="card card--pad" style="margin-top:var(--s-4);background:var(--surface-2)">' +
            '<p class="small">' + esc(I18N.t("admin.internNote")) + "</p>" +
