<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="dashboard-client" data-title-key="client.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">
<title>لوحة تحكم العميل | سند</title>
<meta name="description" content="لوحة تحكم العميل: متابعة الاستشارات النشطة، الوثائق، والمواعيد القادمة.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/i18n.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div class="app">
  <aside class="sidebar" data-dash-sidebar data-role="client"></aside>

  <main class="app-main" id="main">
    <header class="app-head">
      <div>
        <h1 class="headline" data-i18n="dash.panel"></h1>
        <p class="lead" data-i18n="client.lead"></p>
      </div>
      <div class="row gap-2">
        <button class="icon-btn" type="button" data-action="toggle-theme" data-i18n-attr="aria-label:a11y.theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn icon-btn--wide" type="button" data-action="toggle-lang" data-i18n-attr="aria-label:a11y.lang, title:a11y.lang">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
          <span class="lang-btn__code" data-lang-code>EN</span>
        </button>
        <a class="btn btn--primary btn--sm" href="lawyers.html">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="client.newRequest"></span>
        </a>
      </div>
    </header>

    <div class="grid grid-3" style="margin-bottom:var(--s-8)" data-client-stats></div>

    <div class="grid dash-split">
      <div class="stack gap-6">
        <section class="card card--rule-gold card--pad" data-client-upcoming></section>

        <section class="panel">
          <div class="panel__head row between gap-3">
            <h2 class="subtitle" data-i18n="client.activeConsults"></h2>
            <a class="small muted" href="#" data-i18n="client.viewAll"></a>
          </div>
          <div class="panel__body" data-client-consults></div>
        </section>
      </div>

      <aside class="stack gap-6">
        <section class="card card--rule-navy card--pad">
          <h2 class="subtitle" data-i18n="client.docCenter"></h2>
          <hr class="divider">
          <div data-client-docs></div>
        </section>

        <section class="card card--pad">
          <h2 class="subtitle" data-i18n="client.savedArticles"></h2>
          <hr class="divider">
          <div data-client-saved></div>
        </section>
      </aside>
    </div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
