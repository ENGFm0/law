<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="login" data-title-key="auth.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">
<title>تسجيل الدخول | سند</title>
<meta name="description" content="سجّل الدخول إلى حسابك في منصة سند.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/core/theme.js"></script>
<script src="assets/js/core/i18n.js"></script>
</head>
<body class="page">
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div data-slot="header"></div>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/data/seed.js"></script>
<script src="assets/js/data/models.js"></script>
<script src="assets/js/core/session.js"></script>
<script src="assets/js/core/supabase.js"></script>
<script src="assets/js/core/signal.js"></script>
<script src="assets/js/core/rtc.js"></script>
<script src="assets/js/ui/icons.js"></script>
<script src="assets/js/core/app.js"></script>
<script src="assets/js/ui/layout.js"></script>

<main id="main">
  <div class="auth">
    <aside class="auth__aside">
      <h2 class="headline" data-i18n="auth.asideTitle"></h2>
      <p class="lead" style="color:rgba(232,238,252,.72)" data-i18n="auth.asideBody"></p>
      <ul class="stack gap-4" data-auth-points></ul>
    </aside>

    <section class="auth__form">
      <p class="demo-banner" data-i18n="auth.demoBanner"></p>
      <h1 class="headline" style="margin-top:var(--s-6)" data-i18n="auth.welcome"></h1>
      <p class="lead" style="margin:var(--s-2) 0 var(--s-8)" data-i18n="auth.welcomeLead"></p>

      <form class="stack gap-4" data-login novalidate>
        <label class="field"><span class="label" data-i18n="auth.email"></span>
          <input class="input" name="email" type="email" autocomplete="email" dir="ltr"></label>
        <label class="field"><span class="label" data-i18n="auth.password"></span>
          <input class="input" name="password" type="password" autocomplete="current-password"></label>
        <p class="form-error" data-login-error hidden></p>
        <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="auth.signIn"></button>
      </form>

      <p class="center small muted" style="margin-top:var(--s-6)">
        <span data-i18n="signup.noAccount"></span>
        <a href="signup.html" style="color:var(--accent);font-weight:700" data-i18n="auth.createAccount"></a>
      </p>

      <div style="margin-top:var(--s-10)">
        <p class="small muted center" data-i18n="login.tryAs"></p>
        <div class="grid grid-3" style="gap:var(--s-3);margin-top:var(--s-3)" data-demo-accounts></div>
      </div>
    </section>
  </div>
</main>

<div data-slot="footer"></div>

<script src="assets/js/ui/components.js"></script>
<script src="assets/js/pages/login.js"></script>
</body>
</html>
