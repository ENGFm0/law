<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="home" data-title-key="home.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">
<title>سند | سندك القانوني الموثوق</title>
<meta name="description" content="منصة سند للتقنية القانونية — استشارات قانونية سريعة وموثوقة من محامين مرخصين، بأسعار واضحة.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/roles.js"></script>
</head>
<body class="page">
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div data-slot="header"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>

<main id="main">

  <!-- Hero -->
  <section class="hero">
    <div class="container hero__inner">
      <span class="eyebrow" data-i18n="home.eyebrow"></span>
      <h1 class="display" style="margin-top:var(--s-4)" data-i18n="home.heroTitle"></h1>
      <p class="lead" data-i18n="home.heroLead"></p>

      <form class="searchbar" data-search-form>
        <div class="input-group">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" type="search" name="q" data-i18n-attr="placeholder:home.searchPlaceholder, aria-label:home.searchPlaceholder">
        </div>
        <select class="select" name="specialty" data-fill="specialties" data-i18n-attr="aria-label:home.specialty"></select>
        <select class="select" name="city" data-fill="cities" data-i18n-attr="aria-label:home.city"></select>
        <button class="btn btn--primary" type="submit" data-i18n="home.search"></button>
      </form>

      <div style="margin-top:var(--s-5)">
        <a class="btn btn--accent btn--lg" href="lawyers.html" data-i18n="home.bookNow"></a>
      </div>

      <div class="trustbar" data-trustbar></div>
    </div>
  </section>

  <!-- Why Sanad -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <h2 class="headline" data-i18n="home.whyTitle"></h2>
        <p class="lead" data-i18n="home.whyLead"></p>
      </div>
      <div class="grid grid-4" data-features></div>
    </div>
  </section>

  <!-- Three workspaces -->
  <section class="section section--band">
    <div class="container">
      <div class="section-head center">
        <h2 class="headline" data-i18n="home.rolesTitle"></h2>
        <p class="lead" data-i18n="home.rolesLead"></p>
      </div>
      <div class="grid grid-3" data-role-cards></div>
    </div>
  </section>

  <!-- How it works -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <h2 class="headline" data-i18n="home.stepsTitle"></h2>
        <p class="lead" data-i18n="home.stepsLead"></p>
      </div>
      <div class="grid grid-4" data-steps></div>
    </div>
  </section>

  <!-- Featured lawyers -->
  <section class="section">
    <div class="container">
      <div class="row between wrap gap-4" style="margin-bottom:var(--s-10)">
        <div>
          <h2 class="headline" data-i18n="home.featuredTitle"></h2>
          <p class="lead" data-i18n="home.featuredLead"></p>
        </div>
        <a class="btn btn--ghost" href="lawyers.html">
          <span data-i18n="home.viewAll"></span>
          <svg class="icon icon-sm icon-flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div class="grid grid-3" data-featured-lawyers></div>
    </div>
  </section>

  <!-- Stats -->
  <section class="section--tight section--band">
    <div class="container">
      <h2 class="headline center" style="margin-bottom:var(--s-10)" data-i18n="home.statsTitle"></h2>
      <div class="grid grid-4 center" data-stats></div>
    </div>
  </section>

  <!-- Testimonials -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <h2 class="headline" data-i18n="home.testimonialsTitle"></h2>
        <p class="lead" data-i18n="home.testimonialsLead"></p>
      </div>
      <div class="grid grid-3" data-testimonials></div>
    </div>
  </section>

  <!-- Latest articles -->
  <section class="section section--band">
    <div class="container">
      <div class="row between wrap gap-4" style="margin-bottom:var(--s-10)">
        <div>
          <h2 class="headline" data-i18n="home.blogTitle"></h2>
          <p class="lead" data-i18n="home.blogLead"></p>
        </div>
        <a class="btn btn--ghost" href="blog.html">
          <span data-i18n="home.viewAll"></span>
          <svg class="icon icon-sm icon-flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div class="grid grid-3" data-home-articles></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section">
    <div class="container">
      <div class="cta-band reveal">
        <h2 class="headline" data-i18n="home.ctaTitle"></h2>
        <p class="lead" style="margin-top:var(--s-3)" data-i18n="home.ctaLead"></p>
        <div class="row gap-3 wrap" style="justify-content:center;margin-top:var(--s-8)">
          <a class="btn btn--accent btn--lg" href="lawyers.html" data-i18n="home.ctaPrimary"></a>
          <a class="btn btn--outline btn--lg" href="login.html" data-i18n="home.ctaSecondary"></a>
        </div>
      </div>
    </div>
  </section>

</main>

<div data-slot="footer"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
