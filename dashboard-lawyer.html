<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="dashboard" data-title-key="dash.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fd">
<title>لوحة تحكم المحامي | سند</title>
<meta name="description" content="لوحة تحكم المحامي: متابعة الأداء، إدارة الطلبات، ونشر المقالات القانونية.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/roles.js"></script>
<script src="assets/js/store.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

<div class="app">
  <aside class="sidebar" data-dash-sidebar data-role="lawyer"></aside>

  <main class="app-main" id="main">
    <header class="app-head">
      <div>
        <h1 class="headline" data-i18n="dash.overview"></h1>
        <p class="lead" data-i18n="dash.overviewLead"></p>
      </div>
      <div class="row gap-2">
        <button class="icon-btn" type="button" data-action="toggle-theme" data-i18n-attr="aria-label:a11y.theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn icon-btn--wide" type="button" data-action="toggle-lang" data-i18n-attr="aria-label:a11y.lang, title:a11y.lang">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
          <span class="lang-btn__code" data-lang-code>EN</span>
        </button>
        <button class="icon-btn" type="button" data-i18n-attr="aria-label:dash.requests" style="position:relative">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15V10a6 6 0 1 0-12 0v5l-1.5 3h15z"/><path d="M10 21h4"/></svg>
          <span style="position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>
        </button>
      </div>
    </header>

    <div class="grid grid-4" style="margin-bottom:var(--s-8)" data-dash-stats></div>

    <!-- Request inbox: everything the clients have sent -->
    <section class="panel" style="margin-bottom:var(--s-8)">
      <div class="panel__head">
        <div class="row between wrap gap-3">
          <div>
            <h2 class="subtitle" data-i18n="inbox.title"></h2>
            <p class="small muted" data-i18n="inbox.lead"></p>
          </div>
          <span class="status status--warn" data-inbox-count></span>
        </div>
        <div class="row gap-2 wrap" style="margin-top:var(--s-4)" data-inbox-filters></div>
      </div>
      <div class="panel__body" data-inbox></div>
    </section>

    <!-- Draft review — only appears once a request is opened -->
    <section class="card card--rule-gold" style="margin-bottom:var(--s-8)" data-inbox-draft hidden></section>

    <section class="panel" style="margin-bottom:var(--s-8)">
      <div class="panel__head row between wrap gap-3">
        <h2 class="subtitle row gap-2">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span data-i18n="drafts.title"></span>
        </h2>
        <span class="status status--warn" data-drafts-count></span>
      </div>
      <div class="panel__body" data-drafts></div>
    </section>

    <section class="panel" style="margin-bottom:var(--s-8)">
      <div class="panel__head row between wrap gap-3">
        <h2 class="subtitle row gap-2">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span data-i18n="dash.editorTitle"></span>
        </h2>
        <div class="row gap-3">
          <button class="btn btn--outline btn--sm" type="button" data-editor-draft data-i18n="dash.saveDraft"></button>
          <button class="btn btn--accent btn--sm" type="button" data-editor-publish data-i18n="dash.publish"></button>
        </div>
      </div>

      <div class="toolbar" data-editor-toolbar></div>

      <div class="editor">
        <input class="editor__title" data-i18n-attr="placeholder:dash.articleTitlePlaceholder, aria-label:dash.articleTitlePlaceholder">
        <div class="editor__body" contenteditable="true" role="textbox" aria-multiline="true"
             data-editor-body data-i18n-attr="data-placeholder:dash.articleBodyPlaceholder"></div>
      </div>
    </section>

  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
